[package]
name = "opengl"
version = "0.1.0"
output = "executable"

# SDL2 and OpenGL come from the packages sdl and gl, whose manifests name the
# C libraries to link: SDL2.lib (from SDL2's development kit, found through
# LIB) and opengl32.lib (from the Windows SDK). SDL2.dll must be on PATH to run.
