[package]
name = "opengl"
version = "0.1.0"
output = "executable"

# The C libraries that the modules sdl and gl bind: SDL2 (SDL2.lib, from SDL2's
# development kit, found through LIB or a folder added under paths) and OpenGL
# (opengl32.lib, from the Windows SDK)
[link]
libraries = ["SDL2", "opengl32"]
