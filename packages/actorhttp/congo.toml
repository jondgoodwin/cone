[package]
name = "actorhttp"
version = "0.1.0"
output = "library"
# stageheavy (ten heavy streams under credit, 100-166 s in debug alone) runs out its deadline while still moving when it shares the
# machine with the parallel package run, so it runs alone after the rest.
# reqbody fails under that load at two places and passes alone: "every buffer home" after the 503 scenario (allHome waits 10 s
# for the pool to empty), and the answer-first scenario (the handler answers, naps 300 ms, then reads; on HTTP/1.1 the
# connection closes after the answer, so how much of the 20,000-byte body is staged by then depends on the machine's load).
# eventstage fails there at its first line after "flood": the test reads one event, waits 500 ms, counts the server's sends, waits
# 300 ms, counts again, and expects the two counts equal (the sends have stalled on credit); a loaded machine has not stalled
# them within 500 ms.
quiet = ["stageheavy", "reqbody", "eventstage"]

# What it asks of the OS is iocore's (Winsock and the completion port on
# Windows, epoll on Linux) and tls's (OpenSSL, and crypt32 on Windows), which
# link their own libraries; this package calls nothing of the OS's itself.
