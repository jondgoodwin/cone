[package]
name = "env"
version = "0.1.0"
output = "library"

# On Windows what the package calls beyond the posix package's (the C
# runtime's) is one function of shell32's, CommandLineToArgvW, which 'args'
# splits the program's own command line with: Windows' own parser, the one
# 'process.run' writes its quoting for. shell32 is the Windows SDK's and not
# on the C runtime's link line, so the Windows section names it. On Linux it
# links nothing more.
[link.windows]
libraries = ["shell32"]
