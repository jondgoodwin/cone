[package]
name = "process"
version = "0.1.0"
output = "library"

# What this package calls is kernel32's, on every link line already, and one
# function of shell32's, CommandLineToArgvW, which 'args' splits the
# program's own command line with: Windows' own parser, the one the quoting
# 'run' does is written for. Both import libraries are the Windows SDK's.
[link]
libraries = ["shell32"]
