[package]
name = "process"
version = "0.1.0"
output = "library"

# On Windows what this package calls is kernel32's, on every link line
# already. (shell32's CommandLineToArgvW, which the program's own arguments are
# split with, is the env package's now, and named in its congo.toml.) On Linux
# it calls the C library's posix_spawn, pipe2, poll, waitpid and kill, and links
# nothing more.
