[package]
name = "process"
version = "0.1.0"
output = "library"

# On Windows what this package calls is kernel32's, on every link line
# already, and one function of shell32's, CommandLineToArgvW, which 'args'
# splits the program's own command line with: Windows' own parser, the one
# the quoting 'run' does is written for. shell32 is the Windows SDK's and not
# on the C runtime's link line, so the Windows section names it. On Linux it
# calls the C library's posix_spawn, pipe2, poll, waitpid and kill, and links
# nothing more.
[link.windows]
libraries = ["shell32"]
