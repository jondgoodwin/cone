[package]
name = "voiceaudio"
version = "0.1.0"
output = "library"

# Microphone and speaker for a spoken conversation, over SDL3's audio streams: capture of mono f32 at 16 kHz, a
# playback queue (24 kHz for speech) that can be cut off at once, and a voice activity detector that turns the
# microphone's samples into utterances. Depends on sdl, audiomixer (WAV decoding and the Sound type), fs and
# collections. Windows alone, for now, because sdl is.
