[package]
name = "actortrace"
version = "0.1.0"
output = "library"

# On Windows: the ETW way of recording (etw.cone) calls advapi32's
# EventRegister, EventSetInformation, EventEnabled and EventWriteTransfer, and
# the steady clock is kernel32's QueryPerformanceCounter (on every link line
# already). Advapi32.lib is not on the default link line, so the Windows
# section names it. On Linux the ETW way is not built (it is a no-op that says
# so) and the clock is POSIX's clock_gettime; nothing more is linked.
[link.windows]
libraries = ["advapi32"]
