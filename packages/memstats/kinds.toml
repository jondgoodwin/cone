# The region kinds the memstats shim records, one number each: the one place both sides
# read. Numbers K01..K22 are the region-kind table of the allocation inventory
# (Incubator\Cone\Ruminations\cone-alloc-inventory-2026-11-16.md, Part 1); 0 is a block
# allocated while nothing had said who was asking (a "stray" block, sorted by call site);
# 23 and up are the marks this item adds. Core's markers (core.cone, sync.cone) write the
# numbers of "core" rows below as literals: check_kinds.py compares them with this file.
#
# who:  "core"  = marked by this item's markers in core / sync (the shim sees them as asked)
#       "trace" = named for the demand side (row 424: packages emit through the trace package
#                 under these names; the shim's tag carries the number when a package asks)
# A kind a region sets itself through memstats_asking takes the outermost-wins rule.

[kinds]
0  = { name = "stray",        who = "shim",  note = "no kind set; the caller's return address is recorded" }
1  = { name = "List",         who = "trace" }
2  = { name = "String",       who = "trace" }
3  = { name = "Deque",        who = "trace" }
4  = { name = "Dict/Set",     who = "trace" }
5  = { name = "OrderedDict",  who = "trace" }
6  = { name = "Pool",         who = "trace" }
7  = { name = "GenPool",      who = "trace" }
8  = { name = "DensePool",    who = "trace" }
9  = { name = "IdPool",       who = "trace" }
10 = { name = "IoBufSlab",    who = "trace" }
11 = { name = "IoBuf",        who = "trace" }
12 = { name = "Chain",        who = "trace" }
13 = { name = "Uni",          who = "core",  note = "core.cone, Uni.alloc" }
14 = { name = "Rc",           who = "core",  note = "core.cone, Rc.alloc" }
15 = { name = "Arc",          who = "core",  note = "sync.cone, Arc.alloc" }
16 = { name = "Rcw",          who = "trace" }
17 = { name = "Futures",      who = "trace" }
18 = { name = "Arena",        who = "trace" }
19 = { name = "ActorRegion",  who = "trace" }
20 = { name = "ActorMessage", who = "trace" }
21 = { name = "Gc",           who = "trace" }
22 = { name = "RawBlocks",    who = "core",  note = "core.cone, RawBlocks.alloc: blocks asked straight of the raw layer, no region above" }
32 = { name = "MemRegion",    who = "core",  note = "core.cone, MemRegion.allocate: a block from a region's alloc function; which collection asked is not known here" }
