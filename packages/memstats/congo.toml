[package]
name = "memstats"
version = "0.1.0"
output = "library"

# No [link] section, on purpose: the shim (shim/memstats.c, built into
# shim/out/memstats.lib by shim/build.ps1) must come ahead of the C runtime on the
# link line, which only the LINK environment variable does; memstats.ps1 sets it.
# A normal build links nothing of this.
