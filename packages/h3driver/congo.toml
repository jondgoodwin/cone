[package]
name = "h3driver"
version = "0.1.0"
output = "library"
# fetches failed in batch b9's parallel package run (9 Nov) and passed alone. It runs
# alone, last, as a timing-sensitive test (the quiet class; Backlog test-flakiness.md, Bug 9).
quiet = ["fetches"]

# What it asks of the OS is iocore's (Winsock, the completion port, UDP
# sockets), which links its own libraries; QUIC and TLS are the quic
# package's (ngtcp2 and OpenSSL 3.5), whose libraries quic names and Congo
# copies beside every program that imports it. This package calls nothing of
# the OS's itself.
