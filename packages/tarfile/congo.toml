[package]
name = "tarfile"
version = "0.1.0"
output = "library"

# tar archives (POSIX ustar, with GNU-tar-made ustar archives and PAX extended headers read for 'path' and
# 'size'): read as their bytes arrive and written, in Cone over the streams and iobuf packages. No compression
# here; a gzip-wrapped tar is read through the deflate package's gzip reader.
