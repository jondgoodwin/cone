[package]
name = "iocore"
version = "0.1.0"
output = "library"
# tick failed twice in batch b7's parallel package run (9 Nov) and passed 5 of 5 alone on the batch and on master. It runs
# alone, last, as a timing-sensitive test (the quiet class; Backlog test-flakiness.md, Bug 9).
# waitchild failed 3 times in parallel package runs on 9 Nov (b15 18:21, b17r 20:26, a lane batch run) and passed every time alone,
# and 0 of 20 on each of master and the batch tree in an alternating run under load; the same rule.
quiet = ["tick", "waitchild"]

# What it calls on Windows is Winsock (ws2_32), and ntdll for the wait
# completion packet that delivers the high-resolution timer's expiry to the
# port (NtCreateWaitCompletionPacket, NtAssociateWaitCompletionPacket) and for
# RtlNtStatusToDosError; both import libraries are the Windows SDK's, and the
# Windows section names them. On Linux it asks the C library alone (epoll,
# eventfd, timerfd, the socket calls), which every link line has.
[link.windows]
libraries = ["ws2_32", "ntdll"]
