[package]
name = "iocore"
version = "0.1.0"
output = "library"

# What it calls on Windows is Winsock (ws2_32), and ntdll for the wait
# completion packet that delivers the high-resolution timer's expiry to the
# port (NtCreateWaitCompletionPacket, NtAssociateWaitCompletionPacket) and for
# RtlNtStatusToDosError; both import libraries are the Windows SDK's, and
# Congo's Windows link line names them, as it does synchronization.lib. On
# Linux it asks the C library alone (epoll, eventfd, timerfd, the socket
# calls), which every link line has.
