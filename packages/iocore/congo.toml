[package]
name = "iocore"
version = "0.1.0"
output = "library"

# Windows: Winsock (ws2_32) for sockets; ntdll for the wait completion packet
# that delivers the high-resolution timer's expiry to the port
# (NtCreateWaitCompletionPacket, NtAssociateWaitCompletionPacket) and for
# RtlNtStatusToDosError. Both import libraries are the Windows SDK's. Linux
# asks the C library alone (epoll, eventfd, timerfd, the socket calls), which
# every link line has.
[link]
windows-libraries = ["ws2_32", "ntdll"]
