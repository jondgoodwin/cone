[package]
name = "sdl"
version = "0.1.0"
output = "library"

# SDL2's import library, SDL2.lib, from SDL2's development kit. It is not part
# of the Windows SDK, so the folder holding it must be on LIB (or added under
# a program's own [link] paths), and SDL2.dll on PATH to run.
[link]
libraries = ["SDL2"]
