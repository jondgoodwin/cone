[package]
name = "sdl"
version = "0.1.0"
output = "library"

# SDL3's import library, SDL3.lib, from SDL3's development kit
# (SDL3-devel-3.x-VC.zip, its lib\x64 folder). It is not part of the Windows
# SDK, so the folder holding it must be on LIB (or added under a program's own
# [link] paths). SDL3.dll sits beside it there, where Congo finds it and copies
# it beside every program that imports sdl, at any depth.
[link]
libraries = ["SDL3"]
runtime = ["SDL3"]
