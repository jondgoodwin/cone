[package]
name = "httpdecode"
version = "0.1.0"
output = "library"

# An HTTP body decoded as it arrives (Content-Encoding gzip, deflate, zstd) on
# its way from actorhttp's streamTo to a sink. It is a package of its own so
# that actorhttp, and the programs that import it, do not link the codecs
# unless they ask for decoding. It calls nothing of the OS's itself.
