[package]
name = "bufpool"
version = "0.1.0"
output = "library"

# Its only calls to the OS are kernel32's VirtualAlloc and VirtualFree on
# Windows, on every link line already, and mmap and munmap on Linux, in the C
# library; the lock its stock takes is the sync package's, whose
# Synchronization.lib is named by its [link.windows].
