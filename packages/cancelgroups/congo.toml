[package]
name = "cancelgroups"
version = "0.1.0"
output = "library"
# groups failed once in #1010's parallel package run and passed alone 3 of 3 (8 Nov); it runs alone after the rest until its
# timing assumption is read (design chat 8 Nov: Bug 9).
quiet = ["groups"]

# Cancel groups, the one carrier of "stop this work" for all concurrency: the
# flag every loop reads, a cause beside it, a deadline that one timer thread
# turns into the flag, and the loops a cancel must wake. It calls the OS only
# through the thread, sync and time packages (the timer thread's park and its
# clock); it imports no I/O and no actors, so both can import it.
