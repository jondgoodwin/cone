[package]
name = "englishphonemes"
version = "0.1.0"
output = "library"

# Text to Kokoro's phonemes for English: normalises numbers and symbols, looks words up in misaki's gold and silver
# lexicons (a port of misaki's English G2P rules), a rule-based fallback for words in neither, and splits long text
# at the model's 510-phoneme limit. No GPU, no espeak. Depends on collections, fs and path.
