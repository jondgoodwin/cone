[package]
name = "llmrun"
version = "0.1.0"
output = "library"

# Runs a Qwen3 (or Llama-layout) language model from a GGUF file on the GPU: loads the weights, a KV cache and the
# forward pass over llmkernels, the tokenizer from the file, sampling, a chat template. Depends on gpu, gpuwork,
# llmkernels, llmreference, gguf, bpetokenize, random and fs; Windows alone, for now (it needs a GPU).
