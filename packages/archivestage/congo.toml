[package]
name = "archivestage"
version = "0.1.0"
output = "library"

# A zip archive read as a stream between actors: ArchiveStage is a ChunkSink over
# zipfile's ArchiveStream that hands each entry to a ChunkSink of the caller's
# choosing. It is a package of its own, over stages and zipfile, as httpdecode
# sits over its codecs: zipfile stays free of actors, and a program that reads
# archives in memory links no stage. It calls nothing of the OS's itself.
