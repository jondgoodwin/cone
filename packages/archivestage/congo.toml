[package]
name = "archivestage"
version = "0.1.0"
output = "library"

# A zip archive read or written as a stream between actors: ArchiveStage is a ChunkSink
# over zipfile's ArchiveStream that hands each entry to a ChunkSink of the caller's
# choosing; ZipSource is a ChunkSource over zipfile's ZipWriter, and saveTo sends one
# through stageio's FileSink into a file. It is a package of its own, over stages,
# stageio and zipfile, as httpdecode sits over its codecs: zipfile stays free of
# actors, and a program that handles archives in memory links no stage. It imports
# stageio (and so aio) for saveTo, and thread for the one thread that waits for the
# file's answer; it calls nothing of the OS's itself beyond fs.removeFile.
