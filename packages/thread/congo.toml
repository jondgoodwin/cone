[package]
name = "thread"
version = "0.1.0"
output = "library"

# WaitOnAddress and its two wakes, the futex this package is built on, are
# defined in the Windows SDK's Synchronization.lib (the api set
# api-ms-win-core-synch-l1-2-0, in kernel32 at run time), which is not on the
# C runtime's default link line. Everything else it calls is kernel32's, or
# the C runtime's own '_beginthreadex', both on every link line already.
[link]
libraries = ["synchronization"]
