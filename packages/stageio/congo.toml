[package]
name = "stageio"
version = "0.1.0"
output = "library"

# The ends of a pipeline in the OS, FileSink, FileSource and SocketSource, over package
# aio's File and Socket, as ChunkSink and ChunkSource of package stages. They are apart
# from stages so that stages imports no I/O, and a program that only wants the codec and
# hash stages does not pull the OS in with them. It calls nothing of the OS's itself; it
# imports actors, stages, streams and aio, and through them iocore and iobuf, which make
# the OS calls.
