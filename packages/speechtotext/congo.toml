[package]
name = "speechtotext"
version = "0.1.0"
output = "library"

# Speech to text: NVIDIA's Parakeet TDT 0.6B v2 run on the GPU through gpuwork and llmkernels. Takes 16 kHz mono
# samples (or a WAV file, through audiomixer) to text. Weights are read from safetensors files converted from the
# .nemo checkpoint (converter outside the repository). Depends on gpu, gpuwork, llmkernels, audiomixer, json, fs;
# Windows alone, for now (it needs a GPU).
