[package]
name = "aio"
version = "0.1.0"
output = "library"
# finalinflight failed once in #1010's parallel package run ("fast: no": its bound was 2 s for a 300 ms wait; the bound is
# now 30 s). It runs alone, last, as a timing-sensitive test (the quiet class; Backlog test-flakiness.md, Bug 9).
quiet = ["finalinflight"]

# What it asks of the OS is iocore's (Winsock, the completion port), which
# links its own libraries; this package calls nothing of the OS's itself.
