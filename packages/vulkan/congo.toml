[package]
name = "vulkan"
version = "0.1.0"
output = "library"

# Nothing Vulkan's is linked: no vulkan-1.lib is needed. The module's 'init'
# opens the Vulkan loader at run time (LoadLibrary on Windows, dlopen
# elsewhere) and every Vulkan function is found through its
# vkGetInstanceProcAddr, so a program built with this package needs only the
# Vulkan loader, vulkan-1.dll, which a GPU driver installs, and only when it
# runs; without it the package says so ('available') and does not fail.
# Linux: dlopen is in libdl before glibc 2.34.
[link.linux]
libraries = ["dl"]
