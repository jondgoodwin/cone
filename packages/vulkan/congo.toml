[package]
name = "vulkan"
version = "0.1.0"
output = "library"

# Nothing is linked: no vulkan-1.lib is needed. Every Vulkan function is found
# at run time, through the vkGetInstanceProcAddr a caller hands to 'load'
# (SDL's, for a program that opens a window), so a program built with this
# package needs only the Vulkan loader, vulkan-1.dll, which a GPU driver
# installs, and only when it runs.
