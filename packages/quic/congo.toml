[package]
name = "quic"
version = "0.1.0"
output = "library"

# Windows: ngtcp2 1.22.1 and its OpenSSL 3.5 crypto helper, built by
# `python tools/deps/build_ngtcp2.py` into deps/ngtcp2/ at the repository's
# root (git ignores it), over the OpenSSL 3.5.9 package tls uses (deps/openssl,
# from tools/deps/fetch.py). The four DLLs are copied beside every program that
# imports quic, at any depth.
[link.windows]
libraries = ["ngtcp2_crypto_ossl", "ngtcp2", "libssl", "libcrypto"]
paths = ["../../deps/ngtcp2", "../../deps/openssl"]
runtime = ["ngtcp2_crypto_ossl", "ngtcp2", "libssl-3", "libcrypto-3"]

# Linux: needs OpenSSL 3.5 or later (see the package's header, WINDOWS AND
# LINUX); Ubuntu 24.04's own is 3.0, which cannot carry QUIC. ngtcp2 built
# against an OpenSSL 3.5 prefix by `python3 tools/deps/build_ngtcp2.py
# --openssl <prefix>` lands in deps/ngtcp2/ with that OpenSSL's libraries,
# which this names; a program runs with LD_LIBRARY_PATH set to that folder.
[link.linux]
libraries = ["ngtcp2_crypto_ossl", "ngtcp2", "ssl", "crypto"]
paths = ["../../deps/ngtcp2"]
