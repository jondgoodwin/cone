[package]
name = "safetensors"
version = "0.1.0"
output = "library"

# Reads safetensors files (Hugging Face's tensor container: a JSON header, then raw tensor bytes): the header's
# tensor names, dtypes (F32, F16, BF16, I32), shapes and byte ranges, checked against the file; a file mapped with
# fs.mapFile; tensors widened to f32. Depends on collections, json, fs and path; no GPU.
