[package]
name = "zstd"
version = "0.1.0"
output = "library"

# Zstandard (RFC 8878) decompression, compression at levels 1 to 3, and its xxHash64, written in Cone. It calls
# nothing of the OS's itself; its streams meet package streams' Transform, so it imports streams and through it
# iobuf, whose buffer pool makes the OS calls.
