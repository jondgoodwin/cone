[package]
name = "voicechat"
version = "0.1.0"
output = "library"

# A spoken conversation with a local language model: the microphone's utterance goes to Parakeet (speechtotext), the text to
# Qwen3 (llmrun) with thinking off and a system line that it is speaking aloud, each finished sentence of the reply to Kokoro
# (texttospeech) while Qwen keeps writing, and the speech to the speaker's queue (voiceaudio), which a spoken interruption cuts
# off. Depends on llmrun, speechtotext, texttospeech, voiceaudio, gpu, collections, time, thread, path and random. Windows
# alone, for now (it needs a GPU and SDL3). examples/llmchat.cone in llmrun calls it with --voice.
