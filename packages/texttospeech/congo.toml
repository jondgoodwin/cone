[package]
name = "texttospeech"
version = "0.1.0"
output = "library"

# Kokoro text to speech (hexgrad's 82M-parameter StyleTTS2/iSTFTNet model) on the GPU: weights from a converted
# safetensors file, English phonemes from englishphonemes, the model's layers as speechkernels over gpuwork (with
# llmkernels' matrix product), the harmonic source and the STFTs on the CPU, voices and blends of voices, and a WAV
# file written through audiomixer. Depends on gpu, gpuwork, speechkernels, llmkernels, llmreference, safetensors,
# englishphonemes, audiomixer and random; Windows alone for now (it needs a GPU).
