[package]
name = "llmreference"
version = "0.1.0"
output = "library"

# CPU reference code for running a Llama-family model: the weight block layouts (GGUF's F32, F16, Q8_0, Q4_K,
# Q6_K) and their decoders, and a CPU twin of each GPU kernel in llmkernels. Pure Cone, no GPU, no OS call: it
# builds and runs on Linux, where llmkernels (which needs the GPU packages) does not.
