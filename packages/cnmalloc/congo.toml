[package]
name = "cnmalloc"
version = "0.1.0"
output = "library"
targets = ["native"]
# lfrace runs for minutes and its undo count is a coverage target that a loaded machine may not reach: a quiet-class test
quiet = ["lfrace"]

# The allocator layer and shim have a Windows layer (kernel32) and a Linux layer (futex, mmap; row 550).
os = ["windows", "linux"]
