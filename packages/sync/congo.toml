[package]
name = "sync"
version = "0.1.0"
output = "library"

# WaitOnAddress and its two wakes, the futex this package's locks are built
# on (and the thread package's parking), are defined in the Windows SDK's
# Synchronization.lib (the api set api-ms-win-core-synch-l1-2-0, in kernel32
# at run time), which is not on the C runtime's default link line.
[link]
libraries = ["synchronization"]
