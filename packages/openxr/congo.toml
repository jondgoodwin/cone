[package]
name = "openxr"
version = "0.1.0"
output = "library"

# Nothing OpenXR's is linked: no openxr_loader.lib is needed. The first use of
# the package ('load', which 'available' calls) opens the OpenXR loader at run
# time (LoadLibrary on Windows, dlopen elsewhere) and every OpenXR function is
# found through its xrGetInstanceProcAddr, so a program built with this package
# needs only the loader, openxr_loader.dll (libopenxr_loader.so), which an
# OpenXR runtime's install or the program's own folder provides, and only when
# it opens a headset; without it, or without a runtime, the package says so
# ('available', and the result of 'createInstance') and does not fail. A
# program that never uses the package never asks for the loader.
# Linux: dlopen is in libdl before glibc 2.34.
[link.linux]
libraries = ["dl"]
