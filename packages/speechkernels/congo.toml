[package]
name = "speechkernels"
version = "0.1.0"
output = "library"

# GPU compute kernels (Slang, compiled ahead of time and embedded as SPIR-V) for the speech models: 1-D convolution
# and its transpose, a bidirectional LSTM's recurrence, layer norm, adaptive instance norm, bidirectional attention
# and a few elementwise and copying kernels, each with a CPU twin. Depends on gpu and gpuwork; Windows alone for now.
