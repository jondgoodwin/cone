[package]
name = "tls"
version = "0.1.0"
output = "library"

# OpenSSL 3.5.9, CPython's signed MSVC build: its import libraries (libssl,
# libcrypto) and DLLs come from `python tools/deps/fetch.py`, which puts
# them in deps/openssl/ at the repository's root (git ignores it). The DLLs
# are copied beside every program that imports tls, at any depth. crypt32,
# the Windows SDK's, is the OS's certificate verifier.
[link]
libraries = ["libssl", "libcrypto", "crypt32"]
paths = ["../../deps/openssl"]
runtime = ["libssl-3", "libcrypto-3"]
