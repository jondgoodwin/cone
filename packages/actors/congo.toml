[package]
name = "actors"
version = "0.1.0"
output = "library"

# Everything this package calls is the thread package's (its workers' OS
# threads) and the sync package's (the futex they park on, the inject queue's
# Mutex, and 'Arc', which counts an actor's handles), and, for a wait's spin,
# kernel32's SwitchToThread on Windows (POSIX's sched_yield elsewhere, from
# the C library), on every link line already. The futex's
# Synchronization.lib is linked by sync's own congo.toml.
