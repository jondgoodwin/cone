[package]
name = "actors"
version = "0.1.0"
output = "library"
# Tests run alone, last (a loaded gate skips them). parallelinline checks that a costly loop splits across workers, which
# needs a free worker to take the split: under 16 CPU burners the caller finishes every item before any other worker runs,
# and its two split checks fail (18 Nov, in release, with #1471's sink in). That is load, not a fault.
quiet = ["parallelinline"]

# Everything this package calls is the thread package's (its workers' OS
# threads) and the sync package's (the futex they park on, the inject queue's
# Mutex, and 'Arc', which counts an actor's handles), and, for a wait's spin,
# kernel32's SwitchToThread on Windows (POSIX's sched_yield elsewhere, from
# the C library), and, for the idle spin's clock, kernel32's
# QueryPerformanceCounter (clock_gettime elsewhere, from the C library), on
# every link line already. The futex's Synchronization.lib is named by the
# sync package's [link.windows].
