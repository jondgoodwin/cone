[package]
name = "stages"
version = "0.1.0"
output = "library"

# An actor for each codec over package streams' StageCore and HashCore: inflate,
# deflate, zstd and the SHA hashes as stages of a pipeline. It calls nothing of
# the OS's itself; it imports actors, streams and the codec packages, and
# through them iobuf, whose buffer pool makes the OS calls.
