[package]
name = "stages"
version = "0.1.0"
output = "library"

# Two generic actors, Stage[T: Transform] and HashStage[D: Digester], over package
# streams' Transform and Digester: inflate, deflate, zstd and the SHA hashes as
# stages of a pipeline. It calls nothing of
# the OS's itself; it imports actors, streams and the codec packages, and
# through them iobuf, whose buffer pool makes the OS calls.
