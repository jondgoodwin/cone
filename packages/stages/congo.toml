[package]
name = "stages"
version = "0.1.0"
output = "library"
# shared failed in batches b8 and b9's parallel package runs (9 Nov) and passed alone, 10 of 10 on b8 and on master. It runs
# alone, last, as a timing-sensitive test (the quiet class; Backlog test-flakiness.md, Bug 9).
quiet = ["shared"]

# Two generic actors, TransformStage[T: Transform] and HashStage[D: Digester], over package
# streams' Transform and Digester: inflate, deflate, zstd and the SHA hashes as
# stages of a pipeline. It calls nothing of
# the OS's itself; it imports actors and streams, and through them iobuf, whose
# buffer pool makes the OS calls. A program using a codec stage imports that codec.
