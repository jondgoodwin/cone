[package]
name = "stages"
version = "0.1.0"
output = "library"

# Two generic actors, TransformStage[T: Transform] and HashStage[D: Digester], over package
# streams' Transform and Digester: inflate, deflate, zstd and the SHA hashes as
# stages of a pipeline; and the ends of a pipeline in the OS, FileSink, FileSource and
# SocketSource, over package aio's File and Socket. It calls nothing of the OS's itself;
# it imports actors, streams and aio, and through them iocore and iobuf, which make the
# OS calls. A program using a codec stage imports that codec.
