# closure - anonymous functions and closure literals: writing one, giving it a
# type, binding it, passing it and calling it. Tier 1.
#
# An anonymous function, '&fn(x i32) i32 { ... }', is lifted to module scope and
# sees no local. A closure literal, 'fn (x i32) [n = 0] i32 { ... }' or 'x => x',
# is a value of a struct the compiler writes: it holds its state list and
# borrows the variables its body names (closure_literal, closure_capture).
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# Not here, on purpose:
#
#   - References to named functions ('imm p = &fact'), which the design note
#     gives to 'ref' as "function references", and closure references, which it
#     gives to 'trait'.
#   - An anonymous function declaring an overload name. It is an error
#     (ErrorBadOverload) and core_parse_overload already covers it, so
#     repeating it here would only duplicate that scenario.
#   - Calling a non-function. It reports ErrorNoMbr on '()', which
#     core_typecheck covers. ErrorNotFn (1018) named this condition, was raised
#     nowhere, and has since been deleted from the enum.
#
# The reject scenarios are split by pipeline stage, because analysis halts
# between stages and an expectation from a later stage would never be reached.
#
# The type-check stage is split three ways, and the first split is forced rather
# than stylistic: a module type checks every declaration's signature before any
# body, and only reaches the bodies when the signature phase produced no errors
# (module.c). A signature diagnostic therefore suppresses every body diagnostic
# in its file, so closure_typecheck_sig holds the signature failures alone. The
# two body-phase files are split by what breaks -- the closure not fitting the
# type it is given to, versus the call made through it.

support = []

# -------- success --------

[scenario.closure_success]
category = "run"
description = "Anonymous functions bound, typed, passed to a parameter and called"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# An anonymous function is lifted to module scope, where it needs a name -- for
# a COMDAT to be named after, and because the name LLVM's mangler invents for an
# unnamed symbol ('__unnamed_1') is one every other object file would invent too.
# It is internal like every other definition of a program, which lets the
# optimizer delete the ones nothing calls and fold the rest into their callers,
# so the symbols are read before it runs. A literal LLVM was left to number
# would read as '0', '1' and so on.
[[scenario.closure_success.check]]
name = "anonymous-functions-are-named-and-private"
target = "symbols"
contains = ["define internal anon comdat nodeduplicate"]
excludes = ["define internal 0 ", "define internal 1 "]

# Inside a list a function type's return type ends at the comma; outside every
# list a comma adds a return type. Each signature is called through, since one
# misread as another signature can still compile and run.
[scenario.closure_fnref_comma]
category = "run"
description = "A function-reference parameter first, in the middle and last; several returns parenthesised in a list and bare outside one"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.closure_capture]
category = "compile"
description = "A closure literal reading a local of the function enclosing it"
tags = ["nameres", "typecheck"]

[scenario.closure_literal]
category = "run"
description = "The closure literal: state of its own, variables borrowed '&' and '&mut', return, the short form, nesting, a method's private fields"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

[scenario.closure_bound]
category = "run"
description = "A closure literal given to a generic whose parameter is bound by a signature: both forms, F by value, '&F' and '&mut F'"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

[scenario.closure_overload]
category = "run"
description = "A closure literal meeting overloaded callees: a number's overload never takes it, then its parameter count, then its written types"
tags = ["typecheck", "runtime"]

# -------- warnings --------

[scenario.closure_warn_name]
category = "warn"
description = "Naming a function written where a value is expected"
tags = ["parse"]
diagnostics = 3

# -------- parse stage --------

[scenario.closure_parse_sig]
category = "reject"
description = "Anonymous function signatures the parser cannot accept"
tags = ["parse"]
diagnostics = 3

# -------- type check stage --------

[scenario.closure_typecheck_sig]
category = "reject"
description = "Parts of an anonymous function's signature that are not types"
tags = ["typecheck"]
diagnostics = 2

[scenario.closure_typecheck_use]
category = "reject"
description = "An anonymous function whose type is not the type wanted where it is written"
tags = ["typecheck"]
diagnostics = 5

[scenario.closure_typecheck_call]
category = "reject"
description = "Calls made through a value holding an anonymous function"
tags = ["typecheck"]
diagnostics = 3

[scenario.closure_typecheck_comma]
category = "reject"
description = "A function taking one two-valued function, where a type of two parameters, a function and a u32, is wanted"
tags = ["typecheck"]
diagnostics = 3

# -------- parse stage --------

[scenario.closure_parse_literal]
category = "reject"
description = "The short form of a closure with something other than a name for a parameter"
tags = ["parse"]
diagnostics = 1

# -------- name resolution stage --------

[scenario.closure_nameres_self]
category = "reject"
description = "A closure naming the variable it is the value of: it cannot call itself"
tags = ["nameres"]
diagnostics = 1

# -------- type check stage --------

[scenario.closure_typecheck_literal]
category = "reject"
description = "Closure literals refused: a return type the paths disagree on, a parameter with no type, the wrong parameter count, a global, a change not allowed, overloads that cannot be chosen between"
tags = ["typecheck"]
diagnostics = 7

# -------- GPU code --------

# A closure in a kernel, given to a generic bound by a signature: the static
# form. Everything inlines into the kernel and the closure dissolves into its
# locals, a borrow of a slice included.
[scenario.closure_gpu]
category = "compile"
description = "On a SPIR-V target a closure literal given to a '[F fn(sig)]' generic compiles, capturing a local, a buffer's slice and listed state that changes, beside a hand-written struct with '()'; the generic is inlined and the closure leaves no stack slot, call or table"
tags = ["typecheck", "genllvm"]

[[scenario.closure_gpu.run]]
name = "vulkan"
options = ["--triple=spirv1.6-unknown-vulkan1.3", "--verify"]

[[scenario.closure_gpu.run]]
name = "vulkan-debug"
options = ["--triple=spirv1.6-unknown-vulkan1.3", "--verify", "--debug"]

[[scenario.closure_gpu.check]]
name = "the-closures-dissolve-into-the-kernels"
target = "llvmir"
contains = [
  "define void @localVar()",
  "define void @buffer()",
  "define void @state()",
  "define void @handWritten()",
]
excludes = ["alloca", "define internal", "closure#", "call float"]

# What a closure in GPU code may not hold, nor be made
[scenario.closure_gpu_reject]
category = "reject"
description = "On a SPIR-V target a closure holding an owning reference or a function reference, made a function reference, or made a virtual reference, is refused"
tags = ["typecheck"]
diagnostics = 6

[[scenario.closure_gpu_reject.run]]
name = "vulkan"
options = ["--triple=spirv1.6-unknown-vulkan1.3"]
