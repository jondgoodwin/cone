# module - modules, namespaces, 'include'/'import'/'extern'. Tier 2.
#
# Key reference: design/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# This is the first group with support modules: a .cone file here that is
# neither a listed scenario nor a listed support module is an error (R2.12), so
# every file a scenario imports or includes is named below. Support files carry
# a 'module' prefix that an identifier can hold, because a module's name is also
# its qualifier and 'module-importsub' is not spellable as one.
#
# It is also the first group with folder scenarios and a folder support module.
# A name here reaches either '<name>.cone' or '<name>/<name>.cone', which is the
# compiler's own lookup, and a folder is registered below under its own name.
# The files inside one are not registered: the sweep is what finds them, and
# listing them would restate the thing under test.
#
# Only module-success, module-folder-sweep and module-submodule run. Each of them
# is one module or one tree of them compiled into one object, which is what a
# program is. Everything about 'import'
# compiles and stops there:
# a program spanning modules cannot be linked yet, and design/diagnostics/test-suite.md
# section 4 forbids adding a synthetic 'main' to promote a scenario's category.
# What running would have shown -- which symbol a call lowered to, and whether a
# symbol was emitted at all -- is asserted as named symbols checks instead.
#
# The failure scenarios are split by pipeline stage, because analysis halts
# between stages. module-import-missing is split off again inside the parse
# stage because its failure aborts rather than accumulates, and
# module-include-eof because its diagnostic lands in an included file.
#
# Left out deliberately:
#
# - A 'mod' declaration in an *included* file, which is ErrorModDcl because an
#   included file's declarations join the including module and so it names no
#   module of its own. The condition module-parse-mod pins is the same one by the
#   same rule; what an included file adds is a second route to it, and reaching it
#   costs a support file whose annotation would then be imposed on every scenario
#   that includes it.

support = ["moduleinc.cone", "modulesub.cone", "moduleeof.cone",
           "moduleprov.cone", "moduleprov2.cone", "modulenoname.cone",
           "modulesyms.cone", "modulecyc.cone", "modulex_y.cone", "modulex.cone",
           "moduletransit.cone", "modulelate.cone", "moduleearly.cone",
           "modulehide.cone", "modulehidelate.cone",
           "modulemacro.cone", "moduledeclared.cone",
           "modulefold.cone", "modulefoldlate.cone", "modfolder"]

# -------- success --------

[scenario.module-success]
category = "run"
description = "'include', 'extern' and namespace qualification inside one module"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# Pins today's spelling of an 'extern' declaration, so the symbol-generation
# refactor can show nothing moved: the C name exactly as written, no prefix, a
# 'declare' that leads no COMDAT. Both forms of the declaration -- in a block
# and on its own -- come out the same.
[[scenario.module-success.check]]
name = "extern-declares-the-bare-c-name"
target = "llvmir"
contains = ["declare i32 @abs(i32)", "declare i64 @labs(i64)"]
excludes = ["$abs", "$labs", "@abs(i32) comdat", "@labs(i64) comdat"]

# What the file's 'mod' header does not do. It names the module, which is what
# makes 'onemod.counted' reach the global a local hides; it does not put the
# module in the owner chain a symbol is spelled from, so the root's declarations
# stay bare and 'main' stays linkable. Nothing is spelled after 'onemod'.
[[scenario.module-success.check]]
name = "a-root-mod-header-does-not-prefix-the-root-symbols"
target = "symbols"
contains = [
  "global internal counted comdat nodeduplicate",
  "define internal twice comdat nodeduplicate",
]
excludes = ["onemod."]

# A global's fold binds names and declares nothing. The global is one symbol and
# each method is one, spelled exactly as they would be with no fold written, and
# no symbol is spelled after a folded name -- not the wildcard's, not the renamed
# ones. What makes that possible is the receiver: a global is one instance at a
# fixed address, so a folded name needs no copy, no offset and no thunk.
[[scenario.module-success.check]]
name = "a-global-fold-declares-no-symbol-of-its-own"
target = "symbols"
contains = [
  "global internal settings comdat nodeduplicate",
  "global internal backup comdat nodeduplicate",
  "define internal Settings.cells comdat nodeduplicate",
]
excludes = ["rows", "cols", "backupRows", "backupCells"]

# -------- the folder sweep --------
#
# A module is the files of a folder. module-folder-sweep is the folder scenario
# compiled as the program's root, and it runs, because a folder module is one
# module however many files it spans; module-folder-import reaches one through
# 'import'. Between them they pin what the sweep brings in, what names it, and
# that the files of an organisational subfolder are the enclosing module's.
#
# What pins the other half -- that a file which is NOT its folder's designated
# file sweeps nothing -- is the whole rest of the corpus: every group directory
# holds a dozen unrelated programs side by side, and each compiles alone.

[scenario.module-folder-sweep]
category = "run"
description = "A module spanning its folder's files: a sibling and two depths of subfolder, compiled from the designated file alone"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# A folder module is one module, so its declarations are the root's and are
# spelled bare -- whichever of its files each was written in. Nothing is spelled
# after the folder, after a subfolder, or after a file.
[[scenario.module-folder-sweep.check]]
name = "a-folder-modules-files-declare-into-one-module"
target = "symbols"
contains = [
  "define internal siblingAdd comdat nodeduplicate",
  "define internal nestedScale comdat nodeduplicate",
  "define internal deepestOf comdat nodeduplicate",
  "global internal siblingTotal comdat nodeduplicate",
]
excludes = ["module-folder-sweep.", "deep.", "sibling.", "nested."]

[scenario.module-folder-import]
category = "compile"
description = "An import reaching a folder's module, whose sibling and subfolder files are its own"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# Every file the folder swept in declares into the one module, so every one of
# them is spelled after the FOLDER's name. Neither the subfolder nor a file
# appears in a symbol: neither is a namespace.
[[scenario.module-folder-import.check]]
name = "swept-files-declare-under-the-folders-module"
target = "symbols"
contains = [
  "declare modfolder.folderAdd",
  "declare modfolder.helperScale",
  "declare modfolder.partsOf",
]
excludes = ["parts.", "helper.", "scale."]

# -------- the module tree --------
#
# A subfolder holding its own designated file is a SUBMODULE, so the folder tree
# carries the module tree. module-submodule runs one, two levels deep, and pins
# what the tree spells at the linker; module-submodule-reject holds what the tree
# refuses at parse, and module-submodule-nameres what a path through it may not
# reach.
#
# All three are folder scenarios and could not be anything else: a submodule comes
# from a folder, so the layout IS the case.

[scenario.module-submodule]
category = "run"
description = "A module tree two levels deep: a submodule of the root and a submodule of that, reached by path, beside the organisational folders that draw nothing"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# A submodule is owned by its parent, so its declarations are spelled after the
# parent's name and a submodule of a submodule after both. The root contributes
# nothing, as it does for any program, so what a submodule's symbol carries is the
# tree below the root and no more.
#
# Neither an organisational folder nor a file is a namespace, at any level: what
# detail/helpers.cone declares is spelled after geometry alone, exactly as a file
# swept into the root is spelled bare.
[[scenario.module-submodule.check]]
name = "a-submodules-declarations-are-spelled-after-its-parents"
target = "symbols"
contains = [
  "define internal perimeter comdat nodeduplicate",
  "define internal geometry.area comdat nodeduplicate",
  "define internal geometry.perimeterOf comdat nodeduplicate",
  "define internal geometry.marginOf comdat nodeduplicate",
  "define internal geometry.scaling.twice comdat nodeduplicate",
  "global internal geometry.unit comdat nodeduplicate",
]
excludes = ["module-submodule.", "detail.", "helpers.", "shapes.", "geometry.detail"]

[scenario.module-submodule-reject]
category = "reject"
description = "What the module tree refuses: a designated file too deep to draw a module, an import naming the module's own submodule, and a declaration sharing a submodule's name"
tags = ["parse"]
diagnostics = 5

# The refusal of a module folder that is not a direct child of its parent
# module's folder has no line of its own: which folder draws a module is a fact
# about the filesystem, not a position in a source.
[[scenario.module-submodule-reject.unlocated]]
code = "ErrorModFolder"
message = "direct child of its parent module's folder"

[scenario.module-submodule-nameres]
category = "reject"
description = "What a path through the tree may not reach: a submodule's private declaration, an unmarked submodule from outside its parent, and a sister nobody imported"
tags = ["nameres"]
diagnostics = 3

# -------- import within the tree --------
#
# A module reaches a sister by importing her NAME, resolved against the registry
# its parent is rather than against the filesystem. module-import-sister runs
# one, so an import across the tree links exactly as a call down into it does;
# module-import-reject holds what a written path may not reach, and
# module-import-nameres what an import does not put in reach.
#
# All three are folder scenarios and could not be anything else: a sister comes
# from a folder, so the layout IS the case.

[scenario.module-import-sister]
category = "run"
description = "A submodule importing its sisters by name: one reached through her, one wildcard-folded, and one re-exported for the parent to walk through"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# An import within the tree links. Every module of the tree is compiled into one
# object, so a sister's function is DEFINED here, spelled after her, exactly as a
# submodule's is -- which is what an import between two loaded modules could not
# do, since an imported module's bodies are not generated.
[[scenario.module-import-sister.check]]
name = "a-sister-s-declarations-are-defined-and-spelled-after-her"
target = "symbols"
contains = [
  "define internal engine.drive comdat nodeduplicate",
  "define internal wheels.turn comdat nodeduplicate",
  "define internal rims.size comdat nodeduplicate",
]
excludes = ["declare wheels.turn", "declare rims.size"]

# An import binds names and declares nothing, and neither does a fold. Nothing is
# spelled after the module that imported or folded a name: not the module binding
# engine re-exported, not the name engine folded from rims.
[[scenario.module-import-sister.check]]
name = "an-import-declares-no-symbol-of-its-own"
target = "symbols"
excludes = ["engine.wheels", "engine.size", "engine.rims", "module-import-sister."]

[scenario.module-import-reject]
category = "reject"
description = "What a written path may not reach: a sister's file, a parent, and a parent's sister"
tags = ["parse"]
diagnostics = 3

[scenario.module-import-nameres]
category = "reject"
description = "What an import does not put in reach: a sister's private name, a name she has not got, and a sister of an ancestor"
tags = ["nameres"]
diagnostics = 3

# -------- an import's 'use' clause --------
#
# An import may carry the fold clause a global carries -- a list with 'as', '*
# but', a block, 'use pub' -- with the imported module as the source. Every name
# it admits is an alias with its own spelling, private to the importing module
# unless the import says 'pub': 'pub import' reaches every binding the import
# makes, the module's own name included, and 'use pub' only the folds.
#
# module-import-use runs the clause in a tree of four sisters, with a re-export
# reached through a third module; module-import-use-nameres holds what a clause
# does not put in reach and what it refuses to fold; module-import-use-parse
# holds what is refused as it is parsed, and the rule for two imports of one
# module: an identical repeat is ignored, a differing one is ErrorDupImport.

[scenario.module-import-use]
category = "run"
description = "An import's 'use' clause: a list with 'as', '* but', a block, 'use pub' re-exported through a wildcard import, 'pub import', and identical repeats"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# A fold binds and declares nothing, whatever its spelling. No symbol is spelled
# after the module that folded a name, nor after the local spelling 'as' gave it;
# every call lowers to the declaring module's own symbol.
[[scenario.module-import-use.check]]
name = "an-import-clause-declares-no-symbol-of-its-own"
target = "symbols"
contains = [
  "define internal shapes.area comdat nodeduplicate",
  "define internal shapes.perimeter comdat nodeduplicate",
  "define internal units.feet comdat nodeduplicate",
]
excludes = ["draw.area", "draw.edge", "gallery.ft", "gallery.units", "gallery.metres", "draw.metres", "edge comdat", "ft comdat"]

[scenario.module-import-use-nameres]
category = "reject"
description = "What an import's 'use' clause does not put in reach, and each name it refuses to fold: absent, private, colliding, the module itself"
tags = ["nameres"]
diagnostics = 9

[scenario.module-import-use-parse]
category = "reject"
description = "Two imports of one module that differ, and the clause spellings refused as they are parsed"
tags = ["parse"]
diagnostics = 8

# A re-export does not travel round a cycle of imports: of two modules that
# import each other, one folds from the other while the other's folds are still
# running. Where a name is missing for that reason alone it is ErrorCircular,
# naming the cycle, at a clause's item, a path, and a bare use; where it is
# missing for any other reason, cycle or none, the message is the one it always
# had. Whether a cycle of imports is allowed at all is not decided here: it is.
[scenario.module-import-cycle-nameres]
category = "reject"
description = "A re-export lost round a cycle of imports, reported as one at a clause's item, a path and a bare use; a name missing for any other reason keeps its message"
tags = ["nameres"]
diagnostics = 9

# -------- a module's 'use' of an enum --------
#
# A variant is a name of its enum, and 'use Colors;' folds the variants in as
# names of the module. The fold is the module's own binding, private unless the
# statement says 'use pub', which is the visibility every fold has: a public fold
# is reached by a path from outside and carried on by a wildcard import. That is
# the re-export, and it is a module's subject, so it is covered here; what the
# statement is and what it refuses is enum's. Both are folder scenarios because a
# re-export needs a second module to be seen from, and a tree is the one shape
# that has two modules and still links.

[scenario.module-use-enum]
category = "run"
description = "An enum's variants folded 'use pub' and reached from a sister through a wildcard import and from the parent by a path, and a fold whose enum is named by a path"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

[scenario.module-use-enum-nameres]
category = "reject"
description = "What a fold of an enum's variants does not put in reach: a private fold by a path or through a wildcard import, and a fold colliding with a name an import brought"
tags = ["nameres"]
diagnostics = 3

[scenario.module-declared]
category = "compile"
description = "A module named by its 'mod' declaration rather than by its filename, beside one still named by its file"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# The declared name is the module's identity at every point it is used: the
# importer binds it, a path is written with it, and the owner chain a symbol is
# spelled from carries it. The filename it replaced is nowhere -- not as a symbol
# prefix, and not as a name this file could have qualified with.
[[scenario.module-declared.check]]
name = "a-declared-module-name-replaces-its-filename"
target = "symbols"
contains = [
  "declare renamed.scaleBy",
  "declare renamed.timesFactor",
  "external constant renamed.factor",
]
excludes = ["moduledeclared"]

# The transitional half: a module that declares none keeps the name its filename
# gave it, so both kinds of neighbour are reached the same way. This goes when the
# folder walk replaces filename naming altogether.
[[scenario.module-declared.check]]
name = "a-module-with-no-declaration-keeps-its-filename"
target = "symbols"
contains = ["declare modulesub.plain"]

[scenario.module-imports]
category = "compile"
description = "A wildcard import folding an overload name, and what the importer declares for it"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# Every candidate of the folded overload name is declared in the importer, and
# every one is public: a private candidate may not join a public name
# (core-parse-overload-private), so the fold never reaches a declaration the
# importer may not see. A declaration is external, as an LLVM declaration can
# be nothing else.
[[scenario.module-imports.check]]
name = "imported-candidates-declared"
target = "symbols"
contains = [
  "declare modulesub.scaleInt",
  "declare modulesub.scaleFloat",
  "declare modulesub.plain",
  "declare modulesub._leading",
]

# An overload name has no symbol of its own; a private overload name is not
# folded by the import at all, so neither it nor its candidate is declared; and
# a private function nothing public reaches leaves no symbol either. A
# declaration's line ends at its name, so the newline is what stops
# 'modulesub.scale' from matching 'modulesub.scaleInt'.
[[scenario.module-imports.check]]
name = "no-symbol-for-imported-overload-name"
target = "symbols"
excludes = ["modulesub.scale\n", "modulesub.hidden", "hiddenOne", "hiddenScaleFloat"]

# The other half of the COMDAT rule core-overload states: only a definition may
# lead one. An imported module's functions have bodies in the IR, but this
# object file merely declares them, so they get none.
[[scenario.module-imports.check]]
name = "imported-declarations-carry-no-comdat"
target = "symbols"
excludes = [
  "modulesub.scaleInt comdat",
  "modulesub.scaleFloat comdat",
  "modulesub.plain comdat",
]

[scenario.module-imports-macro]
category = "compile"
description = "A wildcard import of a module declaring a macro and an anonymous function, each of which once broke the importer"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# The fold asks every named node of the imported module whether it is private,
# and a macro is a named node; asking it for its name once reached a node kind
# the name lookup did not know and abandoned the compile as a compiler defect.
# The folded function is declared in the importer like any imported function.
# The macro is expanded into its use and leaves no symbol, so nothing is
# declared under its name.
[[scenario.module-imports-macro.check]]
name = "folded-function-declared-and-macro-leaves-no-symbol"
target = "symbols"
contains = ["declare modulemacro.bump"]
excludes = ["modulemacro.four"]

# The same import carries a function that uses an anonymous function, and the
# lift of that anonymous function into a module this compile generates nothing
# for once segfaulted here. It is declared like any other imported function; the
# anonymous function it contains belongs to the module that defines it, so no
# 'anon' is declared in the importer.
[[scenario.module-imports-macro.check]]
name = "importing-an-anonymous-function-declares-only-its-owner"
target = "symbols"
contains = ["declare modulemacro.useAnon"]
excludes = ["declare anon"]

# The macro's body, the literal 4, is what the one call passes: the fold
# carried the macro across and the use expanded it. Pre-optimization IR,
# because the optimizer removes the uncalled internal function; the argument
# list alone, because a check may not spell a symbol's encoded bytes.
[[scenario.module-imports-macro.check]]
name = "folded-macro-expands-into-its-use"
target = "preir"
contains = ["(i64 4)"]

[scenario.module-qualified]
category = "compile"
description = "An import without '.*', whose members are reached by qualifying them"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# A qualified call reaches the same namespaced concrete symbol a folded one
# does, so the importer declares it, and the qualifier itself leaves nothing
# behind.
# A qualified global is the same external declaration a fold reaches, and a
# qualified type name lowers to the type itself: the LLVM type is named after
# the struct alone, and the root fn that takes one is declared over it. A
# qualifier is a way of finding a declaration, never part of what it lowers to.
[[scenario.module-qualified.check]]
name = "qualified-global-lowers-to-the-declaration"
target = "symbols"
contains = [
  "external global modulesyms.shared",
  "external constant modulesyms.fixed",
]

[[scenario.module-qualified.check]]
name = "qualified-type-name-is-the-type"
target = "preir"
contains = ["%Gadget = type", "@gadgetOf(%Gadget"]
excludes = ["modulesyms_Gadget", '"modulesyms.Gadget"']

[[scenario.module-qualified.check]]
name = "qualified-call-lowers-to-namespaced-symbol"
target = "symbols"
contains = ["declare modulesub.plain", "declare modulesub.scaleInt"]
excludes = ["modulesub.scale\n"]

[scenario.module-qualified-nested]
category = "compile"
description = "A two-hop path, 'mod.Type.name', reaching a type's static function"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# The call resolves through module then type to the static function, which the
# importer declares under both. This is the collapse feeding itself: the inner
# hop has to leave a resolved type name for the outer hop to find.
[[scenario.module-qualified-nested.check]]
name = "two-qualifier-call-lowers-to-the-static-function"
target = "symbols"
contains = ["declare modulesyms.Gadget.make"]

# -------- the transit trio --------
#
# Three scenarios reach one name that a middle module holds only by folding
# modulesub. What decides whether a qualifier can see it is the 'pub' on that
# module's import and nothing else: moduletransit re-exports, modulehide is the
# same file without the keyword, and the reaches against the two are the whole
# of the transit rule, which is the visibility rule read on the binding a fold
# made.
#
# What the trio used to pin was a load-order defect: one name, three answers,
# decided by whether the asking module was loaded before or after the folding
# one. Every module's folds now run ahead of any module's body, dependency
# first, so module-transit reaches the re-exported name from all three positions
# and module-nameres-transit and -late are refused from either side.

[scenario.module-transit]
category = "compile"
description = "A re-exported fold reached through its module's qualifier from before it, after it, and from the root, which loads first"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# Every reach lowers to the symbol of the module that DECLARES the name: a fold
# binds, it declares nothing, so nothing is spelled after moduletransit for a
# name it folded, and nothing after the modules that reached it through her.
[[scenario.module-transit.check]]
name = "transit-name-declares-under-its-declaring-module"
target = "symbols"
contains = [
  "declare moduleearly.viaEarly",
  "declare modulelate.viaMid",
  "declare moduletransit.midOwn",
  "declare modulesub.plain",
  "declare modulesub.scaleInt",
]
excludes = ["moduletransit.plain", "moduletransit.scale\n", "modulelate.plain", "moduleearly.plain"]

# -------- symbol kinds --------
#
# The four scenarios below assert the symbol an importer emits for kinds no
# other check names: an 'extern system' declaration, an imported global, an
# imported private declaration, an extern inside an imported module, an import
# cycle, and two modules whose names would once have joined into one symbol.

[scenario.module-extern-system]
category = "compile"
description = "An 'extern system' declaration and the imported, stdcall symbol it lowers to"
tags = ["parse", "genllvm"]

# Pins today's spelling for the symbol-generation refactor: 'system' adds the
# DLL import storage class and the x86 stdcall convention to an otherwise
# ordinary extern declaration, which still takes no prefix and no COMDAT.
[[scenario.module-extern-system.check]]
name = "extern-system-declares-a-dllimport-stdcall-symbol"
target = "llvmir"
contains = ["declare dllimport x86_stdcallcc i32 @GetTickCount()"]
excludes = ["$GetTickCount", "@GetTickCount() comdat"]

[scenario.module-symbols]
category = "compile"
description = "What an importer emits for an imported global, private declarations, extern and struct methods"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# An imported global is an 'external' declaration spelled after its module,
# with no initializer and no COMDAT; an imported 'imm' global is an 'external
# constant'. A definition's line would carry its COMDAT.
[[scenario.module-symbols.check]]
name = "imported-global-is-an-external-declaration"
target = "symbols"
contains = [
  "external global modulesyms.shared",
  "external constant modulesyms.fixed",
]
excludes = [
  "modulesyms.shared comdat",
  "modulesyms.fixed comdat",
]

# An imported module's private top-level function and global leave no symbol
# at all in the importer, while its public function is declared.
[[scenario.module-symbols.check]]
name = "imported-private-top-level-names-are-absent"
target = "symbols"
contains = ["declare modulesyms.pubFn"]
excludes = ["privFn", "privGlobal"]

# A struct's methods are declared after the module and then the type, and the
# private method *is* declared, spelled and linked like the public ones,
# although a private top-level function of the same module is not.
[[scenario.module-symbols.check]]
name = "imported-private-method-is-declared"
target = "symbols"
contains = [
  "declare modulesyms.Gadget.get",
  "declare modulesyms.Gadget.hid",
  "declare modulesyms.Gadget.make",
]
excludes = [
  "modulesyms.Gadget.get comdat",
  "modulesyms.Gadget.hid comdat",
]

# The struct's LLVM type is named after the type alone: an LLVM type name is
# not an object-file symbol, so it takes no module path.
[[scenario.module-symbols.check]]
name = "imported-struct-type-carries-no-module-path"
target = "llvmir"
contains = ["%Gadget = type"]
excludes = ["%modulesyms_Gadget", '%"modulesyms.Gadget"']

# An 'extern' declared inside an imported module is still the bare C name,
# with no module path.
[[scenario.module-symbols.check]]
name = "extern-inside-an-imported-module-takes-no-prefix"
target = "symbols"
contains = ["declare labs"]
excludes = ["modulesyms.labs"]

[scenario.module-cycle]
category = "compile"
description = "An import cycle back to the root file, which finds the root instead of re-parsing it"
tags = ["parse", "nameres", "genllvm"]

# The root's own declarations are defined under their bare names, as in any
# root file, and the sub module's after its module ...
[[scenario.module-cycle.check]]
name = "root-defines-its-own-symbols-unprefixed"
target = "symbols"
contains = [
  "global internal counter comdat nodeduplicate",
  "define internal rootFn comdat nodeduplicate",
  "define internal caller comdat nodeduplicate",
  "declare modulecyc.subFn",
]

# ... and each of them exactly once. The root module is named after its file,
# so the import back to it finds the module already parsed rather than reading
# the file again as a second module named 'module-cycle': nothing is declared
# under that module, and no definition is repeated (LLVM would print a second
# 'rootFn' as 'rootFn.1').
[[scenario.module-cycle.check]]
name = "cycle-finds-the-root-and-declares-nothing-twice"
target = "symbols"
excludes = [
  "module-cycle",
  "rootFn.1",
  "caller.1",
  "counter.1",
]

[scenario.module-collision]
category = "compile"
description = "'z' in module 'modulex_y' and 'y_z' in module 'modulex', which a separator-joined symbol would have confused"
tags = ["parse", "nameres", "genllvm"]

# Every component of a symbol is length-prefixed, so a module named 'modulex_y'
# declaring 'z' and a module named 'modulex' declaring 'y_z' spell two symbols
# rather than one. Were they to join into one, LLVM would rename the second
# '.1' and one of the two calls would reference a symbol nothing defines.
[[scenario.module-collision.check]]
name = "distinct-modules-spell-distinct-symbols"
target = "symbols"
contains = [
  "declare modulex_y.z",
  "declare modulex.y_z",
]
excludes = [".1"]

# -------- parse stage --------

[scenario.module-parse]
category = "reject"
description = "'extern' declaration syntax the parser cannot accept"
tags = ["parse"]
diagnostics = 2

# Separate from module-parse because the subject is the 'mod' declaration rather
# than 'extern', and because it needs an accepted header first: what follows is
# then refused for its own reason instead of for following a bad declaration. The
# 'mod trait' spelling is asserted in trait-parse-kind-modifier as well, where the
# subject is 'trait' as a modifier on a kind; here it is one of the two shapes of
# 'mod' that are admitted and unbuilt.
[scenario.module-parse-mod]
category = "reject"
description = "A 'mod' declaration that is misplaced, has no name or is 'pub' with no parent module, and the nested block and abstraction shapes that are unbuilt"
tags = ["parse"]
diagnostics = 6

# A module's name meeting another name of the module, which is the ordinary
# duplicate rule. What it pins is where each half is reported: at the import
# statement and at the 'mod' declaration, neither of which is where the lexer
# stood when the binding was made. The submodule half of the same question is in
# module-submodule-reject.
[scenario.module-parse-dupname]
category = "reject"
description = "An import binding a name the module's own declaration or another declaration already has, reported at the import and at the declaration"
tags = ["parse"]
diagnostics = 4

# What the sweep refuses. It is a folder scenario because several of its
# diagnostics are reported against a file the scenario's own source never names:
# the module's files are what is under test, so they are where the expectations
# live. Two of the six have no line of their own -- which files a module holds is
# a fact about the filesystem rather than a position in a source -- so they are
# declared below.
[scenario.module-folder-reject]
category = "reject"
description = "What the folder sweep refuses: a misnaming declaration, a swept file declaring a module, importing and including one's own files, two files of one name and two subfolders declaring one name"
tags = ["parse"]
diagnostics = 7

[[scenario.module-folder-reject.unlocated]]
code = "ErrorDupFile"
message = "holds two files named same"

[scenario.module-import-missing]
category = "reject"
description = "An import naming a source file that is not there"
tags = ["parse"]
diagnostics = 0
exit = 2

[scenario.module-include-eof]
category = "recover"
description = "An included file the parser stops reading before its end"
tags = ["parse"]
diagnostics = 1

# Split off for module-include-eof's reason: the diagnostics land in the
# imported file. What it pins is that a malformed global declaration there is
# reported and stops the compile, rather than being reported and then crashing
# the compiler while its symbol is named.
[scenario.module-parse-noname]
category = "recover"
description = "A global declaration with no name, in an imported module"
tags = ["parse"]
diagnostics = 3

# The same condition in the main file rather than an included one, which is why
# it can be a 'reject' with its own annotation where module-include-eof cannot.
[scenario.module-parse-strayend]
category = "reject"
description = "A stray block end at global scope in the main source file"
tags = ["parse"]
diagnostics = 1

# -------- name resolution stage --------

[scenario.module-nameres]
category = "reject"
description = "Paths through a module and a type that resolve to nothing, or to something private"
tags = ["nameres"]
diagnostics = 5

# Once left out as re-asserting what notFolded establishes; pinned now because
# a fold that ran and a fold that never happened are two different reasons for
# one code, and the classification refactor and the transit rule both touch
# what a fold carries across.
[scenario.module-nameres-fold]
category = "reject"
description = "Private names a wildcard import does not fold: a function, an overload name and its candidate"
tags = ["nameres"]
diagnostics = 3

# A global's fold is expanded while the module is name resolved, so what a clause
# may admit and what it may fold from are this stage's.
[scenario.module-nameres-fold-global]
category = "reject"
description = "What a global's 'use' clause may not admit, and what it may not fold from"
tags = ["nameres"]
diagnostics = 8

# A fold makes a binding, and a binding carries its own visibility: 'use pub'
# widens what the folding module shows, a plain 'use' does not, and the members
# behind both are public in the type either way. Its one annotation lives in the
# support module that writes the reach, because that is where it is reported.
[scenario.module-nameres-fold-visibility]
category = "reject"
description = "A folded name reached from another module: public only if the clause said 'pub'"
tags = ["nameres"]
diagnostics = 1

# The refused half of the transit trio (see module-transit above): the same fold
# with the re-export left off.
[scenario.module-nameres-transit]
category = "reject"
description = "A folded name its module did not re-export, reached through that module's qualifier and refused"
tags = ["nameres"]
diagnostics = 2

# Its one diagnostic is reported against modulehidelate.cone, so the annotation
# lives there and this file has none.
[scenario.module-nameres-transit-late]
category = "reject"
description = "The same refusal from a module loaded after the folding one, so it is the binding's visibility rather than the order"
tags = ["nameres"]
diagnostics = 1

# -------- type check stage --------

# Which file a diagnostic names, when more than one module was parsed. Its one
# annotation lives in the support module the error is in, because that is where
# the compiler reports it.
[scenario.module-typecheck-provenance]
category = "reject"
description = "A diagnostic in an imported module names that module's file, not the last one parsed"
tags = ["typecheck"]
diagnostics = 1

# The other half of module-nameres: a period whose left side is a value, which
# is a member access and fails against the receiver's type rather than as a
# lookup. Separate because name resolution halts the pipeline, so the two
# stages' failures cannot share a file.
[scenario.module-typecheck-notnamespace]
category = "reject"
description = "A period whose left side names neither a module nor a type"
tags = ["nameres", "typecheck"]
diagnostics = 3
