# -------- one declaration reached by two routes --------
#
# A name the module's own source WRITES twice is an error, even for the same
# declaration: "two different ways of bringing in the same thing... it's a
# cleanliness issue" [Jon 23 Sep]. The same name listed twice in a clause, two
# identical 'use Colors;', a name both imported and listed, a listed name that
# is the module's own declaration, a global's clause listing a member twice.
#
# A name the module never wrote -- one a wildcard 'use *', an 'extends' or the
# implicit core import brought -- is one binding with another of the SAME
# declaration under that name: the second is the binding the name has already
# [Jon 23 Sep]. One side unwritten is enough, so a listed name meeting a
# wildcard's arrival of the same declaration is one binding too. Where one route
# is public and the other private, the binding is public, whichever was folded
# first. module_extends_back is the same rule met through 'extends'.
#
# module_fold_diamond runs the diamond, a listed name beside a wildcard in both
# orders, a written enum 'use' beside the core import's variants, and the public
# route winning in both orders. module_fold_written_nameres holds what is
# written twice; module_fold_diamond_nameres holds what collides however it was
# reached: two different declarations under one name, and one member folded
# through two globals.

[scenario.module_fold_diamond]
category = "run"
description = "One declaration reaching a module through two re-exporting wildcard imports, a listed name beside a wildcard in both orders, 'use Option;' beside the core import's variants, and a private and a public route to one name in both orders"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

[scenario.module_fold_written_nameres]
category = "reject"
description = "A name the module writes twice for the same declaration: listed twice in a clause, listed through two imports, listed again after a wildcard and a listing, two identical enum 'use's, a module both imported and listed, and a global's clause listing a member twice"
tags = ["nameres"]
diagnostics = 7

[scenario.module_fold_diamond_nameres]
category = "reject"
description = "What still collides: two different declarations under one name through a diamond's two sides, and one member folded through two globals"
tags = ["nameres"]
diagnostics = 2

[scenario.module_declared]
category = "compile"
description = "A module named by its 'mod' declaration rather than by its filename, beside one whose 'mod' line restates its file's name"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# The declared name is the module's identity at every point it is used: the
# importer binds it, a path is written with it, and the owner chain a symbol is
# spelled from carries it. The filename it replaced is nowhere -- not as a symbol
# prefix, and not as a name this file could have qualified with.
[[scenario.module_declared.check]]
name = "a-declared-module-name-replaces-its-filename"
target = "symbols"
contains = [
  "declare renamed.scaleBy",
  "declare renamed.timesFactor",
  "external constant renamed.factor",
]
excludes = ["moduledeclared"]

# The other half: a 'mod' line restating the filename names the module after
# it, so both kinds of neighbour are reached the same way.
[[scenario.module_declared.check]]
name = "a-mod-line-restating-the-filename-keeps-it"
target = "symbols"
contains = ["declare modulesub.plain"]

[scenario.module_imports]
category = "compile"
description = "A wildcard import folding an overload name, and what the importer declares for it"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# Every candidate of the folded overload name is declared in the importer, and
# every one is public: a private candidate may not join a public name
# (core_parse_overload_private), so the fold never reaches a declaration the
# importer may not see. A declaration is external, as an LLVM declaration can
# be nothing else.
[[scenario.module_imports.check]]
name = "imported-candidates-declared"
target = "symbols"
contains = [
  "declare modulesub.scaleInt",
  "declare modulesub.scaleFloat",
  "declare modulesub.plain",
  "declare modulesub._leading",
]

# An overload name has no symbol of its own; a private overload name is not
# folded by the import at all, so neither it nor its candidate is declared; and
# a private function nothing public reaches leaves no symbol either. A
# declaration's line ends at its name, so the newline is what stops
# 'modulesub.scale' from matching 'modulesub.scaleInt'.
[[scenario.module_imports.check]]
name = "no-symbol-for-imported-overload-name"
target = "symbols"
excludes = ["modulesub.scale\n", "modulesub.hidden", "hiddenOne", "hiddenScaleFloat"]

# The other half of the COMDAT rule core_overload states: only a definition may
# lead one. An imported module's functions have bodies in the IR, but this
# object file merely declares them, so they get none.
[[scenario.module_imports.check]]
name = "imported-declarations-carry-no-comdat"
target = "symbols"
excludes = [
  "modulesub.scaleInt comdat",
  "modulesub.scaleFloat comdat",
  "modulesub.plain comdat",
]

[scenario.module_imports_macro]
category = "compile"
description = "A wildcard import of a module declaring a macro and an anonymous function, each of which once broke the importer"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# The fold asks every named node of the imported module whether it is private,
# and a macro is a named node; asking it for its name once reached a node kind
# the name lookup did not know and abandoned the compile as a compiler defect.
# The folded function is declared in the importer like any imported function.
# The macro is expanded into its use and leaves no symbol, so nothing is
# declared under its name.
[[scenario.module_imports_macro.check]]
name = "folded-function-declared-and-macro-leaves-no-symbol"
target = "symbols"
contains = ["declare modulemacro.bump"]
excludes = ["modulemacro.four"]

# The same import carries a function that uses an anonymous function, and the
# lift of that anonymous function into a module this compile generates nothing
# for once segfaulted here. It is declared like any other imported function; the
# anonymous function it contains belongs to the module that defines it, so no
# 'anon' is declared in the importer.
[[scenario.module_imports_macro.check]]
name = "importing-an-anonymous-function-declares-only-its-owner"
target = "symbols"
contains = ["declare modulemacro.useAnon"]
excludes = ["declare anon"]

# The macro's body, the literal 4, is what the one call passes: the fold
# carried the macro across and the use expanded it. Pre-optimization IR,
# because the optimizer removes the uncalled internal function; the argument
# list alone, because a check may not spell a symbol's encoded bytes.
[[scenario.module_imports_macro.check]]
name = "folded-macro-expands-into-its-use"
target = "preir"
contains = ["(i64 4)"]

[scenario.module_qualified]
category = "compile"
description = "An import without a 'use' clause, whose members are reached by qualifying them"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# A qualified call reaches the same namespaced concrete symbol a folded one
# does, so the importer declares it, and the qualifier itself leaves nothing
# behind.
# A qualified global is the same external declaration a fold reaches, and a
# qualified type name lowers to the type itself: the LLVM type is named after
# the struct alone, and the root fn that takes one is declared over it. A
# qualifier is a way of finding a declaration, never part of what it lowers to.
[[scenario.module_qualified.check]]
name = "qualified-global-lowers-to-the-declaration"
target = "symbols"
contains = [
  "external global modulesyms.shared",
  "external constant modulesyms.fixed",
]

[[scenario.module_qualified.check]]
name = "qualified-type-name-is-the-type"
target = "preir"
contains = ["%Gadget = type", "@gadgetOf(%Gadget"]
excludes = ["modulesyms_Gadget", '"modulesyms.Gadget"']

[[scenario.module_qualified.check]]
name = "qualified-call-lowers-to-namespaced-symbol"
target = "symbols"
contains = ["declare modulesub.plain", "declare modulesub.scaleInt"]
excludes = ["modulesub.scale\n"]

[scenario.module_qualified_nested]
category = "compile"
description = "A two-hop path, 'mod.Type.name', reaching a type's static function"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# The call resolves through module then type to the static function, which the
# importer declares under both. This is the collapse feeding itself: the inner
# hop has to leave a resolved type name for the outer hop to find.
[[scenario.module_qualified_nested.check]]
name = "two-qualifier-call-lowers-to-the-static-function"
target = "symbols"
contains = ["declare modulesyms.Gadget.make"]

# -------- the transit trio --------
#
# Three scenarios reach one name that a middle module holds only by folding
# modulesub. What decides whether a qualifier can see it is the 'pub' on that
# module's import and nothing else: moduletransit re-exports, modulehide is the
# same file without the keyword, and the reaches against the two are the whole
# of the transit rule, which is the visibility rule read on the binding a fold
# made.
#
# What the trio used to pin was a load-order defect: one name, three answers,
# decided by whether the asking module was loaded before or after the folding
# one. Every module's folds now run ahead of any module's body, dependency
# first, so module_transit reaches the re-exported name from all three positions
# and module_nameres_transit and -late are refused from either side.

[scenario.module_transit]
category = "compile"
description = "A re-exported fold reached through its module's qualifier from before it, after it, and from the root, which loads first"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# Every reach lowers to the symbol of the module that DECLARES the name: a fold
# binds, it declares nothing, so nothing is spelled after moduletransit for a
# name it folded, and nothing after the modules that reached it through her.
[[scenario.module_transit.check]]
name = "transit-name-declares-under-its-declaring-module"
target = "symbols"
contains = [
  "declare moduleearly.viaEarly",
  "declare modulelate.viaMid",
  "declare moduletransit.midOwn",
  "declare modulesub.plain",
  "declare modulesub.scaleInt",
]
excludes = ["moduletransit.plain", "moduletransit.scale\n", "modulelate.plain", "moduleearly.plain"]

# -------- symbol kinds --------
#
# The scenarios below assert the symbol an importer emits for kinds no other
# check names: a C function with the system convention, an imported global, an
# imported private declaration, extern declarations inside an imported module,
# and two modules whose names would once have joined into one symbol.

[scenario.module_extern_system]
category = "compile"
description = "An 'extern' fn with '@c(system)' and the imported, stdcall symbol it lowers to"
tags = ["parse", "genllvm"]

# '@c(system)' gives the C name and the x86 stdcall convention; on an 'extern'
# declaration the DLL import storage class comes with it. The declaration takes
# no prefix and no COMDAT.
[[scenario.module_extern_system.check]]
name = "extern-system-declares-a-dllimport-stdcall-symbol"
target = "llvmir"
contains = ["declare dllimport x86_stdcallcc i32 @GetTickCount()"]
excludes = ["$GetTickCount", "@GetTickCount() comdat"]

[scenario.module_symbols]
category = "compile"
description = "What an importer emits for an imported global, private declarations, extern and struct methods"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# An imported global is an 'external' declaration spelled after its module,
# with no initializer and no COMDAT; an imported 'imm' global is an 'external
# constant'. A definition's line would carry its COMDAT.
[[scenario.module_symbols.check]]
name = "imported-global-is-an-external-declaration"
target = "symbols"
contains = [
  "external global modulesyms.shared",
  "external constant modulesyms.fixed",
]
excludes = [
  "modulesyms.shared comdat",
  "modulesyms.fixed comdat",
]

# An imported module's private top-level function and global leave no symbol
# at all in the importer, while its public function is declared.
[[scenario.module_symbols.check]]
name = "imported-private-top-level-names-are-absent"
target = "symbols"
contains = ["declare modulesyms.pubFn"]
excludes = ["privFn", "privGlobal"]

# A struct's methods are declared after the module and then the type, and the
# private method *is* declared, spelled and linked like the public ones,
# although a private top-level function of the same module is not.
[[scenario.module_symbols.check]]
name = "imported-private-method-is-declared"
target = "symbols"
contains = [
  "declare modulesyms.Gadget.get",
  "declare modulesyms.Gadget.hid",
  "declare modulesyms.Gadget.make",
]
excludes = [
  "modulesyms.Gadget.get comdat",
  "modulesyms.Gadget.hid comdat",
]

# The struct's LLVM type is named after the type alone: an LLVM type name is
# not an object-file symbol, so it takes no module path.
[[scenario.module_symbols.check]]
name = "imported-struct-type-carries-no-module-path"
target = "llvmir"
contains = ["%Gadget = type"]
excludes = ["%modulesyms_Gadget", '%"modulesyms.Gadget"']

# A C function declared inside an imported module, with 'extern' and '@c', is
# the bare C name, with no module path: '@c' names it, not 'extern'.
[[scenario.module_symbols.check]]
name = "c-named-extern-inside-an-imported-module-takes-no-prefix"
target = "symbols"
contains = ["declare labs"]
excludes = ["modulesyms.labs"]

[scenario.module_extern_cone_names]
category = "compile"
description = "Body-less 'extern' functions, methods, an operator and globals in a Cone-named module take its Cone names"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# 'extern' says only "defined elsewhere", and the module names the symbol
# [Jon 23 Sep]: in a Cone-named module an extern declaration is spelled after
# the module (and the type), exactly as a package compiled on its own defines
# it, so an include file reaches the package's object. The private ones are
# declared too, since the public inline body the importer expands names them.
# None is a definition here, so none leads a COMDAT. An 'extern' 'imm' global
# is not a constant here: its value is the defining object's, which its
# module's 'init' may assign at run time.
[[scenario.module_extern_cone_names.check]]
name = "extern-declarations-take-the-module-cone-name"
target = "symbols"
contains = [
  "declare moduleextern.twice\n",
  "declare moduleextern.hidden\n",
  "external global moduleextern.count\n",
  "external global moduleextern.limit\n",
  "declare moduleextern.Vec2.+\n",
  "declare moduleextern.Vec2.len\n",
  "declare moduleextern.Vec2.size\n",
  "declare moduleextern.Vec2.origin\n",
]
excludes = ["define moduleextern", "define internal moduleextern", "declare twice", "declare hidden", "global count"]

[scenario.module_c_names]
category = "run"
description = "'@c' on a 'mod' line (a prefix) and on a fn (the whole symbol): C functions bound, Cone bodies exported under C names, 'main' under another Cone name"
tags = ["parse", "genllvm", "runtime"]

# The C-named module's names are its prefix and the name as written; a fn's own
# '@c("...")' is the whole symbol and takes no prefix. Nothing is spelled after
# the module or the type.
[[scenario.module_c_names.check]]
name = "a-c-named-module-spells-prefix-and-name-and-the-fn-override-whole"
target = "symbols"
contains = ["declare printStr\n", "declare printInt\n", "declare labs\n"]
excludes = ["cio.", "printabs", "declare abs"]

# 'pub' and '@c' export a body to C: external, where a private C-named body is
# internal like any program definition [Jon 23 Sep]. That holds for the
# functions and the global of the C-named module, and for a Cone-named
# module's '@c' functions. 'main' is external under any Cone name.
[[scenario.module_c_names.check]]
name = "pub-and-c-export-a-body-and-a-private-one-stays-internal"
target = "symbols"
contains = [
  "define printLine comdat nodeduplicate",
  "define printQuad comdat nodeduplicate",
  "define internal printTwice comdat nodeduplicate",
  "global printCount comdat nodeduplicate",
  "define cone_square comdat nodeduplicate",
  "define internal cone_cube comdat nodeduplicate",
  "define main comdat nodeduplicate",
]
excludes = ["start", " square ", " cube "]

[scenario.module_c_system]
category = "compile"
description = "'@c(system)' on a 'mod' line: the system convention for the functions it names, and a DLL import only for the extern one"
tags = ["parse", "genllvm"]

# Both functions take the x86 stdcall convention from the module; only the
# 'extern' one is imported from a DLL. The body is exported under its own
# '@c' name.
[[scenario.module_c_system.check]]
name = "a-system-module-gives-its-functions-the-convention"
target = "symbols"
contains = [
  "declare dllimport x86_stdcallcc GetTickCount\n",
  "define x86_stdcallcc ConeTicks comdat nodeduplicate",
]
excludes = ["win.", "dllimport x86_stdcallcc ConeTicks"]

# The calls are made with the convention too, not only the declarations
[[scenario.module_c_system.check]]
name = "calls-to-a-system-function-use-the-convention"
target = "preir"
contains = ["call x86_stdcallcc i32 @ConeTicks()", "call x86_stdcallcc i32 @GetTickCount()"]

[scenario.module_c_reject]
category = "reject"
description = "'@c' that says nothing, is malformed, or names what has no symbol"
tags = ["parse"]

[scenario.module_extern_reject]
category = "reject"
description = "'extern' on a declaration whose body its user needs, or on what is not a function or a global"
tags = ["parse"]

[scenario.module_inline_private]
category = "compile"
description = "An imported module's public inline bodies reaching its private function, global and type"
tags = ["genllvm"]

# An inline body is generated in its caller, so a private name it reaches is
# declared in the importer on first use -- the function called plainly, through
# a generic inline and by address, the global loaded and borrowed, the private
# type's method -- each as external as any imported declaration. A private name
# no public body reaches is still absent, as module_symbols pins.
[[scenario.module_inline_private.check]]
name = "private-names-an-inline-body-reaches-are-declared"
target = "symbols"
contains = [
  "declare moduleinline.helper",
  "external global moduleinline.count",
  "declare moduleinline.Hidden.get",
]
excludes = [
  "unreached",
  "moduleinline.helper comdat",
  "moduleinline.count comdat",
]

[scenario.module_collision]
category = "compile"
description = "'z' in module 'modulex_y' and 'y_z' in module 'modulex', which a separator-joined symbol would have confused"
tags = ["parse", "nameres", "genllvm"]

# Every component of a symbol is length-prefixed, so a module named 'modulex_y'
# declaring 'z' and a module named 'modulex' declaring 'y_z' spell two symbols
# rather than one. Were they to join into one, LLVM would rename the second
# '.1' and one of the two calls would reference a symbol nothing defines.
[[scenario.module_collision.check]]
name = "distinct-modules-spell-distinct-symbols"
target = "symbols"
contains = [
  "declare modulex_y.z",
  "declare modulex.y_z",
]
excludes = [".1"]

# -------- parse stage --------

[scenario.module_parse]
category = "reject"
description = "'extern' declaration syntax the parser cannot accept"
tags = ["parse"]
diagnostics = 2

# Separate from module_parse because the subject is the 'mod' declaration rather
# than 'extern', and because it needs an accepted header first: what follows is
# then refused for its own reason instead of for following a bad declaration. A
# 'mod trait' among them is accepted and is no late 'mod': it declares a module
# trait, which the module_trait scenarios own.
[scenario.module_parse_mod]
category = "reject"
description = "A 'mod' declaration that is misplaced, has no name or is 'pub' with no parent module, a module trait declared late that is no late 'mod', and the in-file block that does not exist"
tags = ["parse"]
diagnostics = 5

# A module's name meeting another name of the module, which is the ordinary
# duplicate rule. What it pins is where each half is reported: at the import
# statement and at the 'mod' declaration -- for an imported module named by its
# folder too, whose 'mod' line is where the folder's name is reported once the
# file is parsed -- neither of which is where the lexer stood when the binding
# was made. The submodule half of the same question, and a module with no 'mod'
# line to be reported at, are in module_submodule_reject.
[scenario.module_parse_dupname]
category = "reject"
description = "A module's name meeting another binding of it: an import against a declaration either way round, reported at the import and at the declaration, and a folder module's own name against its own declaration, reported at its 'mod' line"
tags = ["parse"]
diagnostics = 6

# A global name that one of the compiler's own names holds already: a built-in
# type, a keyword, a permission, a reserved word. The built-in is written in no
# source, so the one diagnostic is at the declaration or the 'mod' line, naming
# what the name already is.
# Whether a global name may be a built-in type's at all -- the built-ins are no
# module's names, and are looked up after all of them -- is not settled by the
# notes; this pins where and how the refusal is reported, not that it is right.
# (initAll is left out: module.md says a declaration hides it, and one is
# refused.) A module named after one is refused in its own namespace and in its
# parent's, both at its 'mod' line, so that line carries two -- but for the
# reserved word, which is released to be a name once it is reported. The 'mod'
# line restating a keyword or a permission reports nothing more.
[scenario.module_builtin_name_parse]
category = "reject"
description = "A global name a built-in holds: a struct named like a number type, reported once at the declaration; submodule files and folders named like a number type, a permission, a keyword and a reserved word, each reported at its 'mod' line"
tags = ["parse"]
diagnostics = 8

# A name of core -- Option, Result or a variant of either, folded into every
# module by the core import -- taken for a declaration, a module's name or an
# import's binding. Two things under one name collide; the core import is
# written nowhere, so each is reported at the other binding, saying that core
# has the name.
[scenario.module_builtin_name_nameres]
category = "reject"
description = "A name core folds into every module taken by a declaration, a one-file submodule and a sister's import, each reported where the source wrote it and naming core"
tags = ["nameres"]
diagnostics = 4

# -------- a file's header: the 'mod' line, then the imports --------
#
# Every file the compiler builds as a module opens with its 'mod' line, and every
# file's imports come right after it, ahead of anything else it declares [Jon 24
# Sep]. module_header is the accepted shape, a folder so that a file of the
# module that is not its designated file carries no 'mod' line; the rest are
# what is refused. A submodule's designated file with no 'mod' line is in
# module_submodule_reject.

[scenario.module_header]
category = "run"
description = "A file's header accepted: comments between the 'mod' line and the imports, and a file of a folder module that is not its designated file with no 'mod' line"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

[scenario.module_parse_header]
category = "reject"
description = "An import after a declaration: after a function, a type or a standalone 'use', plain, with a 'use' clause, and 'pub'"
tags = ["parse"]
diagnostics = 3

[scenario.module_header_reject]
category = "reject"
description = "An import after a declaration in a file of a folder module that is not its designated file, and so has no 'mod' line"
tags = ["parse"]
diagnostics = 1

[scenario.module_parse_nomod]
category = "reject"
description = "A module's first file with no 'mod' line: a lone root file, an imported one opening with a module trait, which is no 'mod' line, and an imported one holding only comments, reported at its end"
tags = ["parse"]
diagnostics = 3

# What the sweep refuses. It is a folder scenario because several of its
# diagnostics are reported against a file the scenario's own source never names:
# the module's files are what is under test, so they are where the expectations
# live. Two of the six have no line of their own -- which files a module holds is
# a fact about the filesystem rather than a position in a source -- so they are
# declared below.
[scenario.module_folder_reject]
category = "reject"
description = "What the folder sweep refuses: a misnaming declaration, a swept file declaring a module, importing one's own file, two files of one name and two subfolders declaring one name"
tags = ["parse"]
diagnostics = 6

[[scenario.module_folder_reject.unlocated]]
code = "ErrorDupFile"
message = "holds two files named same"

# A stray block end in a file the folder swept in, beside module_parse_strayend,
# which is the same condition in the file the compiler was given. A folder
# scenario may annotate any of its files, so it is a 'reject' with the annotation
# where the diagnostic lands.
[scenario.module_folder_strayend]
category = "reject"
description = "A stray block end at global scope in a file the folder swept in"
tags = ["parse"]
diagnostics = 1

# 'include' is retired: the folder brings a module's files in. Each way of
# writing the statement -- a name, a 'pub' one naming a path, a list, and the
# samples' form with no ';' -- is one diagnostic at the word, and the statement
# is skipped whole without swallowing the declaration after it.
[scenario.module_parse_include]
category = "reject"
description = "The retired 'include' statement, reported once however it is written"
tags = ["parse"]
diagnostics = 4

[scenario.module_import_missing]
category = "reject"
description = "An import naming a source file that is not there"
tags = ["parse"]
diagnostics = 0
exit = 2

# Split off because its diagnostics land in the imported file. What it pins is that a malformed global declaration there is
# reported and stops the compile, rather than being reported and then crashing
# the compiler while its symbol is named.
[scenario.module_parse_noname]
category = "recover"
description = "A global declaration with no name, in an imported module"
tags = ["parse"]
diagnostics = 3

# The condition module_folder_strayend pins in a swept sibling, here in the file
# the compiler was given.
[scenario.module_parse_strayend]
category = "reject"
description = "A stray block end at global scope in the main source file"
tags = ["parse"]
diagnostics = 1

# -------- name resolution stage --------

[scenario.module_nameres]
category = "reject"
description = "Paths through a module and a type that resolve to nothing, or to something private"
tags = ["nameres"]
diagnostics = 5

# Once left out as re-asserting what notFolded establishes; pinned now because
# a fold that ran and a fold that never happened are two different reasons for
# one code, and the classification refactor and the transit rule both touch
# what a fold carries across.
[scenario.module_nameres_fold]
category = "reject"
description = "Private names a wildcard import does not fold: a function, an overload name and its candidate"
tags = ["nameres"]
diagnostics = 3

# A global's fold is expanded while the module is name resolved, so what a clause
# may admit and what it may fold from are this stage's.
[scenario.module_nameres_fold_global]
category = "reject"
description = "What a global's 'use' clause may not admit, and what it may not fold from"
tags = ["nameres"]
diagnostics = 9

# A fold makes a binding, and a binding carries its own visibility: 'pub use'
# widens what the folding module shows, a plain 'use' does not, and the members
# behind both are public in the type either way. Its one annotation lives in the
# support module that writes the reach, because that is where it is reported.
[scenario.module_nameres_fold_visibility]
category = "reject"
description = "A folded name reached from another module: public only if the clause said 'pub'"
tags = ["nameres"]
diagnostics = 1

# The refused half of the transit trio (see module_transit above): the same fold
# with the re-export left off.
[scenario.module_nameres_transit]
category = "reject"
description = "A folded name its module did not re-export, reached through that module's qualifier and refused"
tags = ["nameres"]
diagnostics = 2

# Its one diagnostic is reported against modulehidelate.cone, so the annotation
# lives there and this file has none.
[scenario.module_nameres_transit_late]
category = "reject"
description = "The same refusal from a module loaded after the folding one, so it is the binding's visibility rather than the order"
tags = ["nameres"]
diagnostics = 1

# -------- type check stage --------

# Which file a diagnostic names, when more than one module was parsed. Its one
# annotation lives in the support module the error is in, because that is where
# the compiler reports it.
[scenario.module_typecheck_provenance]
category = "reject"
description = "A diagnostic in an imported module names that module's file, not the last one parsed"
tags = ["typecheck"]
diagnostics = 1

# The other half of module_nameres: a period whose left side is a value, which
# is a member access and fails against the receiver's type rather than as a
# lookup. Separate because name resolution halts the pipeline, so the two
# stages' failures cannot share a file.
[scenario.module_typecheck_notnamespace]
category = "reject"
description = "A period whose left side names neither a module nor a type"
tags = ["nameres", "typecheck"]
diagnostics = 3

# -------- build descriptions --------

# A scenario folder holding <name>.conebuild rather than <name>.cone hands the
# compiler that build description, which lists the package's files and modules
# itself: nothing is swept. Its annotations live in the description and in every
# .cone file of the folder.

[scenario.module_build_lib]
category = "compile"
description = "A package compiled on its own from a build description: a library root named for the package, a child module, an import line"
tags = ["parse", "genllvm"]

# 'output: library' names the root, so every declaration of the package is
# spelled after it as an importer of 'q' spells it: the root's own functions, a
# global and a type's method, and the child module's function after both. Each
# is public, so each is exported: external, which is what lets an importer's
# object link against it (module_build_export pins the whole linkage rule).
[[scenario.module_build_lib.check]]
name = "a-described-library-root-prefixes-its-symbols"
target = "symbols"
contains = [
  "define q.addOne comdat nodeduplicate",
  "define q.deep comdat nodeduplicate",
  "global q.counter comdat nodeduplicate",
  "define q.Acc.put comdat nodeduplicate",
  "define q.inner.triple comdat nodeduplicate",
]
excludes = ["define internal", "global internal", "define addOne", "define inner.triple"]

# Built 'release', and nothing in the library calls viaDep or reads counter. An
# internal definition would be deleted by the optimiser; an exported one is
# still there in what reaches the object file.
[[scenario.module_build_lib.check]]
name = "exports-survive-optimisation"
target = "llvmir"
contains = ["define i64 @_CNvC1q6viaDep(", "@_CNvC1q7counter = global i64 0"]

# The same symbols, mangled: what an importer of q declares.
[[scenario.module_build_lib.check]]
name = "the-library-root-mangles-as-a-top-module"
target = "preir"
contains = ["@_CNvC1q6addOne(i64", "@_CNvNtC1q5inner6triple(i64", "@_CNvNtC1q3Acc3put("]

# The file an import line names is found where the line says, is named by the
# import, and is only declared: it stands for another package's include file.
[[scenario.module_build_lib.check]]
name = "an-import-line-file-is-declared-under-the-import-name"
target = "symbols"
contains = ["declare dep.twice"]
excludes = ["dep.twice comdat"]

# A file beside the description that it does not list is not compiled.
[[scenario.module_build_lib.check]]
name = "an-unlisted-file-is-not-compiled"
target = "symbols"
excludes = ["unlistedFn"]

# 'build: release' decides the optimisation options: no debug information.
[[scenario.module_build_lib.check]]
name = "build-release-emits-no-debug-info"
target = "preir"
excludes = ["!dbg"]

[scenario.module_build_exe]
category = "run"
description = "A program built from a build description and run: an unnamed root whose main links, a child module, and stdio reached through import lines"
tags = ["parse", "genllvm", "runtime"]

# 'output: executable' leaves the root out of every symbol, so 'main' is the
# entry point the linker looks for and the root's functions are bare; the child
# module is spelled after itself alone, as a folder program's submodule is.
[[scenario.module_build_exe.check]]
name = "a-described-executable-root-stays-bare"
target = "symbols"
contains = [
  "define main comdat nodeduplicate",
  "define internal helper comdat nodeduplicate",
  "define internal calc.square comdat nodeduplicate",
]
excludes = ["prog."]

# Both of the package's import lines name one file, which is one module, read
# once and declared once, its 'extern' functions under their C names.
[[scenario.module_build_exe.check]]
name = "two-import-lines-naming-one-file-are-one-module"
target = "symbols"
contains = ["declare printStr", "declare printInt"]
excludes = ["stdio.printStr"]

# 'build: debug' decides the optimisation options: debug information.
[[scenario.module_build_exe.check]]
name = "build-debug-emits-debug-info"
target = "preir"
contains = ["!dbg"]

[scenario.module_build_export]
category = "compile"
description = "A library compile's linkage: public definitions and the private ones an expanded body names are exported, every other private one stays internal, and a generic's instance is shared"
tags = ["nameres", "genllvm"]

# Exported, so external: each public function, global and type function, the
# child module's included, and each private function or global named by a body
# an importer expands -- inline, generic, macro, a trait's default, and a
# private inline's too -- whether bare or through a path.
[[scenario.module_build_export.check]]
name = "public-and-expand-reached-definitions-are-exported"
target = "symbols"
contains = [
  "define ex.pubFn comdat",
  "global ex.pubGlobal comdat",
  "define ex.privByInline comdat",
  "global ex.privGlobalByInline comdat",
  "define ex.privByGeneric comdat",
  "define ex.privByMacro comdat",
  "define ex.privByTrait comdat",
  "define ex.privByPath comdat",
  "define ex.PathType.make comdat",
  "define ex.privByPrivInline comdat",
  "define ex.usesGeneric comdat",
  "define ex.Plain.shown comdat",
  "define ex.inner.innerPub comdat",
]

# A type's function is exported when an importer can reach the type -- it is
# public, or an expanded body names it, as viaReached names the private Reached
# -- and the function is public, or the type holds an expanded body, which can
# reach a private one through its receiver: WithInline.get reaches secret.
[[scenario.module_build_export.check]]
name = "a-reachable-types-functions-are-exported"
target = "symbols"
contains = ["define ex.Reached.get comdat", "define ex.WithInline.secret comdat"]

# Internal: a private definition no expanded body names, whether the library
# calls it or not, the child module's too; a private method of a type holding
# no expanded body; and every function of a private type nothing expanded
# names, public or not.
[[scenario.module_build_export.check]]
name = "other-private-definitions-stay-internal"
target = "symbols"
contains = [
  "define internal ex.privCalled comdat",
  "define internal ex.privUnreached comdat",
  "global internal ex.privGlobalUnreached comdat",
  "define internal ex.Plain.hidden comdat",
  "define internal ex.Hidden.get comdat",
  "define internal ex.inner.innerPriv comdat",
]

# Neither exported nor internal: the instance of a generic the library makes for
# its own use is shared. An importer using the same instance defines it too,
# and the linker keeps one copy (module_build_link links the two).
[[scenario.module_build_export.check]]
name = "an-instance-is-shared"
target = "symbols"
contains = ["define linkonce_odr ex.viaGeneric[i64] comdat any"]

# An inline function is expanded where it is called and has no symbol.
[[scenario.module_build_export.check]]
name = "an-inline-function-has-no-symbol"
target = "symbols"
excludes = ["ex.viaInline", "ex.privInline", "ex.WithInline.get", "ex.viaReached", "ex.viaPath"]

# Package q compiled on its own, the program compiled against q's hand-written
# include file, and the two objects linked: the scenario's 'link' compiles
# q/q.conebuild first, into an object of its own, and links it in. Every value
# the program prints comes from q's object: the include's non-inline bodies all
# give 0 and are never generated, so a right answer can only be q's. The
# bodies the program does generate, the expanded inlines, reach q's private
# function, global and type, whose symbols q exports for them.
[scenario.module_build_link]
category = "run"
description = "A package compiled alone and a program compiled against its hand-written include file, linked and run: generic instances and vtables both objects define merge at link"
tags = ["genllvm", "runtime"]
link = ["q/q.conebuild"]

# The program only declares what q defines, the private names its expanded
# inline bodies reach among them, under the names q exports them by.
[[scenario.module_build_link.check]]
name = "the-program-declares-what-q-defines"
target = "symbols"
contains = [
  "declare q.addOne",
  "declare q.secret",
  "declare q.Acc.plus",
  "declare q.Box.twice",
  "external global q.hits",
  "external global q.shared",
]
excludes = ["q.addOne comdat", "q.secret comdat", "q.Box.twice comdat", "q.answer", "q.bump", "q.boxed"]

# A generic's instances are defined by every object that uses them: q has none
# for the program to link against, since it cannot know which ones the program
# makes. So the program defines each from the body q's include file carries,
# 'linkonce_odr' in a COMDAT of kind 'any': the i64 instances q defines too,
# and the linker keeps one copy, and the f64 instances only the program has --
# as are 'kept' and the private generic 'same' its body instantiates. The
# private function a method of Pair names is q's export, declared here.
[[scenario.module_build_link.check]]
name = "the-program-defines-each-instance-it-uses-shared"
target = "symbols"
contains = [
  "define linkonce_odr q.larger[i64] comdat any",
  "define linkonce_odr q.larger[f64] comdat any",
  "define linkonce_odr q.Pair[i64].sum comdat any",
  "define linkonce_odr q.Pair[i64].count comdat any",
  "define linkonce_odr q.Pair[f64].sum comdat any",
  "define linkonce_odr q.Pair[f64].count comdat any",
  "define linkonce_odr q.kept[i64] comdat any",
  "define linkonce_odr q.same[i64] comdat any",
  "declare q.unit",
  "declare q.qLarger",
  "declare q.qPairSum",
]
excludes = ["declare q.larger", "declare q.Pair", "internal q.larger", "internal q.Pair", "define q.larger", "define q.Pair"]

# q's own instances have the same linkage, so the i64 copies in the two objects
# merge at link rather than colliding; a strong or 'nodeduplicate' definition in
# both is a duplicate-symbol error. q defines no f64 instance: nothing in q
# makes one. Its other definitions keep their library linkage: the private
# 'unit', named by Pair's methods, exported.
[[scenario.module_build_link.check]]
name = "the-library-shares-its-own-instances"
target = "symbols"
object = "q"
contains = [
  "define linkonce_odr q.larger[i64] comdat any",
  "define linkonce_odr q.Pair[i64].sum comdat any",
  "define linkonce_odr q.Pair[i64].count comdat any",
  "define q.unit comdat nodeduplicate",
  "define q.qLarger comdat nodeduplicate",
  "define q.qPairSum comdat nodeduplicate",
]
excludes = ["[f64]", "internal q.larger", "internal q.Pair", "define q.larger", "define q.Pair"]

# A vtable is built by every object that coerces its type to its trait, and a
# virtual reference carries its address across objects: q's 'isSquare' tells a
# Square by comparing that address with its own copy's. So both objects' copies
# are shared, and the one the linker keeps is the one both compare against;
# internal, the program's reference would not match q's copy ('isSquare' 0).
# The list of a trait's vtables holds the implementers one object saw, so it
# stays each object's own.
[[scenario.module_build_link.check]]
name = "the-program-shares-its-vtables"
target = "symbols"
contains = [
  "constant linkonce_odr q.Square as q.Shape (vtable) comdat any",
  "constant internal q.Shape (vtable list) comdat nodeduplicate",
]

[[scenario.module_build_link.check]]
name = "the-library-shares-its-vtables"
target = "symbols"
object = "q"
contains = [
  "constant linkonce_odr q.Square as q.Shape (vtable) comdat any",
  "constant internal q.Shape (vtable list) comdat nodeduplicate",
]

# Three packages, each compiled on its own: b defines a struct with methods, a
# imports b and takes and returns b's type, and the program imports a alone. An
# include file is a module file like any other [Jon 25 Sep], so a's include file
# imports b, and the program's description answers that import from its package
# lines, which list the compile's whole dependency closure. Every value the
# program prints comes from a's object (the Counter it builds) or from b's (the
# methods), since both include files declare them 'extern'.
[scenario.module_build_transitive]
category = "run"
description = "An include file that imports another package's include file, answered by the program's package lines: a program imports a, whose functions take and return b's type"
tags = ["parse", "genllvm", "runtime"]
link = ["b/b.conebuild", "a/a.conebuild"]

# The program declares a's functions and b's methods, and defines neither.
[[scenario.module_build_transitive.check]]
name = "the-program-declares-both-packages"
target = "symbols"
contains = ["declare a.start", "declare a.advance", "declare b.Counter.next", "declare b.Counter.scaled"]
excludes = ["define a.", "define b."]

# The package lines answer an include file's imports and nothing else: a program
# that imports b by its own name needs its own module's line for b, and an
# include file importing a package with no package line is refused, naming it.
[scenario.module_build_transitive_parse]
category = "reject"
description = "Package lines answer an include file's imports only: the program's own import of a package only a package line names, and an include file's import of a package no line names"
tags = ["parse"]
diagnostics = 2

# A package reached only through another's include file is not in the
# program's view: the program imports a, and a's include file imports b
# privately, so b is neither a name of the program nor a public name of a.
[scenario.module_build_transitive_nameres]
category = "reject"
description = "A package the program reaches only through another package's include file is not the program's to name, bare or through the importing package"
tags = ["nameres"]
diagnostics = 2

# Package knob folds its public global's members into its namespace with
# 'pub use *'; its include file declares that global 'extern', with no value, and
# the same fold clause [Jon 25 Sep], so the program, folding knob in, reaches
# the names bare as knob itself does. Every value comes from knob's one
# 'config', defined in knob's object: the include gives it no value to read.
[scenario.module_build_fold_extern]
category = "run"
description = "A fold clause on an 'extern' global in an include file: the program reaches, reads and writes the folded names bare, and they are the package's global"
tags = ["parse", "nameres", "genllvm", "runtime"]
link = ["knob/knob.conebuild"]

# The program declares knob's global and defines no copy of its own.
[[scenario.module_build_fold_extern.check]]
name = "the-folded-global-is-knobs"
target = "symbols"
contains = ["external global knob.config", "declare knob.Config.product", "declare knob.faster"]
excludes = ["global knob.config comdat"]

# A fold on an 'extern' global reads its declared type, so where the type is out
# of view the fold is refused as the type is, where it is written, and nothing
# more; and what a fold refuses on a global with a value it refuses on an
# 'extern' one.
[scenario.module_build_fold_extern_nameres]
category = "reject"
description = "Folds on 'extern' globals whose type is out of view (undeclared, private to another module), is no struct, or whose 'pub use' goes through a private global"
tags = ["nameres"]
diagnostics = 4

# Include files that import each other loop like any two modules, and the
# compile refuses it (ErrorImportLoop).
[scenario.module_build_transitive_loop]
category = "reject"
description = "Two include files that import each other through the program's package lines: an import loop, refused at the edge that closes it"
tags = ["nameres"]
diagnostics = 1

[scenario.module_build_reject]
category = "reject"
description = "A build description that cannot be read: a bad setting value, an unknown setting, a package line written twice, an import line missing its ':', a module's import line naming a different file from the package line, a child module named twice, a module listing no file, a setting and a package line after the module"
tags = ["parse"]
diagnostics = 9

[scenario.module_build_modname_parse]
category = "reject"
description = "Each file's 'mod' line checked against the build description: a later file, a child's first file and an import line's file naming another module, and a second declaration of the right name"
tags = ["parse"]
diagnostics = 4

[scenario.module_build_import_parse]
category = "reject"
description = "An import a described module writes that the build description provides nothing for, by name and by path"
tags = ["parse"]
diagnostics = 2
