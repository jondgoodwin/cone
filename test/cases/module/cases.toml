# module - modules, namespaces, 'include'/'import'/'extern'. Tier 2.
#
# Key reference: design/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# This is the first group with support modules: a .cone file here that is
# neither a listed scenario nor a listed support module is an error (R2.12), so
# every file a scenario imports or includes is named below. Support files carry
# a 'module' prefix that an identifier can hold, because a module's name is also
# its qualifier and 'module-importsub' is not spellable as one.
#
# Only module-success runs. Everything about 'import' compiles and stops there:
# a program spanning modules cannot be linked yet, and design/diagnostics/test-suite.md
# section 4 forbids adding a synthetic 'main' to promote a scenario's category.
# What running would have shown -- which symbol a call lowered to, and whether a
# symbol was emitted at all -- is asserted as named symbols checks instead.
#
# The failure scenarios are split by pipeline stage, because analysis halts
# between stages. module-import-missing is split off again inside the parse
# stage because its failure aborts rather than accumulates, and
# module-include-eof because its diagnostic lands in an included file.
#
# Left out deliberately:
#
# - Selective import, 'import mod::name'. The parser accepts '::' only before
#   '*', so this form is rejected as a malformed statement rather than resolved.
#   Asserting today's rejection would pin a placeholder.
# - A name-fold clash between two wildcard imports. It is diagnosed, but both
#   diagnostics are attributed to a source module and one of them carries the
#   wrong file url, so a scenario built on it would pin a reporting bug.
# - A path with two qualifiers, 'mod::Type::name' or '::mod::Type::name'.
#   nameUseAddQual (ir/exp/nameuse.c) stores the second qualifier at the wrong
#   offset -- it indexes the list in NameList strides rather than Name-pointer
#   strides -- so the walk in nameUseNameRes reads a slot nothing set. As a
#   value the path reports "Namespace Gadget does not exist" for a type that
#   does; in a type position the same path crashes the compiler. A construct
#   that crashes cannot be a scenario, and the diagnostic the value form gives
#   is read from uninitialised memory. The one-qualifier forms -- 'mod::name',
#   'Type::name', '::mod::name', and 'mod::Type' as a final component -- are
#   what module-qualified, module-success and struct-methods pin.

support = ["moduleinc.cone", "modulesub.cone", "moduleeof.cone",
           "moduleprov.cone", "moduleprov2.cone", "modulenoname.cone",
           "modulesyms.cone", "modulecyc.cone", "modulex_y.cone", "modulex.cone",
           "moduletransit.cone", "modulelate.cone", "moduleearly.cone"]

# -------- success --------

[scenario.module-success]
category = "run"
description = "'include', 'extern' and namespace qualification inside one module"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# Pins today's spelling of an 'extern' declaration, so the symbol-generation
# refactor can show nothing moved: the C name exactly as written, no prefix, a
# 'declare' that leads no COMDAT. Both forms of the declaration -- in a block
# and on its own -- come out the same.
[[scenario.module-success.check]]
name = "extern-declares-the-bare-c-name"
target = "llvmir"
contains = ["declare i32 @abs(i32)", "declare i64 @labs(i64)"]
excludes = ["$abs", "$labs", "@abs(i32) comdat", "@labs(i64) comdat"]

[scenario.module-imports]
category = "compile"
description = "A wildcard import folding an overload name, and what the importer declares for it"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# Every candidate of the folded overload name is declared in the importer, and
# every one is public: a private candidate may not join a public name
# (core-parse-overload-private), so the fold never reaches a declaration the
# importer may not see. A declaration is external, as an LLVM declaration can
# be nothing else.
[[scenario.module-imports.check]]
name = "imported-candidates-declared"
target = "symbols"
contains = [
  "declare modulesub::scaleInt",
  "declare modulesub::scaleFloat",
  "declare modulesub::plain",
]

# An overload name has no symbol of its own; a private overload name is not
# folded by the import at all, so neither it nor its candidate is declared; and
# a private function nothing public reaches leaves no symbol either. A
# declaration's line ends at its name, so the newline is what stops
# 'modulesub::scale' from matching 'modulesub::scaleInt'.
[[scenario.module-imports.check]]
name = "no-symbol-for-imported-overload-name"
target = "symbols"
excludes = ["modulesub::scale\n", "modulesub::_hidden", "_hiddenOne", "_scaleFloat"]

# The other half of the COMDAT rule core-overload states: only a definition may
# lead one. An imported module's functions have bodies in the IR, but this
# object file merely declares them, so they get none.
[[scenario.module-imports.check]]
name = "imported-declarations-carry-no-comdat"
target = "symbols"
excludes = [
  "modulesub::scaleInt comdat",
  "modulesub::scaleFloat comdat",
  "modulesub::plain comdat",
]

[scenario.module-qualified]
category = "compile"
description = "An import without '::*', whose members are reached by qualifying them"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# A qualified call reaches the same namespaced concrete symbol a folded one
# does, so the importer declares it, and the qualifier itself leaves nothing
# behind.
# A qualified global is the same external declaration a fold reaches, and a
# qualified type name lowers to the type itself: the LLVM type is named after
# the struct alone, and the root fn that takes one is declared over it. A
# qualifier is a way of finding a declaration, never part of what it lowers to.
[[scenario.module-qualified.check]]
name = "qualified-global-lowers-to-the-declaration"
target = "symbols"
contains = [
  "external global modulesyms::shared",
  "external constant modulesyms::fixed",
]

[[scenario.module-qualified.check]]
name = "qualified-type-name-is-the-type"
target = "preir"
contains = ["%Gadget = type", "@gadgetOf(%Gadget"]
excludes = ["modulesyms_Gadget", '"modulesyms::Gadget"']

[[scenario.module-qualified.check]]
name = "qualified-call-lowers-to-namespaced-symbol"
target = "symbols"
contains = ["declare modulesub::plain", "declare modulesub::scaleInt"]
excludes = ["modulesub::scale\n"]

# -------- the load-order trio --------
#
# Three scenarios reach one name, 'moduletransit::plain', which moduletransit
# holds only by folding modulesub. Whether the qualifier can see it depends
# today on whether the asking module was loaded before or after moduletransit:
# the root and moduleearly (loaded first) are refused, modulelate (loaded
# after) resolves. module-nameres-transit.cone carries the explanation and the
# statement that this is a known defect pinned on purpose; the other two are
# its controls, and a fix changes all three together.

[scenario.module-transit]
category = "compile"
description = "A folded name reached through its module's qualifier from a module loaded after it, which resolves"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# What the root names lowers to the declaring modules' symbols, and the name
# modulelate reached through 'moduletransit::' is declared under the module
# that declares it -- a fold binds a name, it declares nothing, so nothing is
# spelled after moduletransit for it or after modulelate.
[[scenario.module-transit.check]]
name = "transit-name-declares-under-its-declaring-module"
target = "symbols"
contains = [
  "declare modulelate::viaMid",
  "declare moduletransit::midOwn",
  "declare modulesub::plain",
  "declare modulesub::scaleInt",
]
excludes = ["moduletransit::plain", "moduletransit::scale", "modulelate::plain"]

# -------- symbol kinds --------
#
# The four scenarios below assert the symbol an importer emits for kinds no
# other check names: an 'extern system' declaration, an imported global, an
# imported private declaration, an extern inside an imported module, an import
# cycle, and two modules whose names would once have joined into one symbol.

[scenario.module-extern-system]
category = "compile"
description = "An 'extern system' declaration and the imported, stdcall symbol it lowers to"
tags = ["parse", "genllvm"]

# Pins today's spelling for the symbol-generation refactor: 'system' adds the
# DLL import storage class and the x86 stdcall convention to an otherwise
# ordinary extern declaration, which still takes no prefix and no COMDAT.
[[scenario.module-extern-system.check]]
name = "extern-system-declares-a-dllimport-stdcall-symbol"
target = "llvmir"
contains = ["declare dllimport x86_stdcallcc i32 @GetTickCount()"]
excludes = ["$GetTickCount", "@GetTickCount() comdat"]

[scenario.module-symbols]
category = "compile"
description = "What an importer emits for an imported global, private declarations, extern and struct methods"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# An imported global is an 'external' declaration spelled after its module,
# with no initializer and no COMDAT; an imported 'imm' global is an 'external
# constant'. A definition's line would carry its COMDAT.
[[scenario.module-symbols.check]]
name = "imported-global-is-an-external-declaration"
target = "symbols"
contains = [
  "external global modulesyms::shared",
  "external constant modulesyms::fixed",
]
excludes = [
  "modulesyms::shared comdat",
  "modulesyms::fixed comdat",
]

# An imported module's private top-level function and global leave no symbol
# at all in the importer, while its public function is declared.
[[scenario.module-symbols.check]]
name = "imported-private-top-level-names-are-absent"
target = "symbols"
contains = ["declare modulesyms::pubFn"]
excludes = ["_privFn", "_privGlobal"]

# A struct's methods are declared after the module and then the type, and the
# private method *is* declared, spelled and linked like the public ones,
# although a private top-level function of the same module is not.
[[scenario.module-symbols.check]]
name = "imported-private-method-is-declared"
target = "symbols"
contains = [
  "declare modulesyms::Gadget::get",
  "declare modulesyms::Gadget::_hid",
  "declare modulesyms::Gadget::make",
]
excludes = [
  "modulesyms::Gadget::get comdat",
  "modulesyms::Gadget::_hid comdat",
]

# The struct's LLVM type is named after the type alone: an LLVM type name is
# not an object-file symbol, so it takes no module path.
[[scenario.module-symbols.check]]
name = "imported-struct-type-carries-no-module-path"
target = "llvmir"
contains = ["%Gadget = type"]
excludes = ["%modulesyms_Gadget", '%"modulesyms::Gadget"']

# An 'extern' declared inside an imported module is still the bare C name,
# with no module path.
[[scenario.module-symbols.check]]
name = "extern-inside-an-imported-module-takes-no-prefix"
target = "symbols"
contains = ["declare labs"]
excludes = ["modulesyms::labs"]

[scenario.module-cycle]
category = "compile"
description = "An import cycle back to the root file, which finds the root instead of re-parsing it"
tags = ["parse", "nameres", "genllvm"]

# The root's own declarations are defined under their bare names, as in any
# root file, and the sub module's after its module ...
[[scenario.module-cycle.check]]
name = "root-defines-its-own-symbols-unprefixed"
target = "symbols"
contains = [
  "global internal counter comdat nodeduplicate",
  "define internal rootFn comdat nodeduplicate",
  "define internal caller comdat nodeduplicate",
  "declare modulecyc::subFn",
]

# ... and each of them exactly once. The root module is named after its file,
# so the import back to it finds the module already parsed rather than reading
# the file again as a second module named 'module-cycle': nothing is declared
# under that module, and no definition is repeated (LLVM would print a second
# 'rootFn' as 'rootFn.1').
[[scenario.module-cycle.check]]
name = "cycle-finds-the-root-and-declares-nothing-twice"
target = "symbols"
excludes = [
  "module-cycle",
  "rootFn.1",
  "caller.1",
  "counter.1",
]

[scenario.module-collision]
category = "compile"
description = "'z' in module 'modulex_y' and 'y_z' in module 'modulex', which a separator-joined symbol would have confused"
tags = ["parse", "nameres", "genllvm"]

# Every component of a symbol is length-prefixed, so a module named 'modulex_y'
# declaring 'z' and a module named 'modulex' declaring 'y_z' spell two symbols
# rather than one. Were they to join into one, LLVM would rename the second
# '.1' and one of the two calls would reference a symbol nothing defines.
[[scenario.module-collision.check]]
name = "distinct-modules-spell-distinct-symbols"
target = "symbols"
contains = [
  "declare modulex_y::z",
  "declare modulex::y_z",
]
excludes = [".1"]

# -------- parse stage --------

[scenario.module-parse]
category = "reject"
description = "Module qualifier and 'extern' declaration syntax the parser cannot accept"
tags = ["parse"]
diagnostics = 4

[scenario.module-import-missing]
category = "reject"
description = "An import naming a source file that is not there"
tags = ["parse"]
diagnostics = 0
exit = 2

[scenario.module-include-eof]
category = "recover"
description = "An included file the parser stops reading before its end"
tags = ["parse"]
diagnostics = 1

# Split off for module-include-eof's reason: the diagnostics land in the
# imported file. What it pins is that a malformed global declaration there is
# reported and stops the compile, rather than being reported and then crashing
# the compiler while its symbol is named.
[scenario.module-parse-noname]
category = "recover"
description = "A global declaration with no name, in an imported module"
tags = ["parse"]
diagnostics = 3

# The same condition in the main file rather than an included one, which is why
# it can be a 'reject' with its own annotation where module-include-eof cannot.
[scenario.module-parse-strayend]
category = "reject"
description = "A stray block end at global scope in the main source file"
tags = ["parse"]
diagnostics = 1

# -------- name resolution stage --------

[scenario.module-nameres]
category = "reject"
description = "Module and type qualifiers and imported names that resolve to nothing, or to something private"
tags = ["nameres"]
diagnostics = 7

# Once left out as re-asserting what notFolded establishes; pinned now because
# a fold that ran and a fold that never happened are two different reasons for
# one code, and the classification refactor and the transit rule both touch
# what a fold carries across.
[scenario.module-nameres-fold]
category = "reject"
description = "Private names a wildcard import does not fold: a function, an overload name and its candidate"
tags = ["nameres"]
diagnostics = 3

# The refused two-thirds of the load-order trio (see module-transit above).
[scenario.module-nameres-transit]
category = "reject"
description = "A folded name reached through its module's qualifier from the root, which loads first and is refused"
tags = ["nameres"]
diagnostics = 2

# Its one diagnostic is reported against moduleearly.cone, so the annotation
# lives there and this file has none.
[scenario.module-nameres-transit-early]
category = "reject"
description = "The same reach from a module loaded before the folding one, refused although it is not the root"
tags = ["nameres"]
diagnostics = 1

# -------- type check stage --------

# Which file a diagnostic names, when more than one module was parsed. Its one
# annotation lives in the support module the error is in, because that is where
# the compiler reports it.
[scenario.module-typecheck-provenance]
category = "reject"
description = "A diagnostic in an imported module names that module's file, not the last one parsed"
tags = ["typecheck"]
diagnostics = 1
