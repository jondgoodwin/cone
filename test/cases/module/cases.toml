[scenario.module_extends_nameres]
category = "reject"
description = "What 'extends' refuses once names are bound: a redeclared public, private or folded name, a module the base imports named without importing it, the base's private name reached through an importer by path, a listed clause and a wildcard, a trait, a function, itself, a loop of two 'extends', its own submodule, its parent, and a module out of reach"
tags = ["nameres"]
