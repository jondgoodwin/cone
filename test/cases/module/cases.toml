# module - modules, namespaces, 'import'/'extern'. Tier 2.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# This is the first group with support modules: a .cone file here that is
# neither a listed scenario nor a listed support module is an error (R2.12), so
# every file a scenario imports is named below. Support files carry a bare
# 'module' prefix, 'modulesub', which keeps them apart from the scenarios'
# 'module_' names; either is an identifier, as a module's name must be, since
# it is also its qualifier.
#
# It is also the first group with folder scenarios and a folder support module.
# A name here reaches either '<name>.cone' or '<name>/<name>.cone', which is the
# compiler's own lookup, and a folder is registered below under its own name.
# The files inside one are not registered: the sweep is what finds them, and
# listing them would restate the thing under test.
#
# Only module_success, module_package_path and folder scenarios run. Each of them
# is one module or one tree of them compiled into one object, which is what a
# program is -- module_package_path's package included, since a module found on
# the package search path is compiled in. (module_build_exe is a folder scenario
# too, and runs because the one module it imports declares only C functions,
# which conestd supplies.) Everything else about 'import'
# compiles and stops there:
# a program spanning modules cannot be linked yet, and compiler/c/doc/diagnostics/test-suite.md
# section 4 forbids adding a synthetic 'main' to promote a scenario's category.
# What running would have shown -- which symbol a call lowered to, and whether a
# symbol was emitted at all -- is asserted as named symbols checks instead.
#
# The failure scenarios are split by pipeline stage, because analysis halts
# between stages. module_import_missing is split off again inside the parse
# stage because its failure aborts rather than accumulates.

support = ["modulesub.cone",
           "moduleprov.cone", "moduleprov2.cone", "modulenoname.cone",
           "modulesyms.cone", "modulecyc.cone", "modulex_y.cone", "modulex.cone",
           "moduletransit.cone", "modulelate.cone", "moduleearly.cone",
           "modulehide.cone", "modulehidelate.cone", "modselfnamed",
           "modulemacro.cone", "moduledeclared.cone",
           "modulefold.cone", "modulefoldlate.cone", "modfolder",
           "moduleextbase.cone", "modulepkgs", "modtree",
           "moduleinline.cone", "moduleextern.cone",
           "modulenomod.cone", "modulecomments.cone"]

# -------- success --------

[scenario.module_success]
category = "run"
description = "'extern' and namespace qualification inside one module"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# Pins today's spelling of an 'extern' declaration, so the symbol-generation
# refactor can show nothing moved: the C name exactly as written, no prefix, a
# 'declare' that leads no COMDAT. Both forms of the declaration -- in a block
# and on its own -- come out the same.
[[scenario.module_success.check]]
name = "extern-declares-the-bare-c-name"
target = "llvmir"
contains = ["declare i32 @abs(i32)", "declare i64 @labs(i64)"]
excludes = ["$abs", "$labs", "@abs(i32) comdat", "@labs(i64) comdat"]

# What the file's 'mod' header does not do. It names the module, which is what
# makes 'onemod.counted' reach the global a local hides; it does not put the
# module in the owner chain a symbol is spelled from, so the root's declarations
# stay bare and 'main' stays linkable. Nothing is spelled after 'onemod'.
[[scenario.module_success.check]]
name = "a-root-mod-header-does-not-prefix-the-root-symbols"
target = "symbols"
contains = [
  "global internal counted comdat nodeduplicate",
  "define internal twice comdat nodeduplicate",
]
excludes = ["onemod."]

# A global's fold binds names and declares nothing. The global is one symbol and
# each method is one, spelled exactly as they would be with no fold written, and
# no symbol is spelled after a folded name -- not the wildcard's, not the renamed
# ones. What makes that possible is the receiver: a global is one instance at a
# fixed address, so a folded name needs no copy, no offset and no thunk.
[[scenario.module_success.check]]
name = "a-global-fold-declares-no-symbol-of-its-own"
target = "symbols"
contains = [
  "global internal settings comdat nodeduplicate",
  "global internal backup comdat nodeduplicate",
  "define internal Settings.cells comdat nodeduplicate",
]
excludes = ["rows", "cols", "backupRows", "backupCells"]

# -------- the folder sweep --------
#
# A module is the files of a folder. module_folder_sweep is the folder scenario
# compiled as the program's root, and it runs, because a folder module is one
# module however many files it spans; module_folder_import reaches one through
# 'import'. Between them they pin what the sweep brings in, what names it, and
# that the files of an organisational subfolder are the enclosing module's.
#
# What pins the other half -- that a file which is NOT its folder's designated
# file sweeps nothing -- is the whole rest of the corpus: every group directory
# holds a dozen unrelated programs side by side, and each compiles alone.

[scenario.module_folder_sweep]
category = "run"
description = "A module spanning its folder's files: a sibling and two depths of subfolder, compiled from the designated file alone"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# A folder module is one module, so its declarations are the root's and are
# spelled bare -- whichever of its files each was written in. Nothing is spelled
# after the folder, after a subfolder, or after a file.
[[scenario.module_folder_sweep.check]]
name = "a-folder-modules-files-declare-into-one-module"
target = "symbols"
contains = [
  "define internal siblingAdd comdat nodeduplicate",
  "define internal nestedScale comdat nodeduplicate",
  "define internal deepestOf comdat nodeduplicate",
  "global internal siblingTotal comdat nodeduplicate",
]
excludes = ["module_folder_sweep.", "deep.", "sibling.", "nested."]

[scenario.module_folder_import]
category = "compile"
description = "An import reaching a folder's module, whose sibling and subfolder files are its own"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# Every file the folder swept in declares into the one module, so every one of
# them is spelled after the FOLDER's name. Neither the subfolder nor a file
# appears in a symbol: neither is a namespace.
[[scenario.module_folder_import.check]]
name = "swept-files-declare-under-the-folders-module"
target = "symbols"
contains = [
  "declare modfolder.folderAdd",
  "declare modfolder.helperScale",
  "declare modfolder.partsOf",
]
excludes = ["parts.", "helper.", "scale."]

[scenario.module_import_submodule]
category = "compile"
description = "An import reaching a module with a tree beneath it: a folder submodule, a one-file submodule, and a one-file submodule of the folder one, all declared with it"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# A submodule is generated exactly when its parent is. modtree was found beside
# its importer, so it is only declared, and so is every module of its tree, at
# any depth: each function reached is a 'declare', spelled after its tree, and
# none is defined here.
[[scenario.module_import_submodule.check]]
name = "an-imported-modules-submodules-are-declared-with-it"
target = "symbols"
contains = [
  "declare modtree.treeAdd",
  "declare modtree.branch.grow",
  "declare modtree.branch.twig.bend",
  "declare modtree.leaf.fall",
]
excludes = ["define internal modtree."]

# -------- the module tree --------
#
# A subfolder holding its own designated file is a SUBMODULE, so the folder tree
# carries the module tree. module_submodule runs one, two levels deep, and pins
# what the tree spells at the linker; module_submodule_reject holds what the tree
# refuses at parse, and module_submodule_nameres what a path through it may not
# reach.
#
# All three are folder scenarios and could not be anything else: a submodule comes
# from a folder, so the layout IS the case.

[scenario.module_submodule]
category = "run"
description = "A module tree two levels deep: a submodule of the root and a submodule of that, reached by path, beside the organisational folders that draw nothing"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# A submodule is owned by its parent, so its declarations are spelled after the
# parent's name and a submodule of a submodule after both. The root contributes
# nothing, as it does for any program, so what a submodule's symbol carries is the
# tree below the root and no more.
#
# Neither an organisational folder nor a file is a namespace, at any level: what
# detail/helpers.cone declares is spelled after geometry alone, exactly as a file
# swept into the root is spelled bare.
[[scenario.module_submodule.check]]
name = "a-submodules-declarations-are-spelled-after-its-parents"
target = "symbols"
contains = [
  "define internal perimeter comdat nodeduplicate",
  "define internal geometry.area comdat nodeduplicate",
  "define internal geometry.perimeterOf comdat nodeduplicate",
  "define internal geometry.marginOf comdat nodeduplicate",
  "define internal geometry.scaling.twice comdat nodeduplicate",
  "global internal geometry.unit comdat nodeduplicate",
]
excludes = ["module_submodule.", "detail.", "helpers.", "shapes.", "geometry.detail"]

[scenario.module_submodule_reject]
category = "reject"
description = "What the module tree refuses: a designated file too deep to draw a module, an import naming the module's own submodule, a submodule's designated file with no 'mod' line, and a submodule's name shared with a declaration or with its parent, with a name bound before a module's 'mod' line is parsed reported at its designated file's first line"
tags = ["parse"]
diagnostics = 10

# A module named by its folder is positioned at line 1, column 1 of its
# designated file -- the file that makes the folder a module -- until its 'mod'
# line is parsed, which moves it to the line. So a duplicate found before then
# is reported at the first line: the root against the subfolder named like it,
# found when that subfolder is drawn, and bare/, whose file has no 'mod' line
# and is refused for it. Each carries that half as an annotation on its first
# line; sub/ is reported at its 'mod' line, since its collision is found when
# the root's file is parsed, after sub/'s.

# The refusal of a module folder that is not a direct child of its parent
# module's folder has no line of its own: which folder draws a module is a fact
# about the filesystem, not a position in a source.
[[scenario.module_submodule_reject.unlocated]]
code = "ErrorModFolder"
message = "direct child of its parent module's folder"

[scenario.module_submodule_nameres]
category = "reject"
description = "What a path through the tree may not reach: a submodule's private declaration, an unmarked submodule from outside its parent, and a sister nobody imported"
tags = ["nameres"]
diagnostics = 3

# -------- one-file modules --------
#
# A file of a module's folder whose first statement is a 'mod' declaration is a
# submodule of its own, in every respect the submodule a subfolder draws [Jon 23
# Sep]. module_onefile runs one tree of them; module_onefile_grown is the same
# tree with two of them grown into folders, and its symbols check lists exactly
# the symbols module_onefile's does, which is what pins that growing a module
# changes nothing for anyone who names it. module_onefile_reject holds what the
# sweep refuses at parse, and module_onefile_nameres what a path may not reach.

[scenario.module_onefile]
category = "run"
description = "One-file submodules beside a swept file and a folder submodule: private and 'pub', reached by path, folded by 'use', imported by a sister, and importing a sister of their own"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# A one-file module is owned by its parent, so its declarations are spelled after
# the parent's name, exactly as a folder submodule's are. A file with no 'mod'
# is the root's own and spelled bare. No file is a namespace beyond the module it
# is, so nothing is spelled after a file's name that is not also its module's.
[[scenario.module_onefile.check]]
name = "a-one-file-modules-declarations-are-spelled-after-its-parents"
target = "symbols"
contains = [
  "define internal helperAdd comdat nodeduplicate",
  "define internal lexer.scan comdat nodeduplicate",
  "define internal lexer.bias comdat nodeduplicate",
  "define internal tokens.weight comdat nodeduplicate",
  "define internal parser.parse comdat nodeduplicate",
  "define internal parser.ast.depth comdat nodeduplicate",
]
excludes = ["module_onefile.", "helper."]

[scenario.module_onefile_grown]
category = "run"
description = "module_onefile with two of its one-file modules grown into folders, and the same output and symbols"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# The same list as module_onefile's check, entry for entry: the folder shape of a
# module spells what its one-file shape spelled.
[[scenario.module_onefile_grown.check]]
name = "a-grown-modules-declarations-are-spelled-as-its-one-files-were"
target = "symbols"
contains = [
  "define internal helperAdd comdat nodeduplicate",
  "define internal lexer.scan comdat nodeduplicate",
  "define internal lexer.bias comdat nodeduplicate",
  "define internal tokens.weight comdat nodeduplicate",
  "define internal parser.parse comdat nodeduplicate",
  "define internal parser.ast.depth comdat nodeduplicate",
]
excludes = ["module_onefile_grown.", "helper."]

[scenario.module_onefile_reject]
category = "reject"
description = "What a one-file module refuses: a name that is not its file's, a second declaration, a module folder of the same name beside it, a place in an organisational folder, and an import of it by its parent"
tags = ["parse"]
diagnostics = 5

# Which files a module holds is a fact about the filesystem, so the refusal of a
# file beside a same-named module folder, and of a one-file module in an
# organisational folder, have no line of their own.
[[scenario.module_onefile_reject.unlocated]]
code = "ErrorModFileFolder"
message = "declares module 'clash', and so does module folder"

[[scenario.module_onefile_reject.unlocated]]
code = "ErrorModFolder"
message = "must sit directly in its parent module's folder"

[scenario.module_onefile_nameres]
category = "reject"
description = "What a path may not reach through a one-file module: its private declaration, and an unmarked one-file module from outside its parent"
tags = ["nameres"]
diagnostics = 2

# -------- import within the tree --------
#
# A module reaches a sister by importing her NAME, resolved against the registry
# its parent is rather than against the filesystem. module_import_sister runs
# one, so an import across the tree links exactly as a call down into it does;
# module_import_reject holds what a written path may not reach, and
# module_import_nameres what an import does not put in reach.
#
# All three are folder scenarios and could not be anything else: a sister comes
# from a folder, so the layout IS the case.

[scenario.module_import_sister]
category = "run"
description = "A submodule importing its sisters by name: one reached through her, one wildcard-folded, and one re-exported for the parent to walk through"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# An import within the tree links. Every module of the tree is compiled into one
# object, so a sister's function is DEFINED here, spelled after her, exactly as a
# submodule's is -- which is what an import between two loaded modules could not
# do, since an imported module's bodies are not generated.
[[scenario.module_import_sister.check]]
name = "a-sister-s-declarations-are-defined-and-spelled-after-her"
target = "symbols"
contains = [
  "define internal engine.drive comdat nodeduplicate",
  "define internal wheels.turn comdat nodeduplicate",
  "define internal rims.size comdat nodeduplicate",
]
excludes = ["declare wheels.turn", "declare rims.size"]

# An import binds names and declares nothing, and neither does a fold. Nothing is
# spelled after the module that imported or folded a name: not the module binding
# engine re-exported, not the name engine folded from rims.
[[scenario.module_import_sister.check]]
name = "an-import-declares-no-symbol-of-its-own"
target = "symbols"
excludes = ["engine.wheels", "engine.size", "engine.rims", "module_import_sister."]

[scenario.module_import_reject]
category = "reject"
description = "What a written path may not reach: a sister's file, a parent, and a parent's sister"
tags = ["parse"]
diagnostics = 3

[scenario.module_import_nameres]
category = "reject"
description = "What an import does not put in reach: a sister's private name, a name she has not got, and a sister of an ancestor"
tags = ["nameres"]
diagnostics = 3

# -------- the package search path --------
#
# A name the registry does not hold, and no file beside the importer answers, is
# looked for on the package search path: each '--path' folder, then the packages
# folder at the repository's root, which holds core and stdio as ordinary folder
# modules. Every other scenario that prints reaches stdio that way. Until
# separate compilation lands, a module found on the search path is compiled into
# the object that imports it, which is why those scenarios link.
#
# module_package_sister is the registry winning over the packages folder: a
# sister named stdio is what her sister's 'import stdio' reaches.
# module_package_path is a '--path' folder winning over it: its run adds
# modulepkgs, a support folder holding a stdio of its own, and the import reaches
# that one while core is still found in the packages folder.

[scenario.module_package_sister]
category = "run"
description = "A submodule's 'import stdio' reaching her sister named stdio, not the stdio package"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# The sister is what the import bound, so her function is defined and spelled
# after her. The package was never read: nothing of its IOStream or its print
# global is declared.
[[scenario.module_package_sister.check]]
name = "the-registry-answers-before-the-packages-folder"
target = "symbols"
contains = [
  "define internal stdio.marker comdat nodeduplicate",
  "define internal user.value comdat nodeduplicate",
]
excludes = ["IOStream", "stdio.print"]

[scenario.module_package_path]
category = "run"
description = "A '--path' folder searched before the packages folder: its stdio is the one 'import stdio' reaches"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

[[scenario.module_package_path.run]]
name = "search-path"
options = ["--path=test/cases/module/modulepkgs"]

# The '--path' package is found on the search path, so its body is generated
# here, spelled after the package; the packages folder's stdio is not read.
[[scenario.module_package_path.check]]
name = "a-path-folder-answers-before-the-packages-folder"
target = "symbols"
contains = ["define internal stdio.show comdat nodeduplicate"]
excludes = ["IOStream", "stdio.print"]

# -------- import of a parent's name --------
#
# 'import' takes ANY name the registry holds, not only a module [Jon 23 Sep]:
# inside a submodule, 'import Point;' names the parent's public Point -- a type,
# a function, a global -- as 'import log;' names a sister. But a parent depends
# on each of its children, so the import closes a loop of two and is refused
# (ErrorImportLoop) [Jon 23 Sep]: what a parent and its children share moves
# into a sister they all import. The import is still bound, in the fold passes,
# so the child's body resolves and the loop is what is reported.
#
# module_import_parent is the refusal: a struct, a function and a global, one
# re-exported, a written import beside a wildcard's arrival of the same
# declaration, and two levels down a type and a module the level above binds by
# its imports, each a name of that parent. module_import_parent_nameres holds what binding refuses beside the loop,
# module_import_parent_parse the name imported twice, and
# module_import_parent_file a file reached by a name the parent answers too.

[scenario.module_import_parent]
category = "reject"
description = "A submodule importing its parent's public struct, function and global, and a grandchild importing a type and a module its parent binds by an import, each a loop through containment"
tags = ["nameres"]
diagnostics = 6

[scenario.module_import_parent_nameres]
category = "reject"
description = "What an import of a parent's name refuses beside the loop it closes: a private name, a name the parent has not got, a name the submodule declares, a 'use' clause on a struct, and a name written twice"
tags = ["nameres"]
diagnostics = 11

[scenario.module_import_parent_parse]
category = "reject"
description = "A name of the parent imported twice"
tags = ["parse"]
diagnostics = 1

[scenario.module_import_parent_file]
category = "reject"
description = "A submodule's bare name reached as a file that the parent's registry answers with something else"
tags = ["nameres"]
diagnostics = 1

[[scenario.module_import_parent_file.run]]
name = "search-path"
options = ["--path=test/cases/module"]

# -------- an import's 'use' clause --------
#
# An import may carry the fold clause a global carries -- a list with 'as', '*
# but', a block, 'pub use' -- with the imported module as the source. Every name
# it admits is an alias with its own spelling, private to the importing module
# unless the import says 'pub': 'pub import' reaches every binding the import
# makes, the module's own name included, and 'pub use' only the folds.
#
# module_import_use runs the clause in a tree of four sisters, with a re-export
# reached through a third module; module_import_use_nameres holds what a clause
# does not put in reach and what it refuses to fold; module_import_use_parse
# holds what is refused as it is parsed, and the rule for two imports of one
# module: a second is ErrorDupImport, a differing one and an identical repeat
# alike [Jon 23 Sep].

[scenario.module_import_use]
category = "run"
description = "An import's 'use' clause: a list with 'as', '* but', a block, 'pub use' re-exported through a wildcard import, and 'pub import'"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# A fold binds and declares nothing, whatever its spelling. No symbol is spelled
# after the module that folded a name, nor after the local spelling 'as' gave it;
# every call lowers to the declaring module's own symbol.
[[scenario.module_import_use.check]]
name = "an-import-clause-declares-no-symbol-of-its-own"
target = "symbols"
contains = [
  "define internal shapes.area comdat nodeduplicate",
  "define internal shapes.perimeter comdat nodeduplicate",
  "define internal units.feet comdat nodeduplicate",
]
excludes = ["draw.area", "draw.edge", "gallery.ft", "gallery.units", "gallery.metres", "draw.metres", "edge comdat", "ft comdat"]

[scenario.module_import_use_nameres]
category = "reject"
description = "What an import's 'use' clause does not put in reach, and each name it refuses to fold or to leave out: absent, private, colliding, the module itself"
tags = ["nameres"]
diagnostics = 10

[scenario.module_import_use_parse]
category = "reject"
description = "Two imports of one module, identical or differing, and the clause spellings refused as they are parsed"
tags = ["parse"]
diagnostics = 12

# A module's default fold: the 'use' on its own 'mod' line names what a bare
# import of it folds [Jon 23 Sep]. module_mod_default runs it in a tree of eight
# sisters -- one type, two names, 'extends' beside it, an importer's own clause
# replacing it, and 'pub import' carrying it one module further;
# module_mod_default_nameres holds what the default may not name, and what a
# replaced default leaves out of reach; module_mod_default_parse the spellings
# refused on the 'mod' line.

[scenario.module_mod_default]
category = "run"
description = "A module's default fold: one type, two names, with 'extends', replaced by an importer's own clause, and re-exported by 'pub import' to a wildcard importer"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# A default fold binds names and declares nothing, as every fold does. Each call
# lowers to the declaring module's own symbol, and nothing is spelled after the
# importer that folded a name, nor after the module that re-exported one.
[[scenario.module_mod_default.check]]
name = "a-default-fold-declares-no-symbol-of-its-own"
target = "symbols"
contains = [
  "define internal bigint.helper comdat nodeduplicate",
  "define internal units.metres comdat nodeduplicate",
  "define internal solids.volume comdat nodeduplicate",
  "define internal shapes.area comdat nodeduplicate",
]
excludes = ["calc.BigInt", "calc.metres", "calc.area", "calc.volume", "relay.BigInt", "gallery.BigInt", "solids.area"]

[scenario.module_mod_default_nameres]
category = "reject"
description = "What a module's default fold may not name -- a missing name, a private one, a 'but' of a missing one -- a default meeting a declaration, and a default an importer's clause replaced"
tags = ["nameres"]
diagnostics = 5

[scenario.module_mod_default_parse]
category = "reject"
description = "The default-fold spellings refused on a 'mod' line: 'as', 'pub use', 'use pub', and the clause before 'extends'"
tags = ["parse"]
diagnostics = 4

# -------- the module order: imports form a DAG --------
#
# "Modules need to have an explicit dag order" [Jon 23 Sep], at every scale:
# sister modules as well as packages. A module depends on each module it
# imports, on the module holding a name it imports, on the module it extends,
# and on each of its own submodules, so a child depending on its parent is a
# loop of two. The modules are put in dependency order once what 'extends' names
# is known, and each loop is ErrorImportLoop at the edge that closes it, naming
# the modules round it (pgmModuleOrder). The order is the one module 'init's
# will run in.
#
# module_cycle is a loop back to the root file, which the import finds rather
# than reading the file again. module_import_cycle is the loops the fold passes
# used to carry re-exports round -- two sisters, three round one ring, one an
# 'extends' closes -- and pins that the loop is the one thing reported: the
# loop is left whole, and the passes still carry each name round it.
# module_import_cycle_nameres is what the passes do not make even so: a name
# missing for good, a 'but' and a listed name judged against the module once
# complete, two different declarations a loop brings under one name, and one
# declaration a loop makes the module write twice [Jon 23 Sep], each reported
# once, where a single pass would have met them -- beside the same shape through
# a wildcard, which is one binding. module_import_parent is a child importing
# its parent's names, which is a loop through containment; module_extends_back
# and module_extends_nameres hold the loops an 'extends' makes.
[scenario.module_cycle]
category = "reject"
description = "An import loop back to the root file: the import finds the root rather than re-parsing it, and the loop is refused naming the root"
tags = ["parse", "nameres"]
diagnostics = 1

[scenario.module_import_cycle]
category = "reject"
description = "Loops of imports refused at the edge that closes each -- two sisters, three round a ring, one an 'extends' closes -- with every re-export still carried round them, so nothing else is reported"
tags = ["nameres"]
diagnostics = 7

[scenario.module_import_cycle_nameres]
category = "reject"
description = "What the fold passes round a refused loop do not make: a name missing for good, a 'but' of a late name, a listed name that is private, two different declarations under one name, and one declaration listed twice with one listing arriving late, each reported once beside the loop"
tags = ["nameres"]
diagnostics = 17

# -------- a module's 'use' of an enum --------
#
# A variant is a name of its enum, and 'use Colors;' folds the variants in as
# names of the module. The fold is the module's own binding, private unless the
# statement says 'pub use', which is the visibility every fold has: a public fold
# is reached by a path from outside and carried on by a wildcard import. That is
# the re-export, and it is a module's subject, so it is covered here; what the
# statement is and what it refuses is enum's. Both are folder scenarios because a
# re-export needs a second module to be seen from, and a tree is the one shape
# that has two modules and still links.

[scenario.module_use_enum]
category = "run"
description = "An enum's variants folded 'pub use' and reached from a sister through a wildcard import and from the parent by a path, and a fold whose enum is named by a path"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

[scenario.module_use_enum_nameres]
category = "reject"
description = "What a fold of an enum's variants does not put in reach: a private fold by a path or through a wildcard import, and a fold colliding with a name an import brought"
tags = ["nameres"]
diagnostics = 3

# -------- a module's 'use' of its own submodule --------
#
# A standalone 'use' names any namespace a module reaches WITHOUT an import
# [Jon 23 Sep]: an enum, as above, or a submodule -- by its name, or by a path
# through submodules -- whose public names it folds exactly as an import's clause
# folds a module's. A submodule is brought in by its folder and never imported,
# so this is the one way a parent folds its child's names. An imported module is
# not folded this way: its import's own clause does that, one spelling per
# situation, and 'use' on it is ErrorUseImported.
#
# module_use_submodule runs every spelling of the clause -- the whole of it, 'but',
# a block with 'as', a path one level deeper, 'pub use' re-exporting a
# submodule's names to the parent by path and to a sister by import -- beside an
# enum's 'use', and pins that a fold declares nothing. module_use_submodule_nameres
# holds what it refuses: a private name listed, a second 'use' of one submodule,
# a 'but' naming nothing or a private name, a 'use' of an imported module by its name and by a path
# through it, a 'use' of the module itself, and a private fold read from outside.

[scenario.module_use_submodule]
category = "run"
description = "A parent folding its own submodules' names with a standalone 'use': whole, 'but', a block with 'as', a path one level deeper, and 'pub use' seen by path and by a sister's import, beside an enum's 'use'; a global whose type that 'use' brings, folded in the second fold pass and taken by a sister's wildcard"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# A fold binds names and declares nothing. Every call lowers to the submodule's
# own symbol, spelled after the submodule, and nothing is spelled after the local
# spelling 'as' gave a name, nor after the module that re-exported one.
[[scenario.module_use_submodule.check]]
name = "a-submodule-fold-declares-no-symbol-of-its-own"
target = "symbols"
contains = [
  "define internal scaling.twice comdat nodeduplicate",
  "define internal measure.inches comdat nodeduplicate",
  "define internal geometry.deep.depth comdat nodeduplicate",
  "define internal facade.inner.innerValue comdat nodeduplicate",
]
excludes = ["toInches", "facade.innerValue", "reader.innerValue", "module_use_submodule."]

[scenario.module_use_submodule_nameres]
category = "reject"
description = "What a standalone 'use' of a module refuses: a private name listed, a second 'use' of one submodule, a 'but' naming nothing or a private name, an imported module by name and by path, the module itself, and a private fold read by path and by import"
tags = ["nameres"]
diagnostics = 10

# -------- whose names a fold is resolved in --------
#
# A module's namespace holds what it declares, what its own folds and imports
# brought in, and its children; nothing arrives from the scope it was entered
# from. The fold passes run dependency-first, so one module's folds run from
# inside another's -- a parent's 'use' of its child, an import of a sister -- and
# a type is resolved by demand from inside another module's resolution. Each is
# resolved in its own module's names. module_fold_scope_nameres names, from a
# child and from a sister, what only the module whose pass reached them declares:
# an enum's 'use', a global's fold, and a trait's field resolved by demand.

[scenario.module_fold_scope_nameres]
category = "reject"
description = "A fold run from inside another module's fold pass, and a type resolved by demand from another module, do not see that module's names: an enum's 'use', a global's fold type and value, and a trait's field, from a child the parent folds and a sister another sister imports"
tags = ["nameres"]
diagnostics = 7

# -------- 'extends': one module reusing another --------
#
# 'mod solids extends shapes' makes every declaration of shapes, and every name
# a 'use' clause of shapes folded in, a name of solids, as an alias: the
# declaration, its symbol and its state stay shapes'. The name an import of
# shapes binds to its module does not come across: shapes' imports are its
# dependencies, not its contents, and solids states its own [Jon 23 Sep]. Each
# alias is as visible in solids as in shapes, so solids' code reads shapes'
# private names and solids' importers see shapes' public ones [Jon 23 Sep]. For
# a module, extending and inheriting are one thing, because a module's state is
# static and one instance of it is all there is.
#
# module_extends runs one, in a tree -- a chain of two, reached from inside,
# private names and a private fold included, by path from the parent, and
# through two importers, with the extending module importing for itself a module
# the base imports -- and pins that the aliases declare nothing. module_extends_import extends a module an import reached by
# its file, which compiles and cannot link. module_extends_nameres holds what
# 'extends' refuses once names are bound, module_extends_parse what it refuses as
# it is written.

[scenario.module_extends]
category = "run"
description = "A module extending a sister that extends another: the base's function, type and global reached through the extending module from inside, by path, and through an importer's path and wildcard, both bases' private names and the base's private fold reached from inside, and a module the base imports named after the extending module imports it too"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# 'extends' binds and declares nothing. Every name reached through solids lowers
# to the declaring module's own symbol, and nothing is spelled after solids but
# what solids declares itself.
[[scenario.module_extends.check]]
name = "extends-declares-no-symbol-of-its-own"
target = "symbols"
contains = [
  "define internal shapes.area comdat nodeduplicate",
  "define internal base.unit comdat nodeduplicate",
  "global internal shapes.count comdat nodeduplicate",
  "define internal solids.volume comdat nodeduplicate",
  "define internal tools.tripled comdat nodeduplicate",
]
excludes = ["solids.area", "solids.unit", "solids.count", "solids.Point", "shapes.unit",
            "summary.area", "report.area", "solids.secret", "solids.hidden", "solids.deep",
            "shapes.deep", "solids.tripled", "shapes.tripled"]

# A module that imports a module extending it depends on it, and is depended
# on by it: a loop, one edge an import and the other an 'extends', refused
# (ErrorImportLoop) [Jon 23 Sep]. Both orders, because which edge closes the
# loop, and so where it is reported, follows the order the program holds the
# two in; and in neither is anything else reported, since the loop is left
# whole and the fold passes carry the names round it.
[scenario.module_extends_back]
category = "reject"
description = "A module importing a module that extends it, in both orders: the loop refused at the edge that closes it, an 'extends' or an import, and nothing else reported"
tags = ["nameres"]
diagnostics = 2

# A MODULE TRAIT and the modules conforming to it. module_trait runs every way a
# default is taken or not: taken whole, overridden by a function and by a global,
# a default global as per-module storage, a default's body reaching a private
# helper of the trait's module, a module extending a conforming one and conforming
# too, with every 'mod' line clause in the ruled order, and a default fold of a
# taken default. module_trait_parse pins what the declaration and the 'is' clause
# refuse as written, module_trait_nameres what conformance refuses once names are
# bound, and module_trait_typecheck what differs in shape once they have types.
[scenario.module_trait]
category = "run"
description = "A module trait's defaults taken, overridden by a function and a global, per-module default global storage, a default reaching the trait module's private helper, 'mod layered extends plain is Runner use run', and a default fold of a taken default"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# A default taken is the conforming module's own declaration, so it is spelled
# after that module: plain's and custom's copies are each their own symbol. The
# trait's members are generated nowhere, and layered and caller, which reach
# plain's copies through 'extends' and a fold, declare none.
[[scenario.module_trait.check]]
name = "a-taken-default-is-the-conforming-modules-own"
target = "symbols"
contains = [
  "define internal plain.run comdat nodeduplicate",
  "define internal plain.tick comdat nodeduplicate",
  "global internal plain.offset comdat nodeduplicate",
  "global internal plain.calls comdat nodeduplicate",
  "define internal custom.run comdat nodeduplicate",
  "global internal custom.calls comdat nodeduplicate",
  "define internal custom.label comdat nodeduplicate",
  "define internal hosts.unit comdat nodeduplicate",
]
excludes = ["hosts.run", "hosts.tick", "hosts.offset", "hosts.calls", "hosts.label",
            "hosts.step", "hosts.scale", "Runner", "layered.run", "layered.tick",
            "layered.calls", "layered.offset", "caller.run"]

[scenario.module_trait_parse]
category = "reject"
description = "What a module trait's body refuses -- a type, an import, a generic fn, an overload name, a name twice -- a trait with no name, and the 'is' clause by a path, as a list, before 'extends', after 'use', and naming nothing"
tags = ["parse"]
diagnostics = 11

[scenario.module_trait_nameres]
category = "reject"
description = "What conformance refuses once names are bound: requirements declared nowhere, 'is' naming a struct's trait, a module, a function or nothing, a path through a module trait, and 'extends' naming one"
tags = ["nameres"]
diagnostics = 8

[scenario.module_trait_typecheck]
category = "reject"
description = "What a conforming module declares under a member's name without the member's shape: another signature, a global for a function and the reverse, another type for a required and an overriding global, and another permission"
tags = ["typecheck"]
diagnostics = 6

# A MODULE'S 'init' AND 'final' [Jon 23 Sep]: each module declares its own, and
# the program's stitched init and final run them all -- every 'init' in the
# module order, dependencies first and the root last, and every finalizer in
# exactly the reverse. module_init runs a chain of modules, printing from each;
# module_init_link runs a package compiled on its own, whose 'init' and
# finalizer the program's stitched pair reach through its include file;
# module_init_reject pins what a module's 'init' refuses about its globals, and
# what 'init' and 'final' must be.
[scenario.module_init]
category = "run"
description = "Every module's 'init' in the module order and every finalizer in the reverse, through 'initAll()' and 'finalAll()': an 'imm' global assigned by 'init', one module's 'init' reading another's global, a module with only 'final', and a module's 'drop' finalizing its globals after its 'final'"
tags = ["typecheck", "genllvm", "runtime"]

# The stitched pair is the program's own. A module's finalizer is the 'drop' it
# is given where a global needs finalizing -- base's, with no 'final' of base's
# own, and middle's -- and its own 'final' otherwise: top has no 'drop'.
[[scenario.module_init.check]]
name = "the-stitched-pair-and-each-modules-finalizer"
target = "symbols"
contains = [
  "define internal cone.initAll comdat nodeduplicate",
  "define internal cone.finalAll comdat nodeduplicate",
  "define internal base.init comdat nodeduplicate",
  "define internal base.drop comdat nodeduplicate",
  "define internal middle.drop comdat nodeduplicate",
  "define internal top.final comdat nodeduplicate",
  "global internal base.mark comdat nodeduplicate",
]
excludes = ["top.drop", "top.init", "base.final", "constant internal base.mark"]

[scenario.module_init_link]
category = "run"
description = "A package compiled on its own, whose 'init' and finalizer the program's stitched init and final call through its include file, linked and run"
tags = ["genllvm", "runtime"]
link = ["package/lib.conebuild"]

# lib's 'init', 'final' and 'drop' are private, and a library compile exports
# them: the program's stitched init and final call them from another object.
[[scenario.module_init_link.check]]
name = "the-library-exports-its-lifecycle"
target = "symbols"
object = "lib"
contains = [
  "define lib.init comdat nodeduplicate",
  "define lib.final comdat nodeduplicate",
  "define lib.drop comdat nodeduplicate",
]

# The program derives lib's finalizer from the include file as lib's compile
# does from lib's source -- a 'drop', since a global it declares finalizes --
# and declares what its stitched pair calls. lib's 'final' is called only from
# lib's 'drop', so the program never names it.
[[scenario.module_init_link.check]]
name = "the-program-calls-lib-init-and-drop"
target = "symbols"
contains = [
  "declare lib.init",
  "declare lib.drop",
  "define internal cone.initAll comdat nodeduplicate",
  "define internal cone.finalAll comdat nodeduplicate",
]
excludes = ["declare lib.final", "define lib.init", "define lib.drop"]

[scenario.module_init_reject]
category = "reject"
description = "A global without a value that 'init' does not assign, reads one before assigning it, or assigns an 'imm' one twice; one assigned elsewhere; a module with no 'init'; and an 'init' or 'final' not declared as the program calls it"
tags = ["typecheck"]
diagnostics = 11

# GENERIC MODULES, treated as generic types are [Jon 23 Sep]. module_generic
# runs two instances of one generic module with separate globals, one instance
# named from two modules, and each instance's 'init' and 'final' in the module
# order; module_generic_link compiles the generic in a package of its own and
# the same instance in two objects, merged at link. The rejects: what 'mod
# stack[T]' refuses on its line (-parse), a generic module named without type
# arguments or holding what an instance is not built for (-nameres), bad type
# arguments and an instance's missing or private member (-typecheck), and a
# program whose root is generic (-root).
[scenario.module_generic]
category = "run"
description = "Two instances of a generic module with their own globals, a T among them; one instance named from the root and a sister; a type of the module holding a T through a type alias of T; its own name in its body, bare and with its type argument; a module trait's default taken by each instance; each instance's 'init' after its generic and after the module its type argument comes from, and 'final' in the reverse"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

# An instance's symbols carry its type arguments on the module, as a generic
# type instance's do: 'stack[i64].push' is '_CNvIC5stackxE4push'. A lone
# compile's instances are internal, as every definition of a program is
[[scenario.module_generic.check]]
name = "an-instance-is-spelled-with-its-type-arguments"
target = "symbols"
contains = [
  "define internal stack[i64].push comdat nodeduplicate",
  "define internal stack[f64].push comdat nodeduplicate",
  "define internal stack[i64].Entry.doubled comdat nodeduplicate",
  "define internal stack[i64].init comdat nodeduplicate",
  "define internal stack[f64].twice comdat nodeduplicate",
  "define internal tally[user.Tag].see comdat nodeduplicate",
  "global internal stack[i64].count comdat nodeduplicate",
  "global internal stack[f64].count comdat nodeduplicate",
]
excludes = ["stack.push", "stack.count", "tally.see"]

# A generic module as a package's root, compiled on its own (g), used by a
# package compiled on its own (q) and by the program, and linked: g[i64] is
# defined in q's object and in the program's, shared, and the linker keeps one
# copy, so q's code and the program's add to one total. A package's include
# file shows its root module alone, which is why the generic here is a root.
[scenario.module_generic_link]
category = "run"
description = "A generic module in a package of its own, instantiated at i64 in a package compiled alone and in the program, whose copies of the instance -- functions and globals -- merge at link; and an instance the program alone uses"
tags = ["genllvm", "runtime"]
link = ["g/g.conebuild", "q/q.conebuild"]

# q's object defines g[i64] -- its functions, its 'init' and its globals --
# shared, as the program's object does
[[scenario.module_generic_link.check]]
name = "q-defines-the-instance-it-uses-shared"
target = "symbols"
object = "q"
contains = [
  "define linkonce_odr g[i64].add comdat any",
  "define linkonce_odr g[i64].init comdat any",
  "global linkonce_odr g[i64].total comdat any",
  "define q.addTwice comdat nodeduplicate",
]
excludes = ["g[f64]"]

# The program defines each instance it uses from the body g's include file
# carries, and declares what q's object defines
[[scenario.module_generic_link.check]]
name = "the-program-defines-each-instance-it-uses-shared"
target = "symbols"
contains = [
  "define linkonce_odr g[i64].add comdat any",
  "define linkonce_odr g[f64].add comdat any",
  "global linkonce_odr g[i64].total comdat any",
  "global linkonce_odr g[f64].total comdat any",
  "declare q.addTwice",
]

# g's own object has nothing to define: no instance of it is named there
[[scenario.module_generic_link.check]]
name = "the-generic-package-defines-nothing"
target = "symbols"
object = "g"
excludes = ["g[", "g.add", "g.total"]

[scenario.module_generic_parse]
category = "reject"
description = "A generic module's 'mod' line with an empty parameter list, and one C-named"
tags = ["parse"]
diagnostics = 2

[scenario.module_generic_nameres]
category = "reject"
description = "A generic module named without type arguments -- a path through it, a standalone 'use', an import's 'use' clause, 'extends', its own default fold -- and one holding a generic function, a trait or a submodule"
