# struct - structs, method definition, operator methods, initializers and
# finalizers, delegated inheritance. Tier 1.
#
# Key reference: design/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# The success program is split in two at the seam between what a struct holds
# and what it declares: struct-success builds and copies values and declares no
# method at all, so a failure there is about field layout; struct-methods calls
# every method and operator method and declares no field the call does not need.
# struct-operators is the rest of the operator-method table: struct-methods
# keeps the seven spellings whose meaning it explains, and struct-operators
# applies every other spelling once, so that the table of operator names and
# the symbol codes they lower to is pinned whole in one place. struct-opaque
# is a fourth success scenario and a 'compile' one, because an opaque type's
# values cannot be created and so nothing about it can run.
#
# struct-fold is the fifth success scenario: delegated inheritance, a field's
# 'use' clause folding members of its type in as names of the type that holds
# it. It is its own file because the fold's claims -- which receiver a folded
# call runs with, that no forwarder is generated, what a vtable slot a folded
# method fills holds -- are all about lowering, and its checks read the IR.
#
# struct-final-once is the sixth: when a finalizer runs. struct-methods pins
# that one runs at all and what a generated drop fn calls; this file pins that
# it runs exactly once, so its cases are the variables that must not be
# finalized -- never assigned, moved out -- beside the ones that must.
#
# struct-extends is the seventh: enriching a concrete type with methods. It is
# its own file rather than part of struct-fold, because the two folds differ in
# exactly the thing each is for -- a field's clause reaches the part through a
# receiver it has to shift, and an enrichment is the whole and shifts nothing --
# so a failure in one says nothing about the other. Its claims are what the
# base's members reach through the new name, what the enrichment's own methods
# reach in the base, and that a value crosses between the two names in either
# direction. The one claim a run cannot make, that the two types have one LLVM
# layout, is a check below. Retroactive conformance is here too, although it
# dispatches through a virtual reference, because what it establishes is what
# 'extends' delivers rather than what a virtual reference reaches.
#
# struct-use-sibling is the eighth: folding a SIBLING enrichment in with a type
# body's 'use'. It rests on struct-extends and is separate from it, because the
# two answer different questions -- that one pins what one base gives one
# enrichment, and this pins what several enrichments of one base give a type that
# names them. Its claims are which declaration a folded call reached, what a
# renamed or excluded name resolved to, and that a sibling's method reads the
# shared representation through a receiver nothing rewrote. The two claims a run
# cannot make -- that no method is copied per folding type, and that every type
# here has the base's layout -- are checks below.
#
# The reject scenarios are split by pipeline stage, because analysis halts
# between stages and an expectation from a later stage would never be reached.
# The type-check stage is split again by what is wrong: the declaration itself,
# a constructor, or a call. A fold clause gets one file per stage: where it may
# be written (parse), what it may admit (name resolution, which is where a
# type's dictionary is built), and what a folded name is not (type check).
# struct-nameres-extends is at that same middle stage and separate from
# struct-nameres-fold because its subject is the base rather than a clause:
# taking the base's members is what builds the enriching type's dictionary, so
# what may be enriched and what an enrichment may declare are both reported
# there. Where a base clause may be written at all is a stage earlier, and in the
# trait group, which owns the 'is' clause: trait-parse-extends. Reaching a
# private member of the base from outside the pair is type check's, and it sits
# with the rest of the visibility family in struct-typecheck-methods.
#
# Left out, with reasons:
#
# - Initializers -- a 'fn init(self &new)' method. There is no 'new'
#   permission: it does not resolve as a name, so the method cannot be written
#   at all. conesite/public/coneref/refinitdrop.html says as much. Finalizers,
#   which that same page also calls unimplemented, do work and are in
#   struct-methods.
#
# - A 'clone' method, for the same reason: its first parameter is 'self &new'.
#   The name 'clone' is recognized far enough to turn off the move-type
#   inference a finalizer causes, but the method it refers to cannot be
#   declared.
#
# - Field-by-field initialization of a struct declared without a value. Flow
#   analysis tracks the whole value, so assigning every field one at a time
#   still leaves the variable uninitialized. struct-success covers the whole
#   value assignment that does work, and says so.

support = ["structmeter.cone"]

# -------- success --------

[scenario.struct-success]
category = "run"
description = "Struct fields: declaring, constructing, reading, changing and copying them"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# Structs that reach themselves through a reference must survive into code
# generation as self-referential types rather than being flattened or dropped.
# A type whose own name appears inside its body is the whole claim, and runtime
# cannot see it. Read before optimization: the functions that mention these
# types are folded into 'main' and deleted, and a type nothing mentions is not
# printed.
[[scenario.struct-success.check]]
name = "recursive-types-reach-code-generation"
target = "preir"
contains = [
  "%Node = type { i64, %Node* }",
  "%Owner = type { i64, %Held }",
  "%Held = type { %Owner* }",
  "%Left = type { i64, %Right* }",
  "%Right = type { %Left* }",
]

# A global built from nested struct literals is one constant, every level of it
# and the nested default included, rather than code run to fill it in. Runtime
# reads the same fields either way.
[[scenario.struct-success.check]]
name = "nested-struct-literal-global-is-one-constant"
target = "preir"
contains = ["@route = internal constant %Segment { %Point { i32 21, i32 22, i32 23 }, %Point { i32 24, i32 25, i32 7 } }"]

# A type's static is a global owned by the type, spelled after it like a
# method, and not a field: the type's layout is unchanged by it.
[[scenario.struct-success.check]]
name = "static-is-a-global-owned-by-its-type"
target = "symbols"
contains = ["global internal Tally.made comdat nodeduplicate"]

[[scenario.struct-success.check]]
name = "static-is-not-a-field"
target = "preir"
contains = ["%Tally = type { i32 }"]

[scenario.struct-methods]
category = "run"
description = "Methods, receivers, static functions, overloaded methods, operator methods and finalizers"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# Every method's symbol reads as its declaring type, then its own concrete
# name. That is what runtime cannot see: which candidate of an overload set a
# call reached shows up in what it computed, but whether a symbol exists at all
# does not.
[[scenario.struct-methods.check]]
name = "methods-lower-to-concrete-symbols"
target = "symbols"
contains = [
  "define internal Pair.sumValue comdat nodeduplicate",
  "define internal Pair.sumRef comdat nodeduplicate",
  "define internal Pair.sumOther comdat nodeduplicate",
  "define internal Scaler.scaleWide comdat nodeduplicate",
  "define internal Scaler.scaleCount comdat nodeduplicate",
  "define internal Maker.fromInt comdat nodeduplicate",
  "define internal Maker.fromFloat comdat nodeduplicate",
  "define internal Vec.addVec comdat nodeduplicate",
  "define internal Vec.addScalar comdat nodeduplicate",
]

# A call names its method in several ways -- on a value, on a reference,
# through 'self', bare inside a method, and through the type's name with the
# receiver as an argument -- and every one of them lowers to the same concrete
# symbol. The symbols say that the methods written to exercise those forms
# exist and that no form minted a symbol of its own; which candidate each
# reached is in the printed values.
[[scenario.struct-methods.check]]
name = "call-forms-reach-the-concrete-method"
target = "symbols"
contains = [
  "define internal Pair.viaBareNames comdat nodeduplicate",
  "define internal Pair.viaSelf comdat nodeduplicate",
  "define internal Pair.viaBareOverload comdat nodeduplicate",
]
excludes = ["Pair.sum ", "Pair.self", "self."]

# An overload name is not a declaration, so nothing is generated for it. A
# definition's name is followed by its COMDAT, so the trailing space is what
# stops 'Pair.sum' from matching 'Pair.sumValue'.
[[scenario.struct-methods.check]]
name = "no-symbol-for-method-overload-name"
target = "symbols"
excludes = ["Pair.sum ", "Scaler.scale ", "Maker.make ", "Vec.+ "]

# An operator method's concrete name is punctuation. The symbol spells it as a
# fixed code -- '+=' is 'opL' -- and it reads back as the operator itself.
[[scenario.struct-methods.check]]
name = "operator-method-symbols-read-as-the-operator"
target = "symbols"
contains = [
  "define internal Vec.- comdat nodeduplicate",
  "define internal Vec.+= comdat nodeduplicate",
  "define internal Vec.== comdat nodeduplicate",
  "define internal Vec.() comdat nodeduplicate",
  "define internal Vec.[] comdat nodeduplicate",
  "define internal Vec.<- comdat nodeduplicate",
  "define internal List.&[] comdat nodeduplicate",
]

# A name outside [A-Za-z0-9_] -- Unicode letters, or anything in backticks --
# is punycoded into the symbol and read back as written: a Unicode identifier
# bare, a backticked one in its backticks. This is the one place the encoder
# in conec and the demangler in the runner meet on a punycoded name, so it is
# where a disagreement between them would show.
[[scenario.struct-methods.check]]
name = "encoded-names-read-back-as-written"
target = "symbols"
contains = [
  "define internal Umlaut.größe comdat nodeduplicate",
  "define internal Umlaut.`a b` comdat nodeduplicate",
  "define internal Umlaut.`+ -` comdat nodeduplicate",
]

# A private method is a symbol like any other: privacy is a fact about the
# namespace, not a spelling or a visibility, so nothing marks it 'hidden'.
[[scenario.struct-methods.check]]
name = "private-method-keeps-its-symbol"
target = "symbols"
contains = ["define internal Account.fee comdat nodeduplicate"]
excludes = [" hidden "]

# A finalizer generates a function of its own. A struct whose field needs
# dropping gets a second, generated one named for the type, which calls the
# type's own finalizer and then the field's.
[[scenario.struct-methods.check]]
name = "finalizer-generates-a-drop-function"
target = "symbols"
contains = [
  "define internal Resource.final comdat nodeduplicate",
  "define internal Bundle.final comdat nodeduplicate",
  "define internal Bundle.drop comdat nodeduplicate",
]

[scenario.struct-operators]
category = "run"
description = "Every operator spelling a struct may declare as a method, and the symbol each reaches"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# One symbol per spelling, each reading back as the operator it was declared
# under: the arithmetic, comparison, bitwise and assignment operators, and the
# prefix and postfix increments as four distinct methods. The seven spellings
# struct-methods declares are pinned there. A spelling that reached another
# method, or two that shared a code, would print wrong or be missing here.
[[scenario.struct-operators.check]]
name = "operator-spellings-reach-their-own-symbols"
target = "symbols"
contains = [
  "define internal Num.* comdat nodeduplicate",
  "define internal Num./ comdat nodeduplicate",
  "define internal Num.% comdat nodeduplicate",
  "define internal Num.!= comdat nodeduplicate",
  "define internal Num.< comdat nodeduplicate",
  "define internal Num.<= comdat nodeduplicate",
  "define internal Num.> comdat nodeduplicate",
  "define internal Num.>= comdat nodeduplicate",
  "define internal Num.& comdat nodeduplicate",
  "define internal Num.| comdat nodeduplicate",
  "define internal Num.^ comdat nodeduplicate",
  "define internal Num.<< comdat nodeduplicate",
  "define internal Num.>> comdat nodeduplicate",
  "define internal Num.-= comdat nodeduplicate",
  "define internal Num.*= comdat nodeduplicate",
  "define internal Num./= comdat nodeduplicate",
  "define internal Num.%= comdat nodeduplicate",
  "define internal Num.&= comdat nodeduplicate",
  "define internal Num.|= comdat nodeduplicate",
  "define internal Num.^= comdat nodeduplicate",
  "define internal Num.<<= comdat nodeduplicate",
  "define internal Num.>>= comdat nodeduplicate",
  "define internal Num.++ comdat nodeduplicate",
  "define internal Num.-- comdat nodeduplicate",
  "define internal Num.+++ comdat nodeduplicate",
  "define internal Num.--- comdat nodeduplicate",
]

[scenario.struct-opaque]
category = "compile"
description = "An opaque struct, whose values cannot be created and are only reached by reference"
tags = ["parse", "nameres", "typecheck", "genllvm"]

[scenario.struct-fold]
category = "run"
description = "Names folded in from a field's type: selective, renamed, chained, 'use *' with 'but', through a reference-held field, satisfying a trait, and in a generic instance"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# No forwarder exists: a folded call reaches the field type's own method,
# spelled after the field's type, and nothing is spelled after the folding
# type for a folded name. The printed values say which receiver each call ran
# with; the symbols say no method was minted to get it there.
[[scenario.struct-fold.check]]
name = "no-forwarder-is-generated-for-a-folded-name"
target = "symbols"
contains = [
  "define internal Engine.thrust comdat nodeduplicate",
  "define internal Engine.power comdat nodeduplicate",
  "define internal Engine.rating comdat nodeduplicate",
]
excludes = [
  "Car.thrust", "Car.fuel", "Car.horsepower", "Car.power",
  "Plane.leftThrust", "Fleet.leftThrust", "Fleet.rightPower",
  "Hybrid.thrust", "Hybrid.rating", "Hybrid.fuel",
  "Bay.thrust", "Truck.power ",
  "Holder[Engine].fuel", "Holder[Engine].power",
]

# The one thing generated for a fold: a vtable slot a folded method fills
# holds a thunk, spelled after the type, the trait and the slot, which nothing
# in the language can name. The vtable itself is the type's, as for any
# implementer. Truck holds its engine second, so the thunk shifts the receiver
# by an offset; Bay holds it through a reference, so its thunk loads.
[[scenario.struct-fold.check]]
name = "vtable-slot-of-a-folded-method-holds-a-thunk"
target = "symbols"
contains = [
  "define internal Truck as Powered.power (thunk) comdat nodeduplicate",
  "define internal Bay as Powered.power (thunk) comdat nodeduplicate",
  "constant internal Truck as Powered (vtable) comdat nodeduplicate",
  "constant internal Bay as Powered (vtable) comdat nodeduplicate",
]

# The thunk's body is the shift and a tail call of the folded method
[[scenario.struct-fold.check]]
name = "thunk-tail-calls-the-folded-method"
target = "preir"
contains = ["tail call i32 @_CNvNt6Engine5power("]

# The run is the whole claim: each function's finalizer count is 0 or 1 (10
# for the '@move' struct) and a count of 2 or a count on a never-assigned
# variable is the defect. It cannot be read from the IR, because the drop call
# is inlined into its caller and a call that is not there is not a substring.
[scenario.struct-final-once]
category = "run"
description = "A finalizer runs once at the end of its value's life, and not over a variable that was never assigned or was moved out"
tags = ["flow", "genllvm", "runtime"]

[scenario.struct-extends]
category = "run"
description = "Enriching a concrete type with methods: the base's members through the new name, and a value crossing between the two names in both directions"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# The whole of 'extends' rests on one representation, and this is the only place
# it can be seen: every printed number would be the same whatever the layouts
# were. The enrichment declares no field of its own, the base's fields are its
# fields at the same positions, and that holds down a chain and across siblings.
# Read before optimization, where a type nothing mentions is not printed.
[[scenario.struct-extends.check]]
name = "an-enrichment-has-its-base-s-layout"
target = "preir"
contains = [
  "%Meter = type { i32, i32 }",
  "%Gauge = type { i32, i32 }",
  "%Labeled = type { i32, i32 }",
  "%Fancy = type { i32, i32 }",
  "%Framed = type { i32, i32 }",
  "%Ruler = type { i32, i32 }",
]

# A base's method is neither cloned nor re-spelled: the enrichment's name binds
# the base's own declaration, so there is one symbol for it however many types
# reach it. That is the difference between this and an inherited default, which
# trait-success pins as a copy per implementing type.
[[scenario.struct-extends.check]]
name = "a-base-method-is-not-cloned-per-enrichment"
target = "symbols"
contains = [
  "define internal Meter.scaled comdat nodeduplicate",
  "define internal Gauge.doubled comdat nodeduplicate",
]
excludes = ["Gauge.scaled", "Fancy.scaled", "Labeled.scaled", "Ruler.scaled"]

[scenario.struct-use-sibling]
category = "run"
description = "Folding a sibling enrichment's methods in with a type body's 'use', selectively and under spellings of its own"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# A sibling fold is an alias and nothing more: the sibling's own declaration is
# what the name binds to, so there is one symbol for a method however many types
# fold it in. That is the claim that separates this from an inherited trait
# default, which trait-success pins as a copy per implementing type, and a run
# cannot see it -- every printed number would be the same either way.
[[scenario.struct-use-sibling.check]]
name = "a-folded-method-is-not-cloned-per-folding-type"
target = "symbols"
contains = [
  "define internal Trig.sine comdat nodeduplicate",
  "define internal LogExp.logOf comdat nodeduplicate",
  "define internal Trig.cosine comdat nodeduplicate",
]
excludes = ["Rich.sine", "Fancy.sine", "Slim.cosine", "Rich.logOf", "Rich.wide", "Slim.near"]

# The fold is licensed by the shared base, and the base is what keeps every one
# of these types one representation -- which is why a sibling's method needs no
# receiver rewritten. Read before optimization, where a type nothing mentions is
# not printed.
[[scenario.struct-use-sibling.check]]
name = "every-sibling-shares-the-base-s-layout"
target = "preir"
contains = [
  "%Meter = type { i32, i32 }",
  "%Trig = type { i32, i32 }",
  "%LogExp = type { i32, i32 }",
  "%Rich = type { i32, i32 }",
  "%Fancy = type { i32, i32 }",
  "%Slim = type { i32, i32 }",
]

# The motivating case is enriching somebody else's type, so the pair is put on
# opposite sides of a module boundary: the base is resolved on demand from the
# other module's scope, and the enrichment still reads its private members. A
# compile, because a program spanning modules cannot be linked yet.
[scenario.struct-extends-import]
category = "compile"
description = "Enriching a base declared in another module, private members included"
tags = ["nameres", "typecheck", "genllvm"]

# -------- parse stage --------

[scenario.struct-parse]
category = "reject"
description = "Struct declaration syntax the parser cannot accept, and member names it cannot declare twice"
tags = ["parse"]
diagnostics = 16

[scenario.struct-parse-fold]
category = "reject"
description = "A fold clause written where none may be, and the shapes neither the field form nor the body form may take"
tags = ["parse"]
diagnostics = 17

# -------- name resolution stage --------

# A fold is expanded into the type's dictionary while the type is name
# resolved, so what a clause may admit is this stage's: visibility, a name
# the field's type has not got, a static, a collision, a cycle, and a source
# that is not a struct, or is a trait or an enum.
[scenario.struct-nameres-fold]
category = "reject"
description = "What a fold clause may not admit, and the names that collide"
tags = ["nameres"]
diagnostics = 15

# Taking a base's members is what builds the enriching type's dictionary, so what
# may be enriched and what an enrichment may declare are both this stage's: a
# field of its own, a name the base already has, an abstraction or an enum or a
# variant or a number as the base, a base carrying a lifecycle method, and the
# two shapes of cycle.
[scenario.struct-nameres-extends]
category = "reject"
description = "What may be enriched with 'extends', and what an enrichment may not declare"
tags = ["nameres"]
diagnostics = 10

# A sibling fold is expanded right after the base's members are taken, so what a
# body clause may name and what it may admit of it are both this stage's: a type
# with no base to share, a type whose base is a different one, the base itself or
# an ancestor, an abstraction or an enum, itself, a name the sibling lacks, a
# private one, one the sibling took from the shared base, a lifecycle method, the
# two collisions, and a cycle. Separate from struct-nameres-fold because the
# receiver is the difference between the two folds: a field's clause has one to
# find and shift, and a sibling's is already this type's by the shared base.
[scenario.struct-nameres-use-sibling]
category = "reject"
description = "What a type body's 'use' may name as a sibling, and what it may admit of one"
tags = ["nameres"]
diagnostics = 16

# -------- type check stage --------

[scenario.struct-typecheck-fold]
category = "reject"
description = "A folded field named in a type literal, or offered where a trait requires a field"
tags = ["typecheck"]
diagnostics = 2

# -------- flow stage --------

# Separate from the type-check scenarios because ErrorNoMut on an assignment is
# a data-flow diagnostic, and separate from struct-parse because that one is
# about which permissions may be written at all rather than what a legal one
# then governs.
[scenario.struct-flow-fieldperm]
category = "reject"
description = "A field's permission and its container's together govern whether the field may be written"
tags = ["flow"]
diagnostics = 4

[scenario.struct-typecheck-decl]
category = "reject"
description = "Struct declarations rejected for what they declare, including a field name with no self to reach it through"
tags = ["typecheck"]
diagnostics = 6

[scenario.struct-typecheck-nosize]
category = "reject"
description = "Declarations naming a type that cannot say how large it is"
tags = ["typecheck"]
diagnostics = 9

[scenario.struct-typecheck-construct]
category = "reject"
description = "Struct constructors that do not agree with the type's fields"
tags = ["typecheck"]
diagnostics = 6

[scenario.struct-typecheck-methods]
category = "reject"
description = "Method, field and operator accesses a struct's type cannot answer, including a private 'isTrue' a coercion to Bool injects a call to"
tags = ["typecheck"]
diagnostics = 21
