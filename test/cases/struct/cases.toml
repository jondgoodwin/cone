# struct - structs, method definition, operator methods, initializers and
# finalizers, delegated inheritance. Tier 1.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# The success program is split in two at the seam between what a struct holds
# and what it declares: struct_success builds and copies values and declares no
# method at all, so a failure there is about field layout; struct_methods calls
# every method and operator method and declares no field the call does not need.
# struct_operators is the rest of the operator-method table: struct_methods
# keeps the seven spellings whose meaning it explains, and struct_operators
# applies every other spelling once, so that the table of operator names and
# the symbol codes they lower to is pinned whole in one place. struct_opaque
# is a fourth success scenario and a 'compile' one, because an opaque type's
# values cannot be created and so nothing about it can run.
#
# struct_fold is the fifth success scenario: delegated inheritance, a field's
# 'use' clause folding members of its type in as names of the type that holds
# it. It is its own file because the fold's claims -- which receiver a folded
# call runs with, that no forwarder is generated, what a vtable slot a folded
# method fills holds -- are all about lowering, and its checks read the IR.
#
# struct_final_once is the sixth: when a finalizer runs. struct_methods pins
# that one runs at all and what a generated drop fn calls; this file pins that
# it runs exactly once, so its cases are the variables that must not be
# finalized -- never assigned, moved out -- beside the ones that must.
# struct_final_owners and struct_final_aggregates are beside it: what a death
# reaches rather than when it runs. The first pins that a struct held by value
# releases the owning references its fields hold, however deep, in the ruled
# order; the second that a tuple or an array of values that finalize or own
# dies with them, element by element, wherever it lives. Counting the holders a
# copy of such a value makes is the region group's (region_held_counted).
# struct_final_temporary is beside them too: when a value no variable holds
# dies -- a temporary, at the end of the statement, condition or operand that
# made it -- with the sole and counted owners it may be, since what a
# temporary is and when it dies is one question whatever its type.
#
# struct_extends is the seventh: enriching a concrete type with methods. It is
# its own file rather than part of struct_fold, because the two folds differ in
# exactly the thing each is for -- a field's clause reaches the part through a
# receiver it has to shift, and an enrichment is the whole and shifts nothing --
# so a failure in one says nothing about the other. Its claims are what the
# base's members reach through the new name, what the enrichment's own methods
# reach in the base, and that a value crosses between the two names in either
# direction. The one claim a run cannot make, that the two types have one LLVM
# layout, is a check below. Retroactive conformance is here too, although it
# dispatches through a virtual reference, because what it establishes is what
# 'extends' delivers rather than what a virtual reference reaches.
#
# struct_extends_lifecycle is beside it: enriching a base that declares 'final'
# or 'clone'. Separate because its claims are about a different mechanism --
# those two are copied into the enrichment with 'Self' retyped, where every other
# member is aliased -- and about a value's life rather than what a call reaches:
# that the base's finalizer runs once for a value typed as the enrichment, in
# what order beside its fields', and that 'clone' produces the enrichment.
#
# struct_use_sibling is the eighth: folding a SIBLING enrichment in with a type
# body's 'use'. It rests on struct_extends and is separate from it, because the
# two answer different questions -- that one pins what one base gives one
# enrichment, and this pins what several enrichments of one base give a type that
# names them. Its claims are which declaration a folded call reached, what a
# renamed or excluded name resolved to, and that a sibling's method reads the
# shared representation through a receiver nothing rewrote. The two claims a run
# cannot make -- that no method is copied per folding type, and that every type
# here has the base's layout -- are checks below.
#
# struct_privacy is the ninth: a type's own code reaching the private members
# of any value of the type, not only of 'self'. It is its own file because its
# claim is where privacy's boundary lies, which no other success file crosses;
# what stays outside the boundary is in struct_typecheck_methods.
#
# The reject scenarios are split by pipeline stage, because analysis halts
# between stages and an expectation from a later stage would never be reached.
# The type-check stage is split again by what is wrong: the declaration itself,
# a constructor, or a call. A fold clause gets one file per stage: where it may
# be written (parse), what it may admit (name resolution, which is where a
# type's dictionary is built), and what a folded name is not (type check).
# struct_nameres_extends is at that same middle stage and separate from
# struct_nameres_fold because its subject is the base rather than a clause:
# taking the base's members is what builds the enriching type's dictionary, so
# what may be enriched and what an enrichment may declare are both reported
# there. Where a base clause may be written at all is a stage earlier, and in the
# trait group, which owns the 'is' clause: trait_parse_extends. Reaching a
# private member of the base from outside the pair is type check's, and it sits
# with the rest of the visibility family in struct_typecheck_methods.
#
# Left out, with reasons:
#
# - A 'clone' method as the reference describes it: its first parameter is
#   'self &new', which only an init may take. The name 'clone' is recognized
#   far enough to turn off the move-type inference a finalizer causes, but the
#   method it refers to cannot be declared that way. A method of another shape
#   may take the name, and struct_extends_lifecycle declares one to show what an
#   enrichment's copy of it returns; nothing calls it implicitly.
#
# - Field-by-field initialization of a struct declared without a value, or of
#   an init's self. Flow analysis tracks the whole value, so assigning every
#   field one at a time still leaves the variable uninitialized.
#   struct_success covers the whole value assignment that does work, and says
#   so; struct_flow_new refuses a field written before an init's self is
#   filled.
#
# Initializers -- construction, 'new T(...)', and the inits it runs -- are
# struct_new, struct_typecheck_new and struct_flow_new.

support = ["structmeter.cone"]

# -------- success --------

[scenario.struct_success]
category = "run"
description = "Struct fields: declaring, constructing, reading, changing and copying them, and defaults that are aggregates written in place (a construction by position, by name or nested, an array by its elements or a fill, a tuple), each value taking its own copy"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# Structs that reach themselves through a reference must survive into code
# generation rather than being flattened or dropped: each is a named struct
# whose reference field is a pointer, and Owner holds Held by value. LLVM's
# pointers carry no pointee, so the reference field is a bare 'ptr' and a
# type's own name no longer appears inside its body. Runtime cannot see the
# layout. Read before optimization: the functions that mention these types are
# folded into 'main' and deleted, and a type nothing mentions is not printed.
[[scenario.struct_success.check]]
name = "recursive-types-reach-code-generation"
target = "preir"
contains = [
  "%Node = type { i64, ptr }",
  "%Owner = type { i64, %Held }",
  "%Held = type { ptr }",
  "%Left = type { i64, ptr }",
  "%Right = type { ptr }",
]

# A global built from nested struct literals is one constant, every level of it
# and the nested default included, rather than code run to fill it in. Runtime
# reads the same fields either way.
[[scenario.struct_success.check]]
name = "nested-struct-literal-global-is-one-constant"
target = "preir"
contains = ["@route = internal constant %Segment { %Point { i32 21, i32 22, i32 23 }, %Point { i32 24, i32 25, i32 7 } }"]

# A type's static is a global owned by the type, spelled after it like a
# method, and not a field: the type's layout is unchanged by it.
[[scenario.struct_success.check]]
name = "static-is-a-global-owned-by-its-type"
target = "symbols"
contains = ["global internal Tally.made comdat nodeduplicate"]

[[scenario.struct_success.check]]
name = "static-is-not-a-field"
target = "preir"
contains = ["%Tally = type { i32 }"]

[scenario.struct_index_set_position]
category = "run"
description = "An index written to -- stored to whole or by field, changed in place, or a 'self &mut' method's receiver -- goes through the type's '&[]'"
tags = ["typecheck", "runtime"]

[scenario.struct_autoborrow]
category = "run"
description = "A method declaring 'self &' or 'self &mut' called on a value, which is borrowed: a local, a field path, a field through a reference, an index operator, a folded method, a generic type's methods, and a by-value candidate preferred"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.struct_methods]
category = "run"
description = "Methods, receivers, static functions, overloaded methods, operator methods and finalizers"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# Every method's symbol reads as its declaring type, then its own concrete
# name. That is what runtime cannot see: which candidate of an overload set a
# call reached shows up in what it computed, but whether a symbol exists at all
# does not.
[[scenario.struct_methods.check]]
name = "methods-lower-to-concrete-symbols"
target = "symbols"
contains = [
  "define internal Pair.sumValue comdat nodeduplicate",
  "define internal Pair.sumRef comdat nodeduplicate",
  "define internal Pair.sumOther comdat nodeduplicate",
  "define internal Scaler.scaleWide comdat nodeduplicate",
  "define internal Scaler.scaleCount comdat nodeduplicate",
  "define internal Maker.fromInt comdat nodeduplicate",
  "define internal Maker.fromFloat comdat nodeduplicate",
  "define internal Vec.addVec comdat nodeduplicate",
  "define internal Vec.addScalar comdat nodeduplicate",
]

# A call names its method in several ways -- on a value, on a reference,
# through 'self', bare inside a method, and through the type's name with the
# receiver as an argument -- and every one of them lowers to the same concrete
# symbol. The symbols say that the methods written to exercise those forms
# exist and that no form minted a symbol of its own; which candidate each
# reached is in the printed values.
[[scenario.struct_methods.check]]
name = "call-forms-reach-the-concrete-method"
target = "symbols"
contains = [
  "define internal Pair.viaBareNames comdat nodeduplicate",
  "define internal Pair.viaSelf comdat nodeduplicate",
  "define internal Pair.viaBareOverload comdat nodeduplicate",
]
excludes = ["Pair.sum ", "Pair.self", "self."]

# An overload name is not a declaration, so nothing is generated for it. A
# definition's name is followed by its COMDAT, so the trailing space is what
# stops 'Pair.sum' from matching 'Pair.sumValue'.
[[scenario.struct_methods.check]]
name = "no-symbol-for-method-overload-name"
target = "symbols"
excludes = ["Pair.sum ", "Scaler.scale ", "Maker.make ", "Vec.+ "]

# An operator method's concrete name is punctuation. The symbol spells it as a
# fixed code -- '+=' is 'opL' -- and it reads back as the operator itself.
[[scenario.struct_methods.check]]
name = "operator-method-symbols-read-as-the-operator"
target = "symbols"
contains = [
  "define internal Vec.- comdat nodeduplicate",
  "define internal Vec.+= comdat nodeduplicate",
  "define internal Vec.== comdat nodeduplicate",
  "define internal Vec.() comdat nodeduplicate",
  "define internal Vec.[] comdat nodeduplicate",
  "define internal Vec.<- comdat nodeduplicate",
  "define internal List.&[] comdat nodeduplicate",
]

# A name outside [A-Za-z0-9_] -- Unicode letters, or anything in backticks --
# is punycoded into the symbol and read back as written: a Unicode identifier
# bare, a backticked one in its backticks. This is the one place the encoder
# in conec and the demangler in the runner meet on a punycoded name, so it is
# where a disagreement between them would show.
[[scenario.struct_methods.check]]
name = "encoded-names-read-back-as-written"
target = "symbols"
contains = [
  "define internal Umlaut.größe comdat nodeduplicate",
  "define internal Umlaut.`a b` comdat nodeduplicate",
  "define internal Umlaut.`+ -` comdat nodeduplicate",
]

# A private method is a symbol like any other: privacy is a fact about the
# namespace, not a spelling or a visibility, so nothing marks it 'hidden'.
[[scenario.struct_methods.check]]
name = "private-method-keeps-its-symbol"
target = "symbols"
contains = ["define internal Account.fee comdat nodeduplicate"]
excludes = [" hidden "]

# A finalizer generates a function of its own. A struct whose field needs
# dropping gets a second, generated one named for the type, which calls the
# type's own finalizer and then the field's. It is named '-drop', which no
# plainly written method has, since 'drop' is an ordinary method name
# (struct_drop_method).
[[scenario.struct_methods.check]]
name = "finalizer-generates-a-drop-function"
target = "symbols"
contains = [
  "define internal Resource.final comdat nodeduplicate",
  "define internal Bundle.final comdat nodeduplicate",
  "define internal Bundle.`-drop` comdat nodeduplicate",
]

[scenario.struct_operators]
category = "run"
description = "Every operator spelling a struct may declare as a method, and the symbol each reaches"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# One symbol per spelling, each reading back as the operator it was declared
# under: the arithmetic, comparison, bitwise and assignment operators, and the
# prefix and postfix increments as four distinct methods. The seven spellings
# struct_methods declares are pinned there. A spelling that reached another
# method, or two that shared a code, would print wrong or be missing here.
[[scenario.struct_operators.check]]
name = "operator-spellings-reach-their-own-symbols"
target = "symbols"
contains = [
  "define internal Num.* comdat nodeduplicate",
  "define internal Num./ comdat nodeduplicate",
  "define internal Num.% comdat nodeduplicate",
  "define internal Num.!= comdat nodeduplicate",
  "define internal Num.< comdat nodeduplicate",
  "define internal Num.<= comdat nodeduplicate",
  "define internal Num.> comdat nodeduplicate",
  "define internal Num.>= comdat nodeduplicate",
  "define internal Num.& comdat nodeduplicate",
  "define internal Num.| comdat nodeduplicate",
  "define internal Num.^ comdat nodeduplicate",
  "define internal Num.<< comdat nodeduplicate",
  "define internal Num.>> comdat nodeduplicate",
  "define internal Num.-= comdat nodeduplicate",
  "define internal Num.*= comdat nodeduplicate",
  "define internal Num./= comdat nodeduplicate",
  "define internal Num.%= comdat nodeduplicate",
  "define internal Num.&= comdat nodeduplicate",
  "define internal Num.|= comdat nodeduplicate",
  "define internal Num.^= comdat nodeduplicate",
  "define internal Num.<<= comdat nodeduplicate",
  "define internal Num.>>= comdat nodeduplicate",
  "define internal Num.++ comdat nodeduplicate",
  "define internal Num.-- comdat nodeduplicate",
  "define internal Num.+++ comdat nodeduplicate",
  "define internal Num.--- comdat nodeduplicate",
]

[scenario.struct_opaque]
category = "compile"
description = "An opaque struct, whose values cannot be created and are only reached by reference"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# A reference never demands its target's layout. Each shape here compiled in
# one declaration order and was refused as a cycle in the other, so each is
# written in both, and run: the sizes, and the values read back through every
# layout, are what a short or missing layout would get wrong. A real by-value
# cycle, and the checks that read a target's layout still firing when the
# reference is written first, are struct_typecheck_layout_reference.
[scenario.struct_layout_reference_order]
category = "run"
description = "Laying out a reference does not lay out its target: two actors' handles held through owning references and Option, a variant's '&W' and 'So[W]' with W holding the enum, a ring of three owners, a function reference taking its holder's holder by value, a reference to an array of its holder's holder, and a raw pointer to a generic instance holding the pointer's holder, each in both declaration orders"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.struct_fold]
category = "run"
description = "Names folded in from a field's type: selective, renamed, chained, 'use *' with 'but', through a reference-held field, satisfying a trait, and in a generic instance"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# No forwarder exists: a folded call reaches the field type's own method,
# spelled after the field's type, and nothing is spelled after the folding
# type for a folded name. The printed values say which receiver each call ran
# with; the symbols say no method was minted to get it there.
[[scenario.struct_fold.check]]
name = "no-forwarder-is-generated-for-a-folded-name"
target = "symbols"
contains = [
  "define internal Engine.thrust comdat nodeduplicate",
  "define internal Engine.power comdat nodeduplicate",
  "define internal Engine.rating comdat nodeduplicate",
]
excludes = [
  "Car.thrust", "Car.fuel", "Car.horsepower", "Car.power",
  "Plane.leftThrust", "Fleet.leftThrust", "Fleet.rightPower",
  "Hybrid.thrust", "Hybrid.rating", "Hybrid.fuel",
  "Bay.thrust", "Truck.power ",
  "Holder[Engine].fuel", "Holder[Engine].power",
]

# The one thing generated for a fold: a vtable slot a folded method fills
# holds a thunk, spelled after the type, the trait and the slot, which nothing
# in the language can name. The vtable itself is the type's, as for any
# implementer. Truck holds its engine second, so the thunk shifts the receiver
# by an offset; Bay holds it through a reference, so its thunk loads.
[[scenario.struct_fold.check]]
name = "vtable-slot-of-a-folded-method-holds-a-thunk"
target = "symbols"
contains = [
  "define internal Truck as Powered.power (thunk) comdat nodeduplicate",
  "define internal Bay as Powered.power (thunk) comdat nodeduplicate",
  "constant internal Truck as Powered (vtable) comdat nodeduplicate",
  "constant internal Bay as Powered (vtable) comdat nodeduplicate",
]

# The thunk's body is the shift and a tail call of the folded method
[[scenario.struct_fold.check]]
name = "thunk-tail-calls-the-folded-method"
target = "preir"
contains = ["tail call i32 @_CNvNt6Engine5power("]

# The run is the whole claim: each function's finalizer count is 0 or 1 (10
# for the '@move' struct) and a count of 2 or a count on a never-assigned
# variable is the defect. It cannot be read from the IR, because the drop call
# is inlined into its caller and a call that is not there is not a substring.
[scenario.struct_final_once]
category = "run"
description = "A finalizer runs once at the end of its value's life, and not over a variable that was never assigned or was moved out"
tags = ["flow", "genllvm", "runtime"]

[scenario.struct_final_owners]
category = "run"
description = "A struct held by value releases the owning references its fields hold, two fields deep too, after its own final and its finalizing fields"
tags = ["flow", "genllvm", "runtime"]

[scenario.struct_final_aggregates]
category = "run"
description = "A tuple or a fixed-size array of values that finalize or own dies with them, element by element in order, wherever it lives"
tags = ["flow", "genllvm", "runtime"]

[scenario.struct_final_temporary]
category = "run"
description = "A temporary is finalized at the end of the statement that made it, newest first, or of the 'if' or 'while' condition or the right operand of 'and' or 'or' that made it: thrown away, a field read, read through, lent to a call, tested; a sole owner freed, hollow where its value moved out, a counted owner's count back to zero; nothing bound, passed by value or returned; and one a local's initializer borrows kept to the block's end"
tags = ["flow", "genllvm", "runtime"]

[scenario.struct_final_temporary_opassign]
category = "run"
description = "A temporary an operator changing its operand in place reaches through, '(*mk()).n += 1' or '(*mkBag()).v <- 8, 9', is finalized after the change, at the end of the operator's rewrite, not before the store"
tags = ["flow", "genllvm", "runtime"]

[scenario.struct_final_reassign]
category = "run"
description = "A value stored over is finalized as it is replaced -- a struct, a field, an element, a tuple, an enum, a parameter, in a loop, in a parallel assignment, through a reference -- on the paths where its holder holds it, and nothing is finalized where the holder, or the variable a field is part of, holds nothing"
tags = ["flow", "genllvm", "runtime"]

# A value too large to carry as one LLVM value is copied in memory wherever it
# is copied (generation.md, "Large aggregates"). A run, because the claim is
# that each copy is one -- the original and the copy are read after either
# changes -- and that a large value that finalizes still dies once and where it
# did; both builds, since a debug build's copies are the ones nothing
# optimizes away, and its instruction selection is what crashed on a copy of
# an Array[i8, 100000]. The checks pin that a copy is a memcpy, that a large
# argument is a pointer and a large result a slot, and that no large value is
# loaded, stored or built whole.
[scenario.struct_copy_large]
category = "run"
description = "A struct, array or tuple of more than 64 bytes is copied with llvm.memcpy, passed by pointer and returned through a slot: an initializer, an assignment, a swap, a left assignment, an argument, a result, a field, an element, a literal, an 'if', a tuple, 100,000 bytes; a large value that finalizes dies once where it did"
tags = ["genllvm", "runtime"]

[[scenario.struct_copy_large.run]]
name = "release"
options = []

[[scenario.struct_copy_large.run]]
name = "debug"
options = ["--debug"]

[[scenario.struct_copy_large.check]]
name = "a-large-copy-is-a-memcpy"
target = "preir"
contains = ["call void @llvm.memcpy.p0.p0.i64(ptr align 1 %b, ptr align 1 %a, i64 100000, i1 false)"]

[[scenario.struct_copy_large.check]]
name = "a-large-argument-is-a-pointer-and-a-large-result-a-slot"
target = "preir"
contains = [
  "define internal void @make(ptr noalias sret(%Big) %sret, i64 %0)",
  "define internal i64 @total(ptr noalias readonly captures(none) dereferenceable(8200) %0)",
  "define internal void @doubled(ptr noalias sret(%Big) %sret, ptr noalias readonly captures(none) dereferenceable(8200) %0)",
  "define internal %void @drop(ptr noalias readonly captures(none) dereferenceable(264) %0)",
]

[[scenario.struct_copy_large.check]]
name = "no-large-value-is-loaded-stored-or-built-whole"
target = "preir"
excludes = [
  "load %Big", "store %Big", "insertvalue %Big", "extractvalue %Big",
  "load %Pair", "store %Pair", "insertvalue %Pair",
  "load %Held", "store %Held", "insertvalue %Held",
  "load [100000 x i8]", "store [100000 x i8]",
  "phi %Big",
]

# A Cone function's aggregate result of 64 bytes or less returns in registers
# or through its caller's slot, never one register per field (generation.md,
# "Large aggregates"). A run, because each result must arrive whole: every
# field is read back, from a direct call, a method, a '&fn', a vtable slot, an
# 'if' and a result returned on; both builds, since a debug build keeps every
# coercion through memory. The checks pin each shape on the definition and the
# call, that an argument of 16 bytes keeps its own, and that no such result
# returns whole.
[scenario.struct_return_registers]
category = "run"
description = "A struct, array or tuple of 64 bytes or less returns as one vector (2 to 4 floats, 2 doubles), as an integer or two (any other of up to 16 bytes, but a pair of scalars), or through the caller's slot (17 to 64 bytes): directly, as a method, through a '&fn' and a vtable slot, from an 'if' and returned on"
tags = ["genllvm", "runtime"]

[[scenario.struct_return_registers.run]]
name = "release"
options = []

[[scenario.struct_return_registers.run]]
name = "debug"
options = ["--debug"]

[[scenario.struct_return_registers.check]]
name = "floats-return-as-one-vector"
target = "preir"
contains = [
  "define internal <4 x float> @v4(float %0)",
  "define internal <3 x float> @v3(float %0)",
  "define internal <2 x float> @v2(float %0)",
  "define internal <2 x double> @d2(double %0)",
  "define internal <4 x float> @arr4(float %0)",
  "define internal <3 x float> @tuple(float %0)",
  "define internal <4 x float> @_CNvNt6Square6corner(ptr %0)",
  "call <4 x float> @v4(float 1.000000e+00)",
  "call <4 x float> %viaFn",
]

[[scenario.struct_return_registers.check]]
name = "other-small-results-return-as-integers"
target = "preir"
contains = [
  "define internal i32 @rgb(i8 %0)",
  "define internal i64 @flags(i32 %0)",
  "define internal { i64, i64 } @mixed(i32 %0)",
  "call i32 @rgb(i8 10)",
  "call i32 %viaFnInt",
  "store { i64, i64 } zeroinitializer, ptr %agg",
]

[[scenario.struct_return_registers.check]]
name = "a-pair-of-scalars-and-the-arguments-keep-their-shape"
target = "preir"
contains = [
  "define internal %Pair @pair(i32 %0)",
  "define internal <4 x float> @_CNvNt2V46scaled(%V4 %0, float %1)",
]

[[scenario.struct_return_registers.check]]
name = "larger-results-return-through-the-callers-slot"
target = "preir"
contains = [
  "define internal void @m3(ptr noalias sret(%M3) %sret, float %0)",
  "define internal void @three(ptr noalias sret(%Three) %sret, i64 %0)",
  "define internal void @_CNvNt6Square3box(ptr noalias sret(%Three) %sret, ptr %0)",
  "call void @m3(ptr noalias sret(%M3) %agg",
  "call void %viaFnSlot",
]

[[scenario.struct_return_registers.check]]
name = "no-small-aggregate-returns-whole"
target = "preir"
excludes = [
  "ret %V4", "ret %V3", "ret %V2", "ret %D2", "ret [4 x float]", "ret %Rgb", "ret %Flags", "ret %Mixed",
  "ret %M3", "ret %Three", "call %V4", "call %Rgb", "call %M3", "call %Three",
]

# A struct argument of more than 16 bytes, holding more than two scalars, is
# passed as a pointer: to the caller's own storage where the permissions prove
# nothing can change it until the call returns, otherwise to a copy
# (generation.md, "Lending a place to a call"). A run, because a wrong lend is
# a miscompile that shows as a value: each callee here writes, or a later
# argument assigns or consumes, what its argument came from, and reads its
# parameter after; both builds. The checks pin the pointer the callee takes and
# reads in place, the lend of each place the rule allows, and the copy of each
# it refuses: a '&mut' route passed beside it, a global, a 'mut' slice's
# element, an assignment in a later argument, a place through a reference.
[scenario.struct_pass_lend]
category = "run"
description = "A struct of more than 16 bytes is passed as a pointer to its caller's storage where nothing can change it during the call (an 'imm' local, a field or element of one, a parameter, a local nothing borrows to write and no other argument assigns), and to a copy otherwise: a '&mut' route beside it, a global the callee writes, a 'mut' slice element beside the slice, an assignment in a later argument, an 'imm' reference whose owner a later argument consumes; a 'mut' parameter assigned, recursion, a parameter returned and stored, a '&fn', a vtable, a generic"
tags = ["genllvm", "runtime"]

[[scenario.struct_pass_lend.run]]
name = "release"
options = []

[[scenario.struct_pass_lend.run]]
name = "debug"
options = ["--debug"]

[[scenario.struct_pass_lend.check]]
name = "the-callee-takes-a-pointer-and-reads-it-in-place"
target = "preir"
contains = [
  "define internal i64 @digits(ptr noalias readonly captures(none) dereferenceable(24) %0)",
  "define internal float @m3sum(ptr noalias readonly captures(none) dereferenceable(36) %0)",
  "%v1 = load %Big, ptr %0, align 8",
  "define internal float @v4sum(%V4 %0)",
]

[[scenario.struct_pass_lend.check]]
name = "each-place-the-rule-allows-is-lent"
target = "preir"
contains = [
  "call i64 @sumImm(ptr %x)",
  "call i64 @fieldOf(ptr %inner)",
  "call i64 @depth(ptr %x, i64 3)",
  "call i64 @digits(ptr %0)",
  "call i64 @digits(ptr %y)",
  "call float @m3sum(ptr %mm)",
]

[[scenario.struct_pass_lend.check]]
name = "each-place-the-rule-refuses-is-copied"
target = "preir"
contains = [
  "call i64 @viaMut(ptr %agg",
  "call i64 @writesGlobal(ptr %agg",
  "call i64 @writeThenRead(ptr %agg",
  "call i64 @take(ptr %agg",
  "%v = alloca %Big",
  "store <4 x float>",
]
excludes = [
  "@viaMut(ptr %u", "@writesGlobal(ptr @glob", "@take(ptr %z", "@take(ptr %w", "@take(ptr %own",
]

# The same rule where every callee is in a package compiled on its own and
# linked: each call a real one, optimised, the caller's optimizer unable to
# see what the callee writes. Release only: what is tested is what the
# optimizer does with the pointer around a call it cannot see into.
[scenario.struct_pass_lend_link]
category = "run"
description = "Structs of more than 16 bytes passed to a package compiled on its own, optimised: an 'imm' local lent and lent on by a recursing callee, and copied where a '&mut' route is beside it, where it is a global the callee writes, where it is a 'mut' slice element beside the slice, and before a later argument assigns it; a 'mut' parameter assigned, a parameter returned"
tags = ["genllvm", "runtime"]
link = ["lendee/lendee.conebuild"]
include = ["include/lendee.cone"]

[[scenario.struct_pass_lend_link.check]]
name = "the-imm-local-is-lent-and-the-rest-copied"
target = "preir"
contains = [
  "6digits(ptr %x)",
  "5depth(ptr %x, i64 3)",
  "6viaMut(ptr %agg",
  "12writesGlobal(ptr %agg",
  "13writeThenRead(ptr %agg",
  "4take(ptr %agg",
]

[[scenario.struct_pass_lend_link.check]]
name = "the-package-takes-a-pointer-it-only-reads"
target = "preir"
object = "lendee"
contains = [
  "6digits(ptr noalias readonly captures(none) dereferenceable(24) %0)",
  "5depth(ptr noalias readonly captures(none) dereferenceable(24) %0, i64 %1)",
]

# 'drop' is an ordinary method name: a type the compiler gives a drop may
# declare a method named 'drop' too, and the two are distinct declarations
# with distinct symbols. Before, both were named 'drop' and the compile was
# abandoned as a compiler defect.
[scenario.struct_drop_method]
category = "run"
description = "A method named 'drop', declared beside the drop the compiler generates, is an ordinary method and not the finalizer: on a struct with a finalizing field and an owner, beside its own 'final', with the generated drop's own signature, on a generic's instance, on a type with nothing generated, on an enum's variant, as an enum's default, and as an enum's static function"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.struct_drop_method.check]]
name = "a-drop-method-beside-the-generated-drop"
target = "symbols"
contains = [
  "define internal Held.drop comdat nodeduplicate",
  "define internal Held.`-drop` comdat nodeduplicate",
]

[scenario.struct_extends]
category = "run"
description = "Enriching a concrete type with methods: the base's members through the new name, and a value crossing between the two names in both directions"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# The whole of 'extends' rests on one representation, and this is the only place
# it can be seen: every printed number would be the same whatever the layouts
# were. The enrichment declares no field of its own, the base's fields are its
# fields at the same positions, and that holds down a chain and across siblings.
# Read before optimization, where a type nothing mentions is not printed.
[[scenario.struct_extends.check]]
name = "an-enrichment-has-its-base-s-layout"
target = "preir"
contains = [
  "%Meter = type { i32, i32 }",
  "%Gauge = type { i32, i32 }",
  "%Labeled = type { i32, i32 }",
  "%Fancy = type { i32, i32 }",
  "%Framed = type { i32, i32 }",
  "%Ruler = type { i32, i32 }",
]

# A base's method is neither cloned nor re-spelled: the enrichment's name binds
# the base's own declaration, so there is one symbol for it however many types
# reach it. That is the difference between this and an inherited default, which
# trait_success pins as a copy per implementing type.
[[scenario.struct_extends.check]]
name = "a-base-method-is-not-cloned-per-enrichment"
target = "symbols"
contains = [
  "define internal Meter.scaled comdat nodeduplicate",
  "define internal Gauge.doubled comdat nodeduplicate",
]
excludes = ["Gauge.scaled", "Fancy.scaled", "Labeled.scaled", "Ruler.scaled"]

[scenario.struct_extends_lifecycle]
category = "run"
description = "Enriching a base that declares 'final' or 'clone': the base's finalizer runs once for a value typed as the enrichment, and 'clone' produces the enrichment"
tags = ["nameres", "typecheck", "flow", "genllvm", "runtime"]

# Where every other member of the base is aliased, 'final' and 'clone' are copied:
# each enrichment owns one, spelled after it, and so does every type down a chain
# and a type folding a sibling. The base's own is still one symbol of its own. A
# run cannot tell a copy from an alias, since the finalizer's output is the same.
[[scenario.struct_extends_lifecycle.check]]
name = "an-enrichment-owns-a-copy-of-the-lifecycle"
target = "symbols"
contains = [
  "define internal File.final comdat nodeduplicate",
  "define internal LoggedFile.final comdat nodeduplicate",
  "define internal AuditedFile.final comdat nodeduplicate",
  "define internal BothFile.final comdat nodeduplicate",
  "define internal Pt2.clone comdat nodeduplicate",
]

[scenario.struct_use_sibling]
category = "run"
description = "Folding a sibling enrichment's methods in with a type body's 'use', selectively and under spellings of its own"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# A sibling fold is an alias and nothing more: the sibling's own declaration is
# what the name binds to, so there is one symbol for a method however many types
# fold it in. That is the claim that separates this from an inherited trait
# default, which trait_success pins as a copy per implementing type, and a run
# cannot see it -- every printed number would be the same either way.
[[scenario.struct_use_sibling.check]]
name = "a-folded-method-is-not-cloned-per-folding-type"
target = "symbols"
contains = [
  "define internal Trig.sine comdat nodeduplicate",
  "define internal LogExp.logOf comdat nodeduplicate",
  "define internal Trig.cosine comdat nodeduplicate",
]
excludes = ["Rich.sine", "Fancy.sine", "Slim.cosine", "Rich.logOf", "Rich.wide", "Slim.near"]

# The fold is licensed by the shared base, and the base is what keeps every one
# of these types one representation -- which is why a sibling's method needs no
# receiver rewritten. Read before optimization, where a type nothing mentions is
# not printed.
[[scenario.struct_use_sibling.check]]
name = "every-sibling-shares-the-base-s-layout"
target = "preir"
contains = [
  "%Meter = type { i32, i32 }",
  "%Trig = type { i32, i32 }",
  "%LogExp = type { i32, i32 }",
  "%Rich = type { i32, i32 }",
  "%Fancy = type { i32, i32 }",
  "%Slim = type { i32, i32 }",
]

# A type that LENDS a body folds it in, 'use str via view': the methods of 'str'
# become the type's names, each called on the borrow the type's 'view' gives.
# Separate from struct_use_sibling, which folds in methods whose receiver is
# already the type's own by a shared base: here there is no shared base, and
# the receiver is rewritten to a call of the lending method. The claims are
# which receiver each folded call ran on -- through a value, a borrow, a unique
# and a counted owner -- that a name the type declares or leaves out by 'but' is
# its own, that a range borrowed from it is the lent body's slice and its
# operators compare the lent bytes, and that a literal becomes one through
# 'fromLiteral'. The folded method is the body's own declaration, never copied
# per lending type, which a check pins.
[scenario.struct_use_lend]
category = "run"
description = "Folding the body a type lends with 'use str via view': its methods through a value, a borrow, a unique and a counted owner; a name left out by 'but'; a range borrowed from the type; its operators; and a literal made one by 'fromLiteral'"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

[[scenario.struct_use_lend.check]]
name = "a-folded-method-is-not-cloned-per-lending-type"
target = "symbols"
excludes = ["Greeting.startsWith", "Greeting.find", "Greeting.trim", "Greeting.slice"]

# The body of a run-time length is lent the same way: 'use Array[i32] via view'
# folds the body's 'len', which also fills a trait's slot, through the thunk
# that lends the view and then calls the body's method on it.
[scenario.struct_use_lend_array]
category = "run"
description = "Folding the Array[i32] a type lends: its len as the type's own, through a static bound and through a virtual reference to a trait whose slot it fills"
tags = ["typecheck", "genllvm", "runtime"]

# The motivating case is enriching somebody else's type, so the pair is put on
# opposite sides of a module boundary: the base is resolved on demand from the
# other module's scope, and the enrichment still reads its private members. A
# compile, because a program spanning modules cannot be linked yet.
[scenario.struct_extends_import]
category = "compile"
description = "Enriching a base declared in another module, private members included"
tags = ["nameres", "typecheck", "genllvm"]

# The base's private finalizer comes across as a copy owned by the enrichment and
# generated in this module, which is what a value of it is finalized by here. A
# compile cannot run it; struct_extends_lifecycle runs one.
[[scenario.struct_extends_import.check]]
name = "a-finalizer-from-another-module-is-copied-here"
target = "symbols"
contains = ["define internal LoggedHandle.final comdat nodeduplicate"]

[scenario.struct_privacy]
category = "run"
description = "The code of a type's module reaching a private method or field through any value of the type -- a local, a parameter, a borrow written out, a by-value call, a field written -- from the type's own methods and static functions, a generic instance through another value of itself, another type's method, a function of the module, an anonymous function, a construction by position and by name, a private init and a field's default"
tags = ["typecheck", "runtime"]

# Construction, 'new T(...)', and the inits it runs: the implicit field-wise
# one and those a struct declares, which fill the value in place. Its own file
# because its claims are which init the arguments selected and where the value
# was built, which no other success file asks.
[scenario.struct_new]
category = "run"
description = "Construction by the implicit init (by position, by name, with a default, nested, of a struct holding a reference, in a global, an array and a generic) and by declared inits overloaded beside it, a declared init preferred where both take the arguments by position and the implicit one reached by name, filling a local or an allocation in place and a temporary where the value has no place yet"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

# A local's declaration hands a declared init the local's own memory: the
# call's self is the local's alloca, and no temporary is made for it. The run
# compares the addresses; this is the same claim read off the code.
[[scenario.struct_new.check]]
name = "declared-init-fills-the-local"
target = "preir"
contains = ["call %void @_CNvNt4Vec28ofLength(ptr %here, i32 6)"]

# -------- parse stage --------

[scenario.struct_parse]
category = "reject"
description = "Struct declaration syntax the parser cannot accept, and member names it cannot declare twice"
tags = ["parse"]
diagnostics = 18

[scenario.struct_parse_fold]
category = "reject"
description = "A fold clause written where none may be, and the shapes neither the field form nor the body form may take"
tags = ["parse"]
diagnostics = 18

# -------- name resolution stage --------

# A fold is expanded into the type's dictionary while the type is name
# resolved, so what a clause may admit is this stage's: visibility, a name
# the field's type has not got, listed or left out, a private name left out, a
# static, a collision, a cycle, and a source that is not a struct, or is a trait
# or an enum.
[scenario.struct_nameres_fold]
category = "reject"
description = "What a fold clause may not admit, and the names that collide"
tags = ["nameres"]
diagnostics = 16

# Taking a base's members is what builds the enriching type's dictionary, so what
# may be enriched and what an enrichment may declare are both this stage's: a
# field of its own, one that owns a resource included, a name the base already
# has, a 'final' of its own over the base's among them, an abstraction or an enum
# or a variant or a number as the base, and the two shapes of cycle.
[scenario.struct_nameres_extends]
category = "reject"
description = "What may be enriched with 'extends', and what an enrichment may not declare"
tags = ["nameres"]
diagnostics = 11

# A sibling fold is expanded right after the base's members are taken, so what a
# body clause may name and what it may admit of it are both this stage's: a type
# with no base to share, a type whose base is a different one, the base itself or
# an ancestor, an abstraction or an enum, itself, a name the sibling lacks, a
# private one listed or left out, one the sibling took from the shared base, a
# lifecycle method, the two collisions, and a cycle. Separate from struct_nameres_fold because the
# receiver is the difference between the two folds: a field's clause has one to
# find and shift, and a sibling's is already this type's by the shared base.
[scenario.struct_nameres_use_sibling]
category = "reject"
description = "What a type body's 'use' may name as a sibling, and what it may admit of one"
tags = ["nameres"]
diagnostics = 17

# The lend: 'use T via m'. The lending method m must be a method the type
# declares; T must be a struct other than the type itself; a name the type
# declares is its own, so the fold of it collides unless 'but' leaves it out; a
# name T has not got, listed or left out, is not a name to fold. Separate from
# struct_nameres_use_sibling, which needs a shared base, because the two folds
# admit different things of different types.
[scenario.struct_nameres_use_lend]
category = "reject"
description = "What a type body's 'use T via m' may lend: a method the type declares, the body of a struct that is not the type itself, no name left unfolded or missing"
tags = ["nameres"]
diagnostics = 8

# A pub field of a pub type is reached from outside the module, so a private
# type it names is refused, however the field's type names it. A private
# type's pub field, a parameter's and a public generic's instance are not.
[scenario.struct_nameres_pubfield]
category = "reject"
description = "A pub field of a pub type, a struct or an enum or its variant, whose type names a type private to the module: alone, borrowed, as a pointer, an array's element, a generic type, a type argument, or through an alias"
tags = ["nameres"]
diagnostics = 9

# -------- type check stage --------

[scenario.struct_typecheck_fold]
category = "reject"
description = "A folded field named in a type literal, or offered where a trait requires a field"
tags = ["typecheck"]
diagnostics = 2

# -------- flow stage --------

# What an init's 'self &new' may do: nothing before '*self = value' fills it
# on every path, no return before then, and nothing but reach through it after
[scenario.struct_flow_new]
category = "reject"
description = "An init's self read, written or called on before it is filled, an init that can return unfilled, and self passed or copied, which would let it outlive the init"
tags = ["flow"]
diagnostics = 6

# Separate from the type-check scenarios because ErrorNoMut on an assignment is
# a data-flow diagnostic, and separate from struct_parse because that one is
# about which permissions may be written at all rather than what a legal one
# then governs.
[scenario.struct_flow_fieldperm]
category = "reject"
description = "A field's permission and its container's together govern whether the field may be written"
tags = ["flow"]
diagnostics = 4

[scenario.struct_typecheck_decl]
category = "reject"
description = "Struct declarations rejected for what they declare, including a field name with no self to reach it through and a default that is not a constant: a sibling field, a reinterpreted global, a call, and a construction or an array holding a call"
tags = ["typecheck"]
diagnostics = 10

[scenario.struct_typecheck_member_module]
category = "reject"
description = "A field or method named like an imported module hides it inside its type: the module written in a method's signature, a field's default or a body is refused rather than crashing, the signature's refusal naming both fixes (rename the import, or reach the module through this module's own name), the module's own name where the import renamed it; a static function calling a method bare is refused; what a failed signature returns is not walked by flow"
tags = ["typecheck", "flow"]
diagnostics = 10

[scenario.struct_member_module_outside]
category = "run"
description = "A method named like an imported module is reached through a value, and outside its type the module's name is the module's"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.struct_typecheck_nosize]
category = "reject"
description = "Declarations naming a type that cannot say how large it is, two structs holding each other by value among them, and a body whose length a reference carries"
tags = ["typecheck"]
diagnostics = 14

# Its own file, beside struct_typecheck_nosize, because its subject is the
# order a reference's target is laid out in rather than the causes of a missing
# size: a real by-value cycle named type by type, and each check that reads a
# reference's target still firing with the reference written above it.
[scenario.struct_typecheck_layout_reference]
category = "reject"
description = "A by-value cycle through three structs and through an enum's variant, named type by type; and, with the reference written above its target, a key's borrow, an undeclared lifetime behind an owner, a condition and a Sendable refusal behind a reference, a function reference's and an array's unsized trait, a generic method in a vtable, an aliased array of a moving type copied, and a lock that does not fit its region"
tags = ["typecheck", "flow"]
diagnostics = 14

[scenario.struct_typecheck_construct]
category = "reject"
description = "Struct constructors that do not agree with the type's fields"
tags = ["typecheck"]
diagnostics = 4

[scenario.struct_typecheck_new]
category = "reject"
description = "Constructions refused: the bracket form, a type called, 'new' on what is not a struct, arguments no init or several declared inits take, an init called by name, an init filling self by position with itself, a declared init in a global, a finished value of the struct; and inits declared in a shape a construction cannot run, and '&new' anywhere but an init's self"
tags = ["typecheck"]
diagnostics = 20

[scenario.struct_typecheck_methods]
category = "reject"
description = "Method, field and operator accesses a struct's type cannot answer, including a private 'isTrue' a coercion to bool injects a call to, and a '&mut'-self method on an immutable variable; a private member reached from elsewhere in its module is not refused"
tags = ["typecheck"]
diagnostics = 21
