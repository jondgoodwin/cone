# each - the 'each' statement and iteration. Tier 2.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# 'while', 'break' and 'continue' belong to core and are covered there. What is
# here is 'each' itself: its header syntax, what it may iterate, how the loop
# variable is bound and scoped, and how 'break' and 'continue' behave inside one.
#
# 'continue' gets depth here rather than in core, and the reason is that it is
# 'each' that makes it hard: a range's rewrite ends the loop body with the step
# that advances its counter, so the jump has to carry a copy of that step or the
# loop cannot end. Nothing about that is visible in core's 'while'.
#
# Two lowerings are covered. The parser rewrites a numeric range into a counter
# and a 'while' (each_success, and its refusals), and type check builds the loop
# for anything else once it knows what the source is (eachLower): an array or a
# slice or a list, whose counted loop each_collections runs and
# compiler/c/doc/nodes/block.md ("Type check") describes, and a cursor, which it
# walks through its 'next'. The refusals are split by pipeline stage. That split is not
# cosmetic here: a header the parser cannot read produces no loop at all and
# nothing downstream ever sees it, and flow runs only on a program whose types
# are right.
#
# Left uncovered on purpose:
#
# - The '...' and '..' range operators the manual's old examples used. They are
#   not the operators parseEach looks for, so they take the path of any other
#   source and are refused as a value that cannot be walked.
# - An LLVM IR check. The sum of a list, an array, a slice and a range is
#   measured by compiler/c/doc/diagnostics/measuring.md's method, not asserted
#   here, since the suite asserts what a program prints and not how it is
#   optimised.
#
# ErrorNoLoop is core's for 'break' outside a loop; the instance claimed here is
# the other site that raises it, an 'each' in expression position, and it is the
# only one of the two whose message names 'each'.

support = []

# -------- success --------

[scenario.each_success]
category = "run"
description = "Range iteration: the four operators, 'by', loop variable scope, 'break' and 'continue'"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

[scenario.each_collections]
category = "run"
description = "Iteration over arrays, slices, lists and cursors: a variable a borrow of each item, two variables unpacking a pair, a cursor used where it stands or given by 'iter', and 'break', 'continue', labels and 'return' across loops over different sources"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

[scenario.each_library]
category = "run"
description = "What the library gives 'each' to walk: 'mutItems' and 'drain' of lists, arrays and slices (an item that moves out of the Option 'next' answers, finalized once on every way out of the loop), 'indexed', 'iter' and 'zip', code generic over cursors whose items move, and the cursors of text and the collections"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.each_chunks]
category = "run"
description = "'chunks(n)' and 'mutChunks(n)' of lists, arrays and slices walked by 'each': runs of n with a shorter last, n dividing the count, n of 1, n past the count (one run), an empty list (none); 'indexed()' numbering the runs; changing elements through a '&mut' run; len and split of the cursor as a ParallelIterable cut between runs; and 'indexed()' over a mutable slice giving '&mut' items, beside a read-only one"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.each_chunks_refused]
category = "reject"
description = "What chunks, mutChunks and indexed() refuse: writing a run 'chunks' gives, writing the item of 'indexed()' over a list or a read-only slice, and 'mutChunks' of a list that cannot be changed or a slice that is only read"
tags = ["typecheck"]
diagnostics = 5

[scenario.each_chunks_zero]
category = "run"
description = "'chunks(0)' is a panic naming the line of its call, after the loop over runs of 2 before it ran"
tags = ["genllvm", "runtime"]
program_exit = "abort"

[scenario.each_chunks_zero_mut]
category = "run"
description = "'mutChunks(0)' is a panic naming the line of its call, on a list (which hands its caller's line on) after an array's runs of 3 ran"
tags = ["genllvm", "runtime"]
program_exit = "abort"

[scenario.each_zip_arrays]
category = "run"
description = "'zip' over arrays and slices: an array beside a list and beside another array or itself, either order, two slice parameters, a slice beside a list, part of an array, an empty slice, and element types that differ, each ending with the shorter"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.each_operand_readthrough]
category = "run"
description = "A borrow read through on both sides of an operator: sums and products with the borrow on either side or both, compound assignment, comparisons against a value on either side and between two borrows (the values, not the places), a '&mut' borrow, a plain struct's operators, and an operator declared for references taking the borrows as they are"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.each_mut_source_ok]
category = "run"
description = "What stays allowed beside the refused '&mut src' source: 'each x in &src' reads, 'src.mutItems()' changes a list, an array and a slice in place, and an entry of '<-' copies from a '&' borrow"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

# -------- parse stage --------

[scenario.each_parse]
category = "reject"
description = "'each' headers the parser cannot read"
tags = ["parse"]
diagnostics = 12

[scenario.each_mut_source]
category = "reject"
description = "An 'each' over a source written '&mut src', for a list, an array, a slice, a field, in a statement, in a 'parallel each' and in an entry of '<-': refused with the message to write 'src.mutItems()'"
tags = ["parse"]
diagnostics = 7

# -------- name resolution stage --------

[scenario.each_nameres]
category = "reject"
description = "The loop variable named outside the scope 'each' gives it"
tags = ["nameres"]
diagnostics = 2

# -------- type check stage --------

[scenario.each_typecheck]
category = "reject"
description = "Range bounds, element types and 'by' steps that do not agree, and a write to the loop variable"
tags = ["typecheck"]
diagnostics = 8

[scenario.each_source]
category = "reject"
description = "What an 'each' cannot walk and what its variables cannot be given: a source with no items, a 'next' that answers no Option, an 'iter' with no cursor, variables that do not unpack the item, an item that moves unpacked into several variables, a write to a pass's variable, a cursor that cannot be advanced"
tags = ["typecheck"]
diagnostics = 13

# -------- flow stage --------

[scenario.each_flow]
category = "reject"
description = "Borrows an 'each' holds: the source changed while it is walked, an item kept past the source or returned from the function owning it, a borrowed array across an 'await'"
tags = ["flow"]
diagnostics = 5

[scenario.each_library_typecheck]
category = "reject"
description = "What the library's walks refuse at type check: 'mutItems' of a slice that is only read or a list that cannot be changed, and writing through the borrow a plain 'each' gives"
tags = ["typecheck"]
diagnostics = 3

[scenario.each_library_flow]
category = "reject"
description = "What the library's walks keep borrowed: a list pushed to or used while 'drain' or 'mutItems' walks it, and a value taken out of the Option a call answers taken a second time"
tags = ["flow"]
diagnostics = 4

[scenario.each_loopctl]
category = "run"
description = "Loop control: a header filter over ranges, arrays, lists, cursors and pairs; a trailing 'if' on 'break', 'continue' and 'return'; 'each' and 'while' with an 'else' as values, over a range (a type's extremes too), a list, a cursor, with an 'else' that returns, breaks or continues the loop around, and one that owns what it drops; in a generic function and in a generator"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

[scenario.each_loopctl_parse]
category = "reject"
description = "Loop control the parser refuses: a trailing 'if' where none belongs, a loop used as a value with no 'else', an 'else' on a loop that cannot run out"
tags = ["parse"]
diagnostics = 4

[scenario.each_loopctl_nameres]
category = "reject"
description = "A loop's 'else' is outside the loop: it cannot name the loop's variables, and a 'break' in it needs a loop around"
tags = ["nameres"]
diagnostics = 3

[scenario.each_loopctl_typecheck]
category = "reject"
description = "A loop's value is one type, and a 'break' with no value gives none"
tags = ["typecheck"]
diagnostics = 2

[scenario.each_operand_readthrough_typecheck]
category = "reject"
description = "What an operator still refuses to read through a borrow: a String or a struct that moves, an operator taking its other operand by value, two number types that differ"
tags = ["typecheck"]
diagnostics = 7
