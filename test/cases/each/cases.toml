# each - the 'each' statement and iteration. Tier 2.
#
# Key reference: design/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# 'while', 'break' and 'continue' belong to core and are covered there. What is
# here is 'each' itself: its header syntax, what it may iterate, how the loop
# variable is bound and scoped, and how 'break' and 'continue' behave inside one.
#
# 'continue' gets depth here rather than in core, and the reason is that it is
# 'each' that makes it hard: the rewrite ends the loop body with the step that
# advances the loop variable, so the jump has to carry a copy of that step or the
# loop cannot end. Nothing about that is visible in core's 'while'.
#
# The failure scenarios are split by pipeline stage. That split is not cosmetic
# here: 'each' is a parser rewrite, so a header the parser cannot read produces
# no loop at all and nothing downstream ever sees it.
#
# Left uncovered on purpose:
#
# - The behavior of iterating anything that is not a range.
#   conesite/public/coneref/refeach.html documents a collection iterator
#   ('each x in [4, 3, 8, 2]'), an index-and-value form ('each i, x in slice')
#   and a closure iterator, and its own note at the top says only the numeric
#   range operators are implemented. So there is no behavior to cover: the
#   rejection is the whole of it, and each-parse.cone asserts that rejection as
#   ErrorNotIterable. The index-and-value form fails earlier and differently --
#   the parser wants 'in' where the comma is -- and is covered there as
#   ErrorBadTok.
# - The '...' and '..' range operators the manual's examples use. They are not
#   the operators parseEach looks for, so they take the non-range path above and
#   would only re-assert ErrorNotIterable under a different spelling.
# - An LLVM IR check. The rewrite produces no symbol of its own -- no iterator
#   object, no call to an 'iter' method -- so there is nothing in the IR that
#   the printed arithmetic does not already establish.
#
# ErrorNoLoop is core's for 'break' outside a loop; the instance claimed here is
# the other site that raises it, an 'each' in expression position, and it is the
# only one of the two whose message names 'each'.

support = []

# -------- success --------

[scenario.each-success]
category = "run"
description = "Range iteration: the four operators, 'by', loop variable scope, 'break' and 'continue'"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# -------- parse stage --------

[scenario.each-parse]
category = "reject"
description = "'each' headers the parser cannot turn into a loop, and iterators it cannot loop over"
tags = ["parse"]
diagnostics = 9

[[scenario.each-parse.unlocated]]
code = "ErrorNoLoop"
message = "each may not be used as an expression"

# -------- name resolution stage --------

[scenario.each-nameres]
category = "reject"
description = "The loop variable named outside the scope 'each' gives it"
tags = ["nameres"]
diagnostics = 2

# -------- type check stage --------

[scenario.each-typecheck]
category = "reject"
description = "Range bounds, element types and 'by' steps that do not agree"
tags = ["typecheck"]
diagnostics = 4
