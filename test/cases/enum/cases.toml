[scenario.enum_flow_trait_pattern]
category = "reject"
description = "The virtual reference a trait pattern binds is a reference into a variant: through a '&mut' or '&' it is refused after a call handed the enum, another name for it, a store over it, or a call through the reference itself that is mutable (its type is hidden), at the use that is stale, and fine when not used after, on the function's own local, or through 'imm' or 'uni'; and it may not be returned past what it borrows"
tags = ["flow"]
diagnostics = 6

[scenario.enum_trait_pattern_link]
