[scenario.enum_method_receiver_generic]
category = "run"
description = "A generic enum's method whose receiver names the enum with its type arguments ('self: Opt[T]', '&Opt[T]', '&mut Opt[T]', and the bare '&Opt') is one function over the whole enum, not inline, called on an enum's value and a variant's; an enum with two parameters the same; a generic method whose receiver names the enum is one function too, reached from a variant's value, in a generic enum and a plain one"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

[scenario.enum_typecheck_method_receiver_generic]
