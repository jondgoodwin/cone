description = "A trait pattern on an enum, 'case imm m Measured': it matches every variant that complies with the trait, counts toward exhaustiveness, and binds a virtual reference built from the variant, called through its vtable; a '&mut' matched gives a writable one; with a guard, '|', in a bound 'if', let-else and by elimination; a test with no binding on a value; a marker trait is nominal; pinned tag values; an enum that names the trait itself"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

[scenario.enum_trait_pattern_forms]
category = "run"
description = "Trait patterns beyond a plain enum: an enum that extends another, a generic enum, a generic trait's instance, a pattern written as the virtual reference, a 'var' binding, an 'if' chain written with 'is' (a test naming several variants narrows as they do, and by elimination), a loop, a macro's expansion, and an owner or an enum laid out as a pointer, which a trait pattern can test but not bind"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.enum_typecheck_trait_pattern]
category = "reject"
description = "What a trait pattern on an enum refuses: a variant after the trait that names it, a trait after its variants, the same trait twice, an 'else' after everything is covered, the variants a trait leaves out uncovered; a trait no variant complies with (a method over the whole enum is no variant's); a trait pattern that binds where the matched value is a value, an owner, or the pattern is written as a plain reference; a read-only matched reference calling what writes; an open trait"
tags = ["typecheck"]
