[scenario.enum_method_receiver]
category = "run"
description = "An enum's method whose receiver names the enum ('self &Lamp', '&mut Lamp', by value 'self Lamp') is one function over the whole enum, where 'match self' and 'self is Red' work, called on an enum value and on a variant's value; 'self &' and 'self &Self' are still copied into each variant; a variant's own method of the same name is what a variant-typed value calls"
