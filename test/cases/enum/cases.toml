# enum - the closed family, Option, Result, pattern matching. Tier 1.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# An enum is a closed set of variants whose layout the compiler owns: a
# discriminant, the common fields spliced into every variant, and -- unless the
# declaration writes '@unsized' -- padding to one size. So this group's subject is
# declaring one in both of its forms, constructing a variant, reading the fields
# the variants share, comparing for equivalence, and recovering the variant by
# matching. A requirement on the enum, a virtual reference and the dispatch
# through it are trait's, and appear here only as far as having something to match
# on requires.
#
# The two forms are one construct and are covered in one success program, because
# what makes them one is exactly what needs asserting: a bare name is an empty
# struct variant, so the plain set of named symbols is the payload-carrying form
# with the payloads left out. Splitting them would test the same parser and the
# same layout twice and still not say that they are one thing.
#
# The reject scenarios are split by pipeline stage, because analysis halts between
# stages and a later stage's expectation would never be reached. Within each stage
# they are split again by sub-family:
#
# - The parse ones: enum_parse_decl is about the declaration's head -- what may
#   modify it, and that it declares variants at all -- while enum_parse_blocks is
#   about its body, and enum_parse_patterns about a pattern binding's shape.
#   enum_parse_decl is separate because each of its diagnostics is at the top
#   level, where recovery from one reaches the next declaration.
# - The type-check ones: by whether the match, the pattern's target type, the
#   enum/variant type relationship, the discriminant, or what '@unsized' gives up
#   is what rejects the code.
#
# enum_typecheck_unsized carries four uses of ErrorNoSize side by side rather than
# one per file, per "One diagnostic's whole story": the cause and the remedy are
# the same at every site, so what a reader checks is that each site says so.
#
# Extending an enum has a success program of its own, enum_extends, because what
# it claims is about two enums at once: the extension's copies of its base's
# variants, and that each of the two lays out its own set. It is refused at three
# stages and so covered at three: what such an enum's body may declare is parse's,
# what it may extend and which names it may declare is name resolution's, and that
# neither enum's values are the other's is type check's. The type-check one pins
# membership in both directions:
# the discriminant is one shared node and the common fields are clones, so a
# structural test would otherwise let a variant of either pass as the other. A
# generic enum on either side of the clause is covered beside the rest -- in the
# success program, what it may be written as in the name-resolution file, and
# membership in the type-check file -- since it is the same relationship, made
# per instance. So is a chain, an extension of an extension, plain and generic:
# each level copies the one below it, which the success program pins. And so are
# an extension's own methods and static functions: a method with a body is cloned
# into every variant of the extension's set, its copies of the base's included, so
# the success program calls one on a copy, on an added variant and on the
# extension's value, plain, generic and down a chain; what cannot be given to a
# copy is refused at parse; and a name the base already has, at name resolution.
# Inside an extension's braces its bases' names are bare, as its own are, so the
# success program names a base's statics, static functions, overload names,
# methods and common field bare from the extension's methods and from the variants
# it adds -- plain, generic, of an instance, generic over plain, and down plain,
# generic and mixed chains -- beside a variant's own name winning over a base's.
#
# When a value typed as an enum dies has a run program of its own, enum_final:
# every place such a value lives, the order an enum's own 'final' runs in beside
# a variant's, and matching by value, which is the one place a variant and the
# enum value it came from are two names for one value. What the drop releases of
# the owning references a variant holds is region's, region_enum_owner; that a
# variant which moves makes its enum move is move's, move_flow_infection.
#
# Comparing two values of an enum whose variants carry fields -- the tags, and then
# the variant's own '==' -- has a run program of its own, enum_payload_equality,
# and its refusals (a variant declaring no '==') are enum_typecheck_payload_eq.
#
# Left out, with reasons:
#
# - The match patterns guide-conditionals.html still marks as not implemented: partial and
#   first-class patterns. A condition as a pattern ('not b', 'n > 3') is refused,
#   and enum_parse_patterns holds its refusal.

support = []

# -------- success --------

[scenario.enum_success]
category = "run"
description = "Enum declaration in both forms, variant construction, common members, a generic enum's static function, equivalence, every form of match built -- a value alone (a literal, a constant, a bool, a field, a string against a slice, a variant named bare), comparison, range and '|' patterns and 'if' guards among them -- a variant named through its enum or folded in with 'use', a variant bare in a pattern, looked up in the matched value's enum, and every name of an enum bare inside its braces, a variant's body included -- a generic enum's variant and an extension's copy among them, and a generic enum's own name and its variants' names meaning this instance's"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# Debug too: a variant literal passed by value is built in a temporary, and
# taking one moved the builder to the entry block's allocas, dropping its debug
# location, so the call after it had none, which the verifier refuses in a
# function with debug info
[[scenario.enum_success.run]]
name = "release"
options = []

[[scenario.enum_success.run]]
name = "debug"
options = ["--debug"]

# The discriminant's width follows the largest tag VALUE rather than the variant
# count, which runtime cannot see: three variants laid out in one byte and four
# laid out in four print the same lines. So it is asserted here, in the types
# generation wrote. PhoneType numbers ascending from zero and fits a byte; Colors
# pins 0xFF0000 and needs four, which is also the width it declared; Wide declared
# no type, and its two variants would fit a byte but its pinned 0x100 widens the
# tag to two. Packet declined the padding, so its variants keep their own sizes
# where Shape's are all padded to the largest.
[[scenario.enum_success.check]]
name = "tag-width-follows-the-largest-value"
target = "preir"
contains = ["%PhoneType = type { i8 }", "%Colors = type { i32 }", "%Wide = type { i16 }"]

# The same from the negative side and past 32 bits, which the run sees only as
# values read back: Offset declared no type and holds -2, so its tag is one signed
# byte; Outcome declared i32 and holds -1000000000; Huge declared u64, and Vast
# declared nothing but pins 0x1FFFFFFFF, so both are eight bytes -- a tag cut to
# 32 bits was the defect this pins.
[[scenario.enum_success.check]]
name = "negative-and-64-bit-tags-set-the-width"
target = "preir"
contains = ["%Offset = type { i8 }", "%Outcome = type { i32 }", "%Huge = type { i64 }", "%Vast = type { i64 }"]

[[scenario.enum_success.check]]
name = "unsized-enum-variants-are-not-padded"
target = "preir"
contains = ["%Ping = type { i8, i32 }", "%Payload = type { i8, i32, i64, i64, i64 }"]

# An enum value is loaded, stored and passed as a first-class LLVM value, which
# does not carry its type's padding bytes. So the enum's own type is its own
# fields and then bytes, never a copy of one variant's layout: Flag's bool and u8
# sit at bytes 1 and 2, where Count has padding before its i32. And the size
# every variant is padded to is rounded up to the strictest variant alignment:
# Tally, the largest at ten bytes, is byte-aligned and Count is not, so all three
# are twelve. The run prints the fields back; this pins the layout that keeps them.
# Where every variant with something in some bytes has the same scalar there, the
# enum's type names that scalar and not bytes (enum_payload_scalars says why).
# Cell's, by byte: 1 is Flag's bool beside Tally's u8, so bytes; 2 is Flag's u8
# and Tally's u8, so an i8; 3 is Tally's alone, an i8; 4 to 7 are Count's i32
# over four of Tally's u8s, so bytes; 8 and 9 are Tally's alone, two i8s; 10 and
# 11 are padding.
[[scenario.enum_success.check]]
name = "an-enum-type-has-no-padding-a-variant-uses"
target = "preir"
contains = [
  "%Cell = type { i8, [1 x i8], i8, i8, [4 x i8], i8, i8, [2 x i8], [0 x i32] }",
  "%Flag = type { i8, i1, i8, [9 x i8] }",
  "%Count = type { i8, i32, [4 x i8] }",
  "%Tally = type { i8, i8, i8, i8, i8, i8, i8, i8, i8, i8, [2 x i8] }",
]

# Which vtable a tag names is looked up two ways, and the run cannot see which:
# both reach the right implementation, which is the point. Signals pins 0x10 and
# 0x2000, so the tag is not an index into a two-entry list and the selection has to
# compare -- asserted as the 'select' it emits, against the constant 8192, before
# the optimizer folds the dispatch away.
[[scenario.enum_success.check]]
name = "sparse-tags-select-a-vtable-by-comparison"
target = "preir"
contains = ["icmp eq i32 %tag, 8192", "%vtablefortag = select i1"]

[scenario.enum_variant_forms]
category = "run"
description = "A variant declared as a type ('Number(i64);') beside a struct variant and a bare name in one enum, each arm's binding following its own variant's declaration; bound through a value, a borrow and a bound 'if', with a guard, as a copy, a move that finalizes once and a borrow of a reference; in a generic enum, an extension and with a pinned tag; and core's Option and Result"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

[[scenario.enum_variant_forms.run]]
name = "release"
options = []

[[scenario.enum_variant_forms.run]]
name = "debug"
options = ["--debug"]

# A variant declared as a type is laid out as a struct variant of one field is,
# so the nullable-pointer optimization sees it too: 'Held', an empty variant and
# one holding a reference, is the bare pointer (runtime cannot see that), with no
# struct emitted for the enum or either variant
[[scenario.enum_variant_forms.check]]
name = "type-variant-nullable-ptr-has-no-tag-and-no-struct"
target = "preir"
contains = ["%h = alloca ptr, align 8"]
excludes = ["%Held", "%Some1", "%Nothing"]

[scenario.enum_nullable_ptr]
category = "run"
description = "The untagged nullable-pointer layout, the Option[&T] shape, and every use of it"
tags = ["typecheck", "genllvm", "runtime"]

# The layout is the subject, and runtime cannot see it: a tagged enum of the
# same shape would print exactly the same lines. So the representation is
# asserted here, in the locals 'main' holds a Maybe and an Option[&i32] in,
# before the optimizer promotes them. Each is one bare pointer, which is the
# whole optimization, and none of the enum's or its variants' struct types is
# emitted at all -- neither a tag nor a wrapper exists.
[[scenario.enum_nullable_ptr.check]]
name = "nullable-ptr-has-no-tag-and-no-struct"
target = "preir"
contains = ["%some = alloca ptr, align 8", "%opt = alloca ptr, align 8"]
excludes = ["%Maybe", "%Just", "%Nothing", "%Some", "%Option"]

# The same layout when the reference is two words. Its null test compared the
# pointer word against a null of the whole fat type, which the verifier
# refused, so this scenario did not compile under '--verify'.
[scenario.enum_nullable_fat_ptr]
category = "run"
description = "The untagged nullable-pointer layout when the reference is a slice or a virtual reference: a slice of bytes, of i64, a virtual reference and Option of a slice, each variant read back by every form of match, an empty slice read as the word variant, and a struct holding a slice in a variant, tagged, beside them"
tags = ["genllvm", "runtime"]

# Runtime cannot see the layout, so it is asserted: each enum is the fat
# reference alone, no enum or variant struct emitted, and the variant is told
# by its pointer word against a null of the pointer's own type
[[scenario.enum_nullable_fat_ptr.check]]
name = "fat-nullable-ptr-has-no-tag-and-tests-the-pointer-word"
target = "preir"
contains = ["%tok = alloca { ptr, i64 }", "%some = alloca { ptr, i64 }", "%has = alloca %\"Shape:Vtable.0\"", "icmp ne ptr %ptr, null"]
excludes = ["%Tok =", "%Word =", "%Nums =", "%Have =", "%Held =", "%Has ="]

# The same-size layout of an enum instance whose variant holds a struct that
# reaches the enum back through an owning reference, which generation laid out
# as its tag alone while it generated reference targets inside the struct
# holding them. The sizes are what is claimed, and the allocation written and
# read back through them is what the short layout corrupted.
[scenario.enum_layout_cycle]
category = "run"
description = "An enum instance laid out whole when its variant holds a struct reaching the enum back through an owning reference: Option[A], A holding 'Uni[AState]', AState holding Option[A]"
tags = ["genllvm", "runtime"]

# An enum's payload is laid out in the scalars its variants agree on, bytes where
# they do not, and a run cannot tell the two apart. Wide's variants agree on an
# i64 at byte 8 and Two has a second at byte 16; Num's One and Two put an i64 and
# an f64 in the same bytes, so those stay bytes (with the zero-length array for
# the 8-byte alignment); Mixed's variants agree on an i32 at byte 4 and put an i32
# and an f32 at byte 8, an i32 and then four bytes; Option[i64] is a tag, seven
# bytes and an i64 where it was fifteen bytes.
[scenario.enum_payload_scalars]
category = "run"
description = "An enum payload laid out in the scalars its variants agree on and bytes elsewhere: every variant's value read back after a copy, a call and a return from a branch, for variants that agree, variants that share bytes with a different type, and Option of an i64, a bool and an Option; and a struct and an Option returned from an inlined function and carried round a loop"
tags = ["genllvm", "runtime"]

[[scenario.enum_payload_scalars.check]]
name = "a-payload-is-the-scalars-its-variants-agree-on"
target = "preir"
contains = [
  "%Wide = type { i8, [7 x i8], i64, i64 }",
  "%Num = type { i8, [15 x i8], [0 x i64] }",
  "%Mixed = type { i8, [3 x i8], i32, [4 x i8] }",
  "= type { i8, [7 x i8], i64 }",
  "= type { i8, [7 x i8], i8, [7 x i8], i64 }",
]
excludes = ["%Wide = type { i8, [15 x i8]", "%Mixed = type { i8, [11 x i8]"]

# The optimizer sees each loop's trips whole as well: a value returned from an
# inlined function that is merged through a slot and not an aggregate phi.
[[scenario.enum_payload_scalars.check]]
name = "an-inlined-result-is-not-merged-in-an-aggregate-phi"
target = "preir"
contains = ["%merge = alloca %Got", "%merge = alloca %Option"]
excludes = ["phi %Got", "phi %Option"]

[scenario.enum_payload_equality]
category = "run"
description = "'==' and '!=' on enums whose variants carry fields: the tags are compared, then the variant's own '==' (by value or by reference) on the two payloads, and a variant carrying nothing is equal by its tag alone -- same variant and payload, same variant and a payload that differs in each field, different variants in both orders, the empty variant; variables, call results, parameters and references as operands; a mix of empty and non-empty variants; a payload that is itself an enum; a field the variants have in common; a generic enum's instance; an enum that moves, whose operands are not moved; an enum laid out without a tag, a private '==', an extension's copies and added variants; and two slices of them, compared element by element"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# Debug too, as enum_success: the comparison is a function the compiler builds
[[scenario.enum_payload_equality.run]]
name = "release"
options = []

[[scenario.enum_payload_equality.run]]
name = "debug"
options = ["--debug"]

# The comparison is a function the compiler gives the enum, defined in the object
# of the package that declares it and called from the program that imports it
# (the enum's variants and their '==' are all the include file carries). q's
# private '==' of a variant is reached by q's own comparison, so the program
# never names it. Its generic enum's instance is the program's own.
[scenario.enum_payload_equality_link]
category = "run"
description = "An enum with variants that carry fields, declared in a package compiled on its own, compared by a program linked with it: the package's comparison is called, a variant's private '==' is reached through it, and a generic enum's instance is made by the program"
tags = ["genllvm", "runtime"]
link = ["q/q.conebuild"]
include = ["include/q.cone"]

# q defines the comparison of its Shape and the program only declares it, while
# the program defines its own copy of the generic enum's, shared with any other
# object that makes the same instance
[[scenario.enum_payload_equality_link.check]]
name = "the-program-declares-q's-comparison"
target = "symbols"
contains = ["declare q.Shape.`-eq`", "define linkonce_odr q.Maybe[i32].`-eq` comdat any"]

[scenario.enum_payload_loop_option]
category = "compile"
description = "A loop over the Option of a value that an inlined function returns is vectorized as a counted loop is"
tags = ["genllvm"]

# Compiled as a library, so that its public functions are exported: in a
# program they are internal, and the optimizer deletes what main never calls
[[scenario.enum_payload_loop_option.run]]
name = "library"
options = ["--library"]

# The loaded i64 was broken into eight bytes, put into the Option's payload of
# fifteen bytes and taken out again on every trip, and the two paths out of the
# inlined function merged in a phi of the whole Option, which LLVM does not
# split: the loop stayed scalar. The payload is an i64 now, merged in a slot that
# becomes a phi of the i64 alone.
[[scenario.enum_payload_loop_option.check]]
name = "the-loop-is-vectorized-and-holds-no-aggregate"
target = "llvmir"
contains = ["define i64 @sumVal(", "vector.body", "<2 x i64>"]
excludes = ["phi %Option", "insertvalue %Option", "[15 x i8]"]

[scenario.enum_payload_loop_struct]
category = "compile"
description = "A loop over the plain struct that an inlined function returns is vectorized as a counted loop is"
tags = ["genllvm"]

[[scenario.enum_payload_loop_struct.run]]
name = "library"
options = ["--library"]

# The two paths out of the inlined function merged in a phi of the whole struct
# of a flag and an i64, which LLVM does not split: the loop stayed scalar
[[scenario.enum_payload_loop_struct.check]]
name = "the-loop-is-vectorized-and-holds-no-aggregate"
target = "llvmir"
contains = ["define i64 @sumPair(", "vector.body", "<2 x i64>"]
excludes = ["phi %Got", "insertvalue %Got"]

[scenario.enum_final]
category = "run"
description = "A value typed as an enum is finalized once, as its variant: every place it lives, the order with an enum's own 'final', an extension's, and matching by value, whichever arm runs"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# Whether an enum has a drop at all is per instance, and a run cannot see a drop
# with nothing to do: 'Gen[i32]' and 'Option[&Fin]' would print the same lines
# with an empty one. So the drops generated are asserted here, before the
# optimizer inlines them: 'Gen[Fin]', 'Option[Fin]' and 'Option[Option[Fin]]'
# have one, 'Gen[i32]' none, and the nullable-pointer 'Option[&Fin]' none.
[[scenario.enum_final.check]]
name = "a-drop-only-where-a-variant-finalizes"
target = "preir"
contains = [
  "@_CNvINt3GenNt3FinEu11_drop_9b166b(",
  "@_CNvINtC4core6OptionNt3FinEu11_drop_9b166b(",
  "@_CNvINtC4core6OptionINtC4core6OptionNt3FinEEu11_drop_9b166b(",
]
excludes = ["3GenlEu11_drop", "6OptionR0"]

[scenario.enum_match_form]
category = "run"
description = "The matchee's form decides what a match takes: a place is tested where it stands and only the arm that binds takes from it (a move of an owner, a copy of a copy type that 'mut' changes without touching the original), a borrow binds a reference into it, a call is a temporary the match owns, a bound guard takes nothing from a place; and a pattern names only the variant, taking the reference kind of the matched value ('&imm', an 'Rc', a value), a variant named through its enum alone is an 'is', and '&Circle' stays a check"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

[scenario.enum_flow_typing]
category = "run"
description = "Flow typing: a name tested for a variant is that variant where the test holds -- in the branch, joined by '&&', in the branch of a failed '!', in the arm of a match, in the other branch of a two-variant test, after a branch that leaves, in a loop's pass -- so its fields are read by name; assigning a known variant narrows to it, and writing a field of the variant is no change of it"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.enum_match_bind_final]
category = "run"
description = "A 'var' variable bound by a match arm behaves as a plain 'var' local: moved on every path or some and then assigned over, or assigned over without a move, it finalizes what it held (if anything) and the value assigned is finalized with the matched value"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.enum_match_keeps_place]
category = "run"
description = "A match on a place takes only what its arm binds: a binding of plain data copies it and the place is matched again after the arm, a guard on a binding takes nothing whatever the payload (a failing guard leaves the place whole for the cases after it), and an arm that binds a payload that moves takes it and finalizes it as the arm ends"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

[scenario.enum_match_guard_held]
category = "run"
description = "A guard on a binding of a payload that moves, where the matched value is a call's answer held in the match's own hidden variable: the guard takes nothing, so a failing guard leaves the payload whole for the cases after it (a second guard, an 'else', the arm that binds it), and the arm that binds takes it and finalizes it as the arm ends; a 'var' binding, a payload passed on, a named local and a copy payload alike"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

# A run because the claim is the value each function returns: a 'return'
# ending a plain block in an arm was dropped, and the function fell through
[scenario.enum_match_jump_nested_block]
category = "run"
description = "A 'return' ending a plain block in a match arm ends the path: a 'switch' on an integer and on an enum's tag, an arm that binds and one with a guard, a match whose value is bound, a match on a place"
tags = ["genllvm", "runtime"]

[scenario.enum_let_else]
category = "run"
description = "let-else, 'let Ok(n) = r else {...};': the binding of 'if let Ok(n) = r' declared where it stands, whose 'else' leaves on every path ('return', 'break', 'continue', 'panic', or an 'if' or 'match' each of whose paths leaves, the finalizers showing the binding is not reached); it takes what a binding takes (a copy of plain data that leaves the place whole, a move of an owner, a reference into a borrowed value) and may be 'var'"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

[scenario.enum_typecheck_let_else]
category = "reject"
description = "A let-else whose 'else' can go on, refused (ErrorLetElse) at the spot where a path goes on, saying what it lacks: an empty block, a last statement that is no jump, an 'if' or 'else if' chain with no 'else', one branch that goes on, a match arm that goes on, a loop"
tags = ["typecheck"]
diagnostics = 7

# A run because the claim is that the binding after the 'else' is not reached,
# which only the values the functions return show
[scenario.enum_let_else_block]
category = "run"
description = "A let-else whose 'else' leaves through a plain block ending in 'return', one or two blocks deep, with locals of the block and of the function finalized once as it leaves: the 'else''s value when the variant is missing, the binding's when it is there"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.enum_variant_binding]
category = "run"
description = "A pattern binds one name inside the variant, after the 'let' or 'var' in front of the pattern: 'case let Circle(c)' with a guard, through its enum ('Shape.Circle(c)'), with type arguments ('Some[i32](n)'), 'case var Some(n)' changing the arm's copy, the same in 'if let', 'else if let', 'if var' and 'let Some(n) = x else {...};', 'case var &mut Ok(n)' writing through a reference, and a function's pattern and a call-shaped value told from it"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

[scenario.enum_owner_narrow]
category = "run"
description = "A pattern on an owner nobody can store another variant through, 'match s { case imm c Circle }' on an 'Rc[imm, Shape]', binds a copy of the owner (counted one more, released with its arm) typed 'Rc[imm, Circle]', in a match, a bound 'if' and let-else; the value dies once, with its last owner"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.enum_flow_typing_refs]
category = "run"
description = "Flow typing through a reference parameter: an 'imm' or 'uni' reference is narrowed as it stands, a '&' or '&mut' one through a reference the compiler declares where the test was made; fields read, written and methods of the variant called by name, in a branch, joined by '&&', after a branch that leaves, by elimination, in a match arm, across a call that cannot reach the enum, and again after the enum is stored over"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.enum_typecheck_flow_typing]
category = "reject"
description = "Where flow typing does not narrow: a field only a variant has, named with no test or outside the test's branch; and what is said when the name was narrowed and is not any more (an assignment of a value not known to be a variant, a writable borrow of the whole enum, a branch that changed it, a reference stored over), naming the change; a narrowing from before a loop that the loop changes and comes back to; the name still the whole enum where a variant is wanted; a let-else whose else falls through; and a call between a shared reference's test and the local that holds it (or its use in the same condition)"
tags = ["typecheck"]
diagnostics = 14

[scenario.enum_flow_typing_reshape]
category = "reject"
description = "A reference name others may share, narrowed to a variant by a test, used as the variant after a call handed another name for the enum, a store through one, a swap, or a call whose body cannot be seen, in a branch, after a branch that left, in a match arm and in a loop: refused at the use that is stale, naming the change"
tags = ["flow"]
diagnostics = 7

[scenario.enum_match_bar_join]
category = "run"
description = "A case joins patterns with '|': numbers, ranges, comparisons, variants, 'is', a guard and the columns of 'match a, b'; a bitwise or meant as a value is parenthesized, and '^' and '&' bind inside a value"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.enum_match_cover]
category = "run"
description = "A match that names every variant of an enum or both values of a bool needs no 'else', statement or value, a '|' naming several at once, and 'match a, b' matches several values with a pattern for each and '_' for any: the combinations covered, a column of numbers needing the 'else', a guarded case not counting, the values evaluated once each in the order written"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

[scenario.enum_match_using]
category = "run"
description = "A function's pattern: 'case imm rest using prefix(\"GET \")' binds the Option the function gives back and 'case using isOdd()' tests with its bool, a method's after 'self' (the matched value is the first argument); cases are tried top to bottom and the function is called once, only when its case is reached, with cases of other kinds before and after it, a guard, tests joined by '|', a matched value that is a call made once, a bound value that owns something finalized as its arm ends; and the same binding in an 'if', an 'else if' and a let-else with the matched value after '='"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

# The cases before the first function's pattern are one switch; from that case on, the chain, the
# function called when its case is reached and the cases after it tested in order
[[scenario.enum_match_using.check]]
name = "the-cases-before-a-pattern-are-a-switch-and-the-rest-the-chain"
target = "preir"
contains = [
  "switch i32 %n1, label %ifnext [\n    i32 0, label %ifblk\n    i32 1, label %ifblk2\n  ]",
  "%1 = call i1 @isOdd(i32 %n5)\n  br i1 %1, label %ifblk4, label %ifnext3",
  "icmp eq i32 %n8, 4",
]

[scenario.enum_match_using_calc]
category = "run"
description = "A calculator's parser in 17 lines of function patterns (`case imm after using digits()`, `case imm p using lit(\"+\")`, `case using atEnd()`), each pattern handing back the text that is left and the arm moving on, over the text of a sum"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

[scenario.enum_match_switch]
category = "run"
description = "A match on one integer, character or enum tag is an LLVM switch in every build: its leading cases that test constants (named ones too), ranges up to 128 values, '|' joins and variants (a trait pattern's, through a reference, a binding in the case) are the labels, a value an earlier case took keeps that case, and the chain from the first guard, wider range or 'else' is the default, so each case still yields what the chain gave it"
tags = ["genllvm", "runtime"]

[[scenario.enum_match_switch.run]]
name = "release"
options = []

[[scenario.enum_match_switch.run]]
name = "debug"
options = ["--debug"]

# What generation writes, before any pass of LLVM's: sixty characters are one switch of the character,
# a range is its values spelled out, a value an earlier case took is not a label again (12), and the
# cases from the first range too wide to spell out are the chain in the default
[[scenario.enum_match_switch.check]]
name = "a-match-on-a-character-is-a-switch"
target = "preir"
contains = [
  "switch i32 %c1, label %ifnext [\n    i32 97, label %ifblk\n    i32 98, label %ifblk2\n    i32 99, label %ifblk3\n",
  "    i32 -1, label %ifblk\n    i32 7, label %ifblk2\n    i32 10, label %ifblk3\n    i32 11, label %ifblk3\n    i32 12, label %ifblk3\n    i32 -5, label %ifblk4\n",
  "    i32 20, label %ifblk5\n    i32 21, label %ifblk5\n    i32 13, label %ifblk6\n    i32 40, label %ifblk7\n    i32 41, label %ifblk7\n    i32 42, label %ifblk7\n",
  "switch i32 %n1, label %ifnext [\n    i32 1, label %ifblk\n    i32 2, label %ifblk2\n  ]",
  "icmp sge i32 %n5, 3",
]

# A match on an enum switches on its tag, read once; a pinned tag is the label; the guard ends the labels
[[scenario.enum_match_switch.check]]
name = "a-match-on-an-enum-is-a-switch-of-its-tag"
target = "preir"
contains = [
  "switch i32 %tag, label %ifnext [\n    i32 5, label %ifblk\n    i32 1000, label %ifblk2\n  ]",
  "switch i8 %tag, label %ifnext [\n    i8 0, label %ifblk\n    i8 1, label %ifblk2\n  ]",
]

[scenario.enum_parse_match_columns]
category = "reject"
description = "The columns of 'match a, b': '_' in a match of one value, a case with fewer or more patterns than the match has values, and a pattern in a column that binds a variable"
tags = ["parse"]
diagnostics = 4

[scenario.enum_typecheck_match_cover]
category = "reject"
description = "What a match must cover: a statement or value match leaving out a variant, a numbers-only match, one bool value, a guarded case, a '|' or a combination of columns not covered, a match with no cases, and what may not repeat: a variant, a bool value, a number or character or a combination named twice, an 'else' after the cases cover everything"
tags = ["typecheck"]
diagnostics = 28

[scenario.enum_parse_match_using]
category = "reject"
description = "A function's pattern written wrongly: a match with a 'using' case that does not end in 'else', 'using' without the call of a function, a binding in a column of 'match a, b', a binding by 'using' as a declaration with no 'else'"
tags = ["parse"]
diagnostics = 5

[scenario.enum_typecheck_match_using]
category = "reject"
description = "What a function's pattern gives back: a binding by a function giving a bool or nothing (in a match and in an 'if'), a test by a function giving an Option, a call with too few arguments after the matched value"
tags = ["typecheck"]
diagnostics = 5

[scenario.enum_extends]
category = "run"
description = "An enum extending another: its copies of the base's variants, membership, a fold, methods through the copies, each enum's own layout, a generic enum extending and extended, an extension of an extension, plain and generic, and an extension's own methods and statics, reaching its copies, plain, generic and down a chain, and its bases' names bare inside its braces"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

# Each enum lays out its own set, and runtime cannot see that: a tagged Maybe, or
# a Shape padded to Solid's Cube, would print the same lines. So it is asserted in
# what generation wrote before the optimizer folds the readers into 'main'. Maybe
# is still a bare pointer, so a local holding one, 'base', is a 'ptr', while
# MaybeMore is a tagged struct, and 'ext' holds one. A signature cannot show
# either: every reference is the same 'ptr'. Shape is still padded to its own largest, Rect, while Solid is the
# size of the Cube it adds. Framed is padded although the Message it extends
# declined the padding. An enum's own type is its discriminant and common fields,
# then its payload out to its padded size, in the scalars every variant agrees on
# and bytes elsewhere (enum_payload_scalars), with a zero-length array for the
# strictest alignment among its variants where no scalar carries it: Shape is 16
# bytes, two i32s where Circle and Rect agree; Solid 32, bytes over the i32s that
# Cube's first i64 overlaps and then Cube's last two i64s; Framed 24, bytes over
# Text's i32 and Blob's first i64 and then Blob's second i64; and MaybeMore 16,
# bytes and Just's pointer. The copies' own struct names are not asserted:
# LLVM numbers a second struct of one name, and which is first follows generation
# order.
[[scenario.enum_extends.check]]
name = "each-enum-lays-out-its-own-set"
target = "preir"
contains = [
  "%base = alloca ptr, align 8",
  "%ext = alloca %MaybeMore, align 8",
  "%MaybeMore = type { i8, [7 x i8], ptr }",
  "%Shape = type { i8, i32, i32, i32 }",
  "%Solid = type { i8, i32, [8 x i8], i64, i64 }",
  "%Cube = type { i8, i32, i64, i64, i64 }",
  "%Framed = type { i8, i32, [8 x i8], i64 }",
]
excludes = ["%Maybe = type"]

# The same holds of a generic base and a generic extension, instance by instance.
# Option[&i32] is still a bare pointer, so the local 'osome' is a 'ptr';
# Pending[&i32], an instance of an extension of Option that adds a third
# variant, is a tagged struct, which 'psome' holds, and so is Pending[i32],
# which 'some' holds. Which of the two instances LLVM names '%Pending' and which
# it numbers follows generation order, so only the prefix is asserted.
[[scenario.enum_extends.check]]
name = "generic-extension-lays-out-apart-from-its-base"
target = "preir"
contains = [
  "%osome = alloca ptr, align 8",
  "%psome = alloca %Pending",
  "%some = alloca %Pending",
]

# An extension of an extension shares the discriminant of the enum at the bottom
# of the chain, and numbers its own variants after everything below it. The run
# sees only that the comparisons tell the variants apart, which any distinct values
# would do. So the values are asserted where generation stored them: Colors pins
# Green at 0x100 and declared no integer type, so Rich and Richer are both laid
# out in two bytes, and Gold, added two levels up, is 260 -- after Colors' Blue at
# 257 and Rich's Cyan and Magenta. Gold is asserted rather than a copy, whose
# struct name LLVM may number.
[[scenario.enum_extends.check]]
name = "a-chain-shares-the-bottom-discriminant"
target = "preir"
contains = [
  "%Rich = type { i16 }",
  "%Richer = type { i16 }",
  "store %Gold { i16 260 }",
]

# An enum's members, and its variants', are private to its module, so what is
# claimed is about code in one place reaching members declared in another: an
# enum's static function and cloned method reaching a variant's, one variant's
# method reaching its sibling's, an extension's code reaching its copies' and
# its base's variants', and a generic enum's instance doing each for its own
# variants. Reading, writing, calling and building are each done, since each is
# checked in its own place. enum_typecheck_privacy holds code of the module
# outside the braces, and module_privacy_typecheck what a module outside is
# refused.
[scenario.enum_privacy]
category = "run"
description = "Code inside an enum's braces -- a static function, a cloned enum method, a variant's method, an extension's variant and a copy's cloned method, an extension's own method and static function, and a generic enum's -- reading, writing, calling and building the private members of the enum and its variants"
tags = ["typecheck", "runtime"]

# -------- parse stage --------

[scenario.enum_parse_decl]
category = "reject"
description = "An enum declaration's head: 'enum trait', '@unsized' where nothing pads, an empty enum, and variants inside a trait"
tags = ["parse"]

[scenario.enum_parse_nametype]
category = "reject"
description = "An enum and its integer type written with no ':' between them are refused"
tags = ["parse"]

[scenario.enum_parse_nametype_fields]
category = "reject"
description = "An enum's common field and the place its tag is laid out take a ':' before their type, the old spelling is refused, and a ':' after the enum's name with no integer type is refused"
tags = ["parse"]

[scenario.enum_parse_variant_forms]
category = "reject"
description = "A variant declared as a type in an enum that has fields every variant shares, wherever the field is written; the same variant, with every form of variant beside it, accepted where there is none; and a name with a type, in either case or with a tuple type, always a field"
tags = ["parse"]
diagnostics = 2

[scenario.enum_typecheck_variant_forms]
category = "reject"
description = "Reading the contents of a variant declared as a type by a field name it does not have, and binding them through a managed reference, which cannot lend them yet"
tags = ["typecheck"]
diagnostics = 2

# Where a body's declarations end. ';' delimits them and the last needs none, so a
# variant list is written 'A, B(i32), C' with the '}' ending it, and an empty
# declaration is harmless. One run program holds what is accepted (the plain list,
# the old ';' spelling, a payload on any variant of a list, a struct variant
# delimiting itself, empty declarations); enum_parse_delimiters holds what is still
# refused, each with the position its fix goes at.
[scenario.enum_body_delimiters]
category = "run"
description = "A body whose last declaration has no ';' (a plain list, a list with a payload on any variant, a common field with a struct variant last), the old ';' spelling, and empty declarations"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.enum_parse_delimiters]
category = "reject"
description = "What a body's delimiting ';' still requires: one between two declarations that do not end in a block, a name after a variant list's comma, and a list that is not the comma kind"
tags = ["parse"]
diagnostics = 7

[scenario.enum_parse_blocks]
category = "reject"
description = "Declarations an enum body and arms a match body will not accept, a variant sharing a spelling with a member or a tag value with another variant among them, and a negative tag value past every integer type"
tags = ["parse"]
diagnostics = 8

# A module's 'use' of an enum, as the parser reads it. What follows the enum is
# the grammar a type body's sibling 'use' has, so only what is particular to the
# module statement is here: where its 'pub' goes, and that naming the enum already
# asks for every variant.
[scenario.enum_parse_use]
category = "reject"
description = "A module's 'use' of an enum written 'use pub', or with a '*' the statement already implies"
tags = ["parse"]
diagnostics = 2

[scenario.enum_parse_range_bare]
category = "reject"
description = "A range pattern written with a bare '..' between its bounds, characters and numbers, spaced and not, refused with the two forms that say whether the upper bound is included"
tags = ["parse"]
diagnostics = 3

[scenario.enum_parse_variant_binding]
category = "reject"
description = "A pattern binds one name inside the variant: none or several names (ErrorPatBindCount), a value, a call or another pattern inside it (ErrorPatBindNested), the name before the variant, a variant with no parentheses, a declaration of one name or of several with an 'else' and a let-else with the name before the variant (ErrorPatBindForm), and 'var' inside the parentheses"
tags = ["parse"]
diagnostics = 15

[scenario.enum_parse_patterns]
category = "reject"
description = "Pattern bindings with a permission that is no declaration word, a variant with no parentheses or no variant, a missing value to match, a pattern spelled as a managed reference, a condition where a case or a '|' expects a pattern, and a range written '...'"
tags = ["parse"]
diagnostics = 12

[scenario.enum_parse_pattern_typearg]
category = "reject"
description = "A pattern binding's type argument that is no term, in a match arm, an 'if' and a declaration: reported, not a crash"
tags = ["parse"]
diagnostics = 6

[scenario.enum_parse_extends]
category = "reject"
description = "What an enum extending another may not write: a requirement, a common field, a discriminant or its integer type, an 'is', or no variant at all"
tags = ["parse"]
diagnostics = 6

# -------- name resolution stage --------

# The enum's fields are spliced into every variant while the variant is name
# resolved, which is where a variant redeclaring one of them collides. This is the
# only splice left in the language -- a trait contributes no fields -- so it is the
# only place the collision can arise, and it lives here rather than with the trait
# group that used to hold it.
[scenario.enum_nameres_splice]
category = "reject"
description = "A variant redeclaring a field its enum splices into it"
tags = ["nameres"]
diagnostics = 1

# The copies of the base's variants are made while this enum is resolved, which
# is where every question about what may be extended is answered.
[scenario.enum_nameres_extends]
category = "reject"
description = "What an enum may extend: an enum, not itself, a generic one with its arguments written, with no tag value already taken, no added variant named as a copy is, and no member of its own named as anything down the chain it extends"
tags = ["nameres"]
diagnostics = 14

# A variant is a name of its enum, and a module's 'use' is what folds it in bare.
# The fold is expanded in the module's fold pass, once the enum it names is known,
# so everything it refuses is refused here: a source that is not an enum, a listed
# name that is not a variant, a public fold of a private enum, and a folded name
# the module already has.
[scenario.enum_nameres_use]
category = "reject"
description = "A module's 'use' naming what is not an enum, listing what is not a variant, publishing a private enum's variants, or colliding; and a variant named bare with no 'use'"
tags = ["nameres"]

# A bound pattern's 'is' test and conversion share one type node. A shape whose
# root name is not looked up in the matched value's enum -- under a pointer or an
# array reference -- is resolved by name resolution, and a second resolution of
# the shared node once turned an unknown referent's reference into a borrow that
# had no name resolution of its own, and abandoned the compile.
[scenario.enum_nameres_pattern]
category = "reject"
description = "An unknown name under a pointer or an array reference in a bound pattern, reported once"
tags = ["parse", "nameres"]
diagnostics = 2

# -------- type check stage --------

[scenario.enum_typecheck_match]
category = "reject"
description = "Matches that are not exhaustive, a guarded arm not counting toward it, not ordered, or not of one type; an enum comparison with no candidate, and one whose variants carry fields and declare no '==', a range on an enum, and a guard that is not a condition; a bool's two values alone not exhaustive, and a value alone refused as the '==' it means"
tags = ["typecheck"]
diagnostics = 17

[scenario.enum_tag_equality]
category = "run"
description = "'==' and '!=' against an empty variant ask the tag alone, on either side, whatever the other variants carry and declare: core's Option, and enums whose variants carry a type or fields and declare no '==' -- equal, unequal, a variant of another tag, held in a variable, a call's result, and a reference"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[[scenario.enum_tag_equality.run]]
name = "release"
options = []

[[scenario.enum_tag_equality.run]]
name = "debug"
options = ["--debug"]

[scenario.enum_typecheck_payload_eq]
category = "reject"
description = "'==' and '!=' on an enum with a variant that carries fields and declares no '==': the first such variant is named with what it carries, however many others have one, a field in common counting as carried, for core's Option and Result instances, through references, and a '==' of a variant that takes something other than another of the variant reported where it is declared"
tags = ["typecheck"]
diagnostics = 8

[scenario.enum_typecheck_narrow]
category = "reject"
description = "Patterns narrowing to a type the matched value could never be, already narrow, or in another region; a pattern written as a reference that disagrees with the matched value (a region, a stronger permission, a value that is no reference); and a binding narrowed from an 'Rc' that could be changed by another owner (Rc[mut]), which stays refused"
tags = ["typecheck"]
diagnostics = 15

# A reference narrowed into a variant through a 'mut' or 'ro' reference other
# references share is the collection rule's case: allowed, and refused only if something
# could change the variant while it is used. enum_narrow_shared_success holds what is
# accepted beside each refusal.
[scenario.enum_flow_narrow_shared]
category = "reject"
description = "A reference narrowed into an enum's variant, through a 'mut' or 'ro' reference or a field through one, used again after the enum is stored over by the same name or another, swapped, replaced inside a struct holding it, handed to a call whose body (or what it calls) stores over it, or to one whose body cannot be seen; and a borrow into an 'Option' of a list, or an enum whose variant owns one, emptied by another name's 'take' or 'clear'; and the field of a shared 'Rc[mut, T]' owner, stored over through another handle or by a call handed another reference"
tags = ["flow"]
diagnostics = 15

[scenario.enum_narrow_shared_success]
category = "run"
description = "A reference narrowed into an enum's variant through a 'mut' or 'ro' reference of unseen origin, used while its fields are written (the variant's, and one the variants share, through the enum), the enum is read through the same name or another, a call is handed it that only reads it or writes a shared field, a state machine stores its next state in the arm's last act, and an 'Option' payload is written; the enum stored over only after the narrowed reference's last use; and a borrow of a local held in a variable, which no other name reaches"
tags = ["flow", "genllvm", "runtime"]

# A pattern's bare name is looked up in the matched value's enum, which only type
# check knows, so what it fails to name is reported here rather than at name
# resolution. The bound form's reference case is the one that used to abandon the
# compile, as enum_nameres_pattern's shapes did.
[scenario.enum_typecheck_pattern]
category = "reject"
description = "Pattern names that are no variant of the matched enum and nothing in scope, in every pattern form; type arguments on a variant only the matched enum has; a value where a type must be; and, alone as a pattern, a name nothing answers and a type other than a variant of the matched enum, bare or named through its enum"
tags = ["parse", "nameres", "typecheck"]
diagnostics = 10

[scenario.enum_typecheck_variant]
category = "reject"
description = "Narrowing an enum to a variant by assignment, extending a closed enum, a variant holding its own enum by value, a generic enum's instance included, a variant reached through a value, and an enum's by-value method called on a value of the enum"
tags = ["typecheck"]
diagnostics = 9

[scenario.enum_typecheck_tag]
category = "reject"
description = "A tag value the enum's integer type cannot hold, past its largest or its smallest or negative in an unsigned one, a generic enum's included, a negative value beside one only u64 holds, an integer type that cannot hold a tag, and the one field that may carry the discriminant"
tags = ["typecheck"]

[scenario.enum_typecheck_unsized]
category = "reject"
description = "Holding a value of an '@unsized' enum, which has no one size"
tags = ["typecheck"]

# Membership, pinned both ways: without these refusals a shared discriminant and
# cloned common fields let the two enums, and a variant of either, stand for the
# other in fact, whatever the manual says.
[scenario.enum_typecheck_extends]
category = "reject"
description = "A base enum and an extension of it substituting for each other, a variant of either standing for the other enum, generic instances included, a tag value wider than the shared discriminant or of the sign it does not hold, and a base's variant or the base asked for a method only its extension declares"
tags = ["typecheck"]
diagnostics = 24

# Beside enum_privacy: an enum's members are private to its module, not to its
# braces, so code of the module outside the braces reaches them too. The
# generic function is the case that tells the boundary is drawn by the code's
# owner and not by where analysis happens to be: it is the module's, and so
# accepted. A module outside is refused (module_privacy_typecheck).
[scenario.enum_typecheck_privacy]
category = "compile"
description = "Private members of an enum and its variants reached from outside its braces but inside its module -- a module's function, a generic one instantiated from inside, a sibling extension, the base reaching into an extension -- none refused"
tags = ["typecheck"]

[scenario.enum_typecheck_none_branch]
category = "reject"
description = "A bare None where nothing says which Option it is, as the last statement of a block, the branch of an if and the arm of a match that start a variable, refused where it is written; with the type given by the return type, or written, it is built"
tags = ["typecheck"]
diagnostics = 3

[scenario.enum_construction]
category = "run"
description = "A variant constructed with parentheses and no 'new' (qualified, bare after 'use', a payload variant, a struct variant), an empty one by its name alone, and a generic one taking its type arguments from where it goes or written in brackets before the values ('Some[i64](8)', 'None[i64]'), as a function's last value, an argument and a variable; compared by its tag"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

[scenario.enum_typecheck_construction]
category = "reject"
description = "The old spelling refused at its bracket, a variant with values, an empty one, a generic one with its type arguments written, naming the new one; an empty variant called, a variant holding values named alone"
tags = ["parse", "nameres", "typecheck"]
diagnostics = 10

[scenario.enum_variant_receiver]
category = "run"
description = "A method called on an empty variant written by its name, 'Lamp.Red.get()' and bare after 'use', is called on that variant constructed; a static function and the enum's own path are unchanged; a generic enum's empty variant with its type arguments written"
