# region - owning references, region strategies, lock permissions and weak
# references. Tier 2.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# Two regions are declared in packages/core, the prelude: 'Rc', which counts
# its owners and frees at the last, and 'So', which declares 'Move' and is
# freed by its single owner. A third is the sync package's, reached by
# 'import sync use Arc': 'Arc', which counts as 'Rc' does with its count
# changed atomically and declares 'ThreadSafe' (region_arc; its threads are the
# thread package's tests). None is privileged: a region is a struct declaring 'is
# RegionRef', whose methods the compiler calls at each reference event, so
# region_regionref declares more, region_success another and region_collected
# one declaring neither 'aliasRef' nor 'Move', and that is what the type-check
# scenarios are about.
#
# The failure scenarios split first by pipeline stage. Within the type-check
# stage they split again by which check raised the message, because the
# families ask different questions and would otherwise be twenty diagnostics in
# one file:
#
# - region_typecheck_alloc asks what the allocation expression itself may say:
#   what may be allocated, and what may stand in the region slot.
# - region_typecheck_region asks what shape each region method must have where
#   it is declared, and refuses an allocation from a region with no 'alloc'.
# - region_typecheck_init asks the same about the optional 'init' method, for a
#   region and for a permission.
# - region_typecheck_set asks which sets of region methods are accepted: every
#   one that leaves methods out, and not 'Move' with 'aliasRef'.
# - region_typecheck_regionref asks where 'RegionRef' itself may stand, and
#   refuses a region that does not declare it.
# - region_typecheck_traced asks what a region declaring 'Traced' promises (its
#   'mark'), and who may declare it.
# - region_typecheck_traced_place asks where a traced reference may be held, and
#   what a traced region may allocate: judged after type check, so apart.
# - region_typecheck_threadsafe asks who may declare 'ThreadSafe': a region ref
#   or a lock permission. What it changes, which references may cross threads, is the
#   concurrency group's (concurrency_typecheck_sendable).
# - region_typecheck_coerce asks which coercions between regions are allowed,
#   which is a rule about reference types rather than about allocating.
#
# Lock permissions (doc/reference/refpermlock.html), a struct declaring
# 'LockPermission' in a managed reference's permission slot, are the
# region_lockperm_* scenarios: sync's Mutex (region_lockperm_mutex) and Rwlock
# (region_lockperm_rwlock) from several threads, core's Rwcell on one, where
# each lock is given back on every way out (region_lockperm_rwcell) and a
# conflicting borrow panics (region_lockperm_rwcell_panic), and what type check
# (region_lockperm_typecheck) and flow (region_lockperm_flow) refuse. A lock's
# 'init' is region_typecheck_init's, a lock declaring 'ThreadSafe'
# region_typecheck_threadsafe's, and a traced region refusing one
# region_typecheck_traced_place's. Not covered: a deadlock, which Cone does
# not prevent and a run would only show by hanging; and the lock left held by
# a panic, since a panic ends the process.
#
# region_flow is a single function, because data-flow analysis runs only on a
# function that type checked (ir/stmt/fndcl.c). That gate is now per function, so
# an earlier function's diagnostics no longer silence a later one's; the single
# function here is the shape it was written in rather than a requirement.
#
# Left out deliberately:
#
# - Weak references as a kind of reference. The compiler has none, and no
#   syntax for the '.weak' the manual describes. They are library code, the
#   rcweak package's 'Weak[T]' over its 'Rcw' region, which its own tests run;
#   what the ordinary rules refuse of it is region_flow_rcweak_refuse.
# - An owning array reference. There is none: an owned runtime-sized array is
#   a 'So[Array[T]]', shared as 'Rc[Array[T]]', and '+[]' is refused where it is parsed
#   (region_parse_owned_arrayref). What a borrowed slice is and does belongs to
#   collection.
# - Virtual owning references, allocated as their concrete type and coerced
#   ('+<' is refused, trait_nameres). They belong to trait.
# - A global holding an owning reference. A global may only be initialized with
#   a literal, so 'mut g = new Rc[mut, i32](80)' is ErrorNotLit -- a fact about global
#   initialization, which core owns, rather than about regions.
#
# Nothing here is left uncovered for want of a code. ErrorBadAlloc (1036) is the
# alloc and init shape rules and an allocation from a region with no 'alloc';
# ErrorRegionMeth (1155) the shape of 'aliasRef', 'dealiasRef' and 'free';
# ErrorRegionSet (1156) 'Move' with an 'aliasRef', a region contradicting itself; ErrorNotRegion
# (1154) a region that does not declare 'is RegionRef'; ErrorRegionRefUse (1157)
# 'RegionRef' anywhere but a struct's 'is'. A region slot naming no struct at all
# stays ErrorInvType, because that is a type error rather than a region one.
#
# Five defects this group recorded as xfails are now fixed, and their scenarios
# assert the behavior instead: a moved 'So' reference frees once, a first
# assignment to an uninitialized owning variable releases nothing, a region-
# allocated struct's 'Rc' owning field is released through the reference it holds
# rather than its address, and an owning reference coerces to a borrowed one.
# region_typecheck_coerce pins the direction that must stay refused, which could
# not be asserted while the coercion rule read backwards. region_so_reassign
# is the other half of the first-assignment one: a variable that does hold an
# 'So' value releases it when reassigned, and one moved out does not.
#
# The pair of owning-field scenarios are the same shape in the two regions, and
# together they are what reference counting means here: region_owning_field's 'Rc'
# field is a second holder and is counted, while region_owning_field_so's 'So'
# field is the only holder, so naming it in the literal moves it.
#
# An array's contents repeating a counted reference copy it into each element,
# one holder each, which region_held_counted runs; the 'move' group owns what the
# same contents do to a move value (move_flow_arraylit). region_enrich_count
# asks it of an alias taken under an enrichment's name, which crosses in a
# recast: one holder more, as under the same name.
#
# region_nested_alloc joined them: genlallocref's phi named a predecessor that the
# inner allocation's own branches had already displaced, so it read the block back
# from the builder instead.
#
# region_fallible_alloc is 'trynew' with a finished value: genlallocref reads
# the owning reference's type out of the instantiated 'Some', whose first field
# is the tag the enum gives every variant and whose second is the reference. The
# scenario measures every spelling of the form and reaches the empty variant by
# declaring a region whose 'alloc' returns null.
#
# No xfail remains.

support = []

# -------- success --------

# The whole method set, called for regions the compiler has never heard of:
# alloc and init at the allocation, aliasRef for each copy that becomes an owner
# (a variable, a call's argument), dealiasRef for each owner
# going away and free at the last, and for a region declaring 'Move', the move
# and the one death. Two regions leave out what 'Rc' has, and the absent
# operation does not happen: with no 'dealiasRef' a counted value never dies and
# is never freed, and a 'Move' region with no 'aliasRef' has a single owner whose
# going still asks 'dealiasRef'. Its 'finalized' case shows a death's order in the region calls:
# the value's 'final', then the release of the owner its field holds, then its
# own 'free'. The .out file is the whole assertion. Before regions
# became RegionRef the compiler dispatched on the names 'rc' and 'so', and this
# program printed only its allocs and inits: no aliasRef or dealiasRef was ever
# called, and nothing was freed.
[scenario.region_regionref]
category = "run"
description = "A region written in Cone and named neither 'Rc' nor 'So' has its alloc, init, aliasRef, dealiasRef and free called at each reference event, and one declaring 'Move' is a single owner"
tags = ["nameres", "typecheck", "flow", "genllvm", "runtime"]

# A body whose length a reference carries ('str', the body of bytes), owned in
# regions written here: the owner is a pointer and a count, one hop, the
# header before the bytes. Allocated by copying a borrow of one, so 'alloc' is
# asked for the header and as many bytes as the view has; copies, parameters,
# fields, returns and tuple elements are counted owners as thin ones are, a
# Move region's one owner moves, and the death of the last gives the block back
# through 'free' from the header's place. The .out file is the whole assertion.
[scenario.region_body]
category = "run"
description = "Owners of the body of bytes in a counting region and a Move one: allocated by copying a view (the header and the bytes asked for), copied, passed, moved, held by a value in another region, returned, in a tuple, empty, and fallibly allocated; each death freeing the block once"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# An 'Array[T]' body allocated in a region with a header asks for the header and
# the elements and nothing more; the copy once stored the NUL that only text keeps
# one byte past it, corrupting the C heap (sometimes 0xC0000374, in arcarray).
# A region that fills its blocks and checks the bytes after the size says so.
[scenario.region_body_bounds]
category = "run"
description = "An Array body copied into a region's block writes nothing past the size 'alloc' was asked for (the region fills 16 spare bytes with 0xAB and checks them at 'free'), and text's NUL is inside the block"
tags = ["genllvm", "runtime"]

# A string literal copied into an owner of 'str' in regions written here, as
# 'new R[str](literal)' copies it: ref_literal runs it in So, Rc and Arc.
[scenario.region_literal]
category = "run"
description = "A string literal wanted as an owner of the body of bytes in a counting region and a Move one: a variable and a parameter, the region's alloc asked for the header and the text, each copy freed once"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# sync's 'Arc', on one thread: counted and freed as 'Rc' is, its count changed
# by atomic instructions of the orderings its comment argues -- an aliasRef's add
# Relaxed ('monotonic'), a dealiasRef's subtract Release, and an Acquire load of
# the count by the owner that took it to zero, before the value's death
[scenario.region_arc]
category = "run"
description = "The sync package's Arc, folded in by 'import sync use Arc', on one thread: Arc[imm, T] owners copied, passed and returned, finalized once when the last goes; a unique Arc[T] moves; Arc[mut, T] changed through one owner and read through another; the count's add, subtract and load are atomic, Relaxed, Release and Acquire"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# After optimization, which leaves every one of them, the Acquire load too
[[scenario.region_arc.check]]
name = "count-changes-are-atomic-with-their-orderings"
target = "llvmir"
contains = [
  "i64 1 monotonic, align 8",
  "i64 1 release, align 8",
  " acquire, align 8",
]

# The other reading of a missing method [Jon 26 Sep]: a region ref declaring
# neither 'aliasRef' nor 'dealiasRef' nor 'Move' -- a tracing collector's or an
# arena's shape -- copies its references for nothing, and an owner's going does
# nothing: the compiler never finalizes the value and never calls 'free'. Its
# 'free' and the value's 'final' print, and the .out file shows neither.
[scenario.region_collected]
category = "run"
description = "A region ref with neither aliasRef, dealiasRef nor Move: references copy freely (the source stays usable, a write through one copy is read through another, a struct holding them copies), and the compiler never finalizes or frees what it holds; a 'uni' reference into it still moves"
tags = ["nameres", "typecheck", "flow", "genllvm", "runtime"]

# A region ref whose 'alloc' asks for the value's type record, by taking one
# after the size, is handed it at every allocation; one whose 'alloc' does not
# ask ('Rc', 'So') is called with the size alone, as before records existed.
# The region keeps each record in its header and later finalizes each value
# through it alone, in its own loop, as a collector will: the .out file shows
# each record's size, alignment and flags, and each value's death in the ruled
# order, run from the record.
[scenario.region_typerecord]
category = "run"
description = "A region ref whose alloc takes 'ty *TypeRecord' is handed the value type's record (size, alignment, flags, the same record mem.typeRecord gives) and finalizes each value later through it alone; Rc and So, whose alloc takes only the size, are called as before"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

[[scenario.region_typerecord.check]]
name = "record-passed-only-where-asked"
target = "preir"
contains = [
  "call ptr @_CNvNt4Kept5alloc(i64 24, ptr @cone.tyrec.0)",
  "@cone.tyrec.0 = private constant %TypeRecord { i64 4, i64 4, ptr @cone.tyrec.final.0, ptr @cone.tyrec.untraced, i32 1 }",
  "@cone.tyrec.1 = private constant %TypeRecord { i64 16, i64 8, ptr @cone.tyrec.nothing, ptr @cone.tyrec.untraced, i32 0 }",
  "call %void @_CNvNt6Holderu11_drop_9b166b(ptr %0)",
]

# What a trace reaches beyond a value's fields: what a type declaring
# GcTraceElements holds in memory it points to (a list, a deque, a dictionary, a
# pool, an arena of many types), the traced references behind an Rc or an So
# owner once for each collection (a cycle too), and the slot 'mark' is handed,
# which it rewrites. The .out file shows every mark, the object's id and a *
# where it rewrote its slot.
[scenario.region_gc_trace_elements]
category = "run"
description = "A trace reaches the values a type declaring GcTraceElements holds where it points (List, Deque, Dict, OrderedDict, Pool, and an Arena of many types, whose Erased values are traced by their own records), passes through Rc and So to the traced references behind them once for each collection, so a shared owner and a cycle are traced once, and hands mark the slot, which it rewrites"
tags = ["typecheck", "genllvm", "runtime"]

# A type declaring GcTraceElements says how a collector reaches what it holds
# where it points: a method 'gcTraceElements' giving a cursor that declares 'is
# Iterator[&mut E]'.
[scenario.region_typecheck_gc_trace_elements]
category = "reject"
description = "A type declaring GcTraceElements declares 'fn gcTraceElements(self &mut) I', I a cursor declaring 'is Iterator[&mut E]': none, one taking more or not self &mut, one giving no cursor, a cursor that does not declare Iterator, one giving a read-only reference or a value are refused; a traced type argument it does not reach is refused; a container and a cursor of the program's own are accepted"
tags = ["typecheck"]
diagnostics = 9

# An Rc's 32-bit count is checked: copying an owner of a value that has 4294967295
# panics. The program writes the limit into the header and copies once.
[scenario.region_rc_overflow]
category = "run"
description = "An Rc's owner count is 32 bits, and copying an owner when 4294967295 hold the value panics instead of wrapping"
tags = ["genllvm", "runtime"]
program_exit = "abort"
stderr_mask = ['(?<=core\.cone:)\d+']

# A traced region reference read through a borrow of it (`v.n`, `v &Leaf`) is a
# reference typed as the borrow lets it be seen; generation laid out no record
# for that type and the compiler crashed.
[scenario.region_traced_borrow_field]
category = "run"
description = "A field, a method, a list element and a nested borrow read through a borrow of a traced region reference compile and run (the reference seen through a read-only borrow is a type of its own, and generation must lay it out), and a write through &mut keeps the reference's permission"
tags = ["typecheck", "genllvm", "runtime"]

# The shadow stack finds a local 'Rc' holding traced references, and a local
# list of them, through their types' traces.
[scenario.region_gc_trace_elements_roots]
category = "run"
description = "A local Rc whose value holds traced references and a local list of them are roots: mem.traceRoots passes through the Rc once for each epoch and walks the list"
tags = ["genllvm", "runtime"]

# A traced region ref: 'is RegionRef, Traced', with a 'mark' the compiler's
# traces call. Each type's record carries a trace walking a value of it and
# handing each traced reference it holds to its region's 'mark', with the
# reference's permission (a constant) and the mode the trace was called with,
# where 'mark' takes them; its flags' bit 1 says it holds one, as
# 'mem.holdsTraced' does; 'mem.trace' runs the same walk in line. The .out
# file shows every mark, as header id / permission / mode.
[scenario.region_traced]
category = "run"
description = "A region ref declaring Traced: each type's record's trace (and mem.trace in line) hands every traced reference a value holds to its region's mark, with its permission and the trace's mode -- struct fields, nesting, tuples, fixed arrays in a loop, an enum's variant by its tag, the nullable-pointer Option, a generic's instance; null passed over; Rc and So fields of a traced object not traced but released by its finalizer"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.region_traced.check]]
name = "trace-in-record"
target = "preir"
contains = [
  "@cone.tyrec.3 = private constant %TypeRecord { i64 16, i64 8, ptr @cone.tyrec.nothing, ptr @cone.tyrec.trace.3, i32 2 }",
  "define private %void @cone.tyrec.trace.3(ptr %0, i32 %1)",
  "call %void @_CNvNt2Tr4mark(ptr %2, ptr %left, i32 79, i32 %1)",
  "ptr @cone.tyrec.nothing, ptr @cone.tyrec.untraced, i32 0 }",
]

# A record's trace is a function the compiler makes, which in a debug build
# needs debug information of its own for the calls it makes ('Tr0's inline
# 'mark' expanded in it among them); the one .out file is both builds' assertion
[[scenario.region_traced.run]]
name = "release"
options = []

[[scenario.region_traced.run]]
name = "debug"
options = ["--debug"]

# A nullable-pointer Option's variant held as itself -- what a match on a
# borrowed Option of a traced reference reads through -- is only its
# reference, and its trace reads it there. The compile crashed before: the
# variant was traced as a struct of a tag and a field.
[scenario.region_traced_variant]
category = "run"
description = "A variant of the nullable-pointer Option, held as itself ('*t' for 't &Some[Tr[mut, Leaf]]', a birth; mem.trace and mem.typeRecord of the variant), is traced as the bare reference it is laid out as"
tags = ["genllvm", "runtime"]

[[scenario.region_traced_variant.run]]
name = "release"
options = []

[[scenario.region_traced_variant.run]]
name = "debug"
options = ["--debug"]

# The write barrier: a traced region declaring 'writeBarrier' is handed the
# header of each of its references stored into memory that is not a local --
# through a reference of any kind, a borrow's included -- keyed on what was
# stored, never on the container. The toy region prints each Leaf it is
# handed, so the .out file is the runtime assertion for every store site, each
# line hand-checked in the source, and for the stores that get none: locals,
# a local's fields and elements, an allocation's value, a value holding no
# traced reference, a traced region with no 'writeBarrier'. The check pins the
# call's place: after the store, the stored reference loaded back and, where
# it is not null, its header handed over.
[scenario.region_barrier]
category = "run"
description = "The write barrier: each reference into a traced region declaring writeBarrier that is stored into memory not a local -- a field, element or dereference through a 'R' reference, a borrow, a slice or a pointer; a swap's two halves; ':='; a generic instance's method; a whole struct, tuple, array or enum, each traced reference in it, a null one passed over -- is handed to writeBarrier; locals, allocations' values, untraced values and a region without the method get none"
tags = ["genllvm", "runtime"]

[[scenario.region_barrier.check]]
name = "barrier-after-store"
target = "preir"
contains = [
  "store ptr %l1, ptr %left, align 8",
  "%tracedref = load ptr, ptr %left, align 8",
  "br i1 %present, label %barrier, label %barriered",
  "call %void @_CNvNt2Tr12writeBarrier(ptr %2)",
]

[[scenario.region_barrier.run]]
name = "release"
options = []

[[scenario.region_barrier.run]]
name = "debug"
options = ["--debug"]

# A traced region declared by a package compiled on its own, whose methods are
# all private and none inline, as a collector's are: the program's traces,
# allocations and stores call its 'mark', 'alloc' and 'writeBarrier' in the
# package's object, so the library exports all three, and its include file
# declares the region 'Traced'.
[scenario.region_traced_link]
category = "run"
description = "A traced region of a package compiled on its own: the program's traces (a record's, and mem.trace in line) call its private, non-inline 'mark', its allocations its 'alloc', and a store into one of its objects its 'writeBarrier', all exported from the package's object; the include file keeps 'is RegionRef, Traced'"
tags = ["genllvm", "runtime"]
link = ["package/tracer.conebuild"]
include = ["include/tracer.cone"]

# Roots: every function holding a traced reference on its stack -- a local's,
# a parameter's, or a birth's (an allocation's, a call's result, a load through
# a reference, each rooted in a slot of its own as it is made) -- links a frame
# of them into one chain, and 'mem.traceRoots' hands each root to its region's
# 'mark'. The toy region counts marks and its 'roots' prints what the roots
# reach, so the .out file is the whole runtime assertion, each line
# hand-checked in the source: a local, a temporary across a call, a callee's
# frame and its pop, recursion, an early return from inside a loop, 'break'
# and 'continue', a load through a reference, a structure built across calls,
# a struct and a tuple held by value, a generic's instance, an inline
# function's parameters, and a traced allocation evaluating its value before
# its 'alloc'. The checks pin the frame's shape: a function with no root has
# none.
[scenario.region_roots]
category = "run"
description = "Roots: each function holding traced references links a frame of its roots (locals, parameters, births) into one chain, pushed at entry and popped at every return; mem.traceRoots marks exactly what they hold; a traced allocation evaluates its init's arguments before its alloc, then roots its block, its value zeroed, until the value is filled"
tags = ["genllvm", "runtime"]

[[scenario.region_roots.check]]
name = "frame"
target = "preir"
contains = [
  "@cone_gcframes = external thread_local global ptr",
  "%gcframe = alloca { ptr, ptr, [2 x ptr] }, align 8",
  "store ptr %gcframe, ptr @cone_gcframes, align 8",
  "store ptr %gcprev, ptr @cone_gcframes, align 8",
  "call void @cone_traceRoots(i32 0)",
]

# A Pair holds traced references, so its new block's value is zeroed, then the
# block rooted in its own slot, then the value stored, then the slot let go
# (each line alone, since a debug build appends its location to each)
[[scenario.region_roots.check]]
name = "allocation-rooted-and-zeroed-while-filled"
target = "preir"
contains = [
  "store %Pair zeroinitializer, ptr %5, align 8",
  "store ptr %5, ptr %filling13, align 8",
  "store %Pair %literal8, ptr %5, align 8",
  "store ptr null, ptr %filling13, align 8",
]

[[scenario.region_roots.run]]
name = "release"
options = []

[[scenario.region_roots.run]]
name = "debug"
options = ["--debug"]

# Roots across objects: a package compiled on its own holds traced references
# in its own frames while it calls back into the program, and the program's
# frames and the package's are links of the one chain whose head conestd
# defines.
[scenario.region_roots_link]
category = "run"
description = "Frames of traced references in a program and in a package compiled on its own are one chain: a trace from the package's code during a callback finds the program's roots and its own"
tags = ["genllvm", "runtime"]
link = ["package/keeper.conebuild"]
include = ["include/keeper.cone"]

# The rcweak package's weak reference, found on the search path and compiled
# into the scenario's object, as geomath is in module_package_geomath. Its
# runtime behaviour is the package's own tests'; this pins what is refused.
[scenario.region_flow_rcweak_refuse]
category = "reject"
description = "A weak reference is made only from a shared 'Rcw[mut, T]' owner, cannot be read through or opened, moves, and takes a unique owner by giving it up"
tags = ["typecheck", "flow"]

# A value held by 'So' or 'Rc' is finalized when it dies -- its 'final', its
# finalizing fields, then the owners its fields hold, then 'free' -- and only
# once: 'Rc' at its last owner, a reassignment's old value when it is
# replaced, a value moved to a callee there. Before this, a region-held value
# was never finalized; the stack value is the control. The .out file is the
# whole assertion.
[scenario.region_final]
category = "run"
description = "A value held by a region is finalized once, when it dies: its final, then its finalizing fields, then the owners its fields hold, then its memory"
tags = ["flow", "genllvm", "runtime"]

# Moving a value out through a sole owner, or an element of the array it
# points at, leaves the owner hollow: its allocation is freed without finalizing what
# moved. The regions print their frees, so the .out file is the whole
# assertion; the file's header states each rule. An owner hollowed on one path
# only has a drop flag: on the path that did not move out through it, what
# stayed is finalized before the memory is freed.
[scenario.region_hollow]
category = "run"
description = "Moving a value out through a sole owning reference, directly or through another it owns, or the whole array it points at, frees the allocation without finalizing what moved"
tags = ["flow", "genllvm", "runtime"]

# An owning reference whose state at its release differs by path has a drop
# flag: its region's death, or a counted owner's dealiasRef, happens once, on
# the path that still holds it.
[scenario.region_drop_flags]
category = "run"
description = "A sole owner moved on one branch, handed on by one branch of an 'if' value, or given a value on one branch only; a counted owner moved on one branch; a struct, a tuple and an array holding owners moved on one branch; and a sole owner reassigned in a loop after a move in an earlier pass: each dies once, on the path that still holds it"
tags = ["flow", "genllvm", "runtime"]

[scenario.region_success]
category = "run"
description = "Allocating in a region, reference counting, single ownership, permissions, and owning references through fields, calls and branches"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# An assignment's value is kept by its target, so a copy of it -- a second
# target, an initializer, an argument -- counts one more holder of a counted
# reference. Before, 'a = b = new ...' left one count for two holders, and the
# second release freed the allocation again (region_success's heap corruption
# under the checking debug heap). Every line is worked out by hand.
[scenario.region_assign_value_count]
category = "run"
description = "A copy of an assignment's value counts one more holder of a counted reference, its target keeping the value it stored"
tags = ["flow", "runtime"]

[scenario.region_new]
category = "run"
description = "'new Rc[mut, Node](1)' allocates in So, Rc, Arc, Rcw, a region written in Cone and a generic region's instance; uni when the permission is left out, through an alias, named fields, coerced to a virtual reference; the order arguments, alloc, region init, value init in place; 'trynew' gives Some, or None from a failing region"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.region_new_value]
category = "run"
description = "An allocation's one argument a finished value, moved in: in So, Rc, Arc, Rcw and a region written in Cone; a number literal adopting the value type, a variable, a call's result, an array literal, a tuple, a variant becoming its enum; a struct's own value (through an alias too) moved in while other arguments go to its inits; the order value, alloc, region init, store; 'trynew' giving Some, or None from a failing region"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# An allocation with contents after '<-'. A 'run' because the claim is that
# each element is filled where it lives, in order, after the region's 'alloc'
# and 'init', which only the printed order and values show. The checks hold
# that a million scalars are filled in the allocation's memory: a null fill is
# one memset there, a repeated value a loop, and nothing anywhere is an
# aggregate the size of the array.
[scenario.region_new_contents]
category = "run"
description = "An allocation's contents after '<-' fill its value in place: an array in Rc, So and a region written in Cone, every entry form, several sizes by scalars, nested by rows, through an alias; a million scalars; the order alloc, region init, each value; 'trynew' filling only on Some; a List's contents appended through the reference"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[[scenario.region_new_contents.check]]
name = "a-million-scalars-fill-in-place-with-no-aggregate"
target = "preir"
contains = ["i8 0, i64 4000000, i1 false)",
            "%fillmore = icmp ult i64 %fillnext, 1000000"]
excludes = ["store [1000 x [1000 x i32]]", "store [1000000 x i32]",
            "load [1000 x [1000 x i32]]", "load [1000000 x i32]",
            "insertvalue [1000000 x i32]"]

# Separate from region_success because it is the scenario a code generation fix
# landed with: without it, genlallocref's phi named a predecessor that the inner
# allocation's branches had already displaced, and the module failed verification.
[scenario.region_nested_alloc]
category = "run"
description = "An allocation whose initial value holds another allocation"
tags = ["genllvm", "runtime"]

[scenario.region_so_move]
category = "run"
description = "Moving a 'So' reference between variables transfers ownership, and frees it once"
tags = ["flow", "genllvm", "runtime"]

# The accepting half of region_flow_shared_move: a sole owner ('So[T]', 'Rc[uni, T]',
# 'Rc[T]') gives its value up and the new holder finalizes it once, and a copy
# value reads out through a shared owner. A field of the value is never given
# up (move_flow_field). The .out file is the whole assertion.
[scenario.region_owner_move]
category = "run"
description = "A sole owning reference may move its value out, finalized once by the new holder, and a copy value reads out through a shared one"
tags = ["flow", "genllvm", "runtime"]

[scenario.region_owning_field]
category = "run"
description = "Releasing a region-allocated struct releases the 'Rc' reference its field owns"
tags = ["genllvm", "runtime"]

[scenario.region_reftype]
category = "run"
description = "The managed reference type 'Rc[mut, Node]': uni when the permission is left out, virtual exactly when the value type is an open trait and thin for an enum, as a field, a parameter, a return type, an alias, inside Option and List, and inferred through"
tags = ["parse", "typecheck", "runtime"]

[scenario.region_uninit_owning]
category = "run"
description = "Assigning to an owning-reference variable declared without an initial value releases nothing first"
tags = ["flow", "genllvm", "runtime"]

# The companion of region_uninit_owning: that one assigns after declaring, this
# one never assigns at all. The run is the claim -- without the fix the program
# frees the garbage in the declared slots and dies of heap corruption -- and the
# check says why in the one place it can be seen: the module holds no release at
# all, neither the 'free' an 'So' variable would get nor the count adjustment an
# 'Rc' one would. Read before optimization, as region_tuple_return is. Every
# call of a region's 'aliasRef', 'dealiasRef' or 'free' is handed the allocation's
# header, which generation names 'header', so '%header' is excluded here and in
# the exclude checks below that say nothing is released, with the free call and
# the count's arithmetic that 'Rc''s methods write out in line.
[scenario.region_uninit_never_assigned]
category = "run"
description = "An owning-reference variable declared without a value and never assigned one releases nothing at scope exit"
tags = ["flow", "genllvm", "runtime"]

[[scenario.region_uninit_never_assigned.check]]
name = "never-assigned-variables-not-released"
target = "preir"
excludes = ["allocref", "call %void @cone_rawBlockRelease(", "add i64", "sub i64"]

# The run is the claim: without the fix the compiler faults before emitting
# anything. The check is the layout, which the run cannot see: an Option of an
# owning reference takes the nullable-pointer shape enum_nullable_ptr owns, so
# the locals 'main' holds one in for Rc, So and NeverAllocs are each a bare pointer,
# and no tag or wrapper struct is emitted for the Option or either variant.
# Read before optimization, where the locals are still allocas.
[scenario.region_fallible_alloc]
category = "run"
description = "'trynew R[perm, T](value)' with a finished value (a number here; with a construction it is region_new's) yields an Option holding the owning reference, or empty when the region's alloc returns null"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

[[scenario.region_fallible_alloc.check]]
name = "option-of-owning-ref-is-a-bare-pointer"
target = "preir"
contains = ["%a = alloca ptr, align 8", "%c = alloca ptr, align 8", "%e = alloca ptr, align 8"]
excludes = ["%Option", "%Some", "%None"]

# The owners an enum holds: released as the enum value dies, through the
# nullable pointer's null test or the tag, and counted once more for each copy
# of an enum -- or a struct holding one -- that holds a counted reference.
# Every line is the counting region's own report, worked out by hand.
[scenario.region_enum_owner]
category = "run"
description = "An owning reference held in an enum is released when the enum value dies, and a copy of an enum holding a counted one counts one more owner"
tags = ["flow", "genllvm", "runtime"]

# The same count for every other value that releases a counted reference as it
# dies: a struct holding one in a field, a tuple or an array in an element,
# however deep; a tuple literal's copies of one read out of a variable; and an
# array's contents repeating such a value, a copy in each element, or an
# allocation, a new one in each. Every line is the counting region's own
# report, worked out by hand.
[scenario.region_held_counted]
category = "run"
description = "A copy of a struct, tuple or array holding a counted reference counts one more owner, and the value releases it as it dies"
tags = ["flow", "genllvm", "runtime"]

# A counted reference handed out of a scope as a copy of something still held
# there -- a field or an element of a local the scope releases, a field read
# through a borrowed 'self', a variable of an enclosing scope -- counts one
# more holder; a local or a parameter handed back whole does not, the scope's
# release exempting it. Before, none of them was counted: the value was
# finalized while the caller held it. Every line is worked out by hand.
[scenario.region_result_count]
category = "run"
description = "A copy handed out of a scope from a part of a local, a borrow or an enclosing scope counts one more holder; a local handed back whole does not"
tags = ["flow", "runtime"]

[scenario.region_borrow_coerce]
category = "compile"
description = "An owning reference coerces to a borrowed reference"
tags = ["typecheck"]

[scenario.region_owning_field_so]
category = "run"
description = "Releasing a region-allocated struct releases the 'So' reference its field owns, once"
tags = ["flow", "genllvm", "runtime"]

# The claim is the count, because a run cannot see it: without the fix the read
# after the early free still finds the value, and the second release decrements
# freed memory rather than freeing it twice. 'aliasAcross' is the module's only
# function that counts, so its one increment is the alias's. The register was
# read from the pre-optimization dump; without the fix the module holds the two
# releases and no increment.
[scenario.region_enrich_count]
category = "compile"
description = "An Rc alias taken under an enrichment's name adds a holder, as one under the same name does"
tags = ["flow", "genllvm"]

[[scenario.region_enrich_count.check]]
name = "alias-across-an-enrichment-is-counted"
target = "preir"
contains = ["%7 = add i32 %6, 1"]

# Returning owning references in a value tuple. The claim is that 'pair' adjusts
# no counter at all: both allocations are handed to the caller, so neither is
# released on the way out. The file holds nothing but that one function, which
# is what lets the check exclude the counter adjustment across the whole module
# rather than having to name a register. Without the fix the module carries two
# of them -- a use after free, then a double free, in a program that compiled
# clean. Read before optimization: after it the module holds nothing at all,
# and the exclude would pass for the wrong reason.
[scenario.region_tuple_return]
category = "compile"
description = "Owning references returned in a value tuple are handed to the caller, not released"
tags = ["flow", "genllvm"]

[[scenario.region_tuple_return.check]]
name = "returned-tuple-elements-not-released"
target = "preir"
excludes = ["allocref", "call %void @cone_rawBlockRelease(", "add i64", "sub i64"]

# The caller's side of region_tuple_return: a tuple held in a variable is one
# holder of each Rc reference it carries. Destructuring it, or copying it whole,
# adds a holder per Rc element, and the variable releases its elements at scope
# exit. The run says the program frees nothing twice; the checks say the counts
# are what make that so, since a leak would print the same. Each holder added
# is 'Rc''s 'aliasRef' written out in line, whose 'cnt + 1' is a '+1' line below,
# and each released its 'dealiasRef', whose 'cnt - 1' is a '-1' ('sub ..., 1')
# line. Register numbers were read out of the pre-optimization dump, and where
# another function writes the same line, the check carries the lines before it
# that only this one writes: the load of the count's own 'cnt' address, or, in
# 'mixed', the whole release from the '{ ptr, i32 }' element it begins with. In
# 'twiceFromVariable' the two '+1' lines are the second destructuring's, and the
# two '-1' lines are the tuple variable's own release, the last in the function,
# after the four destructured variables'; in 'mixed' the '+1' is the second
# destructuring's one counted element and the '-1' the tuple's release of it; in
# 'wholeCopy' the two '-1' lines are the previous value released when 'v' is
# overwritten, read from what the store loads as 'dealiasref'. Without the fix
# the module holds no '+1' at all and no tuple release. The 'So' spelling is a
# move, so the destructured 't' releases nothing and the run is the whole claim
# there; a 'So' tuple left in its variable is freed through it, and the last
# check names the two elements 'soWholeVariable' finalizes in place, each
# reached by its address in the variable, and the free of each.
[scenario.region_tuple_destructure]
category = "run"
description = "Destructuring or copying a tuple variable counts each Rc element it carries, and the variable releases what it holds at scope exit"
tags = ["flow", "genllvm", "runtime"]

[[scenario.region_tuple_destructure.check]]
name = "destructured-elements-gain-a-holder"
target = "preir"
contains = ["%14 = add i32 %13, 1", "%23 = add i32 %22, 1", "%30 = add i32 %29, 1"]

[[scenario.region_tuple_destructure.check]]
name = "tuple-variable-releases-its-elements"
target = "preir"
contains = [
  "%67 = load i32, ptr %cnt100, align 4\n  %68 = sub i32 %67, 1",
  "%74 = load i32, ptr %cnt115, align 4\n  %75 = sub i32 %74, 1",
  "%tupelem = getelementptr inbounds nuw { ptr, i32 }, ptr %t, i32 0, i32 0\n  %finalref47 = load ptr, ptr %tupelem, align 8\n  %38 = getelementptr i8, ptr %finalref47, i64 -8\n  store ptr %38, ptr %self48, align 8\n  %self49 = load ptr, ptr %self48, align 8\n  %cnt50 = getelementptr inbounds nuw %Rc, ptr %self49, i32 0, i32 0\n  %39 = load i32, ptr %cnt50, align 4\n  %40 = sub i32 %39, 1",
]

[[scenario.region_tuple_destructure.check]]
name = "overwritten-tuple-releases-previous-elements"
target = "preir"
contains = [
  "%dealiasref = load { ptr, ptr }, ptr %v, align 8",
  "%45 = load i32, ptr %cnt61, align 4\n  %46 = sub i32 %45, 1",
  "%54 = sub i32 %53, 1",
]

[[scenario.region_tuple_destructure.check]]
name = "so-tuple-left-in-variable-is-freed-through-it"
target = "preir"
contains = [
  "%tupelem = getelementptr inbounds nuw { ptr, ptr }, ptr %t, i32 0, i32 0\n  %finalref = load ptr, ptr %tupelem, align 8\n  store ptr %finalref, ptr %self, align 8\n  %self4 = load ptr, ptr %self, align 8\n  store ptr %self4, ptr %block, align 8\n  %block5 = load ptr, ptr %block, align 8\n  %6 = call %void @cone_rawBlockRelease(ptr %block5)",
  "%tupelem6 = getelementptr inbounds nuw { ptr, ptr }, ptr %t, i32 0, i32 1\n  %finalref7 = load ptr, ptr %tupelem6, align 8\n  store ptr %finalref7, ptr %self8, align 8\n  %self9 = load ptr, ptr %self8, align 8\n  store ptr %self9, ptr %block10, align 8\n  %block11 = load ptr, ptr %block10, align 8\n  %7 = call %void @cone_rawBlockRelease(ptr %block11)",
]

# The same two claims for a tuple type named by an alias, which is what says an
# alias counts exactly as the spelled-out type does rather than merely
# compiling. The registers are the second destructure's three '+1' lines and the
# three the tuple variable's own release writes, in 'aliasTrioFromVariable';
# three elements rather than two is what makes them the file's own.
[[scenario.region_tuple_destructure.check]]
name = "alias-destructured-elements-gain-a-holder"
target = "preir"
contains = ["%31 = add i32 %30, 1", "%38 = add i32 %37, 1", "%45 = add i32 %44, 1"]

[[scenario.region_tuple_destructure.check]]
name = "alias-tuple-variable-releases-its-elements"
target = "preir"
contains = ["%100 = sub i32 %99, 1", "%107 = sub i32 %106, 1", "%114 = sub i32 %113, 1"]

# A local moved into a call that is the block's final expression. The claim is
# that nothing in this module is released: every allocation is handed on, to a
# callee that returns its parameter or straight back to the caller. The file
# holds nothing else, which is what lets the check exclude the free and the
# counter adjustment across the whole module rather than having to name a
# register. Without the fix each of the four final-position spellings frees or
# decrements what it just handed over -- a double free for 'So', a count too
# many for 'Rc' -- in a program that compiled clean. Read before optimization,
# as region_tuple_return is: after it the module holds nothing at all and the
# exclude would pass for the wrong reason.
[scenario.region_tail_move]
category = "compile"
description = "A local moved into a call in a block's final position is handed over, not also released"
tags = ["flow", "genllvm"]

[[scenario.region_tail_move.check]]
name = "tail-call-move-releases-nothing"
target = "preir"
excludes = ["allocref", "call %void @cone_rawBlockRelease(", "add i64"]

# The same release list, for a value whose type has a drop fn, where a run can
# see it: the drop fn prints. Three claims share the file because one list makes
# all of them. A value the scope hands back is the caller's to finalize --
# the exemption the owning-reference arm had and the drop-fn arm did not, so a
# struct returned by name was finalized by its maker and again by its receiver.
# And a local moved into a call in final position has left, while a local that
# stayed has not, which is region_tail_move's claim in the spelling that prints.
# The third is which local the exemption is for: it matched the result by name,
# and a 'return' asks it over the whole function's stack, so an outer name a
# nested block shadowed was exempted along with the inner one the return named,
# and was never finalized at all.
# The .out file is the whole assertion: the order is reverse declaration order
# and each tag appears once.
[scenario.region_tail_move_drop]
category = "run"
description = "A value with a drop fn that the scope hands back is finalized by the caller, once, and only a local that stayed is finalized on the way out"
tags = ["flow", "genllvm", "runtime"]

# The drop-fn side of region_jump_release, which a run can see for the same
# reason: the drop fn prints, where a release of an owning reference does not.
# flowScopeDealias positions its injected drop call on the scope's result
# expression, and a 'continue' has none, so a 'continue' in a loop holding a
# local with a 'final' method dereferenced NULL and crashed the compiler. Every
# spelling that reaches the same arm is here: bare and labelled, in a 'while' and
# in an 'each', with a local declared inside the loop body and one outside it.
[scenario.region_jump_drop]
category = "run"
description = "A break or continue finalizes the drop-fn local in every scope it leaves, once, and none in a scope it does not"
tags = ["flow", "genllvm", "runtime"]

# What a break or a continue releases. Two counts, in two functions, and neither
# is visible to a run: too few releases leaks, too many frees what is still
# held, and stdout shows neither. The
# register numbers below were read out of the pre-optimization dump rather than
# chosen. Each release is 'Rc''s 'dealiasRef' written out in line, whose 'cnt - 1'
# is the pinned subtraction: the continue's one, and the break's two -- 'inner'
# then 'outer', on the path that ends at the loop's exit, before the loop's own
# end-of-iteration release of 'outer' (%20). Without the fix 'continueReleases'
# releases nothing at all and 'breakReleasesEveryScope' one instead of two.
[scenario.region_jump_release]
category = "compile"
description = "A break or continue releases every scope it leaves, and a continue releases at all"
tags = ["flow", "genllvm"]

[[scenario.region_jump_release.check]]
name = "continue-releases-its-scope"
target = "preir"
contains = ["%4 = sub i32 %3, 1"]

[[scenario.region_jump_release.check]]
name = "break-releases-the-scopes-between"
target = "preir"
contains = ["%6 = sub i32 %5, 1", "%13 = sub i32 %12, 1"]

# Reassigning a variable that holds an 'So' reference frees the value it held,
# in every spelling the store has: a single reference, a struct field, and each
# iteration of a loop. The run shows the new values arrive, and that
# nothing is freed twice -- a first assignment to a declared-but-empty variable
# and a reassignment after a move both release nothing first, and on Windows a
# double free dies of heap corruption. What the run cannot show is that the
# release is emitted at all, since a leak prints the same. The store releases
# the old value through what it loads as 'dealiasref', and 'So''s 'free' is
# handed that value's header, so the first check names the previous value
# freed: 'dealiasref' stored as the header 'free' takes as 'self'; the free
# reassign and fieldReassign each make of it (%4, the same register in both);
# and the loop body's (%5). The numbers were read out of the pre-optimization dump, and
# before the fix the module holds none of them. The second check is the 'uni'
# 'Rc' spelling of the moved-out gate: a count is not dropped a second time by
# the reassignment, which the run cannot see because the decrement lands in
# freed memory. Its one decrement, 'Rc''s 'dealiasRef' written out in line, is the
# scope exit's, at the register it has only when no other precedes it.
[scenario.region_so_reassign]
category = "run"
description = "Reassigning an 'So' reference or field frees the value it held; a variable holding nothing -- uninitialized or moved out -- releases nothing first"
tags = ["flow", "genllvm", "runtime"]

[[scenario.region_so_reassign.check]]
name = "reassignment-frees-the-previous-so-value"
target = "preir"
contains = [
  "store ptr %dealiasref, ptr %self, align 8",
  "%4 = call %void @cone_rawBlockRelease(ptr %block16)",
  "%5 = call %void @cone_rawBlockRelease(ptr %block19)",
]

[[scenario.region_so_reassign.check]]
name = "moved-out-uni-rc-not-dropped-again-on-reassignment"
target = "preir"
contains = ["%10 = sub i32 %9, 1"]

# An alias is transparent, so an owning type reached through one is
# released exactly as the type it names is. Nothing rewrites the alias away: a
# declaration keeps the name it was written with as its 'vtype', so every site
# that asks what a variable or field holds must resolve it. The run covers the
# spellings that already did -- a local, a reassignment and a move-out, in 'So',
# 'Rc', an alias of an alias, and a struct with a finalizer --
# and the check covers the one that did not: the release of a struct's fields
# read a field's declared type raw, so a struct's owning field spelled through an
# alias leaked on every release. A leak prints what correct code prints, so the
# check names the field GEPs that begin the two releases in Held's generated
# drop, read out of the pre-optimization dump; before the fix the module holds
# neither.
[scenario.region_alias_release]
category = "run"
description = "An owning reference or finalized struct declared through an alias is released as the aliased type is, as a variable and as a struct field"
tags = ["flow", "genllvm", "runtime"]

[[scenario.region_alias_release.check]]
name = "aliased-owning-fields-released-with-their-struct"
target = "preir"
contains = [
  "%r = getelementptr inbounds nuw %Held, ptr %0, i32 0, i32 0",
  "%s = getelementptr inbounds nuw %Held, ptr %0, i32 0, i32 1",
]

# A program that declares C's 'free' itself links beside the releases 'So' and
# 'Rc' make, which go through the raw blocks layer. The run is the claim, since a
# second declaration of 'free' would be renamed 'free.1' and fail at the linker;
# the check names the two releases (soValue's, and rcValue's at a zero count)
# calling the layer, the program's declaration the module's only 'free', and that
# no renamed one exists. The registers were read out of the dump.
[scenario.region_program_free]
category = "run"
description = "A program declaring C's 'free' in its own signature links and runs beside 'So' and 'Rc' releases, which go through the raw blocks layer, so the program's declaration is the only one"
tags = ["genllvm", "runtime"]

[[scenario.region_program_free.check]]
name = "releases-go-through-the-raw-blocks-layer"
target = "preir"
contains = [
  "declare %void @free(ptr)",
  "%3 = call %void @cone_rawBlockRelease(ptr %block6)",
  "%9 = call %void @cone_rawBlockRelease(ptr %block14)",
]
excludes = ["@free.1"]

# The raw blocks layer, core's 'RawBlocks': alloc, resize (grown and shrunk with
# the first bytes kept, a null block allocated) and release (a null block
# nothing), and 'So' and 'Rc', which allocate and release through it. The run is
# the claim; the sums were added by hand (1 to 16 is 136, 1 to 8 is 36) and 41 +
# 43 is 84. The check names the three calls the layer's functions are bound to.
[scenario.region_raw_blocks]
category = "run"
description = "The raw blocks layer: a block allocated, grown and shrunk with its first bytes kept, a null block resized into an allocation, a null block released as nothing, and 'So' and 'Rc' values made and let go through it"
tags = ["genllvm", "runtime"]

[[scenario.region_raw_blocks.check]]
name = "the-layer-is-bound-to-conestds-three-functions"
target = "preir"
contains = [
  "call ptr @cone_rawBlockAlloc(",
  "call ptr @cone_rawBlockResize(",
  "call %void @cone_rawBlockRelease(",
]

# -------- parse stage --------

[scenario.region_parse]
category = "reject"
description = "A '+' with no region annotation, and a '-' with no permission after it"
tags = ["parse"]
diagnostics = 4

# The owning array reference '+[]', which the language does not have, refused
# once at the token wherever it is written -- an alias, a field, a parameter, a
# return type, an allocation of a listed array, a generic's
# parameter -- and read through, so nothing after it is reported as well. The
# message names 'So[Array[T]]', the owned run-time-sized array, and '&Array[T]',
# the borrowed slice, which stays.
[scenario.region_parse_owned_arrayref]
category = "reject"
description = "'+[]', as a type or an allocation, refused: an owned run-time-sized array is a So[Array[T]], shared as Rc[Array[T]]"
tags = ["parse"]
diagnostics = 7

# -------- type check stage --------

[scenario.region_typecheck_alloc]
category = "reject"
description = "Values that may not be allocated, and names that may not be a region"
tags = ["typecheck"]
diagnostics = 4

[scenario.region_typecheck_body]
category = "reject"
description = "The body of bytes, which a reference carries the length of, held by value (a field, a parameter, a local read out through a reference), allocated with no view, two, or a number, borrowed '&mut' (it declares Immutable), converted to a number, a pointer or a reference to a number, its size asked; and a unique owner of it ('Rc[uni, str]') moved"
tags = ["typecheck", "flow"]
diagnostics = 13

[scenario.region_typecheck_contents]
category = "reject"
description = "An allocation's array contents refused as a construction's are: too few values, rows for an array written with several sizes, arguments beside the contents, a product of sizes past 4294967295; contents after a 'trynew' of a List, refused once with their own code"
tags = ["typecheck"]
diagnostics = 6

[scenario.region_typecheck_new]
category = "reject"
description = "Every allocation written with the retired '+' (a construction, a number, a variable, a call, an array, a tuple, a variant; plain, fallible, around 'new'), 'trynew' on a struct or a number, 'new' given a borrowed reference or a virtual one; an allocation of a type no init constructs given other than one value of it, or a value of another type; a struct's one argument not of the struct itself going to its inits"
tags = ["typecheck"]
diagnostics = 26

[scenario.region_typecheck_region]
category = "reject"
description = "The shape of each region method, checked where the region is declared (an 'alloc' taking anything but the size and, after it, the type record), and an allocation from a region with no 'alloc'"
tags = ["typecheck"]
diagnostics = 11

[scenario.region_typecheck_init]
category = "reject"
description = "The 'init' method a region or a permission may declare, and its required shape"
tags = ["typecheck"]
diagnostics = 4

[scenario.region_typecheck_set]
category = "reject"
description = "No set of region methods is refused for what it leaves out, nor 'Move' without 'aliasRef'; the one refusal is 'Move' with 'aliasRef', in either order of the 'is' list, which contradicts itself"
tags = ["typecheck"]
diagnostics = 2

[scenario.region_typecheck_regionref]
category = "reject"
description = "A region that does not declare 'is RegionRef', and 'RegionRef' where it may not stand: as a type, or on a trait, an enum or a variant"
tags = ["typecheck"]
diagnostics = 7

[scenario.region_typecheck_traced]
category = "reject"
description = "What a region ref declaring 'Traced' promises: a 'mark' of one of the two shapes a trace calls, a 'writeBarrier' (where it declares one) of the one shape a store calls, not 'Move'; and only a region ref may declare it. Both shapes of 'mark', a traced region with 'writeBarrier', and one with 'dealiasRef', are accepted"
tags = ["typecheck"]
diagnostics = 15

[scenario.region_typecheck_threadsafe]
category = "reject"
description = "Only a region ref or a lock permission may declare 'ThreadSafe': a plain struct, a trait, an enum and a variant declaring it are refused; a counted region ref, one with no alias and a lock permission declaring it are accepted"
tags = ["typecheck"]
diagnostics = 4

[scenario.region_typecheck_reftype]
category = "reject"
description = "What a managed reference type may not say: a permission given to a head that is no region, a generic's included; more than two arguments; a first of two that is no permission, a last that is one, a value where the type goes; the '+R-perm T' spelling as a type, thin or virtual; and a second use of a uni owner, which moved"
tags = ["typecheck", "flow"]
diagnostics = 9

[scenario.region_typecheck_traced_place]
category = "reject"
description = "Where a traced reference may not be held: behind an owning reference of a region a trace cannot pass through (several owners and no visit; a traced region with a write barrier), in a global, placed raw by mem.writeRaw or mem.moveRaw from a type declaring no GcTraceElements (directly, and through a container of the program's own, reported at the program's instantiation); in a root whose type needs tracing and cannot be traced; and what a traced region may not allocate: a value holding a borrow, a virtual reference, a lock permission. Rc and So (also self-referring), List, Arena and Pool holding traced references are accepted"
tags = ["typecheck"]
diagnostics = 12

[scenario.region_typecheck_coerce]
category = "reject"
description = "The region coercions that must stay refused: a borrow standing in for an allocation, and one region's allocation for another's"
tags = ["typecheck"]
diagnostics = 3

[scenario.region_typecheck_uni_view]
category = "reject"
description = "A borrow of a sole owner seen as a borrow of a shared one -- 'Rc[T]' as 'Rc[mut, T]', 'Rc[imm, T]' or 'Rc[ro, T]', a slice of them, a returned borrow, a user region -- is refused; the same view of a 'So' owner, and a move, are not"
tags = ["typecheck"]
diagnostics = 8

# -------- flow stage --------

[scenario.region_flow]
category = "reject"
description = "Owning references that move rather than copy, those into a region neither counted nor Move that copy freely and may not be moved out through, a permission that forbids the write, and a move value moved into an allocation as its finished value"
tags = ["flow"]
diagnostics = 9

[scenario.region_flow_shared_move]
category = "reject"
description = "Moving a value out through a shared owning reference -- every aliasable 'Rc' permission, a counted field, an array element, a by-value 'self', a call argument and a return -- is refused"
tags = ["flow"]
diagnostics = 9

[scenario.region_flow_borrowmoved]
category = "reject"
description = "Borrowing a sole owning reference's variable after its reference moved out or was hollowed -- the variable, its referent, a field, the receiver of a method -- is refused; a new reference makes it borrowable again"
tags = ["flow"]
diagnostics = 6

# The owner is a shape-changing value: storing over it frees what it points at, so a borrow
# into what it owns is refused beside a call or a store that could replace it through another
# name (the shape check of reshape.h, with the owner as the container). The accepting half
# is region_owner_replace_success
[scenario.region_flow_owner_replace]
category = "reject"
description = "A borrow of what an owner ('So', 'Rc') owns, held beside a call whose body stores over an owner of the type, or a store over one: a local lent '&mut' with its contents to one call (also an owner lent as its own method's receiver, a shared 'Rc' a local holds, a callee of the callee), an array element, two '&mut' owner parameters, the same name, a swap, an owner in a field, in a ship nested in another or in an Option, the whole ship stored over, a method of the holder"
tags = ["flow"]
diagnostics = 20

[scenario.region_owner_replace_success]
category = "run"
description = "A borrow of what an owner owns beside a callee that only reads, writes the Item or replaces it in place, an owner of another type replaced, another field written, the owner replaced after the borrow's last use, a local owner no borrow points into, a method that leaves the owner alone, an owner lent as the receiver of its own method that stores over an owner of its type in a field, and a counted owner replaced after the last use; values and finalizers checked"
tags = ["flow", "genllvm", "runtime"]

# The arena package's Arena, held in a local, is the scratch arena: what its
# 'alloc' returns is a borrow of the local, and this pins that every route the
# borrow rules check refuses it. The package is found on the search path and
# compiled into the scenario's object, as geomath is in module_package_geomath.
# An allocation keeps its arena alive but loans nothing else of it (the arena
# declares 'NoLoanMut'); an owning reference coerced to a borrow lends what it
# owns. Uses the arena package.
[scenario.region_flow_arena_freeze]
category = "reject"
description = "An arena moved, moved into a variable, swapped, replaced or ended while an allocation from it, bare or held in a struct, is still to be used; an owner moved while the borrow its coercion made is"
tags = ["flow"]
diagnostics = 6
[scenario.region_flow_arena_escape]
category = "reject"
description = "A borrow into an arena held in a local, bare, in a value built around it or read back out of the arena's list, may not be returned, alone, through a variable, in a tuple or back through a call, nor stored where it outlives the arena, nor kept past the arena and used"
tags = ["flow"]
diagnostics = 13

# An allocation that names an arena value, 'new a[Pt](1, 2)', is 'a.alloc(new
# Pt(1, 2))': the type in the brackets after the arena, a 'mut' before it if
# one is written. Uses the arena and collections packages.
[scenario.region_new_arena]
category = "run"
description = "'new a[T](args)' in an Arena (a value, the permission 'mut' written, named fields, a List with a starting size, a type with a 'final' finalized newest first at the arena's death) and in a DynArena (a key read and written through the arena)"
tags = ["typecheck", "genllvm", "runtime"]

# An allocation whose head leads to a region: its type has an 'allocRegion'
# method giving the region value. An actor's state has one, generated by the
# compiler (the actors package's gc tests), and so does a type of the program's
# own that owns an arena, here. Uses the arena and collections packages.
[scenario.region_new_leads]
category = "run"
description = "'new x[T](args)' with x a value whose type has an 'allocRegion' method allocates in the region value it gives (an arena the type owns): a struct, the permission 'mut' written, a type with a 'final' finalized newest first when the arena dies"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.region_typecheck_new_arena]
category = "reject"
description = "An allocation in an arena written as a 'trynew', with a permission the arena does not lend, with a permission and no type, with more than a permission and a type, or from a head that is not a region (a number; a struct with an 'alloc' method; one whose first '*MemRegion' field is not public); the good forms stand beside them"
tags = ["typecheck"]
diagnostics = 7

# A type made in a region with 'new a[T](args)' is handed that region when it
# names none: the head's first field, a '*MemRegion'. Any struct with such a
# first field and an 'alloc' is a region; an Arena's region is its own.
[scenario.region_new_region_value]
category = "run"
description = "'new r[T](args)' hands the region in the head's first field to a CarriesRegion type made in it: a user's own region struct (counted), an explicit region passed in the arguments still winning, a type that does not carry a region unaffected, and an Arena's region being the one its lists grow in"
tags = ["typecheck", "genllvm", "runtime"]

# An inline function that places memory and then moves its parameter into it
# (an arena's 'alloc') is handed a construction as it stands and builds it in
# the place, once its arguments are evaluated.
[scenario.region_inline_place]
category = "run"
description = "An inline function that takes room and then writes its parameter with mem.writeRaw is called with a construction by a declared init: the arguments are evaluated, the room taken, and the init runs in it (directly, and through a second inline function the parameter is passed to); a function that uses its parameter before the write, and one that is not inline, build the value first and move it; nothing is finalized twice"
tags = ["genllvm", "runtime"]

[scenario.region_flow_arena_new]
category = "reject"
description = "What 'new a[T](...)' gives is a borrow of the arena held in a local: it may not be returned, alone or through a variable, nor kept past the arena and used, nor may the arena be moved while it is used"
tags = ["flow"]
diagnostics = 4

# The pool package's generational Pool: 'pool[r]' and '&mut pool[r]' return a
# bare borrow of the pool, and 'get' an Option holding one, and this pins that
# every route the borrow rules check refuses them.
[scenario.region_flow_pool_escape]
category = "reject"
description = "A borrow of a value in a generational pool held in a local, bare or in a 'get''s Option, may not be returned, alone or through a variable, nor stored where it outlives the pool, nor kept past the pool and used"
tags = ["flow"]
diagnostics = 9

# A borrow from 'get' or 'getMut', inside an Option, freezes a local pool as a
# bare one does. Uses the pool package.
[scenario.region_flow_pool_freeze]
category = "reject"
description = "A local pool removed from, added to or moved while an 'Option' borrow from 'get' or 'getMut', or its 'match' binding, is still to be used"
tags = ["flow"]
diagnostics = 3

# Part (b) of the shape-changing rule for a pool: a borrow from a pool reached
# through a '&mut' parameter, held while a second '&mut' parameter changes it.
# Uses the pool package.
[scenario.region_flow_pool_twomut]
category = "reject"
description = "A borrow from a pool reached through a '&mut' parameter or a field of 'self' ('pool[r]', '&mut pool[r]', or the one 'getMut' holds), used after a second '&mut Pool' parameter removes from it, adds to it, or is handed to a function that removes"
tags = ["flow"]
diagnostics = 6

# -------- lock permissions --------

[scenario.region_lockperm_mutex]
category = "run"
description = "The reference manual's example, Arc[Mutex, Point] borrowed mutably and read back; a counter in an Arc[Mutex, T] added to from two threads, through a borrow within each statement and one a local holds to its pass's end, giving the exact total; a field borrowed through the lock; the value finalized once, after the last owner, the guards counted and let go"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.region_lockperm_rwlock]
category = "run"
description = "Arc[Rwlock, T]: two reader threads hold read-only borrows at once, sharing the read lock; a writer's mutable borrow waits until both have given theirs back, and finds nobody inside"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.region_lockperm_rwcell]
category = "run"
description = "Rc[Rwcell, T] on one thread: read-only borrows sharing the lock; a borrow's lock given back at its statement's end (an argument, a field written, an operator in place, a field borrowed), at the last use of one a local holds, by every way out (the end, a return, a break, a continue, each pass of a loop), and in a function checked from inside a declaration's initializer at its own statement's end; the value finalized once"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.region_lockperm_rwcell_panic]
category = "run"
description = "A borrow through Rc[Rwcell, T] that may write, while a read-only one is held, panics naming its own line; nothing after it runs, no finalizer either"
tags = ["genllvm", "runtime"]
program_exit = "abort"

[scenario.region_lockperm_release]
category = "run"
description = "A lock permission's borrow gives its lock back at its last use, on each path, not at its block's end: after a statement that is the last use, in the branch that used it last and at the entry of the one that did not, after a loop and each pass of a loop body, before a return and held to the later use on the path that goes on, held while a later use is to come, in a nested block, held through a derived borrow still to be used, and a read lock for a writer; a probe thread shows each by getting the lock or not"
tags = ["flow", "genllvm", "runtime"]

[scenario.region_lockperm_release_rwcell]
category = "run"
description = "Rc[Rwcell, T] on one thread, where a conflicting borrow panics: a first borrow that is not used again leaves the lock free for a second in its own block, whether it was taken plainly or in an 'if', handed to a function, held through a derived borrow or a struct or a copy, used on every pass of a loop, taken in a loop's body, or dead on the path that returns"
tags = ["flow", "genllvm", "runtime"]

[scenario.region_lockperm_typecheck]
category = "reject"
description = "A lock permission's methods and their shapes; a struct in the permission slot that is none; the regions a lock fits (Mutex on Rc, Rwcell on Arc, either on So, a region counting no owners, a virtual reference refused); a method, a lend and an operator in place through a lock-managed reference refused; Arc[Mutex, T] crossing threads only where T may"
tags = ["typecheck"]

[scenario.region_lockperm_flow]
category = "reject"
description = "Reading, writing and swapping through a lock-managed reference refused; a borrow through one returned, or kept in a variable past its guard's statement or past the reference's block, refused; held by a local's initializer to the block's end, accepted"
tags = ["flow"]
