# array - fixed-size arrays: the type 'Array[T, n]' (several sizes for several
# dimensions, 'Array[T, n, m]'), the array literal, an array constructed with
# its contents ('new Array[T, n] <- fill x'), indexing, element assignment and
# array copy semantics. Tier 1.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# Slices and array references ('&[]', '.len', a pointer taken from a slice) are
# collection's subject, not this group's, so they appear here only as the
# '&[]u8' string parameter every run scenario's print helpers need.
#
# The two success scenarios split on whether a literal's elements are constants.
# array_success writes only constant ones, which is the whole of what the
# literal means at the source level; array_nonconst_literal writes computed
# ones, which is a code generation question, because a constant array cannot hold
# the result of an instruction and the group did not notice until a counted
# reference had to be filled into one. array_contents is the construction with
# contents in depth: each entry form, a value evaluated for each element, rows,
# and the positions a construction is written in; array_contents_scalars the
# contents of an array written with several sizes, its scalars row by row,
# beside the nested spelling's rows.
#
# The array syntax gives the parser nothing of its own to reject. Name
# resolution lowers 'Array[T, n]' into the array type and refuses what it
# cannot lower, and since its diagnostics end the compile, those are in their
# own scenarios: array_nameres_spelling for the type, array_nameres_fill for
# the retired fill literal '[n; x]'. The rest are type-check stage, split by
# sub-family: array_typecheck_size covers the array type's sizes and 'Array'
# alone, array_typecheck_range the range a size may take (0 through
# 4294967295), array_reject_shape covers bracket forms that never become a
# well-formed array literal, array_typecheck_contents contents that do not fill
# an array exactly, array_typecheck_counts what an entry of them may give,
# array_typecheck_scalars what the contents of one written with several sizes
# may give, and
# array_reject_use covers an array value that is well formed being
# initialized, indexed or accessed wrongly. Together they would exceed the
# three-to-six diagnostics one scenario should carry.
#
# Left uncovered on purpose:
#
# - An empty array literal, '[]'. ErrorBadArray "Array literal list may not be
#   empty" cannot be provoked from source: the parser demands an expression
#   after '[' and reports ErrorBadTerm first, which is lexical's subject.
# - ErrorBadIndex "Indexing not supported on a value of this type." The array,
#   array-ref and pointer paths all call the index check only after testing the
#   same flag it tests, so nothing reaches it.
# - An index past the end of the array. 'a[7]' on an 'Array[i32, 3]' compiles
#   clean and with no warning, so there is no diagnostic to assert.
# - ErrorBadElems belongs to tuples, not arrays: it is raised only for a tuple
#   whose elements are not all types or all values. An array literal with
#   inconsistent element types reports ErrorBadArray instead.
# - WarnCopy is declared in error.h and never raised anywhere in the compiler.
#   ErrorBadSlice was too, and has since been deleted from the enum.

support = []

# -------- success --------

[scenario.array_success]
category = "run"
description = "Array types, literals, indexing, element assignment and copy semantics"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# 'Array[T]' with no size is the body of a run-time length, whose borrow is the
# slice (a '&Array[T]' is a '&[]T'). It is core's generic struct, so its use is
# an ordinary instance; array_body is its run scenario, array_reject_body what
# it will not accept.
[scenario.array_body]
category = "run"
description = "Array[T], the body of a run-time length: &Array[T] and &[]T one type (parameters, variables, aliases, fields, mutable borrows), a fixed array's borrow converting to it, owners So, Rc and Arc (len, index, borrowed ranges and element borrows, lent as the slice, inferring a generic's element)"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

# Separate from array_success because it is the scenario a code generation fix
# landed with: both literal forms were built with LLVMConstArray, so an element
# that was the result of an instruction rather than a constant produced a
# constant array with instruction operands and the module failed verification.
# array_success writes only constant elements, which is why the group did not
# record this until a counted reference needed to be filled into one. A 'run'
# rather than a 'compile': surviving verification is the smaller half of the
# claim, and only printing the elements shows that an insertvalue chain put each
# one where it belongs.
[scenario.array_nonconst_literal]
category = "run"
description = "An array literal whose elements are computed rather than constant, listed and repeated by an array's contents, and for a struct element type"
tags = ["genllvm", "runtime"]

# An array's construction is its contents: listed values, 'n of x' and
# 'fill x', filling it exactly. A 'run' because the claim is which value lands
# in each element and how many times a repeated value is evaluated, which only
# the printed elements and a counter show. The check holds that contents
# repeating a constant stay one constant, which a global's initializer must be.
[scenario.array_contents]
category = "run"
description = "An array constructed with its contents: listed values, 'n of x', 'fill x', a value evaluated for each element, rows, a global, an argument and a list across lines"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

[[scenario.array_contents.check]]
name = "global-contents-repeating-a-constant-is-a-constant"
target = "preir"
contains = ["@table = internal global [8 x i64] [i64 3, i64 3, i64 3, i64 3, i64 3, i64 3, i64 3, i64 3]"]

# The scenario a code generation fix landed with: contents repeating a value a
# hundred thousand times. A constant repeated was stored as one aggregate,
# which LLVM's instruction selection takes apart element by element and
# crashed on; a computed value was copied into each element, and the chain of
# a hundred thousand inserted values exhausted memory. A 'run' because the
# claim is that each element holds its value, and a computed one was
# evaluated once for each element in order, which the first, middle and last
# elements and a counter show. The checks hold that neither form is an
# aggregate the size of the array: a constant null is one memset, and a
# computed value is generated once, in a loop.
[scenario.array_contents_large]
category = "run"
description = "An array's contents repeating a constant or a computed value a hundred thousand times, alone and among listed values"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.array_contents_large.check]]
name = "a-constant-null-repeated-is-one-memset"
target = "preir"
contains = ["call void @llvm.memset.p0.i64(ptr align 1 %fillat, i8 0, i64 100000, i1 false)"]
excludes = ["store [100000 x i8]"]

[[scenario.array_contents_large.check]]
name = "a-computed-value-repeated-is-evaluated-in-a-loop"
target = "preir"
contains = ["%fillindex = phi i64 [ 1, %entry ], [ %fillnext, %fillloop ]",
            "%fillmore = icmp ult i64 %fillnext, 100000"]
excludes = ["insertvalue [100000 x i8]"]

# An array written with several sizes is filled with its scalars, row by row,
# and the nested spelling with its rows; the two are one type. A 'run'
# because the claim is which scalar lands at which indices, which only reading
# each one back shows, and how often a computed value is evaluated, which a
# counter shows. The checks hold that the scalars are stored into the array
# seen as one run of them, a null fill one memset over all 24 bytes, and that a
# global's contents are a constant of the nested type.
[scenario.array_contents_scalars]
category = "run"
description = "The contents of an array written with several sizes are its scalars, row-major: listed, 'n of x' and 'fill' across rows, a value evaluated for each scalar, a global; the nested spelling takes rows; the spellings one type; an alias keeps its spelling, a type parameter's argument gives rows"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.array_contents_scalars.check]]
name = "a-null-fill-of-every-scalar-is-one-memset"
target = "preir"
contains = ["call void @llvm.memset.p0.i64(ptr align 1 %fillat, i8 0, i64 24, i1 false)"]
excludes = ["store [2 x [3 x [4 x i8]]]"]

[[scenario.array_contents_scalars.check]]
name = "global-contents-of-several-sizes-are-a-nested-constant"
target = "preir"
contains = ["@board = internal global [2 x [3 x i32]] [[3 x i32] [i32 1, i32 2, i32 3], [3 x i32] [i32 4, i32 5, i32 6]]"]

# The scenario a code generation fix landed with: an index takes its array's
# address, and a field's address is taken from its container's, so an array
# field of a struct or tuple returned by a call had no address at all and
# genlAddr stopped with a compiler defect. A 'run' because the fix stores the
# call's result into a temporary, and only printing the elements shows the GEP
# into it lands on the right field and element.
[scenario.array_rvalue_index]
category = "run"
description = "Indexing an array field of a struct or tuple returned by a call or method"
tags = ["genllvm", "runtime"]

# The scenario a code generation fix landed with: in a borrow of a nested
# array's element, '&m[1][0]', the outer index's receiver is the inner index, a
# reference to the row, where generation took it to be the borrow at the
# chain's root, and conec crashed. A 'run' because only reading the elements
# back, and writing through '&mut', shows the borrow reaches the element meant.
# A range on a row, '&m[1][0..2]', is collection_subslice's.
[scenario.array_borrow_nested]
category = "run"
description = "Borrowing an element of a nested array, '&' and '&mut', read and written through: both spellings of the type, a struct's field, three sizes, through a reference, a List's element"
tags = ["typecheck", "genllvm", "runtime"]

# The scenario the fix landed with that coerces an array literal's elements to
# the element type of the array it is wanted as. A 'run' because only printing
# the elements shows each one landed at the declared width: a wide integer that
# kept the i32 default would print truncated. The checks hold that a global's
# coerced literal is still a constant, written at the declared element type,
# which a global's initializer must be.
[scenario.array_literal_coerce]
category = "run"
description = "An array literal's elements coerce to the declared element type: strings to slices, numbers to the declared width"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.array_literal_coerce.check]]
name = "global-array-literal-of-strings-is-a-constant-of-slices"
target = "preir"
contains = ["@gnames = internal constant [3 x { ptr, i64 }] [{ ptr, i64 } { ptr @string, i64 3 }, { ptr, i64 } { ptr @string.1, i64 3 }, { ptr, i64 } { ptr @string.2, i64 5 }]"]

[[scenario.array_literal_coerce.check]]
name = "global-array-literal-of-wide-numbers-is-a-constant-at-the-declared-width"
target = "preir"
contains = ["@gwide = internal constant [2 x i64] [i64 5000000000, i64 -7]",
            "@gfloat = internal constant [2 x double] [double 5.000000e-01, double 1.500000e+00]"]

# The array type in every position a type takes -- a field, a local, a
# global, a parameter, a return, behind a reference, inside Option and as a
# generic's argument -- and with several sizes: 'Array[i32, 2, 3]' is laid out
# row-major, the first size the outermost, exactly as the nested
# 'Array[Array[i32, 3], 2]', which is the same type. A 'run' because only
# printing the elements in memory order, and the sizes, shows the layout; the
# check holds that a struct holding one, handed to C, keeps C's layout.
[scenario.array_type]
category = "run"
description = "Array[T, n] as field, local, global, parameter, return and generic argument; several sizes row-major and the same type as nesting; an array of managed references"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

[[scenario.array_type.check]]
name = "struct-holding-an-array-keeps-c-layout"
target = "preir"
contains = ["%Rgb = type { [3 x i8], i8 }"]

[[scenario.array_type.check]]
name = "several-sizes-generate-as-nested-arrays-outermost-first"
target = "preir"
contains = ["@grid(ptr noalias sret([2 x [3 x i32]]) %sret)"]

# The scenario a code generation fix landed with: an array of variants wanted
# as an array of their enum ('new Array[None[W], 4] <- fill None[W][]' as an
# 'Array[Option[W], 4]' field) is
# a reinterpretation of the whole array, which was generated as an LLVM bitcast
# of an aggregate, and conec crashed with no diagnostic. A 'run' because the
# elements must still read as the variants they were built as, and a None must
# finalize nothing: only the one Some stored over an element prints its 'fin'.
[scenario.array_variant_recast]
category = "run"
description = "An array of an enum's variants coerced to an array of the enum, from a construction with its contents or a local"
tags = ["genllvm", "runtime"]

# -------- name resolution stage --------

[scenario.array_nameres_spelling]
category = "reject"
description = "The old spelling of an array type, '[n; T]', and a first argument that is not a type"
tags = ["nameres"]
diagnostics = 4

[scenario.array_nameres_fill]
category = "reject"
description = "The retired fill literal '[n; x]', in a global, a local, with two counts and as an argument"
tags = ["nameres"]
diagnostics = 4

# -------- type check stage --------

[scenario.array_typecheck_size]
category = "reject"
description = "An array type's size that is not an integer literal, 'Array' alone, and a generic's instance revealing the old spelling of an array type"
tags = ["typecheck"]
diagnostics = 6

[scenario.array_typecheck_range]
category = "reject"
description = "An array type's size outside 0 through 4294967295: negative, alone or nested, and past the 32-bit count; zero, negative zero and the largest accepted"
tags = ["typecheck"]
diagnostics = 3

[scenario.array_reject_body]
category = "reject"
description = "Array[T], the body of a run-time length, held by value (a field, a variable, a size asked of it), allocated from borrowed elements that move, written through a read-only borrow or an 'imm' owner, given the wrong element type, and owned by a traced region with elements that hold traced references"
tags = ["typecheck"]
diagnostics = 9

[scenario.array_flow_body]
category = "reject"
description = "An owner of Array[T] lent as the slice, a range of it or an element's borrow: moved while the borrow is still used, and a borrow of it returned past the owner; reads that lend nothing leave it free to move"
tags = ["flow"]
diagnostics = 5

[scenario.array_reject_shape]
category = "reject"
description = "Bracket forms that are not a valid array literal"
tags = ["typecheck"]
diagnostics = 2

[scenario.array_typecheck_contents]
category = "reject"
description = "An array's contents giving too few values or too many, an array constructed with none, and one given init arguments"
tags = ["typecheck"]
diagnostics = 5

[scenario.array_typecheck_counts]
category = "reject"
description = "An array's contents: a count of 'n of x' not constant, negative or past 4294967295, a value not the element type, and a pair"
tags = ["typecheck"]
diagnostics = 5

[scenario.array_typecheck_scalars]
category = "reject"
description = "The contents of an array written with several sizes: too few scalars or too many, a row where a scalar is wanted, a product of sizes past 4294967295, and an element type that is itself an array"
tags = ["typecheck"]
diagnostics = 5

# Separate from array_reject_use because that file's subject is what an array
# value will not accept at type check, and this one is a flow diagnostic about
# what an assignment reads. It also pins a deliberate non-diagnostic, which is
# why it is worth its own file: the boundary is as much the claim as the error.
[scenario.array_flow_index]
category = "reject"
description = "An index on the left of an assignment is read, and the base of a partial write is not"
tags = ["flow"]
diagnostics = 1

[scenario.array_reject_use]
category = "reject"
description = "Array initializers, indices and member access the compiler rejects"
tags = ["typecheck"]
diagnostics = 5

# A global array whose elements are string literals filling byte arrays, an
# Array of Array[u8, n], crashed conec in LLVM: the literal was generated as a load
# of its text, which a constant array cannot hold. It is now a constant of the
# text's bytes, so the global is a constant array of constant rows, and the
# bytes spelling of the same rows stays what it was.
[scenario.array_global_nested_strings]
category = "run"
description = "A global Array of Array[u8, n] filled by string literals is a constant, and reads as the bytes of the text"
tags = ["genllvm", "runtime"]

[[scenario.array_global_nested_strings.check]]
name = "global-nested-array-of-strings-is-a-constant-of-rows"
target = "preir"
contains = ["@gstr = internal constant [2 x [3 x i8]] [[3 x i8] c\"abc\", [3 x i8] c\"def\"]"]
