# trait - traits, trait-based variants, virtual references, closure references.
# Tier 2.
#
# Key reference: design/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# The subject is the requirement/implementation split: a trait names methods and
# fields, a type satisfies them, and a virtual reference dispatches to whichever
# implementation it points at. The two success programs divide at the seam
# between dispatch and its inverse. trait-success establishes what a virtual
# call reaches -- structural conformance, nominal conformance with 'is-a',
# inherited defaults, field requirements, marker traits -- and carries the LLVM IR
# checks, because which declaration a vtable slot points at is exactly what a run
# cannot observe. trait-variants establishes recovering the concrete type again,
# for an enum's closed set of variants, for an open trait's 'is-a' implementers and
# for a type that conforms structurally without naming the trait at all, which is
# the operation the enum group deliberately left here.
#
# The reject scenarios are split first by pipeline stage, because analysis halts
# between stages, and then by sub-family:
#
# - trait-nameres is alone at its stage. '&<' applied to a value rather than a
#   type is diagnosed during name resolution, which returns before type
#   checking, so nothing else in its file would be reached.
# - trait-typecheck-conform is about a type's relationship to the abstractions it
#   asserts, method requirements and field requirements alike, all of which are
#   checked when the struct is checked. That is the same pass as
#   function bodies but not the same pass as function signatures, and a
#   signature error suppresses the whole pass (module.c:181), so that file
#   declares no function outside a struct.
# - trait-parse-extends is a stage earlier: 'extends' no longer spells nominal
#   conformance and is refused at the clause, which is parse's, so nothing in
#   that file is name resolved and it holds nothing else.
# - trait-parse-kind-modifier is at that same stage and separate from it because
#   the subject is the kind keyword rather than the base clause: the 'trait'
#   modifier written twice, and the two kinds the grammar admits and the compiler
#   does not build.
# - trait-typecheck-vref and trait-typecheck-dispatch answer different
#   questions -- what a virtual reference may be built from, versus what may be
#   done through one that is well formed. Together they would be twenty-two
#   diagnostics.
# - trait-flow-vref is a stage later still: ErrorNoMut on an assignment is a
#   data-flow diagnostic despite reading like a type-check one, and what it
#   pins is the permission a write or a read through a virtual reference is
#   checked against.
#
# Left out, with reasons:
#
# - Closure references. conesite/public/coneref/refcloref.html opens with "None
#   of this is implemented", and every part of it is absent: the closure literal
#   '|{capture}| {...}' does not lex as anything (ErrorBadTerm, then the rest of
#   the statement is swallowed), and the '+<so ||' type does not parse. The one
#   piece that can be written -- a trait declaring '()', reached through a
#   virtual reference, which is the mechanism the page describes -- fails
#   because a call is never routed through the vtable. That is asserted in
#   trait-typecheck-dispatch, which is the whole of what can be claimed here.
#   Function references, the thing a closure reference would generalize, are
#   ref's and closure's.
#
# - An anonymous 'trait {'. It is the same parseStruct path as 'struct {' and
#   'enum {', and struct-parse covers all three together rather than testing one
#   parser function once per group.
#
# - A trait as a value type, beyond the one diagnostic in trait-typecheck-vref.
#   A trait is not instantiable, so there is no behavior to establish past the
#   rejection itself.
#
# Codes this group does not claim: ErrorNoImpl, which an abstract method without
# a body provokes and which reads as trait's, is a parse-stage diagnostic
# already covered by core-parse-fns, struct-parse and closure-parse-sig, and a
# trait is the one place the construct is legal.

support = ["traitmeter.cone", "traitscale.cone"]

# -------- success --------

# 'trait' is a modifier on the kind, so 'struct trait X' and 'trait X' are one
# declaration. A run rather than a compile because the claim is that the long
# spelling is a trait in every respect, and which implementation a vtable slot
# holds is exactly what compiling clean cannot show. Separate from trait-success
# because that file's subject is the requirement/implementation split and this
# one's is the spelling: every line here would still belong if that split were
# established nowhere.
[scenario.trait-kind-modifier]
category = "run"
description = "'struct trait' and 'trait' as one declaration, in a chain that crosses both spellings"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

[scenario.trait-success]
category = "run"
description = "Trait requirements satisfied structurally and with 'is-a', and dispatched through a virtual reference"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# Every implementer of a trait supplies a vtable, read as the type 'as' the
# trait, and both candidates of each overload set are generated -- the one the
# vtable selected and the one it must not. Which of them a slot holds is what
# the run prints ('virtual-dispatch-overload-candidate'); the slot's shape is
# the IR's to show, below.
[[scenario.trait-success.check]]
name = "each-implementer-supplies-a-vtable"
target = "symbols"
contains = [
  "constant internal Rect as Shape (vtable) comdat nodeduplicate",
  "constant internal Circle as Shape (vtable) comdat nodeduplicate",
  "constant internal Square as Shape (vtable) comdat nodeduplicate",
  "define internal Rect.areaOf comdat nodeduplicate",
  "define internal Rect.areaScaled comdat nodeduplicate",
  "define internal Square.area comdat nodeduplicate",
]

# A vtable slot is filled from a method of the implementing type rather than
# left null: the bitcast's operand is a function over that type's pointer.
# The run's printed numbers say which method; the IR says the slot was wired
# from a symbol at all.
[[scenario.trait-success.check]]
name = "vtable-slot-holds-a-method-of-the-implementer"
target = "llvmir"
contains = [
  'constant %"Shape:Vtable" { i32 (i8*)* bitcast (i32 (%Rect*)* @',
  'constant %"Shape:Vtable" { i32 (i8*)* bitcast (i32 (%Circle*)* @',
  'constant %"Shape:Vtable" { i32 (i8*)* bitcast (i32 (%Square*)* @',
]
excludes = ['constant %"Shape:Vtable" { i32 (i8*)* null']

# A trait's default method is not a symbol of its own: it is cloned into each
# type that inherits it, and the clone is owned by that type, so its symbol
# reads exactly as a method written there would -- the same shape Dial's own
# 'reading' gets. Nothing is spelled after the trait, and the clone carries no
# type arguments, because an inherited default is a copy rather than an
# instance of a generic.
[[scenario.trait-success.check]]
name = "inherited-default-is-cloned-per-implementing-type"
target = "symbols"
contains = [
  "define internal Gauge.reading comdat nodeduplicate",
  "define internal Dial.reading comdat nodeduplicate",
]
excludes = ["Meter.reading"]

# A requirement's parameters reach the vtable slot's own type, which is the half
# of "the signatures must match exactly" a run cannot observe: the printed
# numbers would be the same whatever the slot was typed as. The reference
# parameter lowers to a pointer, so a widening that let a value satisfy a
# reference requirement would show here as a mismatched slot type. Each
# implementer's slot must hold its own method rather than be left null.
[[scenario.trait-success.check]]
name = "parameterized-requirement-types-its-vtable-slot"
target = "llvmir"
contains = [
  '%"Scaler:Vtable" = type { i32 (i8*, i32)* }',
  '%"Blender:Vtable" = type { i32 (i8*, i32, i32)*, i32 (i8*, i32*)* }',
  'constant %"Scaler:Vtable" { i32 (i8*, i32)* bitcast (i32 (%Box*, i32)* @',
  'constant %"Scaler:Vtable" { i32 (i8*, i32)* bitcast (i32 (%Cup*, i32)* @',
  'bitcast (i32 (%Mix*, i32, i32)* @',
  'bitcast (i32 (%Churn*, i32*)* @',
]
excludes = ['constant %"Scaler:Vtable" { i32 (i8*, i32)* null']

# A virtual reference is a fat pointer of value and vtable, and a trait's field
# requirement is a vtable slot holding an offset rather than a function pointer
[[scenario.trait-success.check]]
name = "vtable-layout-carries-methods-then-field-offsets"
target = "llvmir"
contains = [
  '%"Meter:Vtable" = type { i32 (i8*)*, %void (i8*)*, i32 }',
  '%"Shape:Vtable.0" = type { i8*, %"Shape:Vtable"* }',
]

# Each trait's list of vtables is a symbol named for that trait, so a module
# with several traits has several lists and LLVM never has to tell two apart
# with its '.1' uniquifier. The list is internal whatever the compile: it holds
# the implementers this compile saw, so no two objects could agree on one.
[[scenario.trait-success.check]]
name = "vtable-list-is-named-per-trait"
target = "symbols"
contains = [
  "constant internal Shape (vtable list) comdat nodeduplicate",
  "constant internal Scaler (vtable list) comdat nodeduplicate",
  "constant internal Blender (vtable list) comdat nodeduplicate",
  "constant internal Meter (vtable list) comdat nodeduplicate",
]
excludes = ["(vtable list).1"]

# The list holds one entry per implementer, which is its length to show.
[[scenario.trait-success.check]]
name = "vtable-list-holds-every-implementer"
target = "preir"
contains = [
  'internal constant [3 x %"Shape:Vtable"*] [',
  'internal constant [2 x %"Scaler:Vtable"*] [',
]

# A trait contributes nothing to the layout of a type that is-a it. Every field a
# type holds is one it declared: Sensor's 'id' appears in Logger and in each
# implementer because each one declares it to comply, not because anything was
# spliced in, and 'Probe' is its own two fields and nothing more. Marker traits
# cost nothing at all, whether named after the first in an 'is-a' list (Ledger) or
# mixed in (Tally). A run cannot see any of this: every printed number would be
# the same whatever sat in front of it, and what a trait used to add was a
# constant zero byte nothing ever read.
[[scenario.trait-success.check]]
name = "composing-traits-adds-no-hidden-field"
target = "preir"
contains = [
  "%Sensor = type { i32 }",
  "%Logger = type { i32 }",
  "%Probe = type { i32, i32 }",
  "%Relay = type { i32, i32 }",
  "%Tally = type { i32 }",
  "%Ledger = type { i32 }",
]

[scenario.trait-inherited-defaults]
category = "compile"
description = "Two types inheriting one trait default each get their own copy of it, spelled after the type"
tags = ["typecheck", "genllvm"]

# Two implementers of the same trait inherit the same default. Each clone is
# owned by its implementing type and so lands on its own symbol, and each is a
# definition here, linked as a method written in that type would be. The
# trait's own copy is not a symbol at all. A collision between the two clones
# would show as LLVM's '.1' uniquifier on the second definition.
[[scenario.trait-inherited-defaults.check]]
name = "each-implementing-type-defines-its-own-clone"
target = "symbols"
contains = [
  "define internal Alpha.reading comdat nodeduplicate",
  "define internal Beta.reading comdat nodeduplicate",
]
excludes = [
  "Meter.reading",
  "Alpha.reading.1",
  "Beta.reading.1",
]

# The receiver each clone takes, which the symbol above cannot show. Both clones
# shared one receiver type until 17 Sept 2026 -- whichever implementer generated
# first named the pointee for every reference to '&ro Meter', because a cloned
# reference node kept the original's interned type record and the LLVM type is
# memoized on it. Beta's clone took a '%Alpha*' and would have read 'span' off
# the end of an Alpha.
[[scenario.trait-inherited-defaults.check]]
name = "each-clone-takes-its-own-receiver"
target = "llvmir"
contains = [
  "define internal i32 @_CNvNt5Alpha7reading(%Alpha* %0)",
  "define internal i32 @_CNvNt4Beta7reading(%Beta* %0)",
]

# A plain reference to a trait is compiled with the trait's own layout, which is
# the fields the trait declares and nothing else, and is a prefix of every
# implementer. One function serves implementers of two different sizes, so any
# implementer's type here would be wrong for the other -- and being the larger of
# the two, '%Beta' would read past the end of an Alpha.
[[scenario.trait-inherited-defaults.check]]
name = "a-trait-reference-takes-the-traits-own-layout"
target = "llvmir"
contains = [
  "%Meter = type { i32 }",
  "%Alpha = type { i32 }",
  "%Beta = type { i32, i32 }",
  "define internal i32 @baseLevel(%Meter* %0)",
]
excludes = [
  "define internal i32 @baseLevel(%Alpha* %0)",
  "define internal i32 @baseLevel(%Beta* %0)",
]

# A trait in an imported module, named by a type in the root. The root is
# resolved first, so the trait is resolved by demand from the type, in its own
# module's scope, with what that module folds in visible to the trait's default
# method. What is asserted is that the compile succeeds at all, and what the
# root declares for the names the inherited default reached.
[scenario.trait-import-inherit]
category = "compile"
description = "A type declaring is-a against a trait from an imported module, whose inherited default names what that module folded in"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# The inherited default is the root type's own clone, and the function it
# reached by the other module's fold is declared under the module that
# declares it. Nothing is spelled after traitmeter for the fold.
[[scenario.trait-import-inherit.check]]
name = "inherited-default-reaches-the-other-modules-fold"
target = "symbols"
contains = [
  "define internal Gauge.doubled comdat nodeduplicate",
  "declare traitscale.twice",
]
excludes = ["traitmeter.twice", "traitmeter.Meter.doubled"]

[scenario.trait-variants]
category = "run"
description = "A base type's abstract method implemented per variant, dispatched and then narrowed back"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# A vtable is a definition of this object, internal in a program compile like
# every other; a package compile, where several objects each supply one, will
# make it merge like a generic instance. It needs a COMDAT for a second reason
# too: it names every method in its slots, so a vtable the linker cannot
# discard keeps all of them in the image whether or not anything dispatches. A
# An enum's variant is owned by its enum, so its vtable reads as the enum's
# variant. Tri, declared after the function whose signature builds Shape's
# vtable, gets a vtable like the others.
[[scenario.trait-variants.check]]
name = "vtables-are-discardable"
target = "symbols"
contains = [
  "constant internal Extense.Variant1 as Extense (vtable) comdat nodeduplicate",
  "constant internal Rect as Shape (vtable) comdat nodeduplicate",
  "constant internal Tri as Shape (vtable) comdat nodeduplicate",
  "constant internal Shape (vtable list) comdat nodeduplicate",
]

# Tri satisfies Shape structurally and is declared after the function whose
# signature builds Shape's vtable. That is invisible to a run: a vtable slot
# holding a null function pointer is what the IR shows and what the printed
# numbers cannot, and a bitcast of a Tri method is the proof the slot was
# filled from a symbol rather than left empty.
[[scenario.trait-variants.check]]
name = "late-declared-structural-conformer-fills-its-vtable-slot"
target = "llvmir"
contains = ['constant %"Shape:Vtable" { i32 (i8*)* bitcast (i32 (%Tri*)* @']
excludes = ['constant %"Shape:Vtable" { i32 (i8*)* null']

# -------- parse stage --------

# 'extends' no longer spells nominal conformance, and it is not yet the concrete
# enrichment it is reserved for, so it is refused at the clause where it is
# written. That is the parser's, which is why this is its own file: a parse
# diagnostic stops the compile before name resolution, so nothing else here
# would be reached. Both kinds that can write one are here, because the
# diagnostic names the kind it was written on.
[scenario.trait-parse-extends]
category = "reject"
description = "'extends' written where a nominal assertion is meant, on a struct and on a trait"
tags = ["parse"]
diagnostics = 2

# The other half of trait-kind-modifier: what the modifier grammar refuses. The
# modifier does not stack, and the two kinds that will have abstractions and do
# not exist say so where the declaration is written rather than being accepted
# with nothing under them. 'mod' and 'actor' are here rather than in module or in
# a concurrency group because the only thing either word does today is carry this
# modifier; there is no module or actor behaviour for them to belong to.
[scenario.trait-parse-kind-modifier]
category = "reject"
description = "'trait' written twice, and the 'mod' and 'actor' kinds the grammar admits and the compiler does not build"
tags = ["parse"]
diagnostics = 6

# -------- name resolution stage --------

[scenario.trait-nameres]
category = "reject"
description = "Borrowing or allocating a virtual reference instead of coercing one"
tags = ["nameres"]
diagnostics = 3

# The other half of trait-success's 'Meter.scale': a static function belongs to
# the type that declares it and is reached through that name alone.
[scenario.trait-nameres-static]
category = "reject"
description = "A trait's static function, named through an implementer or a variant"
tags = ["nameres"]
diagnostics = 2

# A type's abstractions are reached while the type is name resolved, so two types
# that each stand on the other are this stage's. The cycle used to hang the
# compiler. The duplicate-field half of this file is gone with the splice: a trait
# contributes no fields, so declaring the name is compliance rather than a clash,
# and the splice that can still produce one is the enum's -- enum-nameres-splice.
[scenario.trait-nameres-inherit]
category = "reject"
description = "Types that each name the other as a base, or mix in themselves"
tags = ["nameres"]
diagnostics = 2

# -------- type check stage --------

# Both halves of what an 'is-a' asserts: the methods the abstraction requires, and
# the fields it requires the type to declare in its order at position 0. The field
# half points at the field that breaks the prefix rather than at the struct, which
# is the member a reader would go to; everything else is reported on the struct.
[scenario.trait-typecheck-conform]
category = "reject"
description = "Types whose declarations do not satisfy the abstraction they assert or mix in"
tags = ["typecheck"]
diagnostics = 9

[scenario.trait-typecheck-vref]
category = "reject"
description = "Types a virtual reference cannot be made of, or coerced to and from, and traits no virtual reference can dispatch through"
tags = ["typecheck"]
diagnostics = 16

[scenario.trait-typecheck-dispatch]
category = "reject"
description = "Members and operations a virtual reference cannot reach"
tags = ["typecheck"]
diagnostics = 6

# -------- flow stage --------

[scenario.trait-flow-vref]
category = "reject"
description = "Writing a trait field through a virtual reference that grants no write, and reading one through a reference that grants no read"
tags = ["flow"]
diagnostics = 3

# The other flow question a virtual reference raises: not what may be done
# through it, but how long it lives. A virtual reference is built by coercion
# rather than by a borrow expression, and the coercion is where its lifetime was
# lost, so widening a plain reference to a base trait's reference type -- the
# same coercion, lost the same way -- is asserted beside it here rather than in
# ref, whose lifetime scenarios all start from a borrow expression.
[scenario.trait-flow-vref-lifetime]
category = "reject"
description = "A virtual reference, or a reference widened to a base trait, stored or returned past the value it borrows"
tags = ["flow"]
diagnostics = 7
