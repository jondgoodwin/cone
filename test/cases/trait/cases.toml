# trait - traits, trait-based variants, virtual references, closure references.
# Tier 2.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# The subject is the requirement/implementation split: a trait names methods and
# fields, a type satisfies them, and a virtual reference dispatches to whichever
# implementation it points at. The two success programs divide at the seam
# between dispatch and its inverse. trait_success establishes what a virtual
# call reaches -- structural conformance, nominal conformance with 'is',
# inherited defaults, field requirements, marker traits -- and carries the LLVM IR
# checks, because which declaration a vtable slot points at is exactly what a run
# cannot observe. trait_variants establishes recovering the concrete type again,
# for an enum's closed set of variants, for an open trait's is-a implementers and
# for a type that conforms structurally without naming the trait at all, which is
# the operation the enum group deliberately left here.
#
# The reject scenarios are split first by pipeline stage, because analysis halts
# between stages, and then by sub-family:
#
# - trait_nameres is alone at its stage. '&<' applied to a value rather than a
#   type is diagnosed during name resolution, which returns before type
#   checking, so nothing else in its file would be reached.
# - trait_typecheck_conform is about a type's relationship to the abstractions it
#   asserts, method requirements and field requirements alike, all of which are
#   checked when the struct is checked. That is the same pass as
#   function bodies but not the same pass as function signatures, and a
#   signature error suppresses the whole pass (module.c:181), so that file
#   declares no function outside a struct.
# - trait_parse_extends is a stage earlier: it is the base clause grammar, which
#   is parse's, so nothing in that file is name resolved and it holds nothing
#   else. It is in this group rather than struct's because what it is about is the
#   'is' clause -- that a type states its abstractions once, that 'extends' names
#   a concrete base and so may not be written on an abstraction at all, and that
#   the two are separate assertions a type may make together. What may be
#   enriched, and what an enrichment may declare, is a stage later and is
#   struct's.
# - trait_parse_kind_modifier is at that same stage and separate from it because
#   the subject is the kind keyword rather than the base clause: the 'trait'
#   modifier written twice, and the two kinds the grammar admits and the compiler
#   does not build.
# - trait_typecheck_vref and trait_typecheck_dispatch answer different
#   questions -- what a virtual reference may be built from, versus what may be
#   done through one that is well formed. Together they would be twenty-two
#   diagnostics.
# - trait_flow_vref is a stage later still: ErrorNoMut on an assignment is a
#   data-flow diagnostic despite reading like a type-check one, and what it
#   pins is the permission a write or a read through a virtual reference is
#   checked against.
#
# Left out, with reasons:
#
# - Closure references. doc/reference/refcloref.html opens with "None
#   of this is implemented", and every part of it is absent: the closure literal
#   '|{capture}| {...}' does not lex as anything (ErrorBadTerm, then the rest of
#   the statement is swallowed), and the '+<so ||' type does not parse. The one
#   piece that can be written -- a trait declaring '()', reached through a
#   virtual reference, which is the mechanism the page describes -- fails
#   because a call is never routed through the vtable. That is asserted in
#   trait_typecheck_dispatch, which is the whole of what can be claimed here.
#   Function references, the thing a closure reference would generalize, are
#   ref's and closure's.
#
# - An anonymous 'trait {'. It is the same parseStruct path as 'struct {' and
#   'enum {', and struct_parse covers all three together rather than testing one
#   parser function once per group.
#
# - A trait as a value type, beyond the one diagnostic in trait_typecheck_vref.
#   A trait is not instantiable, so there is no behavior to establish past the
#   rejection itself.
#
# - Retroactive conformance: a type enriched with 'extends' supplying the method
#   its base lacks, so that the base's own values reach a trait by being bound to
#   the enriched name. It dispatches through a virtual reference and so reads as
#   this group's, but what it establishes is what 'extends' delivers, and every
#   other claim about the enrichment is in struct_extends with it.
#
# Codes this group does not claim: ErrorNoImpl, which an abstract method without
# a body provokes and which reads as trait's, is a parse-stage diagnostic
# already covered by core_parse_fns, struct_parse and closure_parse_sig, and a
# trait is the one place the construct is legal.

support = ["traitmeter.cone", "traitscale.cone"]

# -------- success --------

# 'trait' is a modifier on the kind, so 'struct trait X' and 'trait X' are one
# declaration. A run rather than a compile because the claim is that the long
# spelling is a trait in every respect, and which implementation a vtable slot
# holds is exactly what compiling clean cannot show. Separate from trait_success
# because that file's subject is the requirement/implementation split and this
# one's is the spelling: every line here would still belong if that split were
# established nowhere.
[scenario.trait_kind_modifier]
category = "run"
description = "'struct trait' and 'trait' as one declaration, in a chain that crosses both spellings"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

[scenario.trait_success]
category = "run"
description = "Trait requirements satisfied structurally and with 'is', and dispatched through a virtual reference"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# Every implementer of a trait supplies a vtable, read as the type 'as' the
# trait, and both candidates of each overload set are generated -- the one the
# vtable selected and the one it must not. Which of them a slot holds is what
# the run prints ('virtual-dispatch-overload-candidate'); the slot's shape is
# the IR's to show, below.
[[scenario.trait_success.check]]
name = "each-implementer-supplies-a-vtable"
target = "symbols"
contains = [
  "constant internal Rect as Shape (vtable) comdat nodeduplicate",
  "constant internal Circle as Shape (vtable) comdat nodeduplicate",
  "constant internal Square as Shape (vtable) comdat nodeduplicate",
  "define internal Rect.areaOf comdat nodeduplicate",
  "define internal Rect.areaScaled comdat nodeduplicate",
  "define internal Square.area comdat nodeduplicate",
]

# A vtable slot is filled from a method of the implementing type rather than
# left null. The run's printed numbers say which method; the IR says the slot
# was wired from a symbol at all. LLVM's pointers carry no type, so the slot is
# a bare 'ptr' to its method and the method's receiver type is not in the
# vtable: what is asserted is that a Shape vtable's slot names a symbol and
# none is null, and the check above names the three vtables it covers.
[[scenario.trait_success.check]]
name = "vtable-slot-holds-a-method-of-the-implementer"
target = "llvmir"
contains = ['internal constant %"Shape:Vtable" { ptr @']
excludes = ['constant %"Shape:Vtable" { ptr null']

# A trait's default method is not a symbol of its own: it is cloned into each
# type that inherits it, and the clone is owned by that type, so its symbol
# reads exactly as a method written there would -- the same shape Dial's own
# 'reading' gets. Nothing is spelled after the trait, and the clone carries no
# type arguments, because an inherited default is a copy rather than an
# instance of a generic.
[[scenario.trait_success.check]]
name = "inherited-default-is-cloned-per-implementing-type"
target = "symbols"
contains = [
  "define internal Gauge.reading comdat nodeduplicate",
  "define internal Dial.reading comdat nodeduplicate",
]
excludes = ["Meter.reading"]

# A requirement's parameters reach the vtable slot's own type, which is the half
# of "the signatures must match exactly" a run cannot observe: the printed
# numbers would be the same whatever the slot was typed as. LLVM's pointers
# carry no type, so a slot is a bare 'ptr' and its function type is the one the
# dispatch calls it with: scaledBy calls Scaler's slot with the receiver and an
# i32, blendedBy calls Blender's first with two, and viaRefOf calls its second
# with a pointer, since the reference parameter lowers to one. What an
# implementer's own method takes is no longer in the vtable at all; the
# conformance check refuses a mismatch (trait_typecheck_conform), and the run
# would print a wrong number. Each slot must hold a method rather than be left
# null. Read before optimization, where the dispatching functions still exist.
[[scenario.trait_success.check]]
name = "parameterized-requirement-types-its-vtable-slot"
target = "preir"
contains = [
  '%"Scaler:Vtable" = type { ptr }',
  '%"Blender:Vtable" = type { ptr, ptr }',
  'internal constant %"Scaler:Vtable" { ptr @',
  'internal constant %"Blender:Vtable" { ptr @',
  '%2 = extractvalue %"Scaler:Vtable.1" %s1, 1',
  '%scaled = getelementptr inbounds nuw %"Scaler:Vtable", ptr %2, i32 0, i32 0',
  '%5 = call i32 %4(ptr %3, i32 %factor2)',
  '%4 = call i32 %3(ptr %2, i32 4, i32 5)',
  '%4 = call i32 %3(ptr %2, ptr %n)',
]
excludes = ['constant %"Scaler:Vtable" { ptr null', 'constant %"Blender:Vtable" { ptr null']

# A virtual reference is a fat pointer of value and vtable, and a trait's field
# requirement is a vtable slot holding an offset rather than a function pointer.
# Both pointers are a bare 'ptr', so which half is the vtable is not in the
# type; the dispatch the check above names reads its slot through the second.
[[scenario.trait_success.check]]
name = "vtable-layout-carries-methods-then-field-offsets"
target = "llvmir"
contains = [
  '%"Meter:Vtable" = type { ptr, ptr, i32 }',
  '%"Shape:Vtable.0" = type { ptr, ptr }',
]

# Each trait's list of vtables is a symbol named for that trait, so a module
# with several traits has several lists and LLVM never has to tell two apart
# with its '.1' uniquifier. The list is internal whatever the compile: it holds
# the implementers this compile saw, so no two objects could agree on one.
[[scenario.trait_success.check]]
name = "vtable-list-is-named-per-trait"
target = "symbols"
contains = [
  "constant internal Shape (vtable list) comdat nodeduplicate",
  "constant internal Scaler (vtable list) comdat nodeduplicate",
  "constant internal Blender (vtable list) comdat nodeduplicate",
  "constant internal Meter (vtable list) comdat nodeduplicate",
]
excludes = ["(vtable list).1"]

# The list holds one entry per implementer, which is its length to show. An
# entry is a bare 'ptr', so a list's type no longer names its trait and only
# its symbol does: Shape's, the one list of three, is asserted; Scaler's two
# would be spelled as every other two-implementer trait's list is.
[[scenario.trait_success.check]]
name = "vtable-list-holds-every-implementer"
target = "preir"
contains = ['internal constant [3 x ptr] [']

# A trait contributes nothing to the layout of a type that is-a it. Every field a
# type holds is one it declared: Sensor's 'id' appears in Logger and in each
# implementer because each one declares it to comply, not because anything was
# spliced in, and 'Probe' is its own two fields and nothing more. Marker traits
# cost nothing at all when named after the first in an 'is' list (Ledger), and
# neither do two that each require a method (Tally). A run cannot see any of this: every printed number would be
# the same whatever sat in front of it, and what a trait used to add was a
# constant zero byte nothing ever read.
[[scenario.trait_success.check]]
name = "composing-traits-adds-no-hidden-field"
target = "preir"
contains = [
  "%Sensor = type { i32 }",
  "%Logger = type { i32 }",
  "%Probe = type { i32, i32 }",
  "%Relay = type { i32, i32 }",
  "%Tally = type { i32 }",
  "%Ledger = type { i32 }",
]

# A trait method whose parameter is a virtual reference to its own trait makes
# the vtable recursive: one of its slots takes the fat pointer to itself. Its
# own file, rather than more of trait_success, because the subject is the
# recursion and not the requirement/implementation split, and because the
# construct used to overflow the compiler's stack, which would take every other
# expectation in a shared file down with it.
[scenario.trait_self_vref]
category = "run"
description = "A trait method taking a virtual reference to its own trait, dispatched through the receiver and the argument"
tags = ["typecheck", "genllvm", "runtime"]

# The recursive slot takes the virtual reference to its own vtable. LLVM's
# pointers carry no type, so the vtable's slots are bare 'ptr's and the cycle
# is not in the types at all; the slot's function type is the one gapOf calls
# its second slot with, the receiver and the fat pointer '%"Meter:Vtable.0"'.
# Read before optimization, where gapOf still dispatches.
[[scenario.trait_self_vref.check]]
name = "recursive-slot-takes-a-reference-to-its-own-vtable"
target = "preir"
contains = [
  '%"Meter:Vtable" = type { ptr, ptr }',
  '%"Meter:Vtable.0" = type { ptr, ptr }',
  '%gap = getelementptr inbounds nuw %"Meter:Vtable", ptr %2, i32 0, i32 1',
  '%5 = call i32 %4(ptr %3, %"Meter:Vtable.0" %b2)',
]

[scenario.trait_inherited_defaults]
category = "compile"
description = "Two types inheriting one trait default each get their own copy of it, spelled after the type"
tags = ["typecheck", "genllvm"]

# Two implementers of the same trait inherit the same default. Each clone is
# owned by its implementing type and so lands on its own symbol, and each is a
# definition here, linked as a method written in that type would be. The
# trait's own copy is not a symbol at all. A collision between the two clones
# would show as LLVM's '.1' uniquifier on the second definition.
[[scenario.trait_inherited_defaults.check]]
name = "each-implementing-type-defines-its-own-clone"
target = "symbols"
contains = [
  "define internal Alpha.reading comdat nodeduplicate",
  "define internal Beta.reading comdat nodeduplicate",
]
excludes = [
  "Meter.reading",
  "Alpha.reading.1",
  "Beta.reading.1",
]

# The receiver each clone takes, which the symbol above cannot show. Both clones
# shared one receiver type until 17 Sept 2026 -- whichever implementer generated
# first named the pointee for every reference to '&ro Meter', because a cloned
# reference node kept the original's interned type record and the LLVM type is
# memoized on it. Beta's clone took a '%Alpha*' and would have read 'span' off
# the end of an Alpha. LLVM's pointers carry no type, so a receiver is a bare
# 'ptr' and its type shows where the clone's body reads 'level' through it: the
# field address taken in the receiver's own struct, then doubled, which only
# the 'reading' clones do. Read before optimization, which folds the address
# away.
[[scenario.trait_inherited_defaults.check]]
name = "each-clone-takes-its-own-receiver"
target = "preir"
contains = [
  "%level = getelementptr inbounds nuw %Alpha, ptr %self1, i32 0, i32 0\n  %1 = load i32, ptr %level, align 4\n  %2 = mul i32 %1, 2",
  "%level = getelementptr inbounds nuw %Beta, ptr %self1, i32 0, i32 0\n  %1 = load i32, ptr %level, align 4\n  %2 = mul i32 %1, 2",
]

# A plain reference to a trait is compiled with the trait's own layout, which is
# the fields the trait declares and nothing else, and is a prefix of every
# implementer. One function serves implementers of two different sizes, so any
# implementer's type here would be wrong for the other -- and being the larger of
# the two, '%Beta' would read past the end of an Alpha. The reference is a bare
# 'ptr', so the layout shows where baseLevel reads 'level' through its 'm':
# the field address is taken in '%Meter'. Read before optimization, which folds
# the address away and with it the only use of '%Meter'.
[[scenario.trait_inherited_defaults.check]]
name = "a-trait-reference-takes-the-traits-own-layout"
target = "preir"
contains = [
  "%Meter = type { i32 }",
  "%Alpha = type { i32 }",
  "%Beta = type { i32, i32 }",
  "%level = getelementptr inbounds nuw %Meter, ptr %m1, i32 0, i32 0",
]
excludes = [
  "getelementptr inbounds nuw %Alpha, ptr %m1",
  "getelementptr inbounds nuw %Beta, ptr %m1",
]

# A trait in an imported module, named by a type in the root. The root is
# resolved first, so the trait is resolved by demand from the type, in its own
# module's scope, with what that module folds in visible to the trait's default
# method. What is asserted is that the compile succeeds at all, and what the
# root declares for the names the inherited default reached.
[scenario.trait_import_inherit]
category = "compile"
description = "A type declaring is-a against a trait from an imported module, whose inherited default names what that module folded in"
tags = ["parse", "nameres", "typecheck", "genllvm"]

# The inherited default is the root type's own clone, and the function it
# reached by the other module's fold is declared under the module that
# declares it. Nothing is spelled after traitmeter for the fold.
[[scenario.trait_import_inherit.check]]
name = "inherited-default-reaches-the-other-modules-fold"
target = "symbols"
contains = [
  "define internal Gauge.doubled comdat nodeduplicate",
  "declare traitscale.twice",
]
excludes = ["traitmeter.twice", "traitmeter.Meter.doubled"]

[scenario.trait_variants]
category = "run"
description = "A base type's abstract method implemented per variant, dispatched and then narrowed back"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# A vtable is a definition of this object, internal in a program compile like
# every other; a package compile, where several objects each supply one, will
# make it merge like a generic instance. It needs a COMDAT for a second reason
# too: it names every method in its slots, so a vtable the linker cannot
# discard keeps all of them in the image whether or not anything dispatches. A
# An enum's variant is owned by its enum, so its vtable reads as the enum's
# variant. Tri, declared after the function whose signature builds Shape's
# vtable, gets a vtable like the others.
[[scenario.trait_variants.check]]
name = "vtables-are-discardable"
target = "symbols"
contains = [
  "constant internal Extense.Variant1 as Extense (vtable) comdat nodeduplicate",
  "constant internal Rect as Shape (vtable) comdat nodeduplicate",
  "constant internal Tri as Shape (vtable) comdat nodeduplicate",
  "constant internal Shape (vtable list) comdat nodeduplicate",
]

# Tri satisfies Shape structurally and is declared after the function whose
# signature builds Shape's vtable. That is invisible to a run: a vtable slot
# holding a null function pointer is what the IR shows and what the printed
# numbers cannot. LLVM's pointers carry no type, so a slot is a bare 'ptr' and
# only the method's symbol would say it is Tri's: what is asserted is that the
# Shape vtables, Tri's among them by the check above, fill the slot from a
# symbol and none leaves it null. Read where generation wrote them, as the
# check above is.
[[scenario.trait_variants.check]]
name = "late-declared-structural-conformer-fills-its-vtable-slot"
target = "preir"
contains = ['internal constant %"Shape:Vtable" { ptr @']
excludes = ['constant %"Shape:Vtable" { ptr null']

# A plain reference to an enum passed where a virtual reference to another trait
# is expected. What it points at is one of the variants, so the fat pointer
# carries that variant's vtable, chosen by the tag. Its own file, rather than
# more of trait_variants, because the subject is the conversion from the enum's
# reference and not narrowing a trait's reference back: before 25 Sept 2026 the
# conversion built a vtable for the enum itself, whose methods are never
# generated, and the program failed to link.
[scenario.trait_enum_vref]
category = "run"
description = "A plain reference to an enum converted to a virtual reference to another trait, dispatching to the variant its tag names"
tags = ["typecheck", "genllvm", "runtime"]

# Each variant gets a vtable for the other trait and the enum gets none. One
# for the enum would fill its slots with the enum's own methods, which are
# never generated: that was the unresolved symbol.
[[scenario.trait_enum_vref.check]]
name = "each-variant-gets-a-vtable-and-the-enum-none"
target = "symbols"
contains = [
  "constant internal Shape.Circle as Named (vtable) comdat nodeduplicate",
  "constant internal Shape.Square as Named (vtable) comdat nodeduplicate",
  "constant internal Shape.Dot as Named (vtable) comdat nodeduplicate",
  "constant internal Color.Red as Labelled (vtable) comdat nodeduplicate",
  "constant internal Tagged.Two as Labelled (vtable) comdat nodeduplicate",
]
excludes = [
  "Shape as Named (vtable)",
  "Shape as Labelled (vtable)",
  "Color as Labelled (vtable)",
  "Tagged as Labelled (vtable)",
]

# An enum's 'is' and a variant's, each naming open traits, which 'mixin' in the
# body was the only way to write until 25 Sept 2026. The enum's gives every
# variant the trait's requirements and defaults; a variant's adds traits beyond
# its enum, which stays its base. Its own file rather than more of
# trait_enum_vref, because the subject is what the declaration gives each
# variant, and the conversion from '&Shape' is one use of it among several. A
# run, because which method each slot reached is what the numbers say.
[scenario.trait_enum_is]
category = "run"
description = "An enum and a variant declaring with 'is' that they comply with open traits: requirements, defaults reaching every variant, a generic enum's instance, and a reference to the enum converted to the trait's virtual reference"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

# Each trait a variant takes in gets a vtable per variant that is it, and the
# enums get none, as in trait_enum_vref; Cat names neither trait and gets neither.
[[scenario.trait_enum_is.check]]
name = "each-variant-that-is-a-trait-gets-its-vtable"
target = "symbols"
contains = [
  "constant internal Shape.Circle as Named (vtable) comdat nodeduplicate",
  "constant internal Shape.Square as Sized (vtable) comdat nodeduplicate",
  "constant internal Pet.Dog as Named (vtable) comdat nodeduplicate",
  "constant internal Pet.Dog as Sized (vtable) comdat nodeduplicate",
  "constant internal Pet.Fish as Sized (vtable) comdat nodeduplicate",
]
excludes = [
  "Shape as Named (vtable)",
  "Pet.Cat as",
]

# -------- parse stage --------

# 'mixin' is retired into 'is' (25 Sept 2026) and kept a keyword only to be
# refused, once per statement, at the keyword. Every kind of body that could
# write one is here -- a struct's, a trait's, an enum's and a variant's -- and a
# fold after it, which is read through with the statement.
[scenario.trait_parse_mixin]
category = "reject"
description = "The retired 'mixin', in each kind of type body, pointed at 'is' on the declaration line"
tags = ["parse"]
diagnostics = 5

# 'extends' no longer spells nominal conformance, and it is not yet the concrete
# enrichment it is reserved for, so it is refused at the clause where it is
# written. That is the parser's, which is why this is its own file: a parse
# diagnostic stops the compile before name resolution, so nothing else here
# would be reached. Both kinds that can write one are here, because the
# diagnostic names the kind it was written on.
[scenario.trait_parse_extends]
category = "reject"
description = "The base clause grammar: 'extends' on an abstraction, and either clause written twice"
tags = ["parse"]
diagnostics = 3

# The other half of trait_kind_modifier: what the modifier grammar refuses. The
# modifier does not stack, and a kind whose abstraction does not exist says so
# where the declaration is written rather than being accepted with nothing under
# it. 'actor' is here rather than in a concurrency group because carrying this
# modifier is the only thing that spelling does today. 'mod trait' is built and
# belongs to module, as 'mod' by itself does.
[scenario.trait_parse_kind_modifier]
category = "reject"
description = "'trait' written twice, and the kind whose abstraction the grammar admits and the compiler does not build"
tags = ["parse"]
diagnostics = 4

# -------- name resolution stage --------

[scenario.trait_nameres]
category = "reject"
description = "Borrowing or allocating a virtual reference instead of coercing one"
tags = ["nameres"]
diagnostics = 3

# The other half of trait_success's 'Meter.scale': a static function belongs to
# the type that declares it and is reached through that name alone.
[scenario.trait_nameres_static]
category = "reject"
description = "A trait's static function, named through an implementer or a variant"
tags = ["nameres"]
diagnostics = 2

# Its converse: a method of a trait or an enum belongs to each implementer or
# variant, so a path through the abstraction names a copy nothing generates.
# Each of these crashed generation with no diagnostic.
[scenario.trait_nameres_method_path]
category = "reject"
description = "A trait's or enum's method, named through the trait or the enum"
tags = ["nameres"]
diagnostics = 7

# A type's abstractions are reached while the type is name resolved, so two types
# that each stand on the other are this stage's. The cycle used to hang the
# compiler. The duplicate-field half of this file is gone with the splice: a trait
# contributes no fields, so declaring the name is compliance rather than a clash,
# and the splice that can still produce one is the enum's -- enum_nameres_splice.
[scenario.trait_nameres_inherit]
category = "reject"
description = "Types that each name the other as a base, or name themselves after the first in an 'is' list"
tags = ["nameres"]
diagnostics = 2

# Every name of an 'is' list is checked for being a closed type, not only the
# first (25 Sept 2026): a later one let a plain struct take in an enum's tag and
# common fields. A later name is taken in at name resolution, so it is refused
# there; the first name of a struct's list is its base, judged at type check
# (enum_typecheck_variant), so none is written first here.
[scenario.trait_nameres_closed_is]
category = "reject"
description = "An enum named in an 'is' list after the first, or in an enum's or a variant's list"
tags = ["nameres"]
diagnostics = 5

# -------- type check stage --------

# Both halves of what an 'is' asserts: the methods the abstraction requires, and
# the fields it requires the type to declare in its order at position 0. The field
# half points at the field that breaks the prefix rather than at the struct, which
# is the member a reader would go to; everything else is reported on the struct.
[scenario.trait_typecheck_conform]
category = "reject"
description = "Types whose declarations do not satisfy the abstractions they assert, an enum's and a variant's among them"
tags = ["typecheck"]
diagnostics = 10

[scenario.trait_typecheck_vref]
category = "reject"
description = "Types a virtual reference cannot be made of, or coerced to and from, and traits no virtual reference can dispatch through"
tags = ["typecheck"]
diagnostics = 16

[scenario.trait_typecheck_dispatch]
category = "reject"
description = "Members and operations a virtual reference cannot reach, and comparing what a reference to a trait refers to"
tags = ["typecheck"]
diagnostics = 8

# trait_enum_vref's refusals: a plain reference to an open trait, or to an enum
# that does not itself declare what the trait requires, converted to another
# trait's virtual reference, and a virtual reference narrowed to a trait or an
# enum. All but the enum used to compile and then fail at link or in
# generation; the enum is the boundary, refused before and after.
[scenario.trait_typecheck_enum_vref]
category = "reject"
description = "References to a trait or an enum that cannot become another trait's virtual reference, and narrowing to a trait or an enum"
tags = ["typecheck"]
diagnostics = 4

# -------- flow stage --------

[scenario.trait_flow_vref]
category = "reject"
description = "Writing a trait field through a virtual reference that grants no write, and reading one through a reference that grants no read"
tags = ["flow"]
diagnostics = 3

# The other flow question a virtual reference raises: not what may be done
# through it, but how long it lives. A virtual reference is built by coercion
# rather than by a borrow expression, and the coercion is where its lifetime was
# lost, so widening a plain reference to a base trait's reference type -- the
# same coercion, lost the same way -- is asserted beside it here rather than in
# ref, whose lifetime scenarios all start from a borrow expression.
[scenario.trait_flow_vref_lifetime]
category = "reject"
description = "A virtual reference, or a reference widened to a base trait, stored or returned past the value it borrows"
tags = ["flow"]
diagnostics = 7
