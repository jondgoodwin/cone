# core - operators and expressions, blocks and statements, functions and
# function overload, 'if', 'while'/'break'/'continue', number types and enum,
# void, tuples, local and global vars. Tier 0.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# The reject scenarios are split by pipeline stage, because analysis halts
# between stages and an expectation from a later stage would never be reached.
# They are split again within the parse stage, by what recovery can reach, and
# within the name-resolution and type-check stages by sub-family. Statement
# placement is checked in both of those stages, and the name-resolution rule
# hides the type-check one, so the two files provoke it in different ways.

support = []

# -------- success --------

[scenario.core_success]
category = "run"
description = "Variables, number types, operators, blocks, if, while, functions, tuples and void"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# Two runs of one source (R2.2). The optimizer is the difference: 'release' is
# the default build, 'debug' passes --debug, which turns optimization off. Both
# are compared against the same .out, so anything the corpus establishes here
# has to hold with and without the optimizer.
#
# This is worth a second run rather than a second file because the failure it
# guards against is one nothing else can see: code generation that is wrong in a
# way the optimizer happens to repair. Such a bug passes every scenario in the
# suite and then breaks the first time someone builds unoptimized.
[[scenario.core_success.run]]
name = "release"
options = []

[[scenario.core_success.run]]
name = "debug"
options = ["--debug"]

# A global variable is discardable on the same terms as a function, and for the
# same reason. So is a string literal, which is private to its object file and
# so cannot collide with anything, but would otherwise sit in a shared section
# and outlive the dead function that was its only mention.
[[scenario.core_success.check]]
name = "global-variables-are-individually-discardable"
target = "symbols"
contains = [
  "global internal counter comdat nodeduplicate",
  "constant internal string comdat nodeduplicate",
]

# The program linkage rule on the root module's own symbols. A root symbol is
# its source name with no prefix, and every definition is internal -- a
# program's symbols are its own, so nothing outside the object may resolve
# against them -- except 'main', which the C runtime resolves. A private global
# is spelled and linked exactly as a public one: privacy is a fact about the
# namespace, not the object file, so no symbol carries 'hidden'. An 'imm'
# global is a 'constant'. Each is a definition, so each leads its own
# 'nodeduplicate' COMDAT.
[[scenario.core_success.check]]
name = "root-definitions-are-internal-except-main"
target = "symbols"
contains = [
  "global internal total comdat nodeduplicate",
  "global internal hiddenTotal comdat nodeduplicate",
  "constant internal origin comdat nodeduplicate",
  "define main comdat nodeduplicate",
]
excludes = [" hidden ", "define internal main "]

# 'main' is the one definition the optimizer cannot delete or fold away, so it
# is where the COMDAT line itself is pinned as LLVM prints it, and where it
# survives into the object. Its 'define' line is generation's, read before the
# optimizer, which adds attributes of its own to it in the release run; it
# stops before its '{' because the debug run puts a '!dbg' there, and both
# runs read these checks.
[[scenario.core_success.check]]
name = "main-leads-its-own-comdat"
target = "llvmir"
contains = [
  "$main = comdat nodeduplicate",
  "i32 @main()",
]

[[scenario.core_success.check]]
name = "main-is-defined-in-its-comdat"
target = "preir"
contains = ["define i32 @main() comdat"]

# A method of a number type lowers to what the type's declaration holds -- an
# intrinsic -- and never to a symbol of its own. 'sqrt' is the one that leaves
# a trace the dump can show, the LLVM intrinsic it calls; the operators called
# by name become instructions and leave none. Read before optimization because
# the release run folds a call on a constant away.
# A function's static is a global owned by the function, so its symbol is
# spelled after the function -- which is what keeps two functions' statics of
# one name apart -- and it is internal like every other definition here.
[[scenario.core_success.check]]
name = "static-is-a-global-owned-by-its-function"
target = "symbols"
contains = [
  "global internal tick.calls comdat nodeduplicate",
  "global internal tock.calls comdat nodeduplicate",
  "global internal moduleStatic comdat nodeduplicate",
]

# libc declares C's own 'sqrt', and every compile loads libc (core imports it),
# so the declaration is in every dump: what must be absent is a call to it.
[[scenario.core_success.check]]
name = "number-method-lowers-to-intrinsic"
target = "preir"
contains = ["call double @llvm.sqrt.f64("]
excludes = ["call double @sqrt(", "isTrue"]

# One tuple-typed lval given a value tuple takes it whole, each value coerced
# to its element's type, as a declaration's initial value is; parallel
# assignment, a swap and extra values to a plain lval are unchanged. Run with
# and without the optimizer, as core_success is, since the new store is of a
# whole tuple value built in place.
[scenario.core_tuple_assign]
category = "run"
description = "A value tuple assigned to one tuple-typed variable, local or global, suffixed or not, parenthesized or not: the variable takes it whole"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[[scenario.core_tuple_assign.run]]
name = "release"
options = []

[[scenario.core_tuple_assign.run]]
name = "debug"
options = ["--debug"]

# A value tuple of constants is a constant: a global's, a static's, a named
# constant's or a field default's value, generated as a constant struct. And a
# tuple named by a type alias is used as the tuple itself: its elements read
# and written by '.0', passed, returned and assigned whole.
[scenario.core_tuple_const]
category = "run"
description = "A value tuple of constants as a global's, a static's, a constant's or a field default's value; element access through a type alias of a tuple"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.core_tuple_const.check]]
name = "global-tuple-is-a-constant-struct"
target = "preir"
contains = ["@gp = internal global { i64, i64 } { i64 1, i64 2 }", "@gi = internal constant { i8, double } { i8 5, double 6.000000e+00 }"]

# The scenario the fix for a crash landed with: a number after '.' on a
# reference to a tuple was looked up as a name. A 'run', since only the printed
# elements show each read and write reached the element it numbers.
[scenario.core_tuple_ref]
category = "run"
description = "A tuple's element read and written through a reference: borrowed, mutable, a parameter, a struct's field, returned by a call, nested, counted, an alias's, a raw pointer, and borrowed through one"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# A number straight after '.' is an element's number and an integer only, so
# a further '.' starts the next member ('y.0.len()', 'p.0.x', 't.1.0') and is
# not read as a float's decimal point. A 'run', since the printed values show
# which element and member each chain reached; the float literals around it
# show the lexer's other numbers are unchanged.
[scenario.core_tuple_dot_chain]
category = "run"
description = "A member, method or further element after a tuple element picked by number: 'y.0.len()', 'p.0.x', 't.1.0', three deep and on a call's result; float literals unchanged"
tags = ["parse", "typecheck", "runtime"]

# The scenario the fix for a crash landed with: an index of a named constant
# array asked the constant for storage it does not have. A use of a constant is
# its literal, so the constant is indexed, borrowed, passed as a slice, returned
# and given to a global as its literal is. A 'run', since only the printed
# elements show each index and borrow reached the right one.
[scenario.core_const_aggregate]
category = "run"
description = "A named constant array, struct or tuple indexed, its fields read, and a constant array or string borrowed, as their literals are"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.core_const_aggregate.check]]
name = "indexed-constant-array-reads-a-constant-global"
target = "preir"
contains = ["internal constant [4 x i32] [i32 1, i32 2, i32 3, i32 4]"]

[scenario.core_overload]
category = "run"
description = "Which candidate of an overload set a call selects"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

# Every candidate is a definition under its own concrete name, the private
# ones of the private set included. Read before optimization: each is called
# once or twice, and the inliner folds every internal function it can into
# 'main' and deletes what it folded.
[[scenario.core_overload.check]]
name = "overload-lowers-to-concrete"
target = "symbols"
contains = [
  "define internal scaleInt comdat nodeduplicate",
  "define internal scaleFloat comdat nodeduplicate",
  "define internal joinOne comdat nodeduplicate",
  "define internal joinTwo comdat nodeduplicate",
  "define internal stepInt comdat nodeduplicate",
  "define internal stepFloat comdat nodeduplicate",
  "define internal emitUnsigned comdat nodeduplicate",
  "define internal emitSigned comdat nodeduplicate",
]

# An overload name is not a declaration, so nothing is generated for it. A
# definition's name is followed by its COMDAT, so the trailing space is what
# stops 'scale' from matching 'scaleInt'.
[[scenario.core_overload.check]]
name = "no-symbol-for-overload-name"
target = "symbols"
excludes = ["scale ", "join ", "step ", "emit "]

# Each function leads a COMDAT named for itself. A COFF section is otherwise
# all-or-nothing, so without this every function an object file defines ships in
# the executable whether the program can reach it or not; with it the linker
# discards the unreachable ones. A private function gets one too, and it is
# spelled and linked exactly as a public one: privacy is a fact about the
# namespace, not the object file.
#
# 'nodeduplicate' is the selection kind that keeps a duplicate definition a link
# error. In a program compile nothing asks to merge, since every definition is
# internal and the object is the only one that references it.
[[scenario.core_overload.check]]
name = "functions-are-individually-discardable"
target = "symbols"
contains = [
  "define internal scaleInt comdat nodeduplicate",
  "define internal emitUnsigned comdat nodeduplicate",
]
excludes = [" hidden ", "comdat any"]

[scenario.core_overload_later]
category = "run"
description = "An overload name called before its candidates, each returning a generic instance, from a method, a function and each other"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.core_shadowing]
category = "run"
description = "Which of two declarations under one spelling a bare name binds to, by scope"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

# Both declarations under the spelling 'weigh' exist as symbols -- the
# module's function bare, the type's method after its type -- and so do both
# shadowed globals, so the printed values and not the presence of a symbol
# are what say which one each bare name reached. What the symbols pin is that
# shadowing binds and never renames: nothing is spelled after what it hid or
# what hid it, and LLVM had no clash to uniquify.
#
# The file's 'mod' line is also pinned here, by what it does not do: the root
# module's declarations stay bare, so naming the module is what makes its hidden
# names reachable and is not what spells its symbols. Nothing is prefixed
# 'core_shadowing'.
[[scenario.core_shadowing.check]]
name = "shadowed-and-shadowing-both-keep-their-symbols"
target = "symbols"
contains = [
  "define internal weigh comdat nodeduplicate",
  "define internal Widget.weigh comdat nodeduplicate",
  "global internal depth comdat nodeduplicate",
  "constant internal width comdat nodeduplicate",
]
excludes = ["weigh.1", "depth.1", "width.1", "core_shadowing."]

# A reinterpretation ('as') of a constant is a constant: the null pointer
# '0usize as *T' and its nonzero and number-to-number kin, as a field default,
# a global, a static, a parameter default and a named constant
[scenario.core_constcast]
category = "run"
description = "A reinterpretation of a constant as a field default, global, static, parameter default and const"
tags = ["typecheck", "genllvm", "runtime"]

# A constant may be an expression over constants: every operator on every
# width folded and compared with the same expression computed at run time,
# conversions, reinterpretations, bool logic, flags chained through a constant
# declared later, and each place a constant is required. Two runs, as
# core_success's: the run-time half must not depend on the optimizer.
[scenario.core_const_expr]
category = "run"
description = "Constant expressions folded where a constant is required, each equal to its run-time value"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.core_const_expr.run]]
name = "release"
options = []

[[scenario.core_const_expr.run]]
name = "debug"
options = ["--debug"]

# The folded value is a literal, so a global's initializer is a constant
# aggregate, computed by nothing at run time
[[scenario.core_const_expr.check]]
name = "folded-global-is-a-constant-initializer"
target = "preir"
contains = ["[3 x i32] [i32 3, i32 8, i32 15]"]

# A thread-local global, read and written on the program's thread and seen
# from a second OS thread the program starts itself. Two runs, as
# core_success's: what each thread sees must not depend on the optimizer.
[scenario.core_threadlocal]
category = "run"
description = "Thread-local globals: read and written, lent, and one copy per thread, seen from a second OS thread"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[[scenario.core_threadlocal.run]]
name = "release"
options = []

[[scenario.core_threadlocal.run]]
name = "debug"
options = ["--debug"]

# Each '@threadlocal' global is thread_local in the object, whatever its type
# and however its type was found; the ordinary global beside them is not.
# None of them is a 'constant', which a thread's own copy never is.
[[scenario.core_threadlocal.check]]
name = "a-thread-local-global-is-thread-local"
target = "symbols"
contains = [
  "global internal thread_local slot comdat nodeduplicate",
  "global internal thread_local inferred comdat nodeduplicate",
  "global internal thread_local counted comdat nodeduplicate",
  "global internal thread_local pair comdat nodeduplicate",
  "global internal plain comdat nodeduplicate",
]
excludes = ["thread_local plain", "constant internal thread_local"]

# And what generation wrote for one: the storage and its initial value, which
# each thread's copy starts from
[[scenario.core_threadlocal.check]]
name = "a-thread-local-holds-its-initial-value"
target = "preir"
contains = [
  "@slot = internal thread_local global i64 0, comdat",
  "@pair = internal thread_local global %Pair { i64 3, i64 4 }, comdat",
]

# '<<' and '>>' past the width [Jon 3 Oct 2026]: 0, or the sign for a signed
# '>>', the same in every build. Every amount comes from C compiled apart
# (opaque.c), which the optimizer cannot see into, so the release run shifts
# as it runs rather than folding; the two runs share one .out because a shift
# past the width once printed one value in a debug build and another in a
# release one.
[scenario.core_shift_defined]
category = "run"
description = "'<<' and '>>' on every integer type by 0, 1, width - 1, width, width + 1, 255, 1000 and all ones (negative for a signed type), the assignment forms, a masked amount and a constant amount past the width: 0, or the sign for a signed '>>', in a release and a debug build alike"
tags = ["typecheck", "genllvm", "runtime"]
link = ["opaque.c"]

[[scenario.core_shift_defined.run]]
name = "release"
options = []

[[scenario.core_shift_defined.run]]
name = "debug"
options = ["--debug"]

# Optimized, the amounts are still unknown: each shift's compare with the
# width survives, so the release run tests the run-time path
[[scenario.core_shift_defined.check]]
name = "the-amount-is-compared-as-the-program-runs"
target = "llvmir"
contains = ["icmp ult i8", "icmp ult i16", "icmp ult i32", "icmp ult i64", "call i64 @opaque("]

# Where the amount is known to be below the width, the defined shift costs
# nothing: a masked amount's compare is gone once optimized, and a constant
# amount gets none from generation; one past the width is the answer itself
[scenario.core_genllvm_shift]
category = "compile"
description = "A shift by an amount masked below the width keeps no compare once optimized, one by a constant amount is written with none, and one by a constant past the width is 0, or the sign for a signed '>>'"
tags = ["genllvm"]

# Compiled as a library, so that its public functions are exported: in a
# program they are internal, and the optimizer deletes what main never calls
[[scenario.core_genllvm_shift.run]]
name = "library"
options = ["--library"]

[[scenario.core_genllvm_shift.check]]
name = "a-masked-amount-needs-no-compare"
target = "llvmir"
contains = ["and i64 %1, 63", "lshr i64 %0, %2", "shl i32 %0, %2", "ashr i16 %0, %2"]
excludes = ["icmp", "select"]

[[scenario.core_genllvm_shift.check]]
name = "a-constant-amount-is-written-without-one"
target = "preir"
contains = ["shl i64 %x1, 3", "ashr i8 %x1, 7", "ret i64 0", "ashr i32 %x1, 31"]

# -------- warnings --------

[scenario.core_warn_loops]
category = "warn"
description = "A 'while' that may never stop, and the three that will"
tags = ["typecheck"]
diagnostics = 2

# -------- parse stage --------

[scenario.core_parse_stmts]
category = "reject"
description = "Statement and expression syntax the parser cannot accept"
tags = ["parse"]
diagnostics = 11

[scenario.core_parse_decls]
category = "reject"
description = "Global-area declaration syntax the parser cannot accept"
tags = ["parse"]
diagnostics = 10

[scenario.core_parse_fns]
category = "reject"
description = "Function declaration syntax the parser cannot accept"
tags = ["parse"]
diagnostics = 4

[scenario.core_parse_names]
category = "reject"
description = "Two declarations claiming one global name, across every kind of declaration"
tags = ["parse"]
diagnostics = 15

[scenario.core_parse_overload]
category = "reject"
description = "Malformed 'overload' declarations"
tags = ["parse"]
diagnostics = 4

[scenario.core_parse_overload_private]
category = "reject"
description = "An overload name's candidates must agree with it about visibility"
tags = ["parse"]
diagnostics = 2

[scenario.core_parse_threadlocal]
category = "reject"
description = "'@threadlocal' anywhere but after a module global's 'mut', and a thread-local with no initial value"
tags = ["parse"]
diagnostics = 12

# ErrorNoRCurly needs the file to end with a block still open, so it is one per
# file and it has to be last. That is why it has a file of its own. It is
# reported at the EOF token, whose line depends on whether the file ends with a
# newline; the runner matches an annotation on the final line against either.
[scenario.core_parse_unclosed]
category = "reject"
description = "A block the file never closes"
tags = ["parse"]
diagnostics = 1

# -------- name resolution stage --------

[scenario.core_nameres]
category = "reject"
description = "Names and lifetime labels that resolve to nothing"
tags = ["nameres"]
diagnostics = 5

[scenario.core_nameres_stmtorder]
category = "reject"
description = "'return', 'break' and 'continue' before the end of their block"
tags = ["nameres"]
diagnostics = 3

[scenario.core_nameres_tuple]
category = "reject"
description = "A tuple mixing types and values among its elements"
tags = ["nameres"]
diagnostics = 3

# One real error and nothing else: --checktree once reported every value tuple
# in a program whose name resolution failed as a compiler defect
[scenario.core_nameres_tuple_vtype]
category = "reject"
description = "Value tuples in a program whose name resolution fails report no compiler defect"
tags = ["nameres"]
diagnostics = 1

# The lexical-scope counterpart of core_parse_names: a block's names are
# hooked as the walk reaches them, so its duplicates are found here.
[scenario.core_nameres_dupname]
category = "reject"
description = "Two declarations claiming one name in one block: a local, and a lifetime label"
tags = ["nameres"]
diagnostics = 4

# -------- type check stage --------

[scenario.core_typecheck]
category = "reject"
description = "Types and arities that do not agree"
tags = ["typecheck"]
diagnostics = 19

[scenario.core_typecheck_namedarg]
category = "reject"
description = "'name: value' anywhere but a struct's implicit init: every kind of call, an init the struct declares among them, an index and a macro use"
tags = ["typecheck"]
diagnostics = 11

[scenario.core_typecheck_select]
category = "reject"
description = "Calls an overload name cannot resolve to exactly one candidate"
tags = ["typecheck"]
diagnostics = 4

[scenario.core_typecheck_overload]
category = "reject"
description = "Overload sets that could never choose, and overload names used as values"
tags = ["typecheck"]
diagnostics = 5

[scenario.core_typecheck_circular]
category = "reject"
description = "A constant, typed or not, and an inferred global, defined in terms of themselves"
tags = ["typecheck"]
diagnostics = 6

# Beside core_const_expr, which folds what has a value: what has none at run
# time -- overflow, division by zero, a shift too far -- is refused where a
# constant is required, once each, and an operand that is no constant leaves
# the expression not one
[scenario.core_typecheck_constexpr]
category = "reject"
description = "Constant expressions that overflow, divide by zero, shift too far, or read a variable or a call"
tags = ["typecheck"]
diagnostics = 28

# Beside core_const_aggregate, which borrows a constant array and string: a
# constant is its literal at each use, so any other constant, or a part of one,
# is a temporary a borrow refuses, once and with nothing following from it.
[scenario.core_typecheck_constborrow]
category = "reject"
description = "Borrows of a named constant that is not a whole constant array or string, or of a field or element of one"
tags = ["typecheck"]
diagnostics = 7

[scenario.core_typecheck_blockend]
category = "reject"
description = "Statements that cannot end the block they finish"
tags = ["typecheck"]
diagnostics = 4

[scenario.core_typecheck_threadlocal]
category = "reject"
description = "A thread-local global whose initial value is not a literal, or whose type needs finalizing"
tags = ["typecheck"]
diagnostics = 4

[scenario.core_typecheck_tuple_member]
category = "reject"
description = "A number after '.' naming no element: past a tuple's end through a reference, a counted reference or a pointer, and on a receiver with no numbered elements"
tags = ["typecheck"]
diagnostics = 8

# -------- analysis gates --------

# The one scenario that deliberately mixes a signature failure, a body failure
# and flow diagnostics in one file. Every other file keeps them apart, because
# until the gates in modTypeCheck and fnDclTypeCheck became per-declaration the
# mix reported only the first of them.
[scenario.core_flow_gate]
category = "reject"
description = "A declaration's own type check, not the global error count, decides what is analyzed after it"
tags = ["typecheck", "flow"]
diagnostics = 4

# -------- GPU targets --------

# Generation reports it, once the module's calls are known: every function on
# a GPU target is inlined, which a cycle of calls would never end
[scenario.core_gpu_recursion]
category = "reject"
description = "On a GPU target, a function calling itself directly, and two calling each other, each refused once at the function the cycle returns to"
tags = ["genllvm"]
diagnostics = 2

[[scenario.core_gpu_recursion.run]]
name = "vulkan"
options = ["--triple=spirv1.6-unknown-vulkan1.3"]
