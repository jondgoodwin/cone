# ref - borrowed references, static permissions, lifetime annotations and
# function references. Tier 1.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# The failure scenarios are split first by pipeline stage and then by
# sub-family:
#
# - The two type-check files answer different questions. ref_typecheck_borrow
#   asks whether there is a place to point at and something to point through;
#   ref_typecheck_perm asks what the resulting reference is then allowed to do.
#   Together they would be ten diagnostics, past the three-to-six limit.
# - ref_flow is separate and is a single function, because data-flow analysis
#   runs only on a function that type checked: a type-check error in the same
#   function silences its flow diagnostics. Since fnDclTypeCheck began gating on
#   the function's own error count, that is the whole of the constraint --
#   ref_flow_return, which is four functions, could not have been written before.
# - ref_flow_return is separate from ref_flow because a function has one return,
#   so each case it asserts needs a function of its own.
#
# There is no parse-stage scenario. A malformed borrow produces the generic
# ErrorBadTerm/ErrorNoSemi pair core already covers, and '&' with a missing
# operand silently swallows the statement that follows instead of failing, so
# an expectation on it would assert nothing.
#
# Left out deliberately:
#
# - Lifetime annotations ('a on a signature, <'a, 'b> on a type). Not
#   implemented; doc/reference/reflifefn.html says so and the parser has no syntax
#   for them. The lifetime rules the compiler does enforce -- a borrowed
#   reference may not be stored or returned where it would outlive what it
#   points at, and a call's returned borrow shares the lifetime of the narrowest
#   borrow it was handed -- are asserted in ref_flow, ref_flow_return and
#   ref_flow_call.
# - 'uni' and 'mut1' permissions on a borrow. They are named in the permission
#   table but a borrow of a local variable can never obtain them, so there is
#   nothing to establish here that is not region's move semantics.
# - Freezing through a borrow held inside another value (a struct field, an
#   'Option'). Only a borrow held in a local whose type is a borrowed
#   reference freezes its source so far. What is built is ref_flow_freeze,
#   ref_flow_freeze_loop and ref_freeze_success: a source reached as 'uni' (a
#   local) frozen against what the borrow forbids, one reached through a
#   shared path ('&mut', '&ro', '+Rc-mut') only against ending. A borrow a
#   method returns ('list[0usize]', 'a.alloc(v)') is collection's
#   (collection_flow_freeze, collection_freeze_success) and region's
#   (region_flow_arena_freeze), since it needs a collection or an arena.
# - An element of a resizable collection borrowed through a shared path
#   ('imm e = l[0usize]' for 'l &mut List[T]' or '+Rc-mut List[T]', then a push
#   through another alias). Jon's rule refuses it, as it refuses a reference into
#   an enum's variant through a 'mut' or 'ro' reference of unseen origin
#   (enum_typecheck_narrow). The collections declare 'ShapeChanging' for it,
#   but refusing it now would refuse ordinary code (a List[String] element
#   read through a '&List' parameter) until 'uni' reborrowing exists, so it
#   is a documented hole: collection_flow_freeze's header writes out each
#   shape.
#
# Owning references, array references and slices, and virtual references belong
# to region, collection and trait. The one place an owning reference and a raw
# pointer appear here is ref_alias_deref, and not for ownership or for pointer
# safety: dereference is this group's subject, the deref site resolves an alias
# whatever the alias names, and the four kinds reach two different arms of the
# same two functions.

support = []

# -------- success --------

[scenario.ref_success]
category = "run"
description = "Borrowing, dereference, operators needing an lval, permissions, lifetime, function references, and comparison by value and by identity"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# Separate from ref_success because its subject is a spelling: a
# function-reference type's parameters written as their types alone, each kind
# of type the parser must tell from a parameter's name.
[scenario.ref_fnref_unnamed]
category = "run"
description = "Function-reference types with unnamed parameters: the manual's '&fn(u32) u32', a struct's field, a method's parameter, reference, generic, array and nested function-reference parameter types, named and unnamed mixed, and a returned function reference's type"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# Separate from ref_success because its subject is a spelling rather than a
# feature: every dereference here has a twin written with the concrete type, and
# the pairing is the assertion. Folding it into ref_success would scatter the
# pairs through a file organized by what a reference does.
[scenario.ref_alias_deref]
category = "run"
description = "Dereference resolves a type alias -- explicit '*p', a write through one, and the deref injected for a field access, a method call and an operator"
tags = ["typecheck", "genllvm", "runtime"]

# Separate from ref_success because its subject is what a borrow's source may
# still do while the borrow is held -- the leniency of freezing -- which each
# case shows by reading through the borrow and then the source.
[scenario.ref_freeze_success]
category = "run"
description = "What a held borrow leaves its source: reads under a read-only borrow, touches after the last use, reborrows, both arms of an if, loops, disjoint fields, a reassigned holder, '&opaq'"
tags = ["flow", "genllvm", "runtime"]

# Separate from ref_freeze_success because its subject is a borrow nobody wrote:
# a '&uni' reference handed where a shareable borrowed reference is wanted is
# lent, the reborrow '&mut *p' built for it, and is there to use again after.
[scenario.ref_unireborrow]
category = "run"
description = "A '&uni' reference lent to a '&mut', '&' or '&imm' parameter, a 'self &' or 'self &mut' receiver, and a '&mut' local, and used again after: in a function, in a 'self &uni' method, and in a finalizer"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# Separate from ref_unireborrow because the source is an owner, not a borrowed
# '&uni': a sole owning reference wanted as a '&uni' is borrowed from, the
# borrow '&uni *o' built for it, and still finalized at its own scope end.
[scenario.ref_ownerunilend]
category = "run"
description = "A '+So' or '+Rc' owner lent to a '&uni' parameter, a 'self &uni' receiver, a '&uni' local and an enrichment's '&uni', used again after, and finalized at its own scope end"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# An owner lent as '&' or '&mut' with no written borrow in the function, the
# lends not overlapping: what ref_flow_ownerlend_call's refusals leave allowed.
[scenario.ref_ownerlend_call]
category = "run"
description = "A '+So' or '+Rc' owner lent as '&mut' in one call after another, as '&' twice to one call, as a mutable receiver beside an argument reading it, and as a '&' receiver and argument"
tags = ["flow", "genllvm", "runtime"]

# -------- name resolution stage --------

[scenario.ref_nameres_fnref]
category = "reject"
description = "A function-reference type's lone-name parameter that names no type: a name, and 'self' in a struct's field and a method's signature"
tags = ["parse", "nameres"]
diagnostics = 3

# -------- type check stage --------

[scenario.ref_typecheck_borrow]
category = "reject"
description = "Expressions that cannot be borrowed from or dereferenced"
tags = ["typecheck"]
diagnostics = 16

# Split from ref_typecheck_borrow because its subject is a malformed type
# spelling rather than a borrow expression, and because every case in it used to
# crash the compiler: sharing a file would put every other expectation behind
# that risk.
[scenario.ref_typecheck_incomplete]
category = "reject"
description = "A reference type that never says what it refers to, nested four ways"
tags = ["typecheck"]

[scenario.ref_typecheck_perm]
category = "reject"
description = "Permissions a borrowed reference cannot obtain or coerce to, from a variable or through a 'mut' reference, and the write a reading reference cannot make"
tags = ["typecheck"]
diagnostics = 9

# Separate from the other two type-check files because its question is neither
# what can be borrowed nor what a permission allows, but what two references can
# be compared for: '==' and ordering read through to the values, so a referent
# must offer the operator and both sides must be references; '===' asks about
# places, so a value has nothing to answer with. A comparison refused through a
# slice or a virtual reference belongs to collection and trait.
[scenario.ref_typecheck_compare]
category = "reject"
description = "Comparisons two references cannot make: a referent without the operator, a reference against a value, identity on values"
tags = ["typecheck"]
diagnostics = 6

# -------- flow stage --------

[scenario.ref_flow]
category = "reject"
description = "Writes and reads the permission forbids, a comparison reading through '&opaq' among them, a borrow stored past its lifetime, directly or through a local it initialized, and a write through an uninitialized reference"
tags = ["flow"]
diagnostics = 11

[scenario.ref_flow_return]
category = "reject"
description = "Returning a borrowed reference to one of the function's own locals, directly or through a local it initialized, whose type is declared or not"
tags = ["flow"]
diagnostics = 9

# Separate from ref_flow_return because it is the call site of the same rule:
# a borrow arriving through a call's result, or handed to a call that could
# store it. The stores share one function; the return and the '&mut &T' call
# each need their own.
[scenario.ref_flow_call]
category = "reject"
description = "A borrowed reference returned through a call, or stored through a call, past the borrow it came from"
tags = ["typecheck", "flow"]
diagnostics = 7

# Separate from ref_flow_call because it is the same rule for several returned
# values at once: a call returning a tuple of borrows, destructured into lvals
# or returned whole. The stores share one function; each return has its own.
[scenario.ref_flow_multiassign]
category = "reject"
description = "A tuple of borrowed references returned through a call, destructured or returned past the borrow it came from"
tags = ["typecheck", "flow"]
diagnostics = 9

# The same rule for the borrows the compiler builds on its own behalf: an array
# auto-borrowed to a slice argument, the '&mut' receiver an operator method is
# handed, the field reborrowed for a folded method, and a value receiver
# borrowed for a method declaring 'self &'. Each carries its source's scope into
# the call exactly as the written borrow in ref_flow_call does. The stores share
# one function; each return has its own.
[scenario.ref_flow_autoborrow]
category = "reject"
description = "A borrow the compiler builds for itself -- slice argument, operator receiver, folded field, method receiver -- stored or returned past its source"
tags = ["typecheck", "flow"]
diagnostics = 13

# The same rule for a swap, which stores in both directions: each side is held
# to it against what it receives from the other. Separate from ref_flow because
# it is one statement kind with its own site, swapFlow.
[scenario.ref_flow_swap]
category = "reject"
description = "Swapping a borrowed reference into a variable that outlives it, in either position, through a call's result, and as a slice"
tags = ["flow"]
diagnostics = 4

# A borrow held in a local freezes its source until its last use. One function
# per touch, so that one borrow's conflict cannot stand in for another's.
[scenario.ref_flow_freeze]
category = "reject"
description = "A local read, changed, moved, replaced, swapped, borrowed or ended while a borrow of it that forbids that is still to be used; a '+Rc-mut' or '+So-mut' owner moved, replaced, changed or borrowed where it is held, or ended, while a borrow through it is; a local enum changed while a binding into its variant is"
tags = ["flow"]
diagnostics = 15

# Separate from ref_flow_freeze because its subject is the path that reaches
# the borrow's next use: around a loop's back edge, through a 'continue', out
# through a 'break'.
[scenario.ref_flow_freeze_loop]
category = "reject"
description = "A borrow's next use reached around a loop: the next iteration, a continue, a break, and a source ended at a break"
tags = ["flow"]
diagnostics = 4

# Separate from ref_flow_freeze because the borrow is one the compiler built:
# a '&uni' reference lent where a '&' or '&mut' is wanted, held in a local or
# handed to one call twice. One function per case.
[scenario.ref_flow_unireborrow]
category = "reject"
description = "A '&uni' reference lent as '&mut' or '&': read or changed while a local holds the borrow, and lent twice to one call where either lending is mutable"
tags = ["typecheck", "flow"]
diagnostics = 5

# Separate from ref_flow_unireborrow because the source is an owner lent as a
# '&uni': read or moved while a local holds the borrow, lent twice to one call,
# and a shared owner, which cannot lend a '&uni'.
[scenario.ref_flow_ownerunilend]
category = "reject"
description = "An owner lent as '&uni': read or moved while a local holds the borrow, lent twice to one call, and a shared '+Rc-mut' owner refused"
tags = ["typecheck", "flow"]
diagnostics = 4

# An owner lent implicitly (as '&', '&mut', or a method's receiver) twice to
# one call, in functions holding no written borrow: the gate must see the
# implicit lend, or the loan walk never runs.
[scenario.ref_flow_ownerlend_call]
category = "reject"
description = "A '+So' or '+Rc' owner, or an owner in a field, lent to one call as '&mut' beside a '&', a '&mut' or a move of it, and as a mutable receiver beside an argument lending or moving it, with no written borrow in the function"
tags = ["flow"]
diagnostics = 8
