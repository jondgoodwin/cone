# ref - borrowed references, static permissions, lifetime annotations and
# function references. Tier 1.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# The failure scenarios are split first by pipeline stage and then by
# sub-family:
#
# - The two type-check files answer different questions. ref_typecheck_borrow
#   asks whether there is a place to point at and something to point through;
#   ref_typecheck_perm asks what the resulting reference is then allowed to do.
#   Together they would be ten diagnostics, past the three-to-six limit.
# - ref_flow is separate and is a single function, because data-flow analysis
#   runs only on a function that type checked: a type-check error in the same
#   function silences its flow diagnostics. Since fnDclTypeCheck began gating on
#   the function's own error count, that is the whole of the constraint --
#   ref_flow_return, which is four functions, could not have been written before.
# - ref_flow_return is separate from ref_flow because a function has one return,
#   so each case it asserts needs a function of its own.
#
# There is no parse-stage scenario. A malformed borrow produces the generic
# ErrorBadTerm/ErrorNoSemi pair core already covers, and '&' with a missing
# operand silently swallows the statement that follows instead of failing, so
# an expectation on it would assert nothing.
#
# Left out deliberately:
#
# - Lifetime annotations ('a on a signature, <'a, 'b> on a type). Not
#   implemented; doc/reference/reflifefn.html says so and the parser has no syntax
#   for them. The lifetime rules the compiler does enforce -- a borrowed
#   reference may not be stored or returned where it would outlive what it
#   points at, and a call's returned borrow shares the lifetime of the narrowest
#   borrow it was handed -- are asserted in ref_flow, ref_flow_return and
#   ref_flow_call.
# - 'uni' and 'mut1' permissions on a borrow. They are named in the permission
#   table but a borrow of a local variable can never obtain them, so there is
#   nothing to establish here that is not region's move semantics.
# - Freezing through a borrow held inside another value (a struct field, an
#   'Option'). Only a borrow held in a local whose type is a borrowed
#   reference freezes its source so far. What is built is ref_flow_freeze,
#   ref_flow_freeze_loop and ref_freeze_success: a source reached as 'uni' (a
#   local) frozen against what the borrow forbids, one reached through a
#   shared path ('&mut', '&ro', 'Rc[mut, T]') only against ending. A borrow a
#   method returns ('list[0usize]', 'a.alloc(v)') is collection's
#   (collection_flow_freeze, collection_freeze_success) and region's
#   (region_flow_arena_freeze), since it needs a collection or an arena.
# - An element of a resizable collection borrowed through a shared path
#   ('imm e = l[0usize]' for 'l &mut List[T]' or 'Rc[mut, List[T]]', then a push
#   through another alias). Jon's rule refuses it, as it refuses a reference into
#   an enum's variant through a 'mut' or 'ro' reference of unseen origin
#   (enum_typecheck_narrow). The collections declare 'ShapeChanging' for it,
#   but refusing it now would refuse ordinary code (a List[String] element
#   read through a '&List' parameter) until 'uni' reborrowing exists, so it
#   is a documented hole: collection_flow_freeze's header writes out each
#   shape.
#
# Owning references, array references and slices, and virtual references belong
# to region, collection and trait. The one place an owning reference and a raw
# pointer appear here is ref_alias_deref, and not for ownership or for pointer
# safety: dereference is this group's subject, the deref site resolves an alias
# whatever the alias names, and the four kinds reach two different arms of the
# same two functions.

support = []

# -------- success --------

[scenario.ref_success]
category = "run"
description = "Borrowing, dereference, operators needing an lval, permissions, lifetime, function references, and comparison by value and by identity"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# Separate from ref_success because its subject is a spelling: a
# function-reference type's parameters written as their types alone, each kind
# of type the parser must tell from a parameter's name.
[scenario.ref_fnref_unnamed]
category = "run"
description = "Function-reference types with unnamed parameters: the manual's '&fn(u32) u32', a struct's field, a method's parameter, reference, generic, array and nested function-reference parameter types, named and unnamed mixed, and a returned function reference's type"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# Separate from ref_success because its subject is a spelling rather than a
# feature: every dereference here has a twin written with the concrete type, and
# the pairing is the assertion. Folding it into ref_success would scatter the
# pairs through a file organized by what a reference does.
[scenario.ref_alias_deref]
category = "run"
description = "Dereference resolves a type alias -- explicit '*p', a write through one, and the deref injected for a field access, a method call and an operator"
tags = ["typecheck", "genllvm", "runtime"]

# Separate from ref_success because its subject is what a borrow's source may
# still do while the borrow is held -- the leniency of freezing -- which each
# case shows by reading through the borrow and then the source.
[scenario.ref_freeze_success]
category = "run"
description = "What a held borrow leaves its source: reads under a read-only borrow, touches after the last use, reborrows, both arms of an if, loops, disjoint fields, a reassigned holder, '&opaq'"
tags = ["flow", "genllvm", "runtime"]

# Separate from ref_freeze_success because its subject is a borrow nobody wrote:
# a '&uni' reference handed where a shareable borrowed reference is wanted is
# lent, the reborrow '&mut *p' built for it, and is there to use again after.
[scenario.ref_unireborrow]
category = "run"
description = "A '&uni' reference lent to a '&mut', '&' or '&imm' parameter, a 'self &' or 'self &mut' receiver, and a '&mut' local, and used again after: in a function, in a 'self &uni' method, and in a finalizer"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# Separate from ref_unireborrow because the call or binding wants a '&uni': a
# '&uni' variable passed there borrows from it too, a fresh and shorter loan,
# and is there to use again after. Slices (a '&uni Array[T]') are borrowed the same way.
[scenario.ref_uniborrow]
category = "run"
description = "A '&uni' variable passed to a '&uni' argument twice and in a loop, a 'self &uni' receiver twice, bare and written out, a '&uni' local declared and inferred, a result derived from it, a cursor reassigned from a call on itself (borrow bare and written out), and a '&uni' slice in each shape, used again after; values checked"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# A part of a '&uni' slice (or of an owner of an array) borrowed '&uni' is a loan
# of part of it, as '&mut' was: nothing is moved out of the slice.
[scenario.ref_unislice]
category = "run"
description = "A sub-slice ('&uni s[a..b]', 'a..', '..b', 'a...b') and an element ('&uni s[i]') of a '&uni' slice or of a 'So' array borrowed '&uni': as an argument, in a local, handed back by a function and borrowed again from, a sub-slice of a sub-slice, beside '&mut' sub-slices; values checked"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.ref_flow_unislice]
category = "reject"
description = "A '&uni' sub-slice or element: the slice read, changed or lent again while it is used, an overlapping '&uni' sub-slice, one of a local returned or held and returned, one taken from a '&' or a '&mut' slice"
tags = ["typecheck", "flow"]
diagnostics = 10

# A slice's own methods ('len') take a '&uni' slice as the borrowed slice they
# are declared with: borrowed from, not moved, so they can be called again.
[scenario.ref_unislicemethod]
category = "run"
description = "'len' called twice on a '&uni' slice in one expression and as a loop's condition, around a borrow of an element and of a sub-slice, on a sub-slice and on a '&mut' slice; values checked"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.ref_flow_unislicemethod]
category = "reject"
description = "'len' on a '&uni' slice while an element or a sub-slice borrowed '&uni' from it is still to be used, and inside a call that borrows part of it '&uni'"
tags = ["typecheck", "flow"]
diagnostics = 3

# One call's arguments are all in use together, so a '&uni' of part of a slice and
# any other borrow of the same slice overlap: the elements are not told apart.
[scenario.ref_unicall]
category = "run"
description = "What one call may still be handed: '&uni' of distinct fields of a struct and of two different references, one '&uni' element in two calls, two '&mut' and two '&' of the same element; values checked"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.ref_flow_unicall]
category = "reject"
description = "One call handed a '&uni' element or sub-slice and another borrow of the same slice: the same element, other indexes, literal or not, ranges apart or overlapping, an element and the whole, a '&', '&mut' or '&imm' beside it, either order, an owner's array, and two '&mut' of one element reached uniquely"
tags = ["typecheck", "flow"]
diagnostics = 15

# A mutable local holding a '&uni' the function was lent (a cursor) is handed back
# as the reference it holds; a borrow of the function's own value it was given is not
[scenario.ref_unicursor]
category = "run"
description = "A 'mut' local holding a '&uni' parameter returned as a '&uni', a '&mut' and a '&', bare, declared, after a cursor walk reassigned from a call on itself, from a branch, with its field or its element borrowed '&uni', along a slice; values checked"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.ref_flow_unicursor]
category = "reject"
description = "A 'mut' local holding a '&uni' parameter, then given a borrow of a local's value (written, an owner lent, a call's result, from a branch or a loop, from another local), returned, its field returned, or stored past the function; a local that only held its own value's borrow"
tags = ["typecheck", "flow"]
diagnostics = 11

# Separate from ref_unireborrow because the source is an owner, not a borrowed
# '&uni': a sole owning reference wanted as a '&uni' is borrowed from, the
# borrow '&uni *o' built for it, and still finalized at its own scope end.
[scenario.ref_ownerunilend]
category = "run"
description = "A 'So' or 'Rc' owner lent to a '&uni' parameter, a 'self &uni' receiver, a '&uni' local and an enrichment's '&uni', used again after, and finalized at its own scope end"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# An owner lent as '&' or '&mut' with no written borrow in the function, the
# lends not overlapping: what ref_flow_ownerlend_call's refusals leave allowed.
[scenario.ref_ownerlend_call]
category = "run"
description = "A 'So' or 'Rc' owner lent as '&mut' in one call after another, as '&' twice to one call, as a mutable receiver beside an argument reading it, and as a '&' receiver and argument"
tags = ["flow", "genllvm", "runtime"]

# An owner in a field, reached through a reference that only reads, lent as a
# '&mut' (a receiver, an argument, a local's initializer, a written borrow, a
# callable owner called, a counted 'mut' owner, an owner in an owner); what
# ref_owner_field runs stays allowed.
[scenario.ref_typecheck_owner_field]
category = "reject"
description = "An owner held in a field of a '&' or '&imm' reference's value lent as a '&mut' receiver, argument, initializer or written borrow, called as a 'So[fn]', as an 'Rc[mut]', and nested in another owner"
tags = ["typecheck"]
diagnostics = 8

# What ref_typecheck_owner_field's rule leaves allowed: the owner in a field
# lent as '&' through a '&', as '&mut' through a '&mut' and '&uni', an owner in
# a local struct lent as '&mut', a counted 'imm' owner called, and an owner in
# a '&mut' parameter's field changed, so the numbers show each call reached it.
[scenario.ref_owner_field]
category = "run"
description = "An owner in a field lent as '&' through a '&', as '&mut' through a '&mut' or '&uni', as '&mut' from a local struct, called as a 'So[fn]' through each"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# What an owner in a field lends by the reference its holder is reached
# through: no '&uni' and no '&imm' of it through a '&mut' or a '&' (a receiver, an
# argument, a local's initializer, a borrow written out, an owner in an owner, the
# use after free); ref_owner_field_shared runs what stays allowed.
[scenario.ref_typecheck_owner_field_shared]
category = "reject"
description = "An owner held in a field of a '&mut' or '&' reference's value lent as a '&uni' or '&imm' receiver, argument, initializer or written borrow, nested in another owner, and the use after free it allowed"
tags = ["typecheck"]
diagnostics = 10

# What ref_typecheck_owner_field_shared's rule leaves allowed: the owner in a
# field lent as '&mut' and '&' through a '&mut', '&imm' for a 'So[imm]' or an
# 'Rc[imm]', '&uni' and '&imm' through a '&uni' holder and from a local, '&imm'
# through a '&imm' holder.
[scenario.ref_owner_field_shared]
category = "run"
description = "An owner in a field lent as '&mut' and '&' through a '&mut', as '&uni' and '&imm' through a '&uni' holder and from a local, as '&imm' through a '&imm' holder, an immutable owner as '&imm' through a '&mut' and a '&'"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# The same through a counted owner that may change: an owner in a field of an
# 'Rc[mut, T]' lends no '&uni' and no '&imm' (a receiver, an argument, an
# initializer, a borrow written out, an owner in an owner, the use after free);
# ref_owner_field_rc runs what stays allowed.
[scenario.ref_typecheck_owner_field_rc]
category = "reject"
description = "An owner held in a field of an 'Rc[mut]' owner's value lent as a '&uni' or '&imm' receiver, argument, initializer or written borrow, nested in another owner or a field, and the use after free it allowed"
tags = ["typecheck"]
diagnostics = 8

# What ref_typecheck_owner_field_rc's rule leaves allowed: the owner in a field
# of an 'Rc[mut]' lent as '&mut' and '&', its 'So[imm]' and 'Rc[imm]' fields as
# '&imm', an 'Rc[imm]' holder's owner as '&', and an owner in a local struct as
# '&uni'.
[scenario.ref_owner_field_rc]
category = "run"
description = "An owner in a field of an 'Rc[mut]' lent as '&mut' and '&', an immutable owner in it as '&imm', through an 'Rc[imm]' as '&' and '&imm', and from a local as '&uni'"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.ref_body]
category = "run"
description = "A borrow of the body of bytes ('&str'), fat as an owner of it is: made of a slice of bytes and converted back with 'as', passed, returned, stored in a struct, in an Option, lent by an owner and reborrowed from it, compared by identity, and 16 bytes where a thin borrow is 8"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# The marker 'Immutable', which 'str' and a struct declare: the default
# permission is 'imm', so a borrow, a method's receiver and an owner written with
# no permission are 'imm' and an 'Rc' of one copies; a finalizer still takes
# 'self &uni'. The refusals are ref_typecheck_immutable and ref_flow_immutable.
[scenario.ref_immutable]
category = "run"
description = "A type declaring Immutable ('str', and a struct): '&str' and '&imm str' are one type, 'ro' and 'opaq' borrow it, 'Rc[str]' and an 'Rc' of the struct copy, its 'self &' and borrow are 'imm', its finalizer takes 'self &uni' and runs once, and 'where T is Immutable' is met by both"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# A string literal is the borrow of its text that lasts for the whole program,
# '&imm str'. The refusals are ref_typecheck_literal.
[scenario.ref_literal]
category = "run"
description = "A string literal as '&imm str': any '&str' converts implicitly to '&Array[u8]' (a parameter, variable, field, return, '=='), the way back is 'as'; the NUL after the text for C, the written borrow '&\"text\"' still the array; a literal fills a byte array of its length (variable, field, parameter, return, constant, global, assignment) and is copied into an owner of 'str' (So, Rc, Arc: variable, parameter, return, field, branch)"
tags = ["typecheck", "genllvm", "runtime"]

# -------- name resolution stage --------

[scenario.ref_nameres_fnref]
category = "reject"
description = "A function-reference type's lone-name parameter that names no type: a name, and 'self' in a struct's field and a method's signature"
tags = ["parse", "nameres"]
diagnostics = 3

# -------- type check stage --------

[scenario.ref_typecheck_immutable]
category = "reject"
description = "'mut', 'mut1' and a lock permission on a type declaring Immutable ('str', a struct): on a borrow, an owner in 'So' and 'Rc', in a struct's 'self &mut', through a generic's argument and in a '&mut *v', each naming Immutable; and 'where T is Immutable' unmet by an integer and by a struct holding an Immutable one"
tags = ["typecheck"]
diagnostics = 12

[scenario.ref_typecheck_literal]
category = "reject"
description = "What a string literal does not do: '&Array[u8]' is no '&str' without 'as', a literal fills no byte array of another length and no other array, another '&str' or a slice is copied into no owner of 'str', a literal is no '&mut Array[u8]' and no '&mut str'"
tags = ["typecheck"]
diagnostics = 10

[scenario.ref_typecheck_borrow]
category = "reject"
description = "Expressions that cannot be borrowed from or dereferenced"
tags = ["typecheck"]
diagnostics = 12

# Split from ref_typecheck_borrow because its subject is a malformed type
# spelling rather than a borrow expression, and because every case in it used to
# crash the compiler: sharing a file would put every other expectation behind
# that risk.
[scenario.ref_typecheck_incomplete]
category = "reject"
description = "A reference type that never says what it refers to, nested four ways"
tags = ["typecheck"]

[scenario.ref_typecheck_perm]
category = "reject"
description = "Permissions a borrowed reference cannot obtain or coerce to, from a variable or through a 'mut' reference, and the write a reading reference cannot make"
tags = ["typecheck"]
diagnostics = 9

# Separate from the other two type-check files because its question is neither
# what can be borrowed nor what a permission allows, but what two references can
# be compared for: '==' and ordering read through to the values, so a referent
# must offer the operator and both sides must be references; '===' asks about
# places, so a value has nothing to answer with. A comparison refused through a
# slice or a virtual reference belongs to collection and trait.
[scenario.ref_typecheck_compare]
category = "reject"
description = "Comparisons two references cannot make: a referent without the operator, a reference against a value, identity on values"
tags = ["typecheck"]
diagnostics = 6

# -------- flow stage --------

[scenario.ref_flow]
category = "reject"
description = "Writes and reads the permission forbids, a comparison reading through '&opaq' among them, a borrow stored past its lifetime, directly or through a local it initialized, and a write through an uninitialized reference"
tags = ["flow"]
diagnostics = 11

[scenario.ref_flow_return]
category = "reject"
description = "Returning a borrowed reference to one of the function's own locals, directly, through a local it initialized whose type is declared or not, or through a variable it was assigned to"
tags = ["flow"]
diagnostics = 10

[scenario.ref_flow_body]
category = "reject"
description = "A borrow of the body of bytes held to the lifetime of its owner: reborrowed with '&*' or lent, it may not be returned, and the owner replaced while it is used later is frozen"
tags = ["flow"]
diagnostics = 3

# Separate from ref_flow_body because its subject is the owner's permission: what
# Immutable changes is the one left unwritten, so 'Rc[str]' copies and 'Rc[uni,
# str]' and a plain struct's 'Rc' move, as an 'So' of anything does.
[scenario.ref_flow_immutable]
category = "reject"
description = "An owner of an Immutable type with no permission written copies and is used again; with 'uni' written, an 'Rc' of a type that does not declare it, and an 'So' of one that does, it moves"
tags = ["flow"]
diagnostics = 3

# Separate from ref_flow_return because it is the call site of the same rule:
# a borrow arriving through a call's result, or handed to a call that could
# store it. The stores share one function; the return and the '&mut &T' call
# each need their own.
[scenario.ref_flow_call]
category = "reject"
description = "A borrowed reference returned through a call, or stored through a call, past the borrow it came from"
tags = ["typecheck", "flow"]
diagnostics = 8

# Separate from ref_flow_call because it is the same rule for several returned
# values at once: a call returning a tuple of borrows, destructured into lvals
# or returned whole. The stores share one function; each return has its own.
[scenario.ref_flow_multiassign]
category = "reject"
description = "A tuple of borrowed references returned through a call, destructured or returned past the borrow it came from"
tags = ["typecheck", "flow"]
diagnostics = 9

# The same rule for the borrows the compiler builds on its own behalf: an array
# auto-borrowed to a slice argument, the '&mut' receiver an operator method is
# handed, the field reborrowed for a folded method, and a value receiver
# borrowed for a method declaring 'self &'. Each carries its source's scope into
# the call exactly as the written borrow in ref_flow_call does. The stores share
# one function; each return has its own.
[scenario.ref_flow_autoborrow]
category = "reject"
description = "A borrow the compiler builds for itself -- slice argument, operator receiver, folded field, method receiver -- stored or returned past its source"
tags = ["typecheck", "flow"]
diagnostics = 13

# The same rule for a swap, which stores in both directions: each side is held
# to it against what it receives from the other. Separate from ref_flow because
# it is one statement kind with its own site, swapFlow.
[scenario.ref_flow_swap]
category = "reject"
description = "Swapping a borrowed reference into a variable that keeps it past its source, in either position, through a call's result, and as a slice; and into what a parameter points at"
tags = ["flow"]
diagnostics = 5

# A borrow held in a local freezes its source until its last use. One function
# per touch, so that one borrow's conflict cannot stand in for another's.
[scenario.ref_flow_freeze]
category = "reject"
description = "A local read, changed, moved, replaced, swapped, borrowed or ended while a borrow of it that forbids that is still to be used; a 'Rc[mut, T]' or 'So[mut, T]' owner moved, replaced, changed or borrowed where it is held, or ended, while a borrow through it is; a local enum changed while a binding into its variant is"
tags = ["flow"]
diagnostics = 15

# Separate from ref_flow_freeze because its subject is the path that reaches
# the borrow's next use: around a loop's back edge, through a 'continue', out
# through a 'break'.
[scenario.ref_flow_freeze_loop]
category = "reject"
description = "A borrow's next use reached around a loop: the next iteration, a continue, a break, and a source ended at a break"
tags = ["flow"]
diagnostics = 4

# Separate from ref_flow_freeze because the borrow is one the compiler built:
# a '&uni' reference lent where a '&' or '&mut' is wanted, held in a local or
# handed to one call twice. One function per case.
[scenario.ref_flow_unireborrow]
category = "reject"
description = "A '&uni' reference lent as '&mut' or '&': read or changed while a local holds the borrow, and lent twice to one call where either lending is mutable"
tags = ["typecheck", "flow"]
diagnostics = 5

# Separate from ref_flow_unireborrow because the call or binding wants a '&uni':
# a '&uni' variable passed there borrows from it too. One function per case.
[scenario.ref_flow_uniborrow]
category = "reject"
description = "A '&uni' variable (or slice) passed to a '&uni': used during the call, held in a local or a struct and read, changed or lent again, a result derived from it and the same, stored or returned past the caller's storage; a store over one variable keeping the loans through another and the source's; an owner still moved by a second use"
tags = ["typecheck", "flow"]
diagnostics = 18

# Separate from ref_flow_unireborrow because the source is an owner lent as a
# '&uni': read or moved while a local holds the borrow, lent twice to one call,
# and a shared owner, which cannot lend a '&uni'.
[scenario.ref_flow_ownerunilend]
category = "reject"
description = "An owner lent as '&uni': read or moved while a local holds the borrow, lent twice to one call, and a shared 'Rc[mut, T]' owner refused"
tags = ["typecheck", "flow"]
diagnostics = 4

# An owner lent implicitly (as '&', '&mut', or a method's receiver) twice to
# one call, in functions holding no written borrow: the gate must see the
# implicit lend, or the loan walk never runs.
[scenario.ref_flow_ownerlend_call]
category = "reject"
description = "A 'So' or 'Rc' owner, or an owner in a field, lent to one call as '&mut' beside a '&', a '&mut' or a move of it, and as a mutable receiver beside an argument lending or moving it, with no written borrow in the function"
tags = ["flow"]
diagnostics = 8

# -------- GPU targets --------
#
# What a SPIR-V target cannot type: a pointer chosen at run time, or kept in
# memory. The rules hold for every GPU triple alike; the Vulkan form is the
# one compiled. What they accept is module_target_spirv_kinds.

[scenario.ref_gpu_choice]
category = "reject"
description = "On a GPU target, an 'if' or a function's returns choosing between references at run time, between kinds of memory or within one, or between structs holding them"
tags = ["flow"]
diagnostics = 5

[[scenario.ref_gpu_choice.run]]
name = "vulkan"
options = ["--triple=spirv1.6-unknown-vulkan1.3"]

# Separate from ref_gpu_choice because each is reported at the variable's use
# after the paths meet, not where a value is chosen
[scenario.ref_gpu_choice_held]
category = "reject"
description = "On a GPU target, a reference variable given different places on paths that meet, used after an 'if' or on a loop's next pass"
tags = ["flow"]
diagnostics = 3

[[scenario.ref_gpu_choice_held.run]]
name = "vulkan"
options = ["--triple=spirv1.6-unknown-vulkan1.3"]

[scenario.ref_gpu_indexed]
category = "reject"
description = "On a GPU target, an array of references or of structs holding one indexed by a run-time value; a literal or a constant index is accepted"
tags = ["flow"]
diagnostics = 2

[[scenario.ref_gpu_indexed.run]]
name = "vulkan"
options = ["--triple=spirv1.6-unknown-vulkan1.3"]

# Separate because generation reports it, and only for a program nothing
# earlier refused
