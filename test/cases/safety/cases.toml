# safety - trust and raw pointers. Tier 2.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# Trust is not covered, because it does not exist. There is no 'trust' keyword
# in the lexer's keyword table and no parse rule for a trust block or a trust
# expression, and doc/manual/safe-trust.html opens by saying so
# outright: "None of this is implemented." Nothing here can be marked xfail
# either -- 'trust' lexes as an ordinary identifier, so a scenario using it
# would fail as an unknown name rather than as a missing feature, which asserts
# nothing about trust. What can be established is the shape of the gap, and
# safety_pointers establishes it: dereferencing, indexing and arithmetic on a
# raw pointer all compile with no trust block anywhere, so none of the checks
# trust is meant to switch off are switched on to begin with.
#
# That leaves raw pointers, which are implemented and are covered in full.
#
# The reject scenarios all belong to the type check stage; a pointer is a type,
# so nothing about it is decided earlier, and the pointer arithmetic that flow
# analysis might have had an opinion about is exactly what pointers are exempt
# from. They are split three ways by sub-family rather than by stage, to keep
# each file's diagnostics reviewable in one pass.

support = []

# -------- success --------

[scenario.safety_pointers]
category = "run"
description = "Creating, dereferencing, indexing, moving, comparing and reinterpreting a raw pointer"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

[scenario.safety_null]
category = "run"
description = "'null' as every position's raw pointer type: initializers, globals, defaults, arguments, returns, fields, comparisons"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# -------- type check stage --------

[scenario.safety_typecheck_ptrops]
category = "reject"
description = "Pointer operator calls no compiler-declared candidate accepts"
tags = ["typecheck"]
diagnostics = 6

[scenario.safety_typecheck_ptruse]
category = "reject"
description = "Indexing, calling and naming through a pointer, and a pointer type used as a value"
tags = ["typecheck"]
diagnostics = 5

[scenario.safety_typecheck_null]
category = "reject"
description = "'null' where nothing says it is a raw pointer, or something says it is not one"
tags = ["typecheck"]
diagnostics = 17

[scenario.safety_typecheck_ptrconv]
category = "reject"
description = "Conversions into and out of a pointer that do not hold"
tags = ["typecheck"]
diagnostics = 5

[scenario.safety_trust_report]
category = "compile"
description = "--report-trust lists each kind of unconstrained operation, and not a reference's '*r' or an init's '*self'"
tags = ["typecheck"]

[[scenario.safety_trust_report.check]]
name = "listed"
target = "trust"
# One line per site, from the lines of safety_trust_report.cone: a change to
# that file's layout moves them. Nothing named ok*, no init's '*self' (Cell.init)
# and no struct without a pointer (Plain) is listed.
contains = [
  "deref test/cases/safety/safety_trust_report.cone:30 kindDeref",
  "deref test/cases/safety/safety_trust_report.cone:34 kindIndex",
  "ref-from-ptr test/cases/safety/safety_trust_report.cone:38 kindRefFromPtrAs",
  "ref-from-ptr test/cases/safety/safety_trust_report.cone:43 kindRefFromPtrBorrow",
  "ref-from-ptr test/cases/safety/safety_trust_report.cone:48 kindRefFromParts [sliceFromParts]",
  "intrinsic test/cases/safety/safety_trust_report.cone:53 kindIntrinsic [writeRaw]",
  "extern test/cases/safety/safety_trust_report.cone:57 kindExtern [trust_elsewhere]",
  "reinterpret test/cases/safety/safety_trust_report.cone:61 kindReinterpret",
  "sendable test/cases/safety/safety_trust_report.cone:17 Handle [p]",
  "sendable test/cases/safety/safety_trust_report.cone:21 Wrapped [h]",
  "sendable test/cases/safety/safety_trust_report.cone:85 GenericHandle [p]",
  "reinterpret-perm test/cases/safety/safety_trust_report.cone:94 kindPermission",
  "generic test/cases/safety/safety_trust_report.cone:97 neverMade [0]",
]
# GenericValue (line 89) holds no pointer; the permission-only 'as' is no plain reinterpret
excludes = ["okReference", "okPointerHandling", "Cell.init", "Plain",
  "sendable test/cases/safety/safety_trust_report.cone:89",
  "reinterpret test/cases/safety/safety_trust_report.cone:94"]
