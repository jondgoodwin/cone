# stream - values drained or built from a source inside a '<-' list. Tier 2.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# What is here is 'each' as an entry of the list after '<-' (`xs <- each src`
# and `xs <- each x in src if cond yield v`). The list itself, its other
# entries and the collections' own '<-' are collection's, and the loop's header
# (variables, sources, the `if` filter) is each's; what this group owns is the
# entry that joins the two.
#
# An iterator chain feeding the entry ('.filter(...).map(...)') is covered
# (stream_chains*); the parallel form ('<- parallel each') is concurrency's.

support = []

# -------- success --------

[scenario.stream_success]
category = "run"
description = "'each' inside '<-': a source drained into a list (a list, an array, a slice, a cursor of values, a range), and the loop's own header with a filter and 'yield' (two variables, ranges, calls), beside other entries, after a construction and in an argument"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

[scenario.stream_sources]
category = "run"
description = "What an 'each' inside '<-' draws from and builds: pairs into a dictionary ('yield k: v'), items that move ('each xs.drain()'), a new value made from each item, sets, deques and chars, and a generator whose header 'yield' is not its own"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

# -------- parse stage --------

[scenario.stream_parse]
category = "reject"
description = "An 'each' entry the parser refuses: variables with no 'yield', a body in braces, a 'yield' of nothing"
tags = ["parse"]
diagnostics = 3

# -------- type check stage --------

[scenario.stream_typecheck]
category = "reject"
description = "An 'each' entry where nothing is appended to (a tuple), in an array's contents, a pair into a list, items or yields of the wrong type, a source that cannot be walked, and a drain of borrowed items that move"
tags = ["typecheck"]
diagnostics = 7

# -------- flow stage --------

[scenario.stream_flow]
category = "reject"
description = "The list an 'each' entry reads may not be the list it appends to: a drain or a yield from itself, and a slice of it through a shared reference"
tags = ["flow"]
diagnostics = 3

# -------- iterator chains as the source (adapters PR B) --------

[scenario.stream_chains]
category = "run"
description = "An iterator chain as the source of an 'each' inside '<-': map, filter, take and skip over a list's iter(), mutItems() and drain() (Strings moved, the others dropped), an array, text, a generator (one without end cut by take), a cursor of one's own, zip and indexed, in the bare form and the header form with 'if' and 'yield' (a dictionary by 'yield k: v'), beside other entries, into an existing list, a deque, a generic function and a generator, a chain held in a variable, and a closure run once an item"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

[scenario.stream_chains_typecheck]
category = "reject"
description = "A chain that lends Strings has none to copy (the message says to drain or make a value), and a chain of the wrong type for the list"
tags = ["typecheck"]
diagnostics = 3

[scenario.stream_chains_flow]
category = "reject"
description = "A chain may not start at the list it appends to (iter, filter, drain), nor have a closure that reads the list being built, nor start at a list reached through a shared reference"
tags = ["flow"]
diagnostics = 5
