# driver - what conec does with its command line. Tier 0.
#
# This group is the one exception to R6.1's rule that a group follows a
# reference-manual chapter. It tests the compiler's command line rather than the
# language, so it has no chapter and never will: there is nothing in the manual
# for a bad option to belong to.
#
# A driver scenario has no .cone file, so R2.12's "a listed scenario with no
# source is an error" does not apply to it. 'argv' is the whole invocation and
# nothing is appended to it, and 'exit' is the whole expectation, matched exactly
# against the taxonomy in src/c-compiler/shared/error.h (R1.2).
#
# The four statuses below come from conec.c's main and coneOptSet in
# coneopts.c: a recognized option that ends the run returns 0, an unrecognized
# one returns -1 and main turns that into ExitOpts, an argument list with no
# source file left in it reaches the ExitOpts errorExit, and a source path that
# does not resolve reaches ExitNF while opening it.
#
# Key reference: design/test-suite.md, "cases.toml keys".

support = []

[scenario.driver-version]
category    = "driver"
description = "--version prints the release and exits successfully"
tags        = []
argv        = ["--version"]
exit        = 0

[scenario.driver-bad-option]
category    = "driver"
description = "An unrecognized option is refused with ExitOpts, not ignored"
tags        = []
argv        = ["--no-such-option"]
exit        = 4

[scenario.driver-missing-source]
category    = "driver"
description = "A source path that does not exist is ExitNF, distinct from a compile error"
tags        = []
argv        = ["test/cases/driver/driver-no-such-source.cone"]
exit        = 2

[scenario.driver-no-arguments]
category    = "driver"
description = "conec with nothing to compile is ExitOpts"
tags        = []
argv        = []
exit        = 4
