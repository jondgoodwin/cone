# exception - exception handling: panics, and the Never type of a call that
# does not return. Tier 2.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
# The chapter is doc/reference/refexcept.html. 'throw', 'catch' and '?' on a
# throwing call are not built, so nothing here is about them.
#
# A program that panics ends through the C library's 'abort', so each such
# scenario says 'program_exit = "abort"', and pins its report, the one line on
# stderr, in its .err file beside the .out. One scenario per panic, since a
# program panics once. What each .err says was worked out from the source by
# hand: the file's name, the line of the call, the message. Those of
# exception_flush, exception_message_nul, exception_message_long and
# exception_thread are what the C library printed before conestd, which does
# the work, was written in Cone, so they pin the report byte for byte.
#
# A panic on a thread other than the one the program started on names the
# thread by an identity that differs from run to run, which exception_thread
# masks ('stderr_mask').
#
# Left out deliberately: WebAssembly, where the compiler's checks trap: the
# suite runs no WebAssembly.

support = []

# -------- success --------

# Every place a block can end in a call returning Never, each beside a path
# that produces a value, so the run shows the values are still right
[scenario.exception_never]
category = "run"
description = "A call returning Never ends a block that must produce a value: a bound 'if', a returned one, a function's body, a 'match' arm, an inline and a generic function; a function of the program's returning Never; a branch ending in 'return' has no say in its 'if''s type"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[[scenario.exception_never.run]]
name = "release"
options = []

[[scenario.exception_never.run]]
name = "debug"
options = ["--debug"]

# -------- panics, each reported and ending the program --------

[scenario.exception_panic]
category = "run"
description = "A panic flushes stdout, writes 'panic at <file>:<line>: <message>' to stderr and aborts: nothing after it runs, no finalizer either"
tags = ["genllvm", "runtime"]
program_exit = "abort"

[scenario.exception_assert]
category = "run"
description = "'assert' does nothing when its condition holds, and panics with 'assertion failed', or its own message, at the line of its call when it does not, in a release and a debug build alike"
tags = ["typecheck", "genllvm", "runtime"]
program_exit = "abort"

[[scenario.exception_assert.run]]
name = "release"
options = []

[[scenario.exception_assert.run]]
name = "debug"
options = ["--debug"]

# 'assertDebug' and 'assertDebugMsg' are checked in a debug build only [Jon 27
# Sep]. A build's output differs from the other's, so each build is a scenario
# of its own. The conditions print, so the .out files show whether each ran
[scenario.exception_assertdebug_release]
category = "run"
description = "A release build: isDebugBuild() is false and a branch on it is folded away; assertDebug and assertDebugMsg are dropped whole, their conditions never run and failing ones do not panic; assert still panics"
tags = ["typecheck", "genllvm", "runtime"]
program_exit = "abort"

# Once the pipeline has run, nothing of the dropped code is left in main: no
# call to the function the debug-only branch calls, none to the one the
# dropped conditions call, and no panic naming the lines of the two uses
# (26 and 27), while assert's, naming line 29, is there. The string constants
# the dropped code named are still defined: no pass removes an unused global
[[scenario.exception_assertdebug_release.check]]
name = "exception_assertdebug_release_folded"
target = "llvmir"
contains = ["@cone_panic(", "i32 29)"]
excludes = ["call %void @debugBanner(", "call i1 @debugOnly(", "i32 26)", "i32 27)"]

[scenario.exception_assertdebug_debug]
category = "run"
description = "A debug build: isDebugBuild() is true; assertDebug and assertDebugMsg run their conditions, do nothing when they hold, and panic with 'assertion failed' at the use's line when one does not"
tags = ["typecheck", "genllvm", "runtime"]
program_exit = "abort"

[[scenario.exception_assertdebug_debug.run]]
name = "debug"
options = ["--debug"]

[scenario.exception_assertdebug_msg]
category = "run"
description = "A debug build: assertDebugMsg panics with its own message, and used inside a macro of the program's own, names the line where that macro is used"
tags = ["typecheck", "genllvm", "runtime"]
program_exit = "abort"

[[scenario.exception_assertdebug_msg.run]]
name = "debug"
options = ["--debug"]

[scenario.exception_caller]
category = "run"
description = "A helper's 'file' and 'line' parameters defaulting to 'srcFile()' and 'srcLine()' report its caller's location, handed on through a second helper to 'assert'"
tags = ["typecheck", "genllvm", "runtime"]
program_exit = "abort"

[scenario.exception_unreachable]
category = "run"
description = "'unreachable()' ending a 'match' arm, taken, panics with its own message at its line"
tags = ["typecheck", "genllvm", "runtime"]
program_exit = "abort"

[scenario.exception_todo]
category = "run"
description = "'todo(msg)' where a value is wanted, run, panics with the message"
tags = ["typecheck", "genllvm", "runtime"]
program_exit = "abort"

[scenario.exception_hook]
category = "run"
description = "The last hook set is called with the message and the location, after the line on stderr and before the program ends"
tags = ["genllvm", "runtime"]
program_exit = "abort"

[scenario.exception_double]
category = "run"
description = "A panic inside the hook ends the program at once, with a line of its own"
tags = ["genllvm", "runtime"]
program_exit = "abort"

# The checks the compiler inserts report the values they compared
[scenario.exception_bounds_index]
category = "run"
description = "An index past a slice's count panics, naming the index and the count"
tags = ["genllvm", "runtime"]
program_exit = "abort"

[scenario.exception_bounds_range]
category = "run"
description = "A range past a slice's count panics, naming the half-open range and the count; an inclusive range is reported half-open"
tags = ["genllvm", "runtime"]
program_exit = "abort"

[scenario.exception_bounds_order]
category = "run"
description = "A range that starts after it ends panics, saying so"
tags = ["genllvm", "runtime"]
program_exit = "abort"

[scenario.exception_nomemory]
category = "run"
description = "An allocation whose region's 'alloc' answers null panics, naming the size asked for"
tags = ["genllvm", "runtime"]
program_exit = "abort"

# How the runtime writes the report, pinned from the C library's
[scenario.exception_flush]
category = "run"
description = "A panic flushes stdout, a line not yet ended included, before its report; the hook runs after it; a slice's range past 32 bits is reported whole"
tags = ["runtime"]
program_exit = "abort"

[scenario.exception_message_nul]
category = "run"
description = "A panic's message is written up to a NUL in it, as C's '%.*s' wrote it"
tags = ["runtime"]
program_exit = "abort"

[scenario.exception_message_long]
category = "run"
description = "A panic's message longer than the runtime gathers for one write is reported whole"
tags = ["runtime"]
program_exit = "abort"

[scenario.exception_thread]
category = "run"
description = "A panic on a thread the program started names the thread, 'panic in thread <id> at', and ends the whole program"
tags = ["runtime"]
program_exit = "abort"
stderr_mask = ['(?<=panic in thread )\d+']

# -------- type check stage --------

[scenario.exception_typecheck_never]
category = "reject"
description = "A function returning Never that can return: its last statement returns, an 'if' with a path that falls through, a 'return', an empty body"
tags = ["typecheck"]

# A message built at run time as text, and the hook's '&str' parameters
[scenario.exception_text]
category = "run"
description = "A panic's message is a '&str': a String's view, with no cast, to 'assert'; the hook declared with '&str' parameters is handed the message and the file as text"
tags = ["typecheck", "genllvm", "runtime"]
program_exit = "abort"
