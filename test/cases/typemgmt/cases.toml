# typemgmt - conversion and coercion, typedef and extend. Tier 2.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# The subject is the moment a value changes type. 'core' owns the number types
# themselves; nothing here exists to show that i32 has a range. What is pinned
# here is which changes of type happen implicitly, which have to be asked for,
# which are refused, and what arithmetic each one performs.
#
# Every reject scenario is type-check stage: the two cast operators and the
# constructor form of conversion are the only surface syntax this group adds,
# and neither has a parse-stage failure worth pinning (see below). They are
# split by what reports the diagnostic, because the four paths are four
# different pieces of the compiler and a change to one should not have to be
# read out of a file covering the others:
#
#   -convert   the 'Type[value]' constructor form, reported by the type literal
#   -cast      'as' and 'into', reported by the cast node
#   -coerce    implicit coercion into a declared type, reported at the receiver
#   -meet      contexts that must find one type for several values
#
# 'typedef' is covered in typemgmt_success rather than in a scenario of its own.
# An alias is the type it names, so nearly every way of misusing one is a
# misuse of that type, already covered by the reject scenarios above. The one
# failure it has of its own -- a chain of aliases that comes back to itself,
# which names no type -- is typemgmt_nameres_alias; and an alias of a reference
# in a literal, the one way to put a reference type before '[', is in
# typemgmt_typecheck_convert. Until itypeGetTypeDcl was fixed to resolve an alias
# rather than return its unresolved target, any use of an alias as a type crashed
# LLVM generation, which is why this group excluded the feature entirely; the
# success scenario now uses an alias as a global, a parameter, a return type, a
# local, a reference's referent, a qualifier, and in a struct literal and a
# number conversion.
#
# A typedef is an AliasDclNode -- the binding a fold makes, with a type
# expression as its target -- rather than a node kind of its own. What that
# changed, visibly: an alias may now qualify what it names, because a path's base
# is asked of the declaration at the end of the chain. The scenario that pinned
# the old refusal is the one that now pins the cycle.
#
# Left out, with reasons:
#
# - 'extend' is not implemented. There is no 'extend' keyword, and 'extends' is
#   held for a concrete enrichment that is not built either. Nominal conformance
#   is spelled 'is' and belongs to 'trait', which holds the refusal.
#
# - 'as' and 'into' with the type omitted produce no parse error. The missing
#   type silently becomes the unknown type and surfaces later as a confusing
#   type-check message, one of them with a bogus 'init:1:1' location. A
#   construct that silently parses as something else asserts nothing, so it is
#   excluded rather than marked xfail.
#
# - An unsuffixed integer literal takes on the number type it is wanted as, so
#   it is built at that width. typemgmt_success asserts the values that
#   distinguish this from converting a 32-bit default -- i64's maximum and
#   minimum, u64's maximum, and a value between i32 and i64 -- and then the same
#   value in every position a literal meets a type: initializer, assignment,
#   argument, return value and struct field, for i64, u64, f32 and f64.
#
#   A literal that nothing gives a type keeps its i32 default, and one whose
#   value does not fit it is refused: typemgmt_genllvm_litrange. One whose value
#   does not fit the type its suffix or its position gives it is refused too:
#   typemgmt_typecheck_litrange. typemgmt_success prints the ends that still
#   fit, and lexical_literals each suffix's.
#
# - The float-literal counterpart is asserted rather than excluded, because it
#   is a settled rule and not a defect: an unsuffixed float literal is f32, so a
#   value needing f64 precision needs the 'd' suffix.

support = []

# -------- success --------

[scenario.typemgmt_success]
category = "run"
description = "Coercion, conversion and reinterpretation, and the value each one produces"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

# An alias never reaches generation as a type of its own. The struct it names
# is the LLVM type, a value built through the alias is a value of that type,
# and no alias -- of a struct, a number, a reference or an array -- leaves a
# type named after itself.
[[scenario.typemgmt_success.check]]
name = "alias-lowers-to-the-type-it-names"
target = "preir"
contains = ["%Reading = type { i64 }"]
excludes = ["%Sample", "%ReadingRef", "%Count = type", "%Tally = type", "%Cells = type"]

# -------- name resolution stage --------

[scenario.typemgmt_nameres_alias]
category = "reject"
description = "An alias defined in terms of itself, in three lengths of chain"
tags = ["nameres"]
diagnostics = 3

# -------- type check stage --------

[scenario.typemgmt_typecheck_convert]
category = "reject"
description = "Conversions in the 'Type[value]' form that cannot be built"
tags = ["typecheck"]
diagnostics = 6

[scenario.typemgmt_typecheck_cast]
category = "reject"
description = "'as' and 'into' applied where no reinterpretation or conversion exists"
tags = ["typecheck"]
diagnostics = 6

[scenario.typemgmt_typecheck_coerce]
category = "reject"
description = "Number coercions that do not happen implicitly"
tags = ["typecheck"]
diagnostics = 6

[scenario.typemgmt_typecheck_meet]
category = "reject"
description = "Branches and operands with no type they both reach"
tags = ["typecheck"]
diagnostics = 3

# An integer literal is refused where its type is decided -- by its suffix, or
# where it takes the type it is wanted as -- when its value does not fit. The
# folded minus is recorded on the literal, so each signed type's extra negative
# value is accepted and the positive one refused.
[scenario.typemgmt_typecheck_litrange]
category = "reject"
description = "An integer literal too large for the type its suffix or its position gives it"
tags = ["typecheck"]
diagnostics = 25

# -------- LLVM generation stage --------

# The size of a struct is not a thing the type checker knows, so the one
# reinterpretation rule it cannot enforce is enforced where the data layout
# exists. Separate from typemgmt_typecheck_cast because a type-check error
# means generation never runs, and these diagnostics come from generation.
[scenario.typemgmt_genllvm_recast]
category = "reject"
description = "'as' onto a struct whose size differs from the source's"
tags = ["genllvm"]
diagnostics = 2

# An unsuffixed integer literal that nothing gave a type keeps its i32 default
# to generation, which is where it is refused when its value does not fit:
# every such literal is reached there, after everything that could have typed
# it has run. An argument's 'if' or block is the case that matters -- a call
# checks its arguments before it resolves its callee, so the parameter's type
# never reaches them.
[scenario.typemgmt_genllvm_litrange]
category = "reject"
description = "An untyped integer literal that nothing types, too large for its i32 default"
tags = ["genllvm"]
diagnostics = 10
