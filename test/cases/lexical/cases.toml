# lexical - literals, identifiers, comments, operators as tokens, statement
# termination. Tier 0.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.

support = []

[scenario.lexical_range_ops]
category = "run"
description = "The range operators '..=' and '..<' as tokens beside everything that follows them: a negative bound, a name with and without a blank, a parenthesis, a character, a float, 'by', a case's '|' and brace; and the bare '..' of an open slice"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical_swap_arrow]
category = "run"
description = "'<->' (swap) and '<=>' (three-way comparison) as tokens beside every blank placement and a negative operand, with '<-' (send) and '<' unchanged beside them; a swap of a local, a field, a tuple element, an array element and a text"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical_literals]
category = "run"
description = "Integer, float, character, string and boolean literal tokens"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# A string literal's constant ends in a NUL the literal's type does not count:
# "c-string" is eight bytes and an Array[u8, 8], and its global is nine. The run
# shows the count and what C reads; this shows the byte itself, which a run
# cannot, because a missing terminator reads on into whatever the linker put
# next and prints the text alone whenever that happens to be a zero.
[[scenario.lexical_literals.check]]
name = "string-literal-constant-ends-in-nul"
target = "llvmir"
contains = [
  "internal constant [9 x i8] c\"c-string\\00\"",
  "internal constant [3 x i8] c\"\\C3\\A9\\00\"",
]

# So does a module-level variable initialized from one, immutable or mutable,
# inferred or typed, while its type stays the text's: "c-global" is an Array[u8, 8]
# stored in nine bytes. A global array from anything else is its type exactly.
[[scenario.lexical_literals.check]]
name = "string-literal-global-ends-in-nul"
target = "llvmir"
contains = [
  "@cglobal = internal constant [9 x i8] c\"c-global\\00\"",
  "@cmutable = internal thread_local global [6 x i8] c\"c-mut\\00\"",
  "@ctyped = internal constant [8 x i8] c\"c-typed\\00\"",
]

# The program reads only that array's length, which is its type's, so the
# optimizer deletes the global: its bytes are read where generation wrote them.
[[scenario.lexical_literals.check]]
name = "a-global-array-from-anything-else-is-its-type"
target = "preir"
contains = ["@cbytes = internal constant [3 x i8] c\"\\01\\02\\03\""]

# A global slice of a string literal is initialized data, not code run at
# start: its constant is the text's address and its length, and an immutable
# one, or a struct holding one, is read-only
[[scenario.lexical_literals.check]]
name = "string-literal-slice-global-is-constant"
target = "preir"
contains = [
  "@cslice = internal constant { ptr, i64 } { ptr @string",
  "@cslicemut = internal thread_local global { ptr, i64 } { ptr @string",
  "@cbypos = internal constant %Named { i32 1, { ptr, i64 } { ptr @string",
]

# The rules of doc/manual/syntax-lexical.html#multiline, "Multi-line String Literals", each
# literal printed a byte at a time so a new-line, tab or carriage return shows.
# The _crlf file is the same rules written with CRLF line ends, and prints the
# same lines: .gitattributes keeps it CRLF in every checkout.
[scenario.lexical_mlstring]
category = "run"
description = "Multi-line string literals: line ends, indentation stripping, backslash joins, tabs"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# The margin, the closing quote's whitespace: a whitespace-only line is empty,
# and every other line begins with exactly the margin (the Swift and C# rule).
[scenario.lexical_mlstring_margin]
category = "run"
description = "Multi-line string literals: blank and whitespace-only lines are empty, and the margin is stripped exactly, spaces, tabs or both"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical_reject_mlstring_margin]
category = "reject"
description = "A multi-line string literal's line that does not begin with exactly the closing quote's whitespace, refused on its line"
tags = ["parse"]
diagnostics = 7

[scenario.lexical_mlstring_crlf]
category = "run"
description = "Multi-line string literals written with CRLF line ends, which read as LF ones do"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# A string literal is sized before it is built; each literal begins with an
# escape sequence or holds a run of escaped quotes, and literals follow it, so
# a short count would show as bytes the later literals overwrote.
[scenario.lexical_string_escapes]
category = "run"
description = "String literals beginning with each escape kind, and runs of escaped quotes"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# \0 is the null character in both kinds of literal. Cone has no octal escapes,
# and a digit after \0 is refused: a 0 byte then a digit is \x00 and the digit.
[scenario.lexical_escape_null]
category = "run"
description = "The \\0 escape: a 0 byte in string literals, the value 0 in character literals"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical_reject_octal]
category = "reject"
description = "\\0 followed by a digit, refused in string, character and multi-line literals"
tags = ["parse"]
diagnostics = 6

# Ctrl-Z (U+001A) is white space between tokens, and no end of the source: a
# declaration after one on its line is read, a line comment runs past one, and
# the file ends in one.
[scenario.lexical_ctrlz]
category = "run"
description = "Ctrl-Z is white space: code after one runs, and a file ending in one compiles"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical_reject_ctrlz]
category = "reject"
description = "Errors written after a Ctrl-Z, which used to end the source, are reported"
tags = ["parse"]
diagnostics = 3

# A raw line end after a character literal's quote is refused, and an unclosed
# backtick's recovery stops at one; either used to take the line end without
# counting it. The reserved word after each case pins the line it is reported
# on. '\n' and '\r', the spellings the message names, are in lexical_literals.
[scenario.lexical_reject_char_line_end]
category = "reject"
description = "A raw line end in a character literal, and an unclosed backtick before one, each reported with the line counted"
tags = ["parse"]
diagnostics = 15

# A raw tab in a literal is content; every other raw control character in one
# is refused, at the character, with the \x escape that writes it.
[scenario.lexical_raw_tab]
category = "run"
description = "A raw tab is content in one-line, multi-line and character literals"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical_reject_raw_control]
category = "reject"
description = "A raw control character other than a tab or a line end, refused in a string, a multi-line string and a character literal"
tags = ["parse"]
diagnostics = 16

[scenario.lexical_tokens]
category = "compile"
description = "Identifier spellings, comment forms, and the greedy operator rule"
tags = ["parse", "nameres", "typecheck", "genllvm"]

[scenario.lexical_stmtend]
category = "run"
description = "A statement ends at its ';' and nowhere else, whatever the next line starts with"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical_reject_tokens]
category = "reject"
description = "Characters the lexer cannot turn into a token"
tags = ["parse"]
diagnostics = 13

# Separate from lexical_reject_tokens because the lexer reports each reserved
# word once and then releases the name: sharing a file would make one scenario's
# diagnostics depend on whether another line had already spent the word.
[scenario.lexical_reject_reserved]
category = "reject"
description = "Words held for unimplemented features, refused as identifiers"
tags = ["parse"]
diagnostics = 8

# The count is exact because the point is that nothing follows: each spelling is
# one diagnostic, and the parse around it carries on as though it were absent.
[scenario.lexical_reject_unbuilt]
category = "reject"
description = "'?.', a '#' word and a '@' word naming no attribute ('@move', retired into 'is Move', among them), one diagnostic each"
tags = ["parse"]
diagnostics = 6

# The dual of lexical_tokens' identifier facts: where that file shows two
# spellings that are two names, this one shows two that are one.
[scenario.lexical_reject_spelling]
category = "reject"
description = "A back-ticked identifier and the same characters bare, which are one name"
tags = ["parse"]
diagnostics = 2

[scenario.lexical_reject_mlstring]
category = "reject"
description = "A multi-line string literal whose closing quote does not begin its line"
tags = ["parse"]
diagnostics = 1

# An unclosed literal runs to the end of the file, so each is one per file. The
# second diagnostic is the missing ';' the parser finds at the end, a follow-on.
[scenario.lexical_reject_unclosed_string]
category = "reject"
description = "A string literal with no closing quote before the end of the file"
tags = ["parse"]
diagnostics = 2

[scenario.lexical_reject_unclosed_mlstring]
category = "reject"
description = "A multi-line string literal whose closing quote never comes"
tags = ["parse"]
diagnostics = 2

# The source's end right after an opening quote or backtick, which the lexer
# once stepped past. Each source is ended by a null character so the
# annotations can follow it; the file says why.
[scenario.lexical_reject_unclosed_char]
category = "reject"
description = "A character literal whose opening quote is the last character of the source"
tags = ["parse"]
diagnostics = 2

[scenario.lexical_reject_char_value]
category = "reject"
description = "A character literal naming a surrogate or a code point past U+10FFFF, and the retired 'u' suffix"
tags = ["parse"]
diagnostics = 5

[scenario.lexical_reject_char_byte]
category = "reject"
description = "A character literal holding a byte that begins no UTF-8 character"
tags = ["parse"]
diagnostics = 3

[scenario.lexical_char_utf8]
category = "run"
description = "A character literal written as the character itself: its code point, of one to four UTF-8 bytes"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical_reject_unclosed_backtick]
category = "reject"
description = "A back-ticked identifier whose backtick is the last character of the source"
tags = ["parse"]
diagnostics = 2

# A hex escape cut short: the message says so, and never prints the character
# that ended it -- which was nothing at the source's end, and a raw control
# byte or a bare quote elsewhere. The source's end is its own file, ended by a
# null character as lexical_reject_unclosed_char is.
[scenario.lexical_reject_short_escape]
category = "reject"
description = "A \\x, \\u or \\U escape with too few digits, ended by a closing quote, a space, a tab or the line's end, in a character literal or a string"
tags = ["parse"]
diagnostics = 13

[scenario.lexical_reject_short_escape_end]
category = "reject"
description = "A \\x escape with too few digits when the source ends"
tags = ["parse"]
diagnostics = 3

# A backslash before a character that begins no escape and cannot be printed:
# the message describes it, where it used to print it raw.
[scenario.lexical_reject_bad_escape]
category = "reject"
description = "A backslash followed by a tab, a control character, a line's end or a byte that is not UTF-8, in a character literal or a string"
tags = ["parse"]
diagnostics = 10

# A backslash right before a line's end took the line's end without counting
# it, so every later diagnostic came out a line early; LF only, as the CRLF
# twin shows. The later '$' lines and columns are the assertion.
[scenario.lexical_reject_escape_newline]
category = "reject"
description = "A backslash before an LF line end in a string or character literal, and a later error reported on its own line"
tags = ["parse"]
diagnostics = 10

[scenario.lexical_reject_escape_newline_crlf]
category = "reject"
description = "A backslash before a CRLF line end in a string or character literal, and a later error reported on its own line"
tags = ["parse"]
diagnostics = 10

# The boundary sits with the rejects because the clean lines are the other half
# of the same rule: exactly 64 bits lexes, one more does not.
[scenario.lexical_reject_overflow]
category = "reject"
description = "An integer literal whose digits do not fit in 64 bits, in either base"
tags = ["parse"]
diagnostics = 7

# Binary and octal literals: the values they build, in every width and suffix,
# and the malformed forms (no digit, a digit past the radix, a fraction, an
# exponent, a float suffix), each refused once at the character that makes it so.
[scenario.lexical_literals_radix]
category = "run"
description = "Binary and octal integer literals: prefixes, separators, suffixes, 64-bit and per-width maxima"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical_reject_radix]
category = "reject"
description = "A binary or octal literal with no digit, a digit past its radix, or a fraction, exponent or float suffix"
tags = ["parse"]
diagnostics = 26

# The float counterpart. A float literal's type is decided in the lexer and
# never changed, so a value past its range was generated as infinity.
[scenario.lexical_reject_float_range]
category = "reject"
description = "A float literal whose value is past the range of its type, f32 or f64"
tags = ["parse"]
diagnostics = 5

# A float takes one decimal point and none after an exponent, so the next dot
# is a method call on the literal.
[scenario.lexical_float_method]
category = "run"
description = "A method called on a float literal: '25.0.sqrt()', after a suffix, an exponent, a hex exponent"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# The integer counterpart of lexical_float_method: a '.' after integer digits and
# before a name is a member access, in decimal and in hex, and 'e5' in '3.e5' is
# a name. The integers have no such methods, so the refusal is at the name.
[scenario.lexical_reject_int_method]
category = "reject"
description = "A method called on an integer literal: '4.max(5)', '3.e5', '3.foo', '0x1f.foo' end the number at the dot"
tags = ["parse", "typecheck"]
diagnostics = 8

# Text after the opening quote that runs on to another line is neither the
# multi-line literal nor a one-line one (the manual: the opening line ends
# right after the quote). The legal forms beside it are the run scenario.
[scenario.lexical_reject_mlstring_open]
category = "reject"
description = "A string literal with text after its opening quote that runs on to another line, refused at the opening quote"
tags = ["parse"]
diagnostics = 4

[scenario.lexical_mlstring_open]
category = "run"
description = "One-line string literals and the legal multi-line form, unaffected by the refusal of text on the opening line"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# 'imm' and 'mut' are permissions, not the words a declaration starts with. One
# diagnostic for each position, so the count is the number of old words written.
[scenario.lexical_reject_old_dcl_word]
category = "reject"
description = "'imm' and 'mut' where a declaration starts -- a global, a field, a static, a parameter, 'self', a closure's parameter and state entry, a local, an 'if' and a 'case' binding -- refused with the word that replaces them"
tags = ["parse"]
diagnostics = 15

# 'let' and 'var' in every position that takes a declaration word, with the
# defaults written out beside the defaults left out.
[scenario.lexical_let_var]
category = "run"
description = "'let' and 'var' on a global, a thread-local global, a field, a static, a parameter, a by-value 'self', a closure's parameter and state entry, a local and a pattern binding, a written default meaning what none means"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# 'let' and 'var' begin a declaration, so neither names a function or a variable.
[scenario.lexical_reject_dcl_word_name]
category = "reject"
description = "'let' and 'var' as the name of a function and of a variable, refused as keywords"
tags = ["parse"]
diagnostics = 3

# '&&', '||' and '!' are the logical operators; 'and', 'or' and 'not' are ordinary names.
# The words written as operators are refused as a name where an operator belongs, with
# no message of their own.
[scenario.lexical_reject_logic_words]
category = "reject"
description = "'and', 'or' and 'not' written as operators, in conditions and as a case's joiner: refused as the names they now are"
tags = ["parse"]
diagnostics = 4

# '&&' after an operand is logical and, '||' logical or, '!' logical not, with the
# precedence and short-circuit 'and', 'or' and 'not' had; the words are names.
[scenario.lexical_logic_symbols]
category = "run"
description = "'&&', '||' and '!' short-circuit and take the precedence of the words they replace; 'and', 'or' and 'not' name variables, functions and fields; '!=' and the bitwise '|' are unchanged"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# A '||' or an '!' written where a case wants a pattern is a condition, refused as
# the other conditions are.
[scenario.lexical_reject_logic_pattern]
category = "reject"
description = "'||' and '!' where a case wants a pattern are conditions, not patterns"
tags = ["parse"]
diagnostics = 2

# What '&&' is not, and what '&&' and '||' do: '&&x' and '&&T' stay two borrows, '& &x'
# and '&(&x)' a borrow of a borrow, '&' and '|' stay bitwise, and '&&' and '||' skip a
# right side that cannot change the answer (the calls counted).
[scenario.lexical_andand_borrows]
category = "run"
description = "'&&' and '||' skip a right side the left already decides; '&&x' and '&&T' stay two borrows, '& &x' and '&(&x)' a borrow of a borrow, and '&' stays bitwise and"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# The 'd' suffix is retired with no message of its own: the 'd' after a number is
# a name where the parser wants an operator or the end of the statement.
[scenario.lexical_reject_d_suffix]
category = "reject"
description = "A float literal followed by the retired 'd' suffix: refused as a stray name after a finished number"
tags = ["parse"]
diagnostics = 3

# 'do' is not a keyword: it names a global, a local, a parameter, a field and a method
# like any other word.
[scenario.lexical_do_name]
category = "run"
description = "'do' is an ordinary name: a global, a local, a parameter, a field and a method are each called 'do'"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# 'elif' is not a keyword either: 'else if' is the one chaining form, and 'elif' names a
# global, a local, a parameter, a field and a method like any other word.
[scenario.lexical_elif_name]
category = "run"
description = "'elif' is an ordinary name: a global, a local, a parameter, a field and a method are each called 'elif', beside an 'else if' chain"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# The retired 'elif' clause is a name where the parser wants a statement's end; no message
# of its own.
[scenario.lexical_reject_elif]
category = "reject"
description = "An 'elif' clause after an 'if' block: refused as a stray name starting a statement, and the 'else' after it as one with no 'if'; 'else if' is accepted"
tags = ["parse"]
diagnostics = 4
