# lexical - literals, identifiers, comments, operators as tokens, statement
# termination. Tier 0.
#
# Key reference: design/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.

support = []

[scenario.lexical-literals]
category = "run"
description = "Integer, float, character, string and boolean literal tokens"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical-tokens]
category = "compile"
description = "Identifier spellings, comment forms, and the greedy operator rule"
tags = ["parse", "nameres", "typecheck", "genllvm"]

[scenario.lexical-stmtend]
category = "run"
description = "A statement ends at its ';' and nowhere else, whatever the next line starts with"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical-reject-tokens]
category = "reject"
description = "Characters the lexer cannot turn into a token"
tags = ["parse"]
diagnostics = 13

# Separate from lexical-reject-tokens because the lexer reports each reserved
# word once and then releases the name: sharing a file would make one scenario's
# diagnostics depend on whether another line had already spent the word.
[scenario.lexical-reject-reserved]
category = "reject"
description = "Words held for unimplemented features, refused as identifiers"
tags = ["parse"]
diagnostics = 15

# The dual of lexical-tokens' identifier facts: where that file shows two
# spellings that are two names, this one shows two that are one.
[scenario.lexical-reject-spelling]
category = "reject"
description = "A back-ticked identifier and the same characters bare, which are one name"
tags = ["parse"]
diagnostics = 2

# The boundary sits with the rejects because the clean lines are the other half
# of the same rule: exactly 64 bits lexes, one more does not.
[scenario.lexical-reject-overflow]
category = "reject"
description = "An integer literal whose digits do not fit in 64 bits, in either base"
tags = ["parse"]
diagnostics = 7
