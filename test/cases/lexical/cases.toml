# lexical - literals, identifiers, comments, operators as tokens, statement
# termination. Tier 0.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.

support = []

[scenario.lexical_literals]
category = "run"
description = "Integer, float, character, string and boolean literal tokens"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# A string literal's constant ends in a NUL the literal's type does not count:
# "c-string" is eight bytes and a [8; u8], and its global is nine. The run
# shows the count and what C reads; this shows the byte itself, which a run
# cannot, because a missing terminator reads on into whatever the linker put
# next and prints the text alone whenever that happens to be a zero.
[[scenario.lexical_literals.check]]
name = "string-literal-constant-ends-in-nul"
target = "llvmir"
contains = [
  "internal constant [9 x i8] c\"c-string\\00\"",
  "internal constant [3 x i8] c\"\\C3\\A9\\00\"",
]

# So does a module-level variable initialized from one, immutable or mutable,
# inferred or typed, while its type stays the text's: "c-global" is a [8; u8]
# stored in nine bytes. A global array from anything else is its type exactly.
[[scenario.lexical_literals.check]]
name = "string-literal-global-ends-in-nul"
target = "llvmir"
contains = [
  "@cglobal = internal constant [9 x i8] c\"c-global\\00\"",
  "@cmutable = internal global [6 x i8] c\"c-mut\\00\"",
  "@ctyped = internal constant [8 x i8] c\"c-typed\\00\"",
  "@cbytes = internal constant [3 x i8] c\"\\01\\02\\03\"",
]

# The rules of doc/reference/reftoken.html, "Multi-line String Literals", each
# literal printed a byte at a time so a new-line, tab or carriage return shows.
# The _crlf file is the same rules written with CRLF line ends, and prints the
# same lines: .gitattributes keeps it CRLF in every checkout.
[scenario.lexical_mlstring]
category = "run"
description = "Multi-line string literals: line ends, indentation stripping, backslash joins, tabs"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical_mlstring_crlf]
category = "run"
description = "Multi-line string literals written with CRLF line ends, which read as LF ones do"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# A string literal is sized before it is built; each literal begins with an
# escape sequence or holds a run of escaped quotes, and literals follow it, so
# a short count would show as bytes the later literals overwrote.
[scenario.lexical_string_escapes]
category = "run"
description = "String literals beginning with each escape kind, and runs of escaped quotes"
tags = ["parse", "typecheck", "genllvm", "runtime"]

# \0 is the null character in both kinds of literal, and only the one digit:
# the manual names no octal escapes, so digits after it are digits.
[scenario.lexical_escape_null]
category = "run"
description = "The \\0 escape: a 0 byte in string literals, the value 0 in character literals"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical_tokens]
category = "compile"
description = "Identifier spellings, comment forms, and the greedy operator rule"
tags = ["parse", "nameres", "typecheck", "genllvm"]

[scenario.lexical_stmtend]
category = "run"
description = "A statement ends at its ';' and nowhere else, whatever the next line starts with"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.lexical_reject_tokens]
category = "reject"
description = "Characters the lexer cannot turn into a token"
tags = ["parse"]
diagnostics = 13

# Separate from lexical_reject_tokens because the lexer reports each reserved
# word once and then releases the name: sharing a file would make one scenario's
# diagnostics depend on whether another line had already spent the word.
[scenario.lexical_reject_reserved]
category = "reject"
description = "Words held for unimplemented features, refused as identifiers"
tags = ["parse"]
diagnostics = 14

# The count is exact because the point is that nothing follows: each spelling is
# one diagnostic, and the parse around it carries on as though it were absent.
[scenario.lexical_reject_unbuilt]
category = "reject"
description = "'?.', a '#' word and a '@' word naming no attribute, one diagnostic each"
tags = ["parse"]
diagnostics = 5

# The dual of lexical_tokens' identifier facts: where that file shows two
# spellings that are two names, this one shows two that are one.
[scenario.lexical_reject_spelling]
category = "reject"
description = "A back-ticked identifier and the same characters bare, which are one name"
tags = ["parse"]
diagnostics = 2

[scenario.lexical_reject_mlstring]
category = "reject"
description = "A multi-line string literal whose closing quote does not begin its line"
tags = ["parse"]
diagnostics = 1

# An unclosed literal runs to the end of the file, so each is one per file. The
# second diagnostic is the missing ';' the parser finds at the end, a follow-on.
[scenario.lexical_reject_unclosed_string]
category = "reject"
description = "A string literal with no closing quote before the end of the file"
tags = ["parse"]
diagnostics = 2

[scenario.lexical_reject_unclosed_mlstring]
category = "reject"
description = "A multi-line string literal whose closing quote never comes"
tags = ["parse"]
diagnostics = 2

# The source's end right after an opening quote or backtick, which the lexer
# once stepped past. Each source is ended by a null character so the
# annotations can follow it; the file says why.
[scenario.lexical_reject_unclosed_char]
category = "reject"
description = "A character literal whose opening quote is the last character of the source"
tags = ["parse"]
diagnostics = 2

[scenario.lexical_reject_unclosed_backtick]
category = "reject"
description = "A back-ticked identifier whose backtick is the last character of the source"
tags = ["parse"]
diagnostics = 2

# The boundary sits with the rejects because the clean lines are the other half
# of the same rule: exactly 64 bits lexes, one more does not.
[scenario.lexical_reject_overflow]
category = "reject"
description = "An integer literal whose digits do not fit in 64 bits, in either base"
tags = ["parse"]
diagnostics = 7
