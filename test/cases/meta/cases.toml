# 'ps[i].f' and the whole row 'ps[i]' over a type declaring SoaLayout (SoaList): the compiler makes
# them 'ps.f[i]', 'ps.rowAt(i)' and 'ps.setRowAt(i, r)'.
[scenario.meta_soa_place]
category = "run"
description = "'ps[i].f' over a SoaList is the element of the column 'ps.f[i]': read, '=', '+=', '++', a nested field, '&uni' of a field, through a '&uni SoaList' parameter; a whole Copy row read as 'ps[i]' and written as 'ps[i] = r'; a List of the same type and a type with its own '[]' unaffected"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.meta_soa_place_reject]
category = "reject"
description = "'ps[i]' over a SoaList refused: a name that is no column (ErrorSoaNoColumn naming the row type), '&ps[i]', '&mut ps[i]', '&uni ps[i]' and 'ps[i] += r' (ErrorSoaRowBorrow naming the column form), and a whole row of a move type (ErrorWhereAbsent, rowAt and setRowAt exist only for Copy)"
tags = ["typecheck"]

[scenario.meta_soa_place_borrow]
category = "reject"
description = "Borrows through 'ps[i].f' over a SoaList follow the column's rules: an '&uni' field of a row then written or borrowed again, a field borrowed then the list grown (ErrorFrozen); another column of the same row, written meanwhile, is accepted"
tags = ["flow"]

# Serialization, core's data model and walk (serializeValue, deserializeValue, Partial), against a recording
# serializer and a scripted deserializer: no format is involved
[scenario.meta_serialize_walk]
category = "run"
description = "serializeValue through a recording Serializer: a bool, signed and unsigned integers, floats and a String as their kinds, a struct as a record of its fields in order with its index, a nested struct, an Option (Some transparent, None as none), and a type's own Serialize called instead of the walk"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.meta_serialize_optin_accept]
category = "run"
description = "Opt-in serialization: a struct that declares 'is Serialize' and writes nothing is walked as a record (nested too); numbers, bool and String are Serialize by grant, so a conditional 'Wrap[T] is Serialize if T is Serialize' holds for Wrap[i32] and Wrap[Pt]"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.meta_deserialize_walk]
category = "run"
description = "deserializeValue through a scripted Deserializer: members in any order, an unknown member skipped, a missing member an error naming it, a missing Option None, an out-of-range number a Range error, an integer read into a float field, a String made in the arena's region, and a type's own Deserialize called instead of the walk"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.meta_serialize_shapekeeping_reject]
category = "reject"
description = "A serializer that appends to a String it holds through a '&mut' field, coerced to '&<mut Serializer + ShapeKeeping' by serializeValue: ErrorNotShapeKeeping naming the method, the call and the field (the coercion is checked); a serializer that owns its output String is accepted"
tags = ["typecheck"]

# A struct declaring Serialize with an enum field is refused at the field by the record walk the compiler supplies
[scenario.meta_serialize_enum_reject]
category = "reject"
description = "A struct that declares Serialize and writes no serialize, with an enum (and an Option) field: ErrorSerializeField at the field, naming it and its type; an enum is serialized through its own Serialize"
tags = ["typecheck"]

# The opt-in, refused where it was not made: an undeclared struct is refused at the call by the ordinary bound, naming
# it; an undeclared struct inside a declared one is refused at the field, naming the field and the inner type; a
# conditional type's refusal names the condition that failed; Deserialize[X] with X not itself, and no body, is refused
[scenario.meta_serialize_optin_reject]
category = "reject"
description = "Opt-in serialization refusals: an undeclared struct at serializeValue and deserializeValue (ErrorWhereUnmet naming it), an undeclared struct inside a declared one (ErrorSerializeField), a conditional instance whose element fails (the condition named), Deserialize[X] for another X (ErrorDeserializeSelf), a number as Deserialize[String] (the grant is the number itself only)"
tags = ["typecheck"]

# The walk is core's, so it reflects as another module does. An Account (private field, no '@reflect') is refused at
# both loops (the count and the walk), raised in core.cone, so neither can carry an annotation. An Open ('@reflect')
# is accepted: see meta_serialize_reflect_private.
[scenario.meta_serialize_private_reject]
category = "reject"
description = "serializeValue of a type from another module with a private field and no '@reflect': ErrorMetaFieldsPrivate naming the field and the opt-in (once for the count, once for the walk)"
tags = ["typecheck"]

[[scenario.meta_serialize_private_reject.unlocated]]
code = "ErrorMetaFieldsPrivate"
path = "packages/core/src/core.cone"
message = "private field 'secret' of 'Account'"

[[scenario.meta_serialize_private_reject.unlocated]]
code = "ErrorMetaFieldsPrivate"
path = "packages/core/src/core.cone"
message = "private field 'secret' of 'Account'"

[scenario.meta_serialize_reflect_private]
category = "run"
description = "serializeValue of an '@reflect' type from another module with a private field is accepted: the walk reads the private field and a recording serializer sees it as a record's second field"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.meta_splice_reflect_private]
category = "run"
description = "a generic written in a module that does not declare the type reads and writes a private field of an '@reflect' type through the splice 'v.#f' (the opt-in opens reflection to any code)"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.meta_splice_reflect_reject]
category = "reject"
description = "the '@reflect' opt-in opens reflection, not plain access: a type without it is refused at the walk as before, and a plain 'o.hidden' from outside the module is refused on one that has it, while the walk through 'v.#f' is accepted"
tags = ["typecheck"]
diagnostics = 2

# '#fields(Self)' in a trait default is the struct's own fields: the placeholders earlier traits of the 'is' list leave in it are not listed, so a second library trait works, and SoA over such a struct has only the struct's columns
[scenario.meta_fields_mixin]
category = "run"
description = "'#fields(Self)' in two or more trait defaults on one struct, after a field-requiring trait, among core traits, and SoaList over that struct: each lists only the struct's own fields"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# Collections serialize where their elements do (row 333c): a List[Plain] or Dict[String, Plain] field of a declared
# record is refused at the field, and serializeValue of a List[Plain] at the call, naming Plain.
[scenario.meta_serialize_list_reject]
category = "reject"
description = "A struct that declares Serialize with a List[Plain] or Dict[String, Plain] field: ErrorSerializeField at the field; serializeValue of a List[Plain] refused at the bound, naming Plain"
tags = ["typecheck"]

[scenario.meta_serialize_collections_accept]
category = "run"
description = "List, Deque and Dict serialize wherever their elements do: List[i32], List[Pt], List[List[f64]], Deque[i32], Dict[String, i64]; a List[Kind] of an unserializable enum compiles when only built"
tags = ["typecheck", "genllvm", "runtime"]

# A package whose type keeps shape: its own compile finds that every method reshapes nothing a caller borrows
# and writes ShapeKeeping into the include file, so a program of another package can hand a value of it to
# serializeValue behind '&<mut Serializer + ShapeKeeping'
[scenario.meta_serialize_shapekeeping_include]
category = "run"
description = "A type of another package that appends to a String it owns (a text format) goes behind '&<mut Serializer + ShapeKeeping': the package's include file records ShapeKeeping for it"
tags = ["typecheck", "genllvm", "runtime"]
link = ["q/q.conebuild", "coll/collections.conebuild", "trace/trace.conebuild"]
include = ["include/q.cone"]

# The reject half: the include file is q's generated one (the case above pins it byte for byte), a copy, because
# a reject scenario does not link
[scenario.meta_serialize_shapekeeping_include_reject]
category = "reject"
description = "A type of another package that appends to a String it was handed a '&mut' of is refused behind '&<mut Serializer + ShapeKeeping' (ErrorNotShapeKeeping), as it is in one package: its include file does not record ShapeKeeping"
tags = ["typecheck"]

# A type of a package that changes shape (it writes storage it owns and lends a borrow of it) is recorded in the
# include file as ShapeChanging; behind '+ ShapeKeeping' of a trait that does NOT lend from self it is accepted, as
# in one package. The reject twins below pin the other half.
[scenario.meta_shapekeeping_lends_include]
category = "run"
description = "A shape-changing type of another package goes behind '+ ShapeKeeping' of a trait that lends nothing from self, as it does in one package"
tags = ["typecheck", "genllvm", "runtime"]
link = ["q/q.conebuild", "coll/collections.conebuild", "trace/trace.conebuild"]
include = ["include/q.cone"]

[scenario.meta_shapekeeping_lends_include_reject]
category = "reject"
description = "A shape-changing type of another package (its include file records ShapeChanging) is refused behind '+ ShapeKeeping' of a trait that lends from self (ErrorNotShapeKeeping), as it is in one package"
tags = ["typecheck"]

[scenario.meta_shapekeeping_lends_store_include_reject]
category = "reject"
description = "A type of another package that stores over a String it owns and lends a view of it is refused behind '+ ShapeKeeping' of a trait that lends from self (ErrorNotShapeKeeping), as it is in one package"
tags = ["typecheck"]

[scenario.meta_shapekeeping_lending_trait_reject]
category = "reject"
description = "A type that reshapes a String it owns and lends a view of it, behind '&<mut Source + ShapeKeeping' of its own self-lending trait: ErrorNotShapeKeeping at the call; the same kind of type behind a trait that lends nothing is accepted. Pins the rule row 333's JsonDeserializer met when Deserializer still had a lending readText"
tags = ["typecheck"]

# A method's 'where' for an instance inside its own argument's definition (row 366)
[scenario.meta_where_recursive_instance]
category = "run"
description = "A generic type's method with a 'where' on its parameter is absent from an instance that sits inside its own argument's definition, as it is elsewhere ('Outer[Cont[Plain]]' inside Plain, and through Option[List[T]]): nothing of it is checked, where the argument declares nothing; where the argument declares the trait, the method exists and runs"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.meta_where_structural_fit_before]
category = "run"
description = "A type that has a trait's method but declares nothing fits the trait structurally inside a recursive definition as it does asked late: a collection's method under 'where T is Tag' is callable on it, and a conditional 'is' entry over it meets 'Tag'; the element types declared before the collections"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.meta_where_structural_fit_after]
category = "run"
description = "The same program as meta_where_structural_fit_before with the collections declared before the element types: the same answer in both orders"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.meta_where_recursive_marker_entry]
category = "run"
description = "An 'is' entry or method 'where' over a compiler-granted marker (ShapeKeeping, found from methods and never declared; Clone, granted from layout) is answered inside a recursive definition: no layout cycle where the answer needs none"
tags = ["typecheck", "genllvm", "runtime"]

# The Deserialize field check agrees with the bound: a nested instance field is accepted whatever was checked first; an element that is not Deserialize is refused at the field
[scenario.meta_deserialize_nested_field]
category = "reject"
description = "A declared record's fields List[List[i32]], Dict[String, List[Pt]] and List[Pt] are accepted by the Deserialize field check; List[Plain] is refused (ErrorSerializeField), naming the field"
tags = ["typecheck"]

# An enum that declares Serialize is given its 'serialize' by the compiler (parseEnumSupply)
[scenario.meta_serialize_enum_walk]
category = "run"
description = "An enum that declares Serialize and writes no serialize: a unit variant, a type variant, a record variant (the record walk inside beginVariant), a generic enum under its condition and an enum field of a record, through a recording Serializer, in declaration order with each variant's index"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.meta_array_bracket_length]
category = "reject"
