# intrinsic - functions the compiler supplies, declared in core with
# '@intrinsic' and defined by the compiler's registry. Tier 2.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
# The chapter is doc/manual/safe-intrinsics.html; each intrinsic's meaning and
# edge cases are stated there, and intrinsic_success pins them.
#
# Core declares its intrinsics in 'mem', so a program calls 'mem.sizeof[T]()',
# and the intrinsics' own names are free for any module to declare
# (intrinsic_success declares a 'sizeof' and a 'finalize' of its own). The
# two that are not, 'srcFile' and 'srcLine', are called bare: they are
# written as parameters' default values (intrinsic_srcloc), and a program may.
# The facts of the build ('#os', '#arch', '#debug', '#defined', '#define') are
# not intrinsics: the parser reads them (the meta group, and the exception
# group's exception_assertdebug_release and exception_assertdebug_debug).
#
# '@intrinsic' is allowed only in the core package, so the scenarios about the
# declaration itself -- intrinsic_parse_form and intrinsic_nameres_registry --
# are modules named 'core'. They are compiled against intrinsicpkgs, a core
# package with nothing in it found through '--path' ahead of the real one, so
# that nothing of the real core's stands in the way. intrinsic_nameres_submodule
# is compiled against intrinsicsub, a core laid out as a folder whose submodule
# declares an intrinsic.
#
# Left out deliberately:
#
# - An intrinsic with no lowering on this back end, which needs a fallback body
#   (the second ErrorIntrinsicBody message). Every intrinsic in the registry has
#   an LLVM lowering, so nothing can provoke it.
# - 'trust'. The registry marks which intrinsics a call can break memory safety
#   with, and a call to one belongs inside 'trust', but 'trust' does not exist
#   (safety group, cases.toml), so a call outside it cannot be refused yet.
# - traceRoots at run time. It walks the frames of traced references, which
#   only a traced region makes: region_roots runs it.

support = ["intrinsicpkgs", "intrinsicsub"]

# -------- success --------

[scenario.intrinsic_forget]
category = "run"
description = "mem.forget ends a value without finalizing it: no final runs for a value forgotten directly, through a generic function, or as a call's result; a value not forgotten is finalized once"
tags = ["flow", "genllvm", "runtime"]

# One .out for two runs: the lowering and the Cone fallback bodies agree
[scenario.intrinsic_success]
category = "run"
description = "sizeof, alignof, needsFinal, finalize, sliceFromParts(Mut), readRaw, writeRaw and moveRaw on a range of types, lowered and through their fallback bodies"
tags = ["nameres", "typecheck", "flow", "genllvm", "runtime"]

[[scenario.intrinsic_success.run]]
name = "lowered"
options = []

[[scenario.intrinsic_success.run]]
name = "fallback"
options = ["--intrinsic-fallback"]

[scenario.intrinsic_writeraw_inplace]
category = "run"
description = "writeRaw of a construction by a declared init fills the slot in place: the init's self is the pointer written to, as a local's is"
tags = ["genllvm", "runtime"]

# An integer's bits, as methods and as mem's intrinsics, on every integer type.
# Three runs, one .out: optimized, unoptimized, and with mem's running their
# Cone fallback bodies beside the methods' lowering, unoptimized so that the
# optimizer cannot recognize a body's loop as the instruction it stands for.
# Every value and amount comes from C compiled apart (opaque.c), so the
# optimized run computes them as it runs, which the llvmir check confirms
[scenario.intrinsic_bits]
category = "run"
description = "countOnes, leadingZeros and trailingZeros of 0, 1, all ones, the top bit and a pattern, and rotateLeft, rotateRight, shlMasked and shrMasked by amounts below, at and past the width, on every integer type, as methods and as mem's: a count of 0 is the width, an amount is taken modulo the width; optimized, unoptimized and through the fallback bodies"
tags = ["typecheck", "genllvm", "runtime"]
link = ["opaque.c"]

[[scenario.intrinsic_bits.run]]
name = "release"
options = []

[[scenario.intrinsic_bits.run]]
name = "debug"
options = ["--debug"]

[[scenario.intrinsic_bits.run]]
name = "fallback"
options = ["--intrinsic-fallback", "--debug"]

[[scenario.intrinsic_bits.check]]
name = "each-is-done-as-the-program-runs"
target = "llvmir"
contains = ["@llvm.ctpop.i8(", "@llvm.ctlz.i16(", "@llvm.cttz.i64(", "@llvm.fshl.i32(", "@llvm.fshr.i64("]

# The 128-bit product with its halves xored, and wyhash on it (core's Hasher):
# each number worked out apart (Python's integers, the published C wyhash). Two
# runs, one .out: the instruction, and the fallback body that forms the product
# from 32-bit halves. Every operand comes through 'opaque' (opaque.c)
[scenario.intrinsic_mulfold]
category = "run"
description = "mulFold on edge operands (all ones, powers of two, carries between the 32-bit halves) and wyhash final version 4.3 through it: its seven published messages and every length from 0 to 130, a fixed-seed Hasher's numbers; lowered and through the fallback body"
tags = ["typecheck", "genllvm", "runtime"]
link = ["opaque.c"]

[[scenario.intrinsic_mulfold.run]]
name = "lowered"
options = []

[[scenario.intrinsic_mulfold.run]]
name = "fallback"
options = ["--intrinsic-fallback", "--debug"]

# A number's methods, abs, min, max, floor, ceil, round and fma, and core's mem
# ones that are the same intrinsics. They have no fallback body (nothing in Cone
# rounds a float), so there is no fallback run; release and debug are the two
# optimization levels. Every value is worked by hand in the source's header.
[scenario.intrinsic_numbers]
category = "run"
description = "abs, min, max, floor, ceil, round and fma of the integers and floats as methods and as mem's: an integer's smallest value wrapping under abs, unsigned min and max, a NaN losing to a number in min and max, round half away from zero at 0.5, 2.5 and -2.5, ceil of -0.5 keeping its sign, and an fma whose fused answer differs from x * y + z; on literals too"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.intrinsic_numbers.run]]
name = "release"
options = []

[[scenario.intrinsic_numbers.run]]
name = "debug"
options = ["--debug"]

# A float's math methods, tan to tanh and isNaN, isInfinite, isFinite, on f64 and
# f32. Operands come through a C function the optimizer cannot see into, so the
# C library runs; the last section is folded by the compiler. Release and debug.
[scenario.intrinsic_float_math]
category = "run"
description = "A float's tan, asin, acos, atan, atan2, exp, exp2, ln, log2, log10, pow, powi, hypot, cbrt, sinh, cosh, tanh, isNaN, isInfinite and isFinite on f64 and f32, at known values and the edges: atan2 in four quadrants and at signed zeros, ln(0) -inf, ln(-1) NaN, pow(0, 0) 1, powi with a negative base and exponent, hypot(inf, NaN) inf with no overflow, cbrt of a negative, exp2(-1074) the smallest subnormal, tanh saturating, the three tests on NaN, the infinities, zeros, a subnormal and the largest finite; at run time and folded"
tags = ["typecheck", "genllvm", "runtime"]
link = ["opaque.c"]

[[scenario.intrinsic_float_math.run]]
name = "release"
options = []

[[scenario.intrinsic_float_math.run]]
name = "debug"
options = ["--debug"]

[scenario.intrinsic_typecheck_numbers]
category = "reject"
description = "abs of an unsigned integer, floor, ceil, round and fma of an integer, min of a bool and max of a char, which have no such method, a method given the wrong arguments, and core's mem versions called at a type outside their class"
tags = ["typecheck"]

[scenario.intrinsic_genllvm_numbers]
category = "compile"
description = "Each number method is the LLVM intrinsic that means it: abs of a float llvm.fabs, of an integer llvm.abs with the smallest value not poison; min and max llvm.minimum and llvm.maximum for floats (a NaN wins) and llvm.smin, llvm.umin and the like for integers by signedness; clamp the maximum with lo then the minimum with hi; floor, ceil, round and fma their own, round and not roundeven; no call to a function of their own"
tags = ["genllvm"]

[[scenario.intrinsic_genllvm_numbers.run]]
name = "library"
options = ["--library"]

[[scenario.intrinsic_genllvm_numbers.check]]
name = "each-is-llvms-intrinsic"
target = "preir"
contains = [
  "@llvm.fabs.f64(", "@llvm.abs.i32(i32 %", ", i1 false)",
  "@llvm.minimum.f32(", "@llvm.maximum.f64(",
  "@llvm.smin.i64(", "@llvm.smax.i8(", "@llvm.umin.i32(","@llvm.umax.i16(",
  "@llvm.maximum.f32(", "@llvm.umax.i8(", "@llvm.umin.i8(",
  "@llvm.floor.f64(", "@llvm.ceil.f32(", "@llvm.round.f64(", "@llvm.fma.f32(",
]
excludes = ["roundeven", "call double @abs", "call double @mem", "minnum", "maxnum"]

# The two have no fallback body, and no type parameter: each is a constant of
# the call it is. What a panic reports is built on them (exception_caller)
[scenario.intrinsic_srcloc]
category = "run"
description = "srcFile and srcLine where written, as a default value at each call taking it, replaced by an explicit argument, and in an inline body"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

# Written in a macro's body, they answer where the macro is used
[scenario.intrinsic_srcloc_macro]
category = "run"
description = "srcFile and srcLine in a macro's body answer at its use; a macro used in another's body, with arguments or bare, at the outermost use; a macro passed as an argument, at its own line"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.intrinsic_typerecord]
category = "run"
description = "typeRecord on plain and finalizing structs, tuples, arrays, a generic's instances, enums, an owner and a borrow: its size, alignment and flags agree with sizeof, alignof and needsFinal, and its finalizer runs the death finalize runs, on a value it cannot name the type of"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

# A record's finalizer is a function the compiler makes, which in a debug build
# needs debug information of its own for the calls it makes (one expanding Rc's
# inline 'dealiasRef' among them); the one .out file is both builds' assertion
[[scenario.intrinsic_typerecord.run]]
name = "release"
options = []

[[scenario.intrinsic_typerecord.run]]
name = "debug"
options = ["--debug"]

# One .out for two runs, as intrinsic_success: an atomic instruction per call,
# and the plain Cone bodies, agree for one thread
[scenario.intrinsic_atomic]
category = "run"
description = "Every atomic intrinsic on u8, i32, u64, usize, bool and a raw pointer answers the value before it, add and sub wrap, min and max compare unsigned for a u8 and signed for an i32, and compareSwap reports what it saw and whether it stored, both ways; lowered and through their fallback bodies"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.intrinsic_atomic.run]]
name = "lowered"
options = []

[[scenario.intrinsic_atomic.run]]
name = "fallback"
options = ["--intrinsic-fallback"]

# The other half of the rule: what a library exports is live, whatever calls it.
# A debug build, whose object keeps what the optimizer would inline
[scenario.intrinsic_buildconst_reach_lib]
category = "compile"
description = "Compiled as a library in a debug build, a 'pub' function is emitted though nothing calls it, with the call it holds and the private function it calls; a private function only dead code reaches, or nothing, is not"
tags = ["genllvm"]

[[scenario.intrinsic_buildconst_reach_lib.run]]
name = "library"
options = ["--library", "--debug"]

[[scenario.intrinsic_buildconst_reach_lib.check]]
name = "what-the-library-exports-is-emitted"
target = "llvmir"
contains = ["@exportedCall(", "@macDefinedNowhere(", "@exportedUser(", "@liveHelper(", "@exportedChoice("]
excludes = ["@deadHelper", "@unusedHelper"]

# -------- generation --------

[scenario.intrinsic_genllvm_lowering]
category = "compile"
description = "Every intrinsic is expanded where it is called: no function or call of its own, a size a constant, moveRaw one block move"
tags = ["genllvm"]

[[scenario.intrinsic_genllvm_lowering.check]]
name = "each-intrinsic-is-expanded-at-its-call"
target = "preir"
contains = [
  "call ptr @malloc(i64 72)",
  "call void @llvm.memmove",
  "%rawread = load %Pad",
  "%slice = insertvalue",
  "store i1 false, ptr %f",
]
excludes = ["sizeof", "alignof", "needsFinal", "finalize", "sliceFromParts", "readRaw", "writeRaw", "moveRaw"]

[scenario.intrinsic_genllvm_mulfold]
category = "compile"
description = "mulFold is expanded where it is called as one wide multiply: both operands extended to 128 bits, multiplied, the high half shifted down, and the two halves xored; no function or call of its own"
tags = ["genllvm"]

[[scenario.intrinsic_genllvm_mulfold.check]]
name = "the-product-is-one-128-bit-multiply"
target = "preir"
contains = ["zext i64 %", "to i128", "mul i128", "lshr i128", "trunc i128", "xor i64"]
excludes = ["mulFold(", "call i64 @mulFold"]

[scenario.intrinsic_genllvm_fallback]
category = "compile"
description = "With --intrinsic-fallback, moveRaw and readRaw run their Cone bodies in place, and writeRaw, which has none, keeps its lowering"
tags = ["genllvm"]

[[scenario.intrinsic_genllvm_fallback.run]]
name = "fallback"
options = ["--intrinsic-fallback"]

[[scenario.intrinsic_genllvm_fallback.check]]
name = "a-fallback-body-replaces-the-lowering"
target = "preir"
contains = ["icmp ult ptr %to", "%deref = load i64", "store i64 1, ptr %p1"]
excludes = ["llvm.memmove", "rawread", "moveRaw", "readRaw", "writeRaw"]

[scenario.intrinsic_genllvm_atomic]
category = "compile"
description = "Each atomic intrinsic is one instruction with the call's ordering and its type's alignment: load and store atomic, atomicrmw (min and max signed or unsigned as their type is), cmpxchg with both orderings; a bool acted on as its byte, a pointer as a pointer"
tags = ["genllvm"]

# The orderings are LLVM's spelling of the call's MemOrder: Relaxed is
# 'monotonic', AcqRel 'acq_rel', SeqCst 'seq_cst'. The one from a const is the
# load's
[[scenario.intrinsic_genllvm_atomic.check]]
name = "one-instruction-per-call-with-its-ordering"
target = "preir"
contains = [
  "load atomic i32, ptr %p1 acquire, align 4",
  "store atomic i32 %a3, ptr %p2 release, align 4",
  "atomicrmw add ptr %p4, i32 1 monotonic, align 4",
  "atomicrmw sub ptr %w5, i64 2 acq_rel, align 8",
  "atomicrmw and ptr %p6, i32 3 seq_cst, align 4",
  "atomicrmw or ptr %b7, i8 1 release, align 1",
  "atomicrmw xor ptr %p8, i32 5 acquire, align 4",
  "atomicrmw xchg ptr %s9, ptr %p10 seq_cst, align 8",
  "cmpxchg ptr %p11, i32 6, i32 7 acq_rel acquire, align 4",
  "cmpxchg ptr %s13, ptr %p14, ptr %h15 seq_cst monotonic, align 8",
  "store atomic i8 %45, ptr %b19 seq_cst, align 1",
  "atomicrmw min ptr %p1, i32 1 monotonic, align 4",
  "atomicrmw max ptr %p2, i32 2 seq_cst, align 4",
  "atomicrmw umin ptr %q3, i32 3 acq_rel, align 4",
  "atomicrmw umax ptr %q4, i32 4 acquire, align 4",
]
excludes = ["= call ", "call void ", "atomicLoad", "atomicStore", "atomicAdd", "atomicCompareSwap", "atomicMin", "atomicMax"]

# -------- parse stage --------

[scenario.intrinsic_parse_form]
category = "reject"
description = "'@intrinsic' beside 'extern' or '@c', which speak of a symbol an intrinsic never has"
tags = ["parse"]

[[scenario.intrinsic_parse_form.run]]
name = "empty-core"
options = ["--path=test/cases/intrinsic/intrinsicpkgs"]

# -------- name resolution stage --------

[scenario.intrinsic_nameres_registry]
category = "reject"
description = "An '@intrinsic' declaration the registry refuses: an unknown name, another signature (typeRecord's result anything but a pointer to core's TypeRecord, trace's mode anything but a u32, traceRoots given a type parameter, an atomic ordering that is not core's MemOrder and compareSwap's result not T, bool, among them), a default value, a body with no fallback; one in a plain struct of core accepted, a method or a generic type's or a trait's refused"
tags = ["nameres"]

[[scenario.intrinsic_nameres_registry.run]]
name = "empty-core"
options = ["--path=test/cases/intrinsic/intrinsicpkgs"]

[scenario.intrinsic_nameres_place]
category = "reject"
description = "'@intrinsic' outside the core package: in another module, and in a struct of that module"
tags = ["nameres"]

[scenario.intrinsic_nameres_submodule]
category = "compile"
description = "An intrinsic declared in a submodule of core is accepted, and called through the submodule's name"
tags = ["nameres", "genllvm"]

[[scenario.intrinsic_nameres_submodule.run]]
name = "folder-core"
options = ["--path=test/cases/intrinsic/intrinsicsub"]

[[scenario.intrinsic_nameres_submodule.check]]
name = "the-submodule-intrinsic-is-a-constant"
target = "preir"
contains = ["store i64 8, ptr %n"]

# -------- type check stage --------

[scenario.intrinsic_typecheck_class]
category = "reject"
description = "An intrinsic instantiated at a type with no size, and a borrowed reference to an intrinsic"
tags = ["typecheck"]

# The same expectations both ways, as intrinsic_typecheck_atomic's
[scenario.intrinsic_typecheck_bits]
category = "reject"
description = "An integer's bit intrinsics at a float, a bool and a struct, refused where the instance is made, and the bit methods asked of a float and a bool, which have none"
tags = ["typecheck"]

[[scenario.intrinsic_typecheck_bits.run]]
name = "lowered"
options = []

[[scenario.intrinsic_typecheck_bits.run]]
name = "fallback"
options = ["--intrinsic-fallback"]

# The same expectations both ways: the class and the orderings are judged
# whether the call is lowered or runs its fallback body
[scenario.intrinsic_typecheck_atomic]
category = "reject"
description = "An atomic intrinsic at a type outside its class (a float, a struct, bool or a pointer where arithmetic is asked, a borrowed reference), called by a generic's instance for an argument it does not constrain, reported once where the instance is made, an ordering that is not a constant, and each ordering LLVM forbids: a load's release, a store's acquire, a compareSwap failure's release or one stronger than its success"
tags = ["typecheck"]

[[scenario.intrinsic_typecheck_atomic.run]]
name = "lowered"
options = []

[[scenario.intrinsic_typecheck_atomic.run]]
name = "fallback"
options = ["--intrinsic-fallback"]

# The file name is text
[scenario.intrinsic_srcfile_text]
category = "run"
description = "srcFile is a '&str': bound as one, and as a slice of bytes; as the default of a '&str' parameter and of an '&Array[u8]' one, each call its own line; replaced by an explicit argument"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

# A pointer to a nullable-pointer enum is stepped by the enum's size, not by what it points at
[scenario.intrinsic_pointer_to_nullable_enum]
category = "run"
description = "A List of an Option of a Uni, an Rc (mutable and immutable), an Arc, a reference and an Rc of the type holding the List: pushed and walked, so '+' steps a pointer to a nullable-pointer enum"
tags = ["genllvm", "runtime"]

# The shape the benchmark's richards program met
[scenario.intrinsic_pointer_to_nullable_enum_trait]
category = "run"
description = "A struct holding a List of an Option of an Rc of a struct that holds an Rc of a trait and the Option of an Rc of itself: constructed and a trait method called through it"
tags = ["genllvm", "runtime"]

# mem.prefetch, a hint: llvm.prefetch(p, 0, 3, 1) on a native target, nothing on
# a GPU or WebAssembly target, and no change to what a program does
[scenario.intrinsic_genllvm_prefetch]
category = "compile"
description = "mem.prefetch is expanded where it is called as a call of llvm.prefetch for reading, high locality and the data cache, after its argument is evaluated; no function of its own"
tags = ["genllvm"]

[[scenario.intrinsic_genllvm_prefetch.run]]
name = "native"
options = ["--library", "--verify"]

[[scenario.intrinsic_genllvm_prefetch.check]]
name = "a-prefetch-is-llvms-read-high-locality-data-cache"
target = "preir"
contains = ["call void @llvm.prefetch.p0(ptr %", ", i32 0, i32 3, i32 1)", "call ptr @bump("]
excludes = ["prefetch(", "@mem.prefetch"]

[scenario.intrinsic_genllvm_prefetch_none]
category = "compile"
description = "On a SPIR-V target (OpenCL and Vulkan forms) and on WebAssembly mem.prefetch compiles to nothing: no llvm.prefetch call or declaration, while the argument with an effect is still evaluated"
tags = ["genllvm"]

[[scenario.intrinsic_genllvm_prefetch_none.run]]
name = "opencl"
options = ["--triple=spirv64-unknown-unknown", "--library", "--verify"]

[[scenario.intrinsic_genllvm_prefetch_none.run]]
name = "vulkan"
options = ["--triple=spirv1.6-unknown-vulkan1.3", "--library", "--verify"]

[[scenario.intrinsic_genllvm_prefetch_none.run]]
name = "wasm"
options = ["--wasm", "--library", "--verify"]

[[scenario.intrinsic_genllvm_prefetch_none.check]]
name = "no-prefetch-is-emitted-but-the-argument-is-still-evaluated"
target = "preir"
contains = ["call ptr @bump("]
excludes = ["llvm.prefetch", "@mem.prefetch"]

# A loop prefetching ahead of what it sums, past the end and at null, cannot
# change the sum, the array or the effect of the prefetch's argument. Debug is
# the second optimization level; the fallback run uses mem's empty body
[scenario.intrinsic_prefetch_run]
category = "run"
description = "Prefetching 8 elements ahead in a summing loop, past the end of the array, and at a null pointer changes nothing: the sum, the array and the count of the argument's calls are those of a loop without it; lowered, unoptimized and through the empty fallback body"
tags = ["genllvm", "runtime"]

[[scenario.intrinsic_prefetch_run.run]]
name = "release"
options = []

[[scenario.intrinsic_prefetch_run.run]]
name = "debug"
options = ["--debug"]

[[scenario.intrinsic_prefetch_run.run]]
name = "fallback"
options = ["--intrinsic-fallback", "--debug"]

# A float's math methods are LLVM's intrinsics where it has one; only hypot and cbrt
# call the C library, and the tests are comparisons
[scenario.intrinsic_genllvm_floatmath]
category = "compile"
description = "A float's tan, asin, acos, atan, atan2, exp, exp2, ln, log2, log10, pow, powi, sinh, cosh and tanh are LLVM's intrinsic of each meaning, f64 and f32; hypot and cbrt call the C library (an f32's hypot through the double form); isNaN, isInfinite and isFinite are comparisons with no call"
tags = ["genllvm"]

[[scenario.intrinsic_genllvm_floatmath.run]]
name = "library"
options = ["--library"]

[[scenario.intrinsic_genllvm_floatmath.check]]
name = "each-is-llvms-intrinsic"
target = "preir"
contains = [
  "@llvm.tan.f64(", "@llvm.asin.f32(", "@llvm.acos.f64(", "@llvm.atan.f64(", "@llvm.atan2.f32(",
  "@llvm.exp.f64(", "@llvm.exp2.f32(", "@llvm.log.f64(", "@llvm.log2.f32(", "@llvm.log10.f64(",
  "@llvm.pow.f64(", "@llvm.powi.f32.i32(", "@llvm.sinh.f64(", "@llvm.cosh.f32(", "@llvm.tanh.f64(",
  "call double @hypot(", "call float @cbrtf(", "call double @cbrt(", "fpext float", "fptrunc double",
  "fcmp une double", "@llvm.fabs.f64(", "@llvm.fabs.f32(", "fcmp oeq double", "fcmp olt float",
]
excludes = ["call float @hypotf(", "call float @tanf(", "call float @expf(", "call float @logf(", "call float @powf(",
  "call double @tan(", "call double @log(", "call double @pow(", "call float @powi("]

# mem.blackBox: the value comes back unchanged for an integer, a float, a bool
# and a struct, in the lowering and through the fallback body `{ v }`, with one .out
[scenario.intrinsic_blackbox]
category = "run"
description = "mem.blackBox returns its argument unchanged for an integer, a float, a bool and a struct, and f(blackBox(3)) is computed each time; optimized, unoptimized and through the fallback body"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.intrinsic_blackbox.run]]
name = "release"
options = []

[[scenario.intrinsic_blackbox.run]]
name = "debug"
options = ["--debug"]

[[scenario.intrinsic_blackbox.run]]
name = "fallback"
options = ["--intrinsic-fallback", "--debug"]

# The optimized IR, read: with both boxes the multiplies stay and the constant
# 27 they would fold to does not appear; the asm is the compiler's own
[scenario.intrinsic_genllvm_blackbox]
category = "compile"
description = "mem.blackBox is an empty side-effecting asm with a memory clobber over a stack slot: after optimization f(blackBox(3)) is not folded and blackBox(f(blackBox(3))) with an unused result is not deleted"
tags = ["genllvm"]

[[scenario.intrinsic_genllvm_blackbox.check]]
name = "the-work-survives-the-optimizer"
target = "llvmir"
contains = ["call void asm sideeffect \"\", \"r,~{memory}\"(ptr", "= mul i64 ", "= ashr i64 "]
excludes = ["i64 27", "mem.blackBox", "@blackBox"]
