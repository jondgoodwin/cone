# concurrency - what threads share safely. Tier 2.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
# The chapter is doc/reference/refconc.html, "Atomic values".
#
# What the compiler knows of concurrency today is atomic values and the thread
# check. Atomic values: the built-in marker 'AtomicValue', which core's
# Atomic[T] declares, and the rules it brings -- what may declare it (one field
# an atomic operation takes), that it moves, that a value holding one is never
# a constant, in a global or a const. The thread check: the built-in marker
# 'Sendable', asked by thread.start and sync's channel types, granted to what
# holds nothing bound to its thread (concurrency_sendable) and refused, naming
# the culprit, to what does (concurrency_typecheck_sendable); the chapter is
# doc/reference/refconccomm.html, "Race condition safety".
# The operations themselves are core's mem intrinsics, which the intrinsic
# group owns; the sync package's own behaviour, threads included, is tested by
# its tests/ folder under 'congo test'. Atomic[T] is core's, so the atomic
# scenarios import nothing for it. Those that start threads or open channels
# import sync as a package found on the search path, so its instances are
# compiled into each, and with them its futex, which is why the runner links
# synchronization.lib.
#
# Actors: the 'actor' declaration (compiler/c/parser/parseactor.c; the chapter
# is doc/reference/refconccomm.html, "Actors"), and the actors package's
# runtime it generates declarations for (mailbox, work-stealing scheduler,
# quiescence, handles counted through 'Arc'). The concurrency_actor_*
# scenarios are the declaration: what 'new' makes, a message's arguments
# moved in, many threads sending to one actor, actors made in a loop, and the
# refusals at parse (concurrency_actor_parse), at type check
# (concurrency_actor_typecheck) and without the package
# (concurrency_actor_runtime). The concurrency_actors_* scenarios are the
# runtime, driven by declared actors: the scheduler's paths, the counting
# that decides when an actor dies, quiescence; they are here, not in the
# package's tests/ folder, because they pin what the compiler generates. Two
# write the generated shape out by hand: concurrency_actors_state_unsendable,
# since a declared actor's state has a name no source can spell, and
# concurrency_actors_declared_last, whose four parts are in the opposite order
# to the compiler's. Each runs threads and prints only what is the same every
# run; each calls initAll() and finalAll(), which start nothing and stop the
# workers.
#
# Declaration order does not matter: a reference never lays out what it points
# at, so a handle, which reaches its message enum only through its owning
# reference to the mailbox, may be laid out before the enum. Declarations
# written above an actor that lay its handle out first are
# concurrency_actor_order's; concurrency_actors_stress declares the collector,
# holding nodes, above the nodes, whose message carries a node.
#
# 'await' in an actor's method: a seam, where the method returns to the
# actor's dispatcher to wait. An 'await' on a message to an actor that returns
# a value waits for its reply: concurrency_await_reply runs it end to end and
# pins the envelope's and the record's shapes, and concurrency_await_message
# is where it and 'selfactor' are refused. Any other 'await' is reported
# where it stands (ErrorUnbuiltAwait), its message naming the borrows it
# ends, the locks it gives back, its continuation's record and that record's
# order of death, and what it leaves; that message is what
# concurrency_await_record, _droporder, _static and _lock pin, each awaiting
# a message that returns nothing. A borrow named after the seam is the
# ordinary ErrorFrozen at the seam (concurrency_await_borrow, _lock); where
# 'await' may stand is concurrency_await_place. With '--await-direct', for
# tests, an 'await' on anything else hands its record straight to its second
# half: concurrency_await_split runs each split message beside its twin with
# no 'await', the two traces the same, and pins the halves' shapes;
# concurrency_await_unsplit is where the split is not built yet. The chapter
# is doc/reference/refconccomm.html, "Actors" and "Awaiting a reply", whose
# examples are concurrency_await_manual's (run) and
# concurrency_await_manual_refused's (refused), copied from them; flow's note is
# compiler/c/doc/phases/flow.md, "A seam", and generation's
# compiler/c/doc/phases/generation.md, "A split method" and "A message's
# reply".
#
# I/O buffers: concurrency_iobuf_loan pins, against the iobuf package, that the
# thread check and the type check together keep a borrowed buffer from being
# lent to an operation or crossing to the thread its completion arrives on;
# concurrency_iocore_submit pins, against the iocore package, that the
# completion loop's operations take owners only, so a borrowed slice or
# buffer cannot be submitted, and that a completion, a waker, a cancel group,
# a request and a completer cross threads while a borrow of a completion or
# a completer does not. Each package's own behaviour is
# tested by its tests/ folder.
#
# Compute kernels on threads: concurrency_compute_barrier_threads runs a
# kernel's workgroup on threads that meet at its barriers through each
# thread's barrier hook, which is what the compiler makes of a barrier on the
# CPU; the module group's module_compute_barrier_hook pins that generation.
#
# Not covered, with reasons:
#
# - The 'atomic' permission, and plain writes of an atomic value only through a
#   unique path: not built (the next steps of the atomics design). Today a
#   plain whole-value write through '&mut' compiles.
# - An 'imm' global of a tuple or an enum holding an atomic value: a global
#   may be initialized only with a literal, and neither is one yet, so the
#   mark's reach through them is pinned by the const refusal instead.
# - Threads: the thread package is library code, and sync's tests/threads.cone
#   is where Atomic[T] is changed from several at once (flag.cone for an
#   Atomic[Bool], treiber.cone for an Atomic[*Node]). concurrency_sendable
#   starts threads only to show that what the check lets through runs.
# - Sendable through an 'or' or 'and' condition: it is evaluated as any
#   marker is, and refused with ErrorWhereUnmet; the judging again after type
#   check is only for a lone 'T is Sendable'.
# - An open trait behind a reference, refused as bound (its implementers are
#   not all known): no virtual reference is sent anywhere yet.

# -------- success --------

# One .out for two runs: the lowering and core's fallback bodies agree
[scenario.concurrency_atomic_ops]
category = "run"
description = "Every operation of core's Atomic[T], everyday and Ordered, through a local, a borrow, two Rc[imm, T] owners of an imm struct, an array element; a loop count after optimization; lowered and through the fallback bodies"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[[scenario.concurrency_atomic_ops.run]]
name = "lowered"
options = []

[[scenario.concurrency_atomic_ops.run]]
name = "fallback"
options = ["--intrinsic-fallback"]

[scenario.concurrency_atomic_global]
category = "run"
description = "An imm global holding an atomic value in a field, a field's field or an array is never a constant: it is changed atomically and read back changed; the same shapes holding none stay constants"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.concurrency_atomic_global.check]]
name = "a-global-holding-an-atomic-value-is-not-a-constant"
target = "symbols"
contains = [
  "global internal held comdat nodeduplicate",
  "global internal deep comdat nodeduplicate",
  "global internal flags comdat nodeduplicate",
  "global internal stats comdat nodeduplicate",
  "constant internal point comdat nodeduplicate",
  "constant internal points comdat nodeduplicate",
]
excludes = ["constant internal held ", "constant internal deep ", "constant internal flags "]

# And the optimizer, which may fold a constant's loads, leaves it one
[[scenario.concurrency_atomic_global.check]]
name = "an-atomic-global-stays-writable-after-optimization"
target = "llvmir"
contains = ["@held = internal global %Holder { i32 7, %Flag { i32 5 } }"]

[scenario.concurrency_sendable]
category = "run"
description = "The thread check's step-6 program: a uni owner sent over a channel to a consumer thread, an Arc[imm, String] read by a thread and by main, a number in a mut local handed to a thread; and the types granted Sendable without running: numbers, structs, arrays, enums, a struct reaching itself through So, owners that move, Arc[imm, T] and Arc[opaq, T], a function reference, a struct declaring Sendable, List, Dict, String, a channel's ends, a ThreadRef"
tags = ["typecheck", "genllvm", "runtime"]

# A kernel's barriers on the CPU, with a workgroup's invocations on threads:
# each thread's barrier hook (core's setBarrierHook) a futex barrier. The
# barriers' generation is compiler work (module_compute_barrier_hook pins it);
# this shows the hook carries a real barrier, and that it is each thread's own
[scenario.concurrency_compute_barrier_threads]
category = "run"
description = "A workgroup prefix sum run on the CPU with each workgroup's 4 invocations on 4 threads, each thread's barrier hook a generation-counting futex barrier, gives the GPU's answer; the main thread, which set no hook, runs it one invocation at a time and its barriers do nothing"
tags = ["typecheck", "genllvm", "runtime"]

# -------- actors --------

[scenario.concurrency_actor_counter]
category = "run"
description = "A declared actor made by 'new Counter(100, 3)', its init running on fresh state; four threads and main send it 40007 messages through copies of its handle, each handled alone with the state 'mut', calling a private method; the total is exact at quiescence"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.concurrency_actor_oneway]
category = "run"
description = "One actor sending to another one way: 1000 sources made with 'new' in a loop, each keeping the sink's handle in its state and sending it 3 numbers; the sink, made by its implicit initializer with field defaults, sums them exactly and dies after the last source"
tags = ["parse", "typecheck", "genllvm", "runtime"]

[scenario.concurrency_actor_moves]
category = "run"
description = "Messages carrying an Arc[Mutex, T], added to under the lock by three actors and kept, finalized once after its last owner; and So owners moved into an actor's state, each finalized once, with the actor"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

[scenario.concurrency_actor_order]
category = "run"
description = "Declarations written above an actor that lay its handle out first: an actor whose state and message hold a Spoke above Spoke, whose message carries a Spoke; a struct holding a handle above the actor whose message carries it. Each compiles and runs"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.concurrency_actor_parse]
category = "reject"
description = "What an actor's declaration may not say: a message carrying a borrow, generic, or taking 'self &uni';a 'pub' field; a static; a 'pub' function without 'self'; 'extern'; a macro; a generic actor; one naming an abstraction"
tags = ["parse"]

[scenario.concurrency_actor_typecheck]
category = "reject"
description = "An actor's private state and its non-'pub' methods reached through its handle; a message's and an initializer's argument that is not Sendable, refused at the parameter"
tags = ["typecheck"]

[scenario.concurrency_actor_runtime]
category = "reject"
description = "An actor declared in a module that does not import the actors package"
tags = ["parse"]

[scenario.concurrency_actors_pingpong]
category = "run"
description = "Two declared actors ping-pong a million messages, each seeing its own in send order; the workers start with the first actor, and finalAll ends the program at quiescence, both finalized once"
tags = ["typecheck", "genllvm", "runtime"]

# The same game with the actor's parts in the other order, its message enum
# last: refused as a cycle until a reference stopped laying out its target
[scenario.concurrency_actors_declared_last]
category = "run"
description = "Two actors written out by hand in the shape the compiler generates, handle declared first and message enum last, ping-pong a thousand messages to the end, both finalized once"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.concurrency_actors_fanin]
category = "run"
description = "Four producer actors, driven from main through the inject queue, send 20000 numbered messages each to one consumer; each producer's order holds, the sum is exact, and every actor dies once its handles and mailbox are gone"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.concurrency_actors_lifetime]
category = "run"
description = "An actor's finalizer runs exactly once, when its last handle goes and its mailbox is empty: at once for an idle one, after the third of three copies, after 2000 queued messages drain, and for 500 held by another actor only once it lets go"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[scenario.concurrency_actors_stealing]
category = "run"
description = "Sixty-four actors made runnable on one worker's queue are run on other workers too: stealing observed through actors.workerIndex and the steal count actors.stats reads while the workers run"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.concurrency_actors_overflow]
category = "run"
description = "On one worker, 3000 actors with empty states made runnable at once, more than its run queue holds, all run once (half the queue moved to the inject queue each time it fills); no steals"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.concurrency_actors_stress]
category = "run"
description = "A hundred rounds on one runtime, each a ring of 8 actors passing 4 tokens 2000 times each (with 'Rc[mut, T]' state inside the actors) and its collector, main waiting for the round's last death: every round exact; finalAll at quiescence"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.concurrency_actors_rcstate]
category = "run"
description = "An actor whose state holds 'Rc[mut, T]' data, a 'So' owner and borrows in its methods, and declares nothing about Sendable: its handle is sent in a message to another actor, kept in that actor's state and used there, and handed to a thread that sends through it; every note arrives and both Rc owners agree"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.concurrency_actors_state_unsendable]
category = "reject"
description = "An actor's state holding 'Rc[mut, T]' is not Sendable: refused over a Channel and by thread.start, while its handle, an Arc[opaq, Mailbox], crosses both"
tags = ["typecheck"]

# -------- 'await': a seam --------

[scenario.concurrency_await_place]
category = "reject"
description = "'await' outside an actor's method -- in a plain function, a struct's method, an actor's init and its final -- is ErrorAwaitPlace at the 'await'"
tags = ["parse", "typecheck"]

[scenario.concurrency_await_borrow]
category = "reject"
description = "A seam ends every borrow that is not global: one of the state through 'self', of a local, or lent through a parameter, named after the 'await'; one a droppable's finalizer reads; one an argument of a call around the 'await' carries, a receiver among them: each the ordinary ErrorFrozen at the 'await'. Not named after it, the seam is accepted, ending it"
tags = ["flow"]

[scenario.concurrency_await_static]
category = "reject"
description = "A ''static' borrow crosses a seam: a borrow of a global, and a reborrow through a ''static' parameter, used after the 'await', are accepted and travel in the continuation's record (ErrorUnbuiltAwait)"
tags = ["flow"]

[scenario.concurrency_await_lock]
category = "reject"
description = "A lock borrow, through an actor's field or a global, is never ''static': its loan is of the guard, a local, so named after the 'await' it is refused as any ended borrow is; not named, the seam gives the lock back and the guard does not travel"
tags = ["flow"]

[scenario.concurrency_await_record]
category = "reject"
description = "What a seam's continuation record holds: a droppable never named again travels; a dead number does not, a live one does; a droppable moved out before the seam holds nothing; liveness follows the paths, an 'if''s arms and a loop's next pass; a local whose initializer holds the 'await' holds nothing yet"
tags = ["flow"]

[scenario.concurrency_await_droporder]
category = "reject"
description = "A seam keeps drop order: a droppable never named after the 'await' travels with the rest, so the record dies inner block first, then the last declared first, as a method with no seam would"
tags = ["flow"]

[scenario.concurrency_await_split]
category = "run"
description = "Under --await-direct each message holding an 'await' is split, each seam handing its record straight to its second half: every split message prints what its twin with no 'await' prints, its values dying where and in the order the one scope says -- an empty record, a value in flight, droppables in order, two seams, a seam in a loop, a drop flag, temporaries and a moved value across, locks given back, a return after the seam, a void await"
tags = ["flow", "genllvm", "runtime"]

[[scenario.concurrency_await_split.run]]
name = "direct"
options = ["--await-direct"]

[[scenario.concurrency_await_split.run]]
name = "direct-debug"
options = ["--await-direct", "--debug"]

[[scenario.concurrency_await_split.check]]
name = "an-empty-record-is-no-parameter"
target = "preir"
contains = [
  "5fetch'1\"(ptr %0, i64 %1)",
  "6locked'1\"(ptr %0, i64 %1)",
  "6voided'1\"(ptr %0)",
]

[[scenario.concurrency_await_split.check]]
name = "the-record-holds-what-the-seam-still-holds-in-the-order-it-dies"
target = "preir"
contains = [
  "7ordered'1.record\" = type { i64, %Fin, %Fin, %Fin, %Fin }",
  "7several'1.record\" = type { %Fin }",
  "7several'2.record\" = type { i64, %Fin, %Fin }",
  "6looped'1.record\" = type { %Fin, i64, i64 }",
  "7flagged'1.record\" = type { %Fin, i8 }",
  "5temps'1.record\" = type { i64, %Fin }",
  "5temps'2.record\" = type { %Fin }",
  "6locked'2.record\" = type { i64 }",
  "5early'1.record\" = type { %Fin, i1 }",
  "7ordered'1\"(ptr %0, %\"_CNvNtu16_PageState_oe802g7ordered'1.record\" %1, i64 %2)",
]

[scenario.concurrency_await_unsplit]
category = "reject"
description = "Under --await-direct, an 'await' where the split is not built is ErrorUnbuiltAwait: in a method that is no message, as every seam is without the option; in the index of a place, a place stored into, a place swapped; in an array's contents filled in memory"
tags = ["flow"]

[[scenario.concurrency_await_unsplit.run]]
name = "direct"
options = ["--await-direct"]

[scenario.concurrency_await_reply]
category = "run"
description = "An 'await' on a message to another actor waits for its reply, the envelope in the message: the worked example (Page.load awaits Fetcher.fetch, whose record holds 'conn' and Page's envelope), an empty record with no slot and no id, one returning before its seam, droppables across two seams, an actor awaiting one parked on it, an actor awaiting itself, a seam in a loop; then 20 continuations parked at once in one pending table, and returned values dropped where nothing awaits them"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[[scenario.concurrency_await_reply.run]]
name = "release"

[[scenario.concurrency_await_reply.run]]
name = "debug"
options = ["--debug"]

[[scenario.concurrency_await_reply.check]]
name = "an-empty-record-is-no-parameter-no-slot-and-no-id"
target = "preir"
contains = [
  "2go'1\"(ptr %0, i64 %1)",
  "2go'1.resume\"(ptr %0, ptr %1)",
  "\"Driver.reply'\"(ptr %self2, ptr @\"_CNvNtu18_DriverState_l7620i2go'1.resume\", i64 8, i64 8)",
]

[[scenario.concurrency_await_reply.check]]
name = "a-record-is-parked-by-its-id-the-envelope-travelling-in-it"
target = "preir"
contains = [
  "5fetch'1.record\" = type { %Answer, %Conn }",
  "4load'1.record\" = type { %Answer }",
  "3two'2.record\" = type { %Answer, %Buf, %Conn }",
  "5fetch'1.resume\"(ptr %0, i64 %1, ptr %2)",
]

[scenario.concurrency_await_message]
category = "reject"
description = "An 'await' on a message returning nothing, a call of a message holding an 'await' from another method, and a record holding a traced reference are ErrorUnbuiltAwait; a message returning what is not Sendable is ErrorNotSendable; 'selfactor' outside an actor's method -- its init, its final, a function, another type's method -- is ErrorSelfActorPlace"
tags = ["typecheck", "flow"]

[scenario.concurrency_iobuf_loan]
category = "reject"
description = "A buffer is lent by moving it: a borrow of an iobuf IoBuf is refused where an IoBuf is wanted and where it would cross a thread, while the IoBuf, its frozen Bytes, a Chain and the Pool handle cross; a frozen one, an Arc[imm, IoBuf], refuses the methods that write"
tags = ["typecheck"]

[scenario.concurrency_iocore_submit]
category = "reject"
description = "An iocore operation takes owners of its bytes, never a borrow: a slice, a string literal, a '&mut IoBuf', a buffer's spare room or view are refused where an Op is built (a blocking-pool Call's buffer too), while an IoBuf and frozen Bytes are taken; a Completion, a Waker, a CancelGroup, a Request and a Completer cross threads, a '&mut Completion' and a '&mut Completer' do not"
tags = ["typecheck"]

# -------- generation --------

[scenario.concurrency_genllvm_atomic]
category = "run"
description = "Atomic[T]'s everyday operations are one seq_cst instruction each, an Ordered form one arm per ordering it allows, and a local changed only atomically stays in memory, its add in the loop, after optimization"
tags = ["genllvm", "runtime"]

[[scenario.concurrency_genllvm_atomic.check]]
name = "everyday-operations-are-sequentially-consistent"
target = "preir"
contains = [
  "%atomicload = load atomic i16, ptr %self1 seq_cst, align 2",
  "store atomic i16 %v2, ptr %self1 seq_cst, align 2",
  "%4 = atomicrmw add ptr %self1, i16 %v2 seq_cst, align 2",
  "%4 = atomicrmw xor ptr %self1, i16 %v2 seq_cst, align 2",
]

[[scenario.concurrency_genllvm_atomic.check]]
name = "an-ordered-form-has-one-arm-per-ordering"
target = "preir"
contains = [
  "%9 = atomicrmw add ptr %self3, i16 %v4 monotonic, align 2",
  "%11 = atomicrmw add ptr %self10, i16 %v11 acquire, align 2",
  "%13 = atomicrmw add ptr %self17, i16 %v18 release, align 2",
  "%15 = atomicrmw add ptr %self24, i16 %v25 acq_rel, align 2",
  "%17 = atomicrmw add ptr %self26, i16 %v27 seq_cst, align 2",
  "%atomicload = load atomic i16, ptr %self3 monotonic, align 2",
  "%atomicload10 = load atomic i16, ptr %self9 acquire, align 2",
]
excludes = ["load atomic i16, ptr %self9 release", "load atomic i16, ptr %self9 acq_rel"]

[[scenario.concurrency_genllvm_atomic.check]]
name = "an-atomic-local-keeps-its-address"
target = "llvmir"
contains = ["atomicrmw add ptr %c.i, i32 3 seq_cst, align 4"]

# -------- rejects --------

[scenario.concurrency_typecheck_atomic]
category = "reject"
description = "AtomicValue on anything but a struct of one integer, Bool or raw pointer field; with Copy; in a const, however deep; Atomic[T] of a type its 'where' clause refuses, just those the marker does; an Atomic[Bool]'s add and sub, and an atomic raw pointer's add and bit operations, which exist only where their clauses hold"
tags = ["typecheck"]

[scenario.concurrency_typecheck_sendable]
category = "reject"
description = "What may not cross threads, refused where a generic asks for Sendable and naming what binds it and where: a borrow of any permission, in a field, deeper down, behind a uni owner or an Arc[imm, T]; Rc[mut, T] and Arc[mut, T]; Rc[imm, T]; a traced reference; a raw pointer, in an enum's variant, beside a struct's owner of itself; a borrow in Option's variant and in an array; a declared-Sendable type's bound argument; thread.start given a borrow of a local, and a thread returning Rc[imm, T]; a channel of borrows; and one judged after type check, a struct asking for a channel of itself while it is laid out"
tags = ["typecheck"]

[scenario.concurrency_flow_atomic]
category = "reject"
description = "An atomic value moves: copying one, reading it after, taking its field out of a struct, and using it after inner are refused"
tags = ["flow"]

[scenario.concurrency_await_manual]
category = "run"
description = "The reference manual's examples of 'await' in an actor's methods, run one after another: the worked example (Page, Fetcher, Net), one scope's drop timing and order, a ''static' borrow and a lock given back across an 'await', 'selfactor' awaited, one request answered once, and a loop holding an 'await'; and refpermlock.html's lock borrowed for a statement, given back at an 'await' within it, which another actor then takes"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[[scenario.concurrency_await_manual.run]]
name = "release"

[[scenario.concurrency_await_manual.run]]
name = "debug"
options = ["--debug"]

[scenario.concurrency_await_manual_refused]
category = "reject"
description = "The refusals the reference manual shows for 'await' in an actor's methods: a borrow used after the 'await' that ended it, one made before it for a call after it (a receiver, an argument), a lock borrow named after it; and each 'await' not built yet -- on a function's call, on a message returning nothing, in a method that is not a message, in a place's index, whose continuation would hold a traced reference -- and a call of a message holding one"
tags = ["flow"]
