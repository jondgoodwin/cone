category = "run"
description = "Eight actors on four workers each run twenty steps of two parallel eaches in a behaviour, one that changes the actor's items and one over a range of 0 to 300 passes sending a message at every fiftieth, while main runs a hundred blocking loops of its own that take their pieces too: results as the plain loop's, no behaviour begun inside another's loop, every gathered message handled"
tags = ["typecheck", "flow", "genllvm", "runtime"]

