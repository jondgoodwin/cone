# -------- futures: a behaviour's value stored, awaited later --------
#
# A call of a behaviour returning a T whose value is used gives an
# actors.Future[T]; as a statement of its own it is fire and forget. 'await'
# on the future parks unless it has its ending already (concurrency_future;
# concurrency_future_arrived pins, by the messages the workers handle, that an
# 'await' on one already arrived goes on with no seam); one found abandoned
# panics at the 'await' (concurrency_future_abandoned), while a behaviour
# parked on one that is then abandoned is ended quietly, its drops run
# (concurrency_future_abandoned_parked). What is refused is
# concurrency_future_refused; the manual's examples are
# concurrency_future_manual's.

[scenario.concurrency_future]
category = "run"
description = "A behaviour's value stored as an actors.Future[T] and awaited later: a future of the actor's own behaviour, which parks, its droppables dying where the one scope says; one arrived before its 'await'; two in flight awaited in order; Future[u64] copied and awaited twice; Future[Note] moved and awaited once; a future handed to another actor and awaited there; in a loop, beside a value in flight, of a tuple; one never awaited, its value finalized when it is freed; and every future freed by the end"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[[scenario.concurrency_future.run]]
name = "release"

[[scenario.concurrency_future.run]]
name = "debug"
options = ["--debug"]

[scenario.concurrency_future_arrived]
category = "run"
description = "An 'await' on a future already arrived goes on at once, with no seam: the workers handle 7 messages, where a reply resuming it would make 8; one on a future still pending parks and is resumed by a message; and the first half's arrived path opens the value where it stands"
tags = ["genllvm", "runtime"]

