  "5fetch'1.record\" = type { %Answer, %Conn }",
  "4load'1.record\" = type { %Answer }",
  "3two'2.record\" = type { %Answer, %Buf, %Conn }",
  "5fetch'1.resume\"(ptr %0, i64 %1, ptr %2)",
]

[scenario.concurrency_await_message]
category = "reject"
description = "An 'await' on a behaviour returning nothing, through another actor's handle or through 'self', is ErrorAwaitVoid; a record holding a traced reference is ErrorUnbuiltAwait; a behaviour returning what is not Sendable is ErrorNotSendable; 'self.m()' on a behaviour holding an 'await' is a send, refused nowhere; 'selfactor' in an actor's init is good; outside an actor's method -- its final, a function, another type's method -- it is ErrorSelfActorPlace"
tags = ["typecheck", "flow"]

[scenario.concurrency_iobuf_loan]
category = "reject"
description = "A buffer is lent by moving it: a borrow of an iobuf IoBuf is refused where an IoBuf is wanted and where it would cross a thread, while the IoBuf, its frozen Bytes, a Chain and the Pool handle cross; a frozen one, an Arc[imm, IoBuf], refuses the methods that write"
tags = ["typecheck"]

[scenario.concurrency_iocore_submit]
category = "reject"
description = "An iocore operation takes owners of its bytes, never a borrow: a slice, a string literal, a '&mut IoBuf', a buffer's spare room or view are refused where an Op is built (a blocking-pool Call's buffer too), while an IoBuf and frozen Bytes are taken; a Completion, a Waker, a CancelGroup, a Request and a Completer cross threads, a '&mut Completion' and a '&mut Completer' do not"
tags = ["typecheck"]

# -------- generation --------

[scenario.concurrency_genllvm_atomic]
category = "run"
description = "Atomic[T]'s everyday operations are one seq_cst instruction each, an Ordered form one arm per ordering it allows, and a local changed only atomically stays in memory, its add in the loop, after optimization"
tags = ["genllvm", "runtime"]

[[scenario.concurrency_genllvm_atomic.check]]
name = "everyday-operations-are-sequentially-consistent"
target = "preir"
contains = [
  "%atomicload = load atomic i16, ptr %self1 seq_cst, align 2",
  "store atomic i16 %v2, ptr %self1 seq_cst, align 2",
  "%4 = atomicrmw add ptr %self1, i16 %v2 seq_cst, align 2",
  "%4 = atomicrmw xor ptr %self1, i16 %v2 seq_cst, align 2",
]

[[scenario.concurrency_genllvm_atomic.check]]
name = "an-ordered-form-has-one-arm-per-ordering"
target = "preir"
contains = [
  "%9 = atomicrmw add ptr %self3, i16 %v4 monotonic, align 2",
  "%11 = atomicrmw add ptr %self10, i16 %v11 acquire, align 2",
  "%13 = atomicrmw add ptr %self17, i16 %v18 release, align 2",
  "%15 = atomicrmw add ptr %self24, i16 %v25 acq_rel, align 2",
  "%17 = atomicrmw add ptr %self26, i16 %v27 seq_cst, align 2",
  "%atomicload = load atomic i16, ptr %self3 monotonic, align 2",
  "%atomicload10 = load atomic i16, ptr %self9 acquire, align 2",
]
excludes = ["load atomic i16, ptr %self9 release", "load atomic i16, ptr %self9 acq_rel"]

[[scenario.concurrency_genllvm_atomic.check]]
name = "an-atomic-local-keeps-its-address"
target = "llvmir"
contains = ["atomicrmw add ptr %c.i, i32 3 seq_cst, align 4"]

# -------- rejects --------

[scenario.concurrency_typecheck_atomic]
category = "reject"
description = "AtomicValue on anything but a struct of one integer, Bool or raw pointer field; with Copy; in a const, however deep; Atomic[T] of a type its 'where' clause refuses, just those the marker does; an Atomic[Bool]'s add and sub, and an atomic raw pointer's add and bit operations, which exist only where their clauses hold"
tags = ["typecheck"]

[scenario.concurrency_typecheck_sendable]
category = "reject"
description = "What may not cross threads, refused where a generic asks for Sendable and naming what binds it and where: a borrow of any permission, in a field, deeper down, behind a uni owner or an Arc[imm, T]; Rc[mut, T] and Arc[mut, T]; Rc[imm, T]; a traced reference; a raw pointer, in an enum's variant, beside a struct's owner of itself; a borrow in Option's variant and in an array; a declared-Sendable type's bound argument; thread.start given a borrow of a local, and a thread returning Rc[imm, T]; a channel of borrows; and one judged after type check, a struct asking for a channel of itself while it is laid out"
tags = ["typecheck"]

[scenario.concurrency_flow_atomic]
category = "reject"
description = "An atomic value moves: copying one, reading it after, taking its field out of a struct, and using it after inner are refused"
tags = ["flow"]

[scenario.concurrency_await_manual]
category = "run"
description = "The reference manual's examples of 'await' in an actor's methods, run one after another: the worked example (Page, Fetcher, Net), one scope's drop timing and order, a ''static' borrow and a lock given back across an 'await', 'selfactor' awaited, one request answered once, a loop holding an 'await', and the rest of a statement run after its 'await' (a place's index, a receiver, a compound assignment); and refpermlock.html's lock borrowed for a statement, given back at an 'await' within it, which another actor then takes"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[[scenario.concurrency_await_manual.run]]
name = "release"

[[scenario.concurrency_await_manual.run]]
name = "debug"
options = ["--debug"]

[scenario.concurrency_await_manual_refused]
category = "reject"
description = "The refusals the reference manual shows for 'await' in an actor's behaviours: a borrow used after the 'await' that ended it, a borrow a call made to the left of the 'await' (ErrorAwaitLeftCall), a lock borrow named after it; an 'await' in a synchronous 'fn' (ErrorAwaitPlace) and on a behaviour returning nothing (ErrorAwaitVoid); and each 'await' not built yet -- on a function's call, in both places a swap exchanges, whose continuation would hold a traced reference"
tags = ["flow"]

[scenario.concurrency_await_operation]
category = "run"
description = "An 'await' on an operation, a value of actors.Awaitable[R] its maker starts at the seam with the reply's envelope, gives the R its answer is and nothing more: an empty record with no slot and no id, a record holding a number and a droppable that dies where the one scope says, a value in flight, a Result answered and matched; and an operation that drops its envelope unanswered, whose continuation is abandoned when its actor dies -- the record dropped, its droppable finalized, its second half never run"
tags = ["typecheck", "flow", "genllvm", "runtime"]

[[scenario.concurrency_await_operation.run]]
name = "release"

[[scenario.concurrency_await_operation.run]]
name = "debug"
options = ["--debug"]

[[scenario.concurrency_await_operation.check]]
name = "an-empty-record-has-no-slot-no-id-and-no-drop-function"
target = "preir"
contains = [
  "5empty'1\"(ptr %0, i64 %1)",
  "5empty'1.resume\"(ptr %0, ptr %1)",
]
excludes = ["5empty'1.drop"]

[[scenario.concurrency_await_operation.check]]
name = "a-record-is-parked-with-its-drop-function-which-finalizes-its-droppable"
target = "preir"
contains = [
  "4kept'1.record\" = type { i64, %Fin }",
  "4kept'1.resume\"(ptr %0, i64 %1, ptr %2)",
  "define internal void @\"_CNvNtu18_ProberState_l7620i4kept'1.drop\"(ptr %0)",
  "%dropping = getelementptr inbounds nuw %\"_CNvNtu18_ProberState_l7620i4kept'1.record\", ptr %0, i32 0, i32 1",
  "@_CNvNt3Fin5final(ptr %dropping)",
  "i64 16, ptr @\"_CNvNtu18_ProberState_l7620i4kept'1.drop\")",
  "@_CNvC6actors10startAwait(ptr %awaitable, %Reply ",
]

[scenario.concurrency_await_operation_unused]
category = "reject"
description = "What an awaited operation (an actors.Awaitable, an I/O operation) answers with must be used: an 'await' on one that is a statement of its own, in the middle of a behaviour or as the last statement of one returning nothing, is ErrorAwaitUnused; bound to a local and matched it is accepted, and an 'await' on a behaviour's reply whose value is unused is not touched"
tags = ["typecheck"]
