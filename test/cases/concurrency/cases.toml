description = "The parallel builder on four workers started for it, each result checked element by element against a plain '<- each' (and its order on its own): number ranges ('<', '<=', signed, ending at the type's maximum, empty, reversed, one pass), arrays, a slice, a part of one, a literal array, lists, structs, an empty list, fewer passes than workers, uneven work; the header 'if' over a list, an array and a range, never and always true; Strings and structs holding them made in the body; the drain form, other entries, a list that already holds values, two builders in one list; yielding from mutItems; a generic function, a method, a builder inside a builder's pass; outside variables read in the header and the yield; and work spread over more than one thread"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

