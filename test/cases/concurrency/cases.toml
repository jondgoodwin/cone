[scenario.concurrency_parallel_each_copies]
category = "reject"
description = "A parallel each body may not copy a counted owner whose count is not atomic (an Rc) that is not the pass's own: a local, a field of a struct, the struct copied whole, an element of a list through a borrow and by index, a tuple's element, an array's, an enum's payload, one passed by value to a function, and a traced Gc reference"
tags = ["typecheck"]
diagnostics = 10

[scenario.concurrency_parallel_each_reach]
category = "reject"
description = "A parallel each body, or a parallel builder's header, filter or yield, may not name a value from outside whose type is not safe to share across the passes (it holds an Rc, a program's own counted region not declaring ThreadSafe, or a traced reference, through a field, element, borrow or the pass's own item): read, lent or passed, not only copied (ErrorParReach; 3D Web's probe d1). A region declaring ThreadSafe, an Arc, an Atomic, numbers, the contents borrowed before the loop and an Rc the pass makes are allowed"
tags = ["typecheck"]

[scenario.concurrency_gc_stopgap_actor]
category = "reject"
description = "A Gc may not be made, held or copied inside an actor until the collector is per actor (ErrorGcStopgap, saying GC per actor is coming): a local of a behaviour (3D Web's probe), of a synchronous method, of init and of final, a struct holding one made in a behaviour, a parameter, a program's own traced region (judged by what a region declares, never by its name), one made in a parallel each written in a behaviour; a plain function using Gc and an actor using none are untouched"
tags = ["typecheck"]

[scenario.concurrency_gc_stopgap_parallel]
category = "reject"
description = "A Gc may not be made or held in a parallel each until the collector is per actor (ErrorGcStopgap): an allocation, a struct holding one and a call returning one in the body, an allocation in a parallel builder's filter and yield, a program's own traced region; a copy in from outside is still ErrorParCopy once, and a loop touching no Gc is untouched"
tags = ["typecheck"]

[scenario.concurrency_parallel_each_counted]
category = "run"
description = "Reading through an Rc in a parallel each body works (dereferenced, lent to a function, inside a struct, the Rcs of a list through the pass's borrow); an Arc is copied in the body, and an Rc the pass makes is copied there too"
tags = ["typecheck", "flow", "genllvm", "runtime"]

# -------- 'parallel each' in an actor's behaviour --------
#
# The behaviour is cut where the loop ends, as an 'await' cuts it (a seam,
# ir/exp/pareach.c, genllvm/genlpar.c and genlawait.c); the actors package
# begins the loop when the behaviour has returned and resumes the rest ahead of
# the mailbox when the last piece is done (packages/actors/src/parallel.cone,
# "A PARALLEL EACH IN A BEHAVIOUR").

[scenario.concurrency_parallel_each_actor]
category = "run"
description = "A parallel each in an actor's behaviour is a seam at the loop's end: the actor is not run again until the loop and the rest of the behaviour have finished (messages sent meanwhile see it outside the loop), the pieces borrow the actor's fields through self and change the items of a field, a parameter, a local and a droppable the pieces read are carried across and the droppable dies at the behaviour's end, the body's sends arrive in iteration order ahead of the sends after the loop, a returned value is answered from after the loop, loops in a while and one after another are a seam each, a range from a parameter, an empty one and a short one, a loop in a piece's body, pieces on more than one worker, and a loop in an actor's synchronous fn, which runs where it stands"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

[[scenario.concurrency_parallel_each_actor.run]]
name = "release"

[[scenario.concurrency_parallel_each_actor.run]]
name = "debug"
options = ["--debug"]

