# -------- the parallel builder --------
#
# 'new List[T] <- parallel each x in src [if c] yield v': each piece of the loop
# appends to a list of its own, and the lists are joined in the order of the
# passes after the loop (List's pieceBag, newPiece and joinPieces, which the
# compiler calls). The body's rules are the parallel each's.

[scenario.concurrency_parallel_builder_refused]
category = "reject"
description = "What the parallel builder refuses: a receiver that is not a List (a dictionary with 'yield k: v', a deque) and a pair appended to a List; a yield or a header 'if' that lends something outside the loop for writing, or copies an Rc from outside it; a source that cannot be split; a break or a return in the yield's value; a list read from and built into at once; and a builder inside an actor's method or a generator"
tags = ["parse", "typecheck", "flow"]
diagnostics = 12

