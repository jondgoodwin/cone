description = "A type of another package behind a '&<mut Trait + ShapeKeeping', taken as the package's include file says: one it does not record (a method that pushes into a collection it reaches through a '&mut' parameter, or one such method beside one that is fine) is refused at the pass; the recorded type passes"
tags = ["flow"]
diagnostics = 2

# A '_' target in a body the shape inference reads (shapeinfer.c): it writes no
# place, and names nothing, so it has no type to ask. Asking one was error 1075,
# a compiler defect, wherever such a body was read: a callee of a call made while
# a borrow into a collection is held, and a public method a library's include file
# records the shape of. What the '_' takes is still made, so a call that reshapes
# is still seen
[scenario.collection_reshape_discard_success]
category = "run"
description = "A borrow into a 'List[i64]' held across calls whose bodies discard with '_': a value that copies, inside a block, in a generic function, in a method of a generic type, a by-value result that moves, one of two values taken apart, a refused value a push hands back in a 'match' arm in a loop (iocore's shape), and a popped value inside an 'if' in a method (http2's shape)"
tags = ["flow", "genllvm", "runtime"]

[scenario.collection_flow_reshape_discard]
category = "reject"
description = "A borrow into a 'List[i64]' held across a call whose callee discards with '_' the result of a call that reshapes the list: a pop, and a push inside an 'if'"
tags = ["flow"]
diagnostics = 2

[scenario.collection_reshape_discard_link]
category = "run"
description = "A package whose public methods, and a function they call, discard with '_', compiled on its own: its include file records ShapeKeeping on the type whose discards reshape nothing, and not on the one that discards what a reshaping call hands back; the program takes the recorded type behind a '&<mut Trait + ShapeKeeping'"
tags = ["flow", "genllvm", "runtime"]
