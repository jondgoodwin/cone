# collection - array references and slices: '&[]' over an array, the length a
# slice carries, indexing and aliasing through one, and a slice as a parameter,
# a result, a member and a global. Tier 2.
#
# Key reference: design/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# The group's title in the manual is "collection types, array references and
# slices". There are no collection types. src/c-compiler/corelib/ defines
# Option, Result, 'so' and 'rc' and nothing else; there is no vector, map, list
# or string type, and no generic container of any kind. Array references and
# slices are therefore the whole of this group, and 'slice' and 'array
# reference' name one thing: the ArrayRefTag type '&[]T', a data pointer and a
# length carried together. A '&[N; T]' -- a plain reference whose value type is
# a fixed-size array -- is the other construct here, and it is a different type
# with different rules; the two are kept apart by name throughout.
#
# The fixed-size array itself is array's subject. It appears here only as what a
# slice is borrowed from. Plain borrowed references and their permissions are
# ref's, and appear only where the thing borrowed is a slice or an element of
# one.
#
# The failure scenarios split first by pipeline stage and then by sub-family:
#
# - The two type-check files ask different questions. collection-typecheck-slice
#   asks which operations a slice supports at all; collection-typecheck-perm
#   asks what a well-formed slice is then allowed to do. Together they would be
#   nine diagnostics, past the three-to-six limit.
# - collection-flow is separate and is a single function, because whether an
#   lval may be modified is decided in assignlvalrtype, which runs from
#   blockFlow. Flow analysis runs only on a function that type checked, so a
#   type-check error in this file's own function would silence its every flow
#   diagnostic. It no longer matters what other functions did: fnDclTypeCheck
#   gates on this function's error count rather than on the global one.
#
# There is no parse-stage or name-resolution scenario. '&[]' is a single token
# (lexical proves that) and a malformed slice type produces the generic
# ErrorBadTerm core already covers; a slice type names only a permission and an
# element type, both of which resolve like any other name.
#
# Left uncovered on purpose:
#
# - Nothing stands where ErrorBadSlice (1047) did. It was declared in
#   shared/error.h, raised nowhere, and has been deleted: '&[]' over a non-array
#   is a one-element slice by design, so there was no condition for it to name.
# - ErrorBadIndex on a slice -- a signed index, or the wrong number of indices.
#   Both go through the same fnCallArrIndex checks the array group already
#   asserts against an array, before the object's type is consulted at all, so
#   a slice would re-test array's code rather than any slice behavior.
# - '&[]' applied to something that is not an array or a slice, and whose type
#   declares no whole-value '&[]' method of its own. It is accepted and produces
#   a one-element slice over that value (see the "a one-element slice!" branch in
#   ir/exp/borrow.c). Nothing rejects it, so there is no diagnostic to assert,
#   and asserting the success would pin a behavior no documentation claims.
#   Where the type does declare that method, '&[]value' dispatches to it, and
#   struct owns operator methods and covers both outcomes.
# - An index past the end of a slice. It compiles, and the bounds check that
#   would catch it aborts the process rather than failing an assertion.
# - WarnCopy sounds as though a slice might provoke it. It is declared in
#   error.h and raised nowhere. ErrorNotLval, ErrorAddr and ErrorNoFlds sounded
#   the same way and have been deleted; ErrorBadAlloc is now region's.

support = []

# -------- success --------

[scenario.collection-success]
category = "run"
description = "Slices borrowed from arrays: length, indexing, aliasing, comparison and slices as values"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# -------- generated code --------

# A slice's length is a field of the value, not of its type, so the check
# against it cannot be folded even for a constant index. Asserted here rather
# than at run time because the check only announces itself by aborting.
[scenario.collection-bounds-slice]
category = "compile"
description = "Indexing a slice is bounds-checked against the length the slice carries"
tags = ["typecheck", "genllvm"]

[[scenario.collection-bounds-slice.check]]
name = "slice-index-emits-bounds-check"
target = "llvmir"
contains = ["extractvalue { i32*, i64 }", "icmp ult i64 0, %count", "call void @llvm.trap()"]

# The same constant index against an array whose length is in its type folds
# away entirely. The pair is what makes either claim informative.
[scenario.collection-bounds-fixed]
category = "compile"
description = "Indexing a fixed-size array through a reference needs no run-time check"
tags = ["typecheck", "genllvm"]

[[scenario.collection-bounds-fixed.check]]
name = "fixed-array-index-needs-no-bounds-check"
target = "llvmir"
excludes = ["call void @llvm.trap()"]

# -------- type check stage --------

[scenario.collection-typecheck-slice]
category = "reject"
description = "Operations a slice does not support: dereference, unknown members, calls"
tags = ["typecheck"]
diagnostics = 4

[scenario.collection-typecheck-perm]
category = "reject"
description = "Permissions a slice cannot obtain or coerce to, and element types it cannot claim"
tags = ["typecheck"]
diagnostics = 5

# -------- flow stage --------

[scenario.collection-flow]
category = "reject"
description = "Writes through a slice the permission forbids, and re-pointing an immutable one"
tags = ["flow"]
diagnostics = 3

# The lifetime rule ref-flow asserts for a borrowed reference now also applies
# to a slice, so a slice may no longer outlive the array it points at.
[scenario.collection-flow-escape]
category = "reject"
description = "Storing a slice where it outlives the array it was borrowed from"
tags = ["flow"]
