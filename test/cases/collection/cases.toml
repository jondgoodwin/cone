description = "An element borrowed through one '&mut' ship while another name replaces the field holding the list's owner ('Uni', 'Rc', 'Arc', a user region), the whole ship, a ship nested in a struct, or the list through the owner; with the controls: the list held inline, the same name, and a push through another owner"
tags = ["flow"]
diagnostics = 12

[scenario.collection_store_owner_success]
category = "run"
description = "A borrow of an element of a list a 'Uni' owns, held while another field of the other ship is written, a borrow used up before the owner is replaced, two local ships, and one shared 'Rc' ship replaced after the last use"
tags = ["flow", "genllvm", "runtime"]

[scenario.collection_freeze_shared_success]
category = "run"
description = "A borrow a method returned out of a list, deque or String reached through a '&mut' parameter or a field of 'self': the path read and borrowed read-only again while it is used, pushed onto after its last use, a cursor used up first"
tags = ["flow", "genllvm", "runtime"]

# A virtual reference marked '+ ShapeKeeping' keeps the caller's borrows across a call
# the compiler cannot read, and the value behind it is held to the promise where it
# becomes the reference (collection_flow_shapekeeping holds what that refuses)
[scenario.collection_shapekeeping_success]
category = "run"
description = "An element of a list reached through a '&mut' parameter, borrowed before a call through '&<fn(...) + ShapeKeeping' or '&<mut Trait + ShapeKeeping' and read after it: a closure writing a field and an element, one changing a number it borrows, structs whose method writes fields and elements, pushes to a list of its own, or only reads, a plain function named with '&', and a trait with two methods"
tags = ["flow", "genllvm", "runtime"]

# The body of text, 'str': its methods (written once, in core), a part of it
# taken with a borrowed range, and '==' and the orderings between the kinds of
# text, by byte. A String's reach of the same methods through a lent body is
# struct_use_lend; the package's own tests cover the String itself.
[scenario.collection_str]
category = "run"
description = "The methods of str on a literal, a borrow and an owner (len, bytes, indexing, boundaries, searching, trimming); a part taken with a borrowed range, through a reference, a result and another part; '==' and the orderings across str, Uni[str] and Rc[str], by byte"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.collection_str_symmetric]
category = "run"
description = "'==', '!=' and the four orderings across '&str', '&String', '&Uni[str]', '&Rc[str]' and a literal, each kind on the left and on the right of each other (an owner on the left against a '&str' was refused as a reference compared with a value); the answers do not depend on operand order"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.collection_typecheck_str]
category = "reject"
description = "A range of text not borrowed, from a borrow and from an owner; an index that is not an integer; text written through an index"
tags = ["typecheck"]
diagnostics = 4

# A read-only '&x[i]' calls '[]', which must lend a borrow for there to be a
# place; '&[]' (IndexMut) may not be declared without '[]' (Index)
[scenario.collection_typecheck_index_borrow]
category = "reject"
description = "'&[]' taking an index declared with no '[]'; '&x[i]' of a String's byte and of a user type's '[]' returning a value, which name no place"
tags = ["typecheck"]
diagnostics = 3

[scenario.collection_reshape_through_call_success]
category = "run"
description = "A view taken through a reference a call returned ('ui.items[0usize].label.view()') and copied out first, handed to a callee that grows nothing it points into or only reads, used up before the call that grows, or taken from a list the function owns; and handed to a callee that grows a String of its own and is handed nothing that holds the viewed one (a read-only source, a loop, a field beside the list, an element of a List[String])"
tags = ["flow", "genllvm", "runtime"]

# The same rule for a view taken through a reference a call returned, with no name to hold it
# ('dl.text(ui.items[0usize].label.view())'): a List's '[]' is a call
# (collection_reshape_through_call_success holds what is accepted beside each refusal).
[scenario.collection_flow_reshape_through_call]
category = "reject"
description = "A String's view taken through an element a list's index returned ('ui.items[0usize].label.view()'), handed to a call that could grow the String through another name: two parameters of one type, and a String appended to; and the same through a name"
tags = ["flow"]
diagnostics = 3

# A List held as an element of an array is followed as one held by a local or a field is: an
# array's elements are not told apart by index, so a change to any of them is a change to the
# one the borrow is into (collection_reshape_array_elem_success holds what is accepted).
[scenario.collection_flow_reshape_array_elem]
category = "reject"
description = "A borrow into a List that is an element of an array ('&mut ls[0usize][0usize]'), held across a push onto the same or another element, a store over another element, or handed to a call beside a '&mut' of the element that pushes; the array an owner's array, a multi-dimensional one, a struct's field, a '&uni' or '&mut' slice parameter"
tags = ["flow"]
diagnostics = 11

[scenario.collection_reshape_array_elem_success]
category = "run"
description = "A borrow into a List that is an element of an array used up before the list grows, handed to a callee that grows nothing, held while another element is only read, two elements swapped, separate local lists, a loop taking a borrow each pass, and the array held by a struct or reached through a '&uni' reference"
tags = ["flow", "genllvm", "runtime"]

# What the refinement must keep refused: the call is handed the struct that holds the viewed
# value, by any route (collection_reshape_through_call_success holds what it lets through).
[scenario.collection_flow_reshape_owner]
category = "reject"
description = "A view of a String, or of an element of a List, handed to a call that could reshape it through another name, the call reaching the struct that holds it through its own methods that replace or clear, a trait bound, a generic struct, a field path two levels down, a List[String]'s method, a '&mut String', an enum's variant, and a chain of indexes with a second reference to the list"
tags = ["flow"]
diagnostics = 13

# A String appended to that is a field of another struct than the viewed value's owner is another
# value, and is not asked; what stays refused beside it is held here
# (collection_reshape_receiver_other_struct_success holds what is accepted).
[scenario.collection_flow_reshape_receiver_other_struct]
category = "reject"
description = "A view held across an append to a String or push to a List that may be the very value it points into: the same struct through two references or the same generic instance, a receiver that is a name, a list's element or a field holding a reference, a view reached through a name or a reference field, and the variants of one enum"
tags = ["flow"]
diagnostics = 15

# A view through a field that holds a reference or pointer is into a String another struct holds:
# the struct with the reference field is not its owner (collection_reshape_reffield_owner_success
# holds what is accepted beside each refusal).
[scenario.collection_flow_reshape_reffield_owner]
category = "reject"
description = "A view of a String reached through a field that holds a '&mut' to it (directly, through '*', held in a name, one struct down, in a method's own field), handed to a call that appends to a String that field may point at: the struct that holds the String, or another struct holding one"
tags = ["flow"]
diagnostics = 7

[scenario.collection_reshape_reffield_owner_success]
category = "run"
description = "A view of a String a struct holds by value (one struct down, or by a by-value field of what a reference field points at), appended to another struct's String; a view through a reference field handed a call that holds no String, or only reads one"
tags = ["flow", "genllvm", "runtime"]

[scenario.collection_reshape_receiver_other_struct_success]
category = "run"
description = "A view of a String that is a field, or a list's element, of one struct, held across an append to a String (or a push to a List) that is a field of another struct (the clipboard of a Ui beside its texts, a document's note beside its items), through one reference, two, a method's self, a loop, and a name holding the borrow"
tags = ["flow", "genllvm", "runtime"]

# A mutable virtual call hides the type behind it, so it may reach any container
# (collection_reshape_virtual_success holds what is accepted beside each refusal).
[scenario.collection_flow_reshape_virtual]
category = "reject"
description = "A view of a String, or of an element of a List, held across a mutable virtual call: a '&<mut Trait' receiver handed the view inline and by a name, a '&<mut fn' closure that captured the owner, and the visitor idiom, a closure that pushes to the list the visitor iterates"
tags = ["flow"]
diagnostics = 4

[scenario.collection_reshape_virtual_success]
category = "run"
description = "A view held across a virtual call that cannot reach the container: a read-only '&<Trait' receiver and '&<fn', a list lent '&imm' to a visitor that takes a '&<mut fn', a '&<mut fn' marked '+ ShapeKeeping', and a '&<mut fn' handed a view of a String the function made"
tags = ["flow", "genllvm", "runtime"]

# A function may write a global by its name, whatever it is handed, and the loan walk does not follow
# which one: a borrow into a 'var' global is refused across a call that may reshape the container's type
# by the shape inference, a callee it cannot read counting as one that does
# (collection_reshape_global_success holds what is accepted beside each refusal).
[scenario.collection_flow_reshape_global]
category = "reject"
description = "A view of a String, or of an element of a List, held in a 'var' global across a call that may reshape it: handed to a function that writes the global by its name, held in a name across such a call, a closure in an 'imm' owner, a '&<fn', and a view passed on by a helper that calls a closure"
tags = ["flow"]
diagnostics = 5

# A function handed a reference cannot tell it is a 'var' global, so where one reaches the type
# the view reached through the reference is asked of the same calls
[scenario.collection_flow_reshape_global_param]
category = "reject"
description = "A view of a String, or of an element of a List, reached through a '&mut' parameter, held across a call that may reshape it in a program with a 'var' global that reaches the type: handed on beside a closure in an 'imm' owner, beside a '&<fn', through a '&<fn' whose body is not visible, and held in a name across such a call"
tags = ["flow"]
diagnostics = 4

# A call through a function value, or an extern handed anything that reaches something callable, runs
# code the compiler cannot follow: refused whether or not the code writes the global (a quiet callback,
# and a String made from a view, are refused alike; the cure is a copy made by a method of the global)
[scenario.collection_flow_reshape_global_opaque]
category = "reject"
description = "A view of a 'var' global held across a call through a function value (a parameter, a struct's field, a 'var' global, a local), across an extern handed a callback that writes the global, a quiet callback, a struct holding a '&fn', a '&<mut fn' or a Uni[fn], and across String.from, which allocates through a '&fn'"
tags = ["flow"]
diagnostics = 10

[scenario.collection_reshape_global_success]
category = "run"
description = "A view of a 'var' global across calls that cannot reshape it: its length, a copy, a call that writes nothing, a print, a view of a 'let' global, a '&<mut fn' marked '+ ShapeKeeping', a view of a local beside a 'var' global, and a view through a reference of a type no 'var' global reaches"
tags = ["flow", "genllvm", "runtime"]

# A generic closure that captured the owner by '&mut' holds it as '& &mut Ed': a read-only reference
# to a '&mut' still reaches a writable path, which reshape.c follows
[scenario.collection_flow_reshape_closure_capture]
category = "reject"
description = "A view of a String handed to a generic closure ('F fn(&str)') that captured the struct holding it by '&mut', so holds it as '& &mut Ed' and can grow the String through it: the view inline, and held in a name"
tags = ["flow"]
diagnostics = 2

[scenario.collection_shapekeeping_link]
category = "run"
description = "A struct of a package compiled on its own behind a '&<mut Trait + ShapeKeeping' in the program that imports it: the package's include file, which has no method bodies, records ShapeKeeping on each type whose methods reshape nothing a caller borrows, and the program takes the type as the file says"
