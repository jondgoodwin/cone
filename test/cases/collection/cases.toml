# collection - array references and slices: '&[]' over an array, the length a
# slice carries, indexing and aliasing through one, and a slice as a parameter,
# a result, a member and a global; and a collection's contents, the list after
# '<-' (listed values, 'n of x', 'fill x', pairs 'k: v'). Tier 2.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# The group's title in the manual is "collection types, array references and
# slices". The compiler defines no collection type: the collections package's
# List, Dict and String are library code, which its own tests cover. What the
# compiler gives every collection is the list after '<-', each entry lowered to
# a call of the receiver's '<-' (collection_contents, and the refusals in
# collection_typecheck_contents and collection_parse_contents); an array's
# contents are array's. Otherwise array references and
# slices are the whole of this group, and 'slice' and 'array
# reference' name one thing: the ArrayRefTag type '&Array[T]', a data pointer and a
# length carried together. An '&Array[T, n]' -- a plain reference whose value type is
# a fixed-size array -- is the other construct here, and it is a different type
# with different rules; the two are kept apart by name throughout.
#
# The fixed-size array itself is array's subject. It appears here only as what a
# slice is borrowed from. Plain borrowed references and their permissions are
# ref's, and appear only where the thing borrowed is a slice or an element of
# one.
#
# The failure scenarios split first by pipeline stage and then by sub-family:
#
# - The two type-check files ask different questions. collection_typecheck_slice
#   asks which operations a slice supports at all; collection_typecheck_perm
#   asks what a well-formed slice is then allowed to do. Together they would be
#   nine diagnostics, past the three-to-six limit.
# - collection_flow is separate and is a single function, because whether an
#   lval may be modified is decided in assignlvalrtype, which runs from
#   blockFlow. Flow analysis runs only on a function that type checked, so a
#   type-check error in this file's own function would silence its every flow
#   diagnostic. It no longer matters what other functions did: fnDclTypeCheck
#   gates on this function's error count rather than on the global one.
#
# The one parse-stage scenario is a range index's: 'a...' with no end, which
# nothing later could report. There is no other parse-stage or name-resolution
# scenario. '&[]' is a single token
# (lexical proves that) and a malformed slice type produces the generic
# ErrorBadTerm core already covers; a slice type names only a permission and an
# element type, both of which resolve like any other name.
#
# The retired slice type, '&[]T' for '&Array[T]', is refused at name resolution,
# which is where a type is told from the value '&[]x' borrows
# (collection_nameres_spelling, collection_nameres_spelling_places).
#
# Left uncovered on purpose:
#
# - Nothing stands where ErrorBadSlice (1047) did. It was declared in
#   shared/error.h, raised nowhere, and has been deleted: '&[]' over a non-array
#   is a one-element slice by design, so there was no condition for it to name.
# - ErrorBadIndex on a slice -- a signed index, or the wrong number of indices.
#   Both go through the same fnCallArrIndex checks the array group already
#   asserts against an array, before the object's type is consulted at all, so
#   a slice would re-test array's code rather than any slice behavior.
# - '&[]' applied to something that is not an array or a slice, and whose type
#   declares no whole-value '&[]' method of its own. It is accepted and produces
#   a one-element slice over that value (see the "a one-element slice!" branch in
#   ir/exp/borrow.c). Nothing rejects it, so there is no diagnostic to assert,
#   and asserting the success would pin a behavior no documentation claims.
#   Where the type does declare that method, '&[]value' dispatches to it, and
#   struct owns operator methods and covers both outcomes.
# - An index past the end of a slice. It compiles, and the bounds check that
#   would catch it aborts the process rather than failing an assertion.
# - WarnCopy sounds as though a slice might provoke it. It is declared in
#   error.h and raised nowhere. ErrorNotLval, ErrorAddr and ErrorNoFlds sounded
#   the same way and have been deleted; ErrorBadAlloc is now region's.

support = []

# -------- success --------

[scenario.collection_success]
category = "run"
description = "Slices borrowed from arrays: length, indexing, aliasing, identity, element-by-element equality and slices as values"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# What a borrow a method returns leaves its receiver, two-phase receivers, and
# an arena's allocations, which loan nothing of it. Uses the collections, pool
# and arena packages.
[scenario.collection_freeze_success]
category = "run"
description = "A list read while an element borrow is used and pushed after its last use, 'v.push(v.len())', a pool read under a borrow, arena allocations live together, an owner moved after its coerced borrow's last use"
tags = ["flow", "genllvm", "runtime"]
[scenario.collection_subslice]
category = "run"
description = "A slice of part of an array or a slice, borrowed with a range index: each range form, through a reference, of a slice, written through, returned from a parameter, and nested: a range of a row, a row of a range"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

# A borrowed array literal of constants is a constant global, as a string
# literal is; the check pins that the borrow points at one rather than at a
# local copy
[scenario.collection_const_literal]
category = "run"
description = "A borrowed constant array literal, '&[1, 2, 3]': indexed, as an argument, as a declared slice, iterated, returned, and initializing a global"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.collection_const_literal.check]]
name = "borrowed-constant-literal-is-a-constant-global"
target = "preir"
contains = ["internal constant [3 x i32] [i32 1, i32 2, i32 3]", "internal constant [4 x i64] [i64 2, i64 3, i64 5, i64 7]"]

# -------- generated code --------

# A slice's length is a field of the value, not of its type, so the check
# against it cannot be folded even for a constant index. Asserted here, the
# failure path's shape; what a failed check prints is panic_bounds's. Both
# scenarios are read before optimization: nothing calls their one function,
# and a program's definitions are internal, so the optimizer deletes it. The
# failure is a call to the C runtime's entry, handed the index, the count, the
# file's name (28 bytes, 'collection_bounds_slice.cone') and the line, then
# 'unreachable'; the entry is cold and does not return.
[scenario.collection_bounds_slice]
category = "compile"
description = "Indexing a slice is bounds-checked against the length the slice carries"
tags = ["typecheck", "genllvm"]

[[scenario.collection_bounds_slice.check]]
name = "slice-index-emits-bounds-check"
target = "preir"
contains = ["%count = extractvalue { ptr, i64 } %s1, 1", "icmp ult i64 0, %count",
  "call void @cone_panicIndex(i64 0, i64 %count, ptr @srcfile, i64 28, i32 22)\n  unreachable",
  "declare void @cone_panicIndex(i64, i64, ptr, i64, i32) #1",
  "attributes #1 = { cold noreturn nounwind }"]

# The same constant index against an array whose length is in its type needs no
# comparison at all: both operands are constants, so generation folds the test
# as it builds it and emits no 'icmp'. The pair is what makes either claim
# informative.
[scenario.collection_bounds_fixed]
category = "compile"
description = "Indexing a fixed-size array through a reference needs no run-time check"
tags = ["typecheck", "genllvm"]

[[scenario.collection_bounds_fixed.check]]
name = "fixed-array-index-needs-no-bounds-check"
target = "preir"
excludes = ["icmp"]

# A range's two comparisons, start against end and end against the length the
# slice carries, both unsigned and inclusive, joined before one branch to the
# panic, which is handed the start, the end and the count; then the length the
# new slice carries is the difference.
[scenario.collection_bounds_subslice]
category = "compile"
description = "A range index on a slice is bounds-checked: the start may not pass the end, nor the end the slice's length"
tags = ["typecheck", "genllvm"]

[[scenario.collection_bounds_subslice.check]]
name = "range-emits-bounds-check"
target = "preir"
contains = ["icmp ule i64", ", %count",
  "call void @cone_panicSlice(i64 %a2, i64 %b3, i64 %count, ptr @srcfile, i64 31, i32 14)\n  unreachable",
  "%slicelen = sub i64"]

# The list after '<-': each entry form after an existing collection and after
# a construction, a value evaluated for each element, 'fill' to a capacity,
# pairs with a key repeated, a list across lines and in an argument, any '<-'
# (print's), and 'of' and 'fill' as names. A 'run' because the claim is which
# values arrive and in what order, which only printing them shows. Uses the
# collections package.
[scenario.collection_contents]
category = "run"
description = "The list after '<-': listed values, 'n of x' evaluating x for each, 'fill x' to the capacity, pairs with a later key winning, after a construction and an existing collection, across lines and in an argument; 'of' and 'fill' as names"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

# -------- name resolution stage --------

# The retired slice type '&[]T' for '&Array[T]', in the three groups of case
# that make up a scenario each: the permissions, then a lifetime and a slice of
# slices, then the places a type stands
[scenario.collection_nameres_spelling]
category = "reject"
description = "The retired slice type '&[]T' is refused with the new spelling, '&Array[T]', in each permission: none, mut, imm, uni, opaq and ro"
tags = ["nameres"]
diagnostics = 6

[scenario.collection_nameres_spelling_lifetime]
category = "reject"
description = "The retired slice type refused with a lifetime ('&[]'a T', '&[]'a mut T') and as the element of a slice, each '&[]' reported"
tags = ["nameres"]
diagnostics = 4

[scenario.collection_nameres_spelling_places]
category = "reject"
description = "The retired slice type refused in a field, an alias, a return type, an argument of a generic type, and a generic function's element type that is never instantiated"
tags = ["nameres"]
diagnostics = 5

# -------- type check stage --------

[scenario.collection_typecheck_contents]
category = "reject"
description = "The list after '<-': a count negative, past 4294967295 or not a usize, a pair with no two-value '<-', 'fill' on what has no 'len()', and an entry form inside a tuple used as a value"
tags = ["typecheck"]
diagnostics = 6

[scenario.collection_typecheck_slice]
category = "reject"
description = "Operations a slice does not support: dereference, unknown members, calls, comparing elements with no '==', ordering"
tags = ["typecheck"]
diagnostics = 6

[scenario.collection_typecheck_range]
category = "reject"
description = "Range indexes refused: unborrowed, on a struct's own index operator, a '&mut' of part of a read-only slice, and through a pointer"
tags = ["typecheck"]
diagnostics = 4

# A range that includes its end must say where it ends: a parse error, so a
# scenario of its own, since analysis halts after the parse stage
[scenario.collection_parse_range]
category = "reject"
description = "A range written with '...' and no end"
tags = ["parse"]
diagnostics = 1

# 'of' and 'fill' outside a list after '<-' are names, so what follows them
# there is a malformed statement
[scenario.collection_parse_contents]
category = "reject"
description = "'n of x' and 'fill x' written outside a list after '<-'"
tags = ["parse"]
diagnostics = 3

[scenario.collection_typecheck_perm]
category = "reject"
description = "Permissions a slice cannot obtain or coerce to, and element types it cannot claim"
tags = ["typecheck"]
diagnostics = 5

[scenario.collection_typecheck_constlit]
category = "reject"
description = "A borrowed array literal: '&mut' of a constant one is refused"
tags = ["typecheck"]
diagnostics = 2

# -------- flow stage --------

[scenario.collection_flow]
category = "reject"
description = "Writes and reads through a slice the permission forbids, and re-pointing an immutable one"
tags = ["flow"]
diagnostics = 4

# The lifetime rule ref_flow asserts for a borrowed reference now also applies
# to a slice, so a slice may no longer outlive the array it points at.
[scenario.collection_flow_escape]
category = "reject"
description = "Storing a slice where it outlives the array it was borrowed from"
tags = ["flow"]

# A borrow a method returns keeps its receiver loaned while it is used, and a
# call's arguments are in flight until it is made. Uses the collections and
# pool packages; a collection reached through a shared path is the next two scenarios'.
[scenario.collection_flow_freeze]
category = "reject"
description = "A list pushed onto, a pool's value removed, or a struct read while a borrow a method returned is still to be used; a list pushed onto, lent by 'viewMut' again or read by 'view', and a String grown, while a 'viewMut' slice is still to be used; an argument touching what an earlier one borrowed; a receiver's reserved borrow meeting a mutable argument borrow, and activated meeting a borrow another argument carries"
tags = ["flow"]
diagnostics = 10

# The same freezing for a container reached through a shared path: a '&mut'
# parameter, a field of 'self'. The same path is frozen here; a change through
# another name for the container is refused by collection_flow_reshape.
[scenario.collection_flow_freeze_shared]
category = "reject"
description = "An element, a cursor, a slice 'viewMut' lends, a String's view or a pool's value borrowed through a '&mut' parameter, a shared 'Rc[mut, T]' owner or a field of 'self', and the same container pushed onto, grown, lent again or read through that path while the borrow is still to be used"
tags = ["flow"]
diagnostics = 10

# Part (b) of the same rule: a change through another name for the container, or
# by a call that might make one. Read from the types and the bodies, not from
# names (collection_reshape_success holds what is accepted beside each refusal).
[scenario.collection_flow_reshape]
category = "reject"
description = "An element, a view or a struct's borrow held while another reference to the same container pushes, clears, pops or truncates it, is handed to a call whose body reshapes it (directly, through what it calls, through a struct holding the reference, or through a global), to a function pointer or a function defined elsewhere, a view held by a result that may hold it while another String grows, and an element or view handed to the very call beside the reference that changes it"
tags = ["flow"]
diagnostics = 17

# A struct that wraps a container is shape-changing too, though it declares
# nothing: the compiler finds it from its methods (a pointer written, a borrow
# lent), so the same freezing applies (collection_freeze_inferred_success holds
# the code beside each refusal that stays accepted; collection_typecheck_shapemark
# the declaration that finds nothing).
[scenario.collection_flow_freeze_inferred]
category = "reject"
description = "An element borrowed through a '&mut' parameter or a field of 'self' from a struct wrapping a List, a struct holding that one, a struct owning a block through a pointer field, one owning it through a member, one handing its pointer to C, and one reshaping through two methods that call each other, and the same value changed through that path while the borrow is still to be used"
tags = ["flow"]
diagnostics = 9

[scenario.collection_typecheck_shapemark]
category = "reject"
description = "A type declaring 'ShapeChanging' that the compiler does not find so from its methods: one that lends a borrow and writes none of its storage, one that writes its storage and lends nothing, and a cursor that lends and writes only its position; one declaring it that both writes and lends is accepted"
tags = ["typecheck"]
diagnostics = 3

[scenario.collection_freeze_inferred_success]
category = "run"
description = "A borrow a method returned, held while the path it was reached through is changed, out of types that lack one of the two things that make a type shape-changing: a cursor that writes only its position, a List wrapper whose writer sets an element, one nothing writes through, a block freed only in 'final', and a borrow of a number; and a wrapper that does change shape, its borrow used up first, and read meanwhile"
tags = ["flow", "genllvm", "runtime"]

[scenario.collection_flow_reshape_owners]
category = "reject"
description = "An element borrowed through a field of 'self', a shared 'Rc[mut, T]' owner, a list allocated in an arena and held by name, or a reference made from a pointer, while another name for the same list pushes"
tags = ["flow"]
diagnostics = 4

[scenario.collection_reshape_success]
category = "run"
description = "A borrow held while another reference writes an element, a callee that only writes elements or only reads, a read-only reference, a list the function owns, a call handed nothing that reaches the list, and the borrow re-taken before it is used; two fields of one struct, an operator on a local String, a view lent in as text, a result whose signature says it is 'static, a view used up before the other String grows; and a String's view appended to another String with the source an '&imm' reference or the receiver an '&uni' one"
tags = ["flow", "genllvm", "runtime"]

[scenario.collection_freeze_shared_success]
category = "run"
description = "A borrow a method returned out of a list, deque or String reached through a '&mut' parameter or a field of 'self': the path read and borrowed read-only again while it is used, pushed onto after its last use, a cursor used up first"
tags = ["flow", "genllvm", "runtime"]

# The body of text, 'str': its methods (written once, in core), a part of it
# taken with a borrowed range, and '==' and the orderings between the kinds of
# text, by byte. A String's reach of the same methods through a lent body is
# struct_use_lend; the package's own tests cover the String itself.
[scenario.collection_str]
category = "run"
description = "The methods of str on a literal, a borrow and an owner (len, bytes, indexing, boundaries, searching, trimming); a part taken with a borrowed range, through a reference, a result and another part; '==' and the orderings across str, So[str] and Rc[str], by byte"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.collection_str_symmetric]
category = "run"
description = "'==', '!=' and the four orderings across '&str', '&String', '&So[str]', '&Rc[str]' and a literal, each kind on the left and on the right of each other (an owner on the left against a '&str' was refused as a reference compared with a value); the answers do not depend on operand order"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.collection_typecheck_str]
category = "reject"
description = "A range of text not borrowed, from a borrow and from an owner; an index that is not an integer; text written through an index"
tags = ["typecheck"]
diagnostics = 4
