# lifetime - the lifetime and borrow scenario corpus. Tier 2, because its cases
# use owners, collections and pools.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
#
# Unlike the other groups, this one is organised by case rather than by
# compiler stage: one small program per point, named for the point, so that a
# rule can be refined case by case: many
# simple cases on the bands (global, the caller's, the function's own), a few
# on borrows made inside relating to those from outside, and most on when a
# borrowed source is free again. The first three prefixes follow that, the
# fourth is lifetimes that are no scope at all, and the fifth is bounds on
# types whose insides are unknown:
#
#   lifetime_band_  global vs the caller band vs the function: parameters
#                   (borrowed, by value, 'self' by value, owners by value),
#                   returns, stores into globals and through '&mut'/'&uni'
#                   parameters, unannotated and named lifetimes, lifetimes on
#                   structs (lifetime_band_struct_), where clauses ordering
#                   them (lifetime_band_where_), the order a borrow of a
#                   value holding lifetimes implies (lifetime_band_implied_),
#                   calls.
#   lifetime_mix_   borrows made inside meeting those from outside: a
#                   variable's lifetime following what it holds (the flow
#                   rule, 2 Oct 2026), temporaries outliving their statement
#                   (Rust's rule, adopted 2 Oct 2026), structs holding one or
#                   two borrows.
#   lifetime_free_  when the source is free again: last use, one arm and not
#                   the others, loops, reborrows, two-phase receivers,
#                   disjoint fields, reassignment, borrows held in values,
#                   NLL's four problem cases and Polonius's exemplars
#                   translated to Cone.
#   lifetime_inv_   invariant lifetimes ('=a, 3 Oct 2026) on the dynamic
#                   arena, DynArena: brands minted per call site, keys opened
#                   only by their own arena ('ar[key]'), never reached through
#                   alone, kept to their loop pass, equated by 'where', and
#                   carried through structs, returns and generics.
#   lifetime_bound_ lifetime bounds ('+ 'a', 3 Oct 2026): on a generic
#                   function's type parameter, '[T + 'a]', 'where T + 'a',
#                   relied on inside and met by each instantiation's argument;
#                   'T + 'static'; on a borrowed virtual reference,
#                   '&<Trait + 'a'; the ''static' an owning virtual
#                   reference, 'So[Trait]', implies; and an unbounded type
#                   parameter's inferred argument, which carries no band.
#
# Every file's header gives the verdict a correct compiler reaches, its basis
# (a language rule, stated, with the date it was settled; a manual page;
# Rust's behaviour and where that comes from -- Rust was read, never run --
# or a reading of those rules where none settles the case outright), and
# what master did when the file was written. Rust's '&mut' is Cone's '&uni';
# Cone's '&mut' is shared and freezes a source reached through it only
# against ending, so Rust examples are translated through that.
#
# Where master is wrong the expectation is still the correct one, marked
# xfail, and the header names the stage that fixes it. The stages are those
# of the lifetimes plan, each of which removes the xfail marks it earns:
#
#   1  five measured fixes: by-value parameters, a parameter's borrow stored,
#      returned 'if'/'match'/block, owner returned as a borrow, reborrow
#      through a local
#   2  the call-site store check widened from '&mut &T' to any '&mut' whose
#      target holds a borrow
#   3  a borrow inside a value (struct, Option, List) freezes its source
#   4  a value's lifetime from its loans: escapes through values and through
#      a variable that follows what it holds
#   5  temporaries outliving their statement, Rust's rule
#   6  named lifetimes on signatures
#   7  lifetimes on structs, and where clauses ordering lifetimes
#   8  relaxations toward Rust's verdicts: implied bounds, temporaries in
#      arms and arguments, lifetimes per reference layer, implementations
#      promising more than their trait, stores through '&mut' into a local
#      following flow
#   9  invariant lifetimes and the dynamic arena (lifetime_inv_)
#  10  lifetime bounds (lifetime_bound_)
#
# A dangling case's header says how master's wrong answer was shown to be
# dangerous: a stale stack slot read back through clobber(), or a finalizer
# printing "final" before the read. Where master refuses the spelling at
# parse, the case was run against the compiler that refuses it with that
# refusal turned off.
#
# Left out deliberately, because the rule depends on something not yet
# decided: a bound on a generic type's parameter or an owning virtual
# reference, owner fields reached through a shared 'mut' path, and whether 'new H(...)'
# extends a temporary the way Rust's struct literal does.

support = []

