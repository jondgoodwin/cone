description = "A ''static' field takes only a global's borrow wherever it is changed: a store of a local's or a caller's borrow into one, in a local, through a local '&mut', or by a swap, is refused at the store"
tags = ["flow"]

[scenario.lifetime_band_static_field_nested]
category = "reject"
description = "A struct holding only ''static' borrows, nested in an Option, an enum's variant or another struct, is refused where a local's borrow goes in; so is a variant's own ''static' field"
tags = ["flow", "generic"]

[scenario.lifetime_band_static_field_global]
category = "run"
description = "A ''static' field given a global's borrow, a literal string, or a borrow already ''static' (another value's field, through a borrowed parameter) is accepted, built, stored and nested"
tags = ["flow", "generic", "runtime"]

[scenario.lifetime_band_static_holder_global_loan]
category = "reject"
description = "A value holding only ''static' borrows, handed back by an unannotated function, still carries a global's loan its argument carried: the global may not be changed while it is used"
tags = ["flow"]

[scenario.lifetime_band_named_two_params_one_name]
category = "reject"
description = "One name on two parameters: the result lives as long as the shorter argument given it"
tags = ["flow"]

[scenario.lifetime_band_named_call_mismatch]
category = "reject"
description = "Inside a function naming lifetimes, a call mixing two names may not be returned or stored as one"
tags = ["flow"]

[scenario.lifetime_band_named_beside_label]
category = "run"
