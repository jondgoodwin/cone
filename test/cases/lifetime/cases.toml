[scenario.lifetime_inv_cross_arena]
category = "reject"
description = "One arena's key handed to another arena's '[]' is refused"
tags = ["typecheck"]

[scenario.lifetime_inv_key_no_access]
category = "reject"
description = "A key is neither dereferenced nor reached through for a field or a method"
tags = ["typecheck"]

[scenario.lifetime_inv_loop_pass]
category = "reject"
description = "A key of an arena made in a loop pass is kept for no later pass and carried out by no break"
tags = ["typecheck"]

[scenario.lifetime_inv_loop_pass_own]
category = "run"
description = "An arena per loop pass used within it, and named arenas made before the loop, are accepted"
tags = ["typecheck", "runtime"]

[scenario.lifetime_inv_index]
category = "run"
description = "'ar[key]' reads, and in set position writes: a value, a field, '+=', a 'self &mut' method"
tags = ["typecheck", "runtime"]

[scenario.lifetime_inv_index_plain_pointer]
category = "run"
description = "'ar[key]' is the key's pointer: no check at run time, and nothing left of '[]' once inlined"
tags = ["genllvm", "runtime"]

[[scenario.lifetime_inv_index_plain_pointer.check]]
name     = "index-answers-the-key"
target   = "preir"
contains = ["define internal ptr @_CINvNtC5arena8DynArenaoixxE(ptr %0, ptr %1) comdat {", "ret ptr %key1"]

[[scenario.lifetime_inv_index_plain_pointer.check]]
name     = "inlined-to-a-load"
target   = "llvmir"
excludes = ["call ptr @_CINvNtC5arena8DynArenaoixxE", "call ptr @_CINvNtC5arena8DynArenaorxxE"]

[scenario.lifetime_inv_returned_with_arena]
category = "run"
description = "A struct holding a dynamic arena and keys into it is built, returned and walked"
tags = ["typecheck", "runtime"]

[scenario.lifetime_inv_recursion]
category = "run"
description = "Each activation mints its own brand; a key passed down with its arena opens it at every depth"
tags = ["typecheck", "runtime"]

[scenario.lifetime_inv_where_equal]
category = "run"
description = "'where '=a == '=b' lets a key of one open an arena of the other"
tags = ["parse", "typecheck", "runtime"]

[scenario.lifetime_inv_where_call_mismatch]
category = "reject"
description = "A call given two brands for an '==' pair, and a callee using unrelated brands together, are refused"
tags = ["typecheck"]

[scenario.lifetime_inv_parse_refused]
category = "reject"
description = "'>=' with an invariant lifetime, '==' with an ordinary one, and one on a slice or virtual reference are refused"
tags = ["parse"]

[scenario.lifetime_inv_signature_refused]
category = "reject"
description = "A struct's invariant lifetime left unnamed or named ordinary in a signature, and a body naming one its signature does not, are refused"
tags = ["typecheck"]

[scenario.lifetime_inv_arena_replaced]
category = "reject"
description = "An arena variable assigned, swapped or stored another arena is refused"
tags = ["typecheck"]

[scenario.lifetime_inv_branch_merge]
category = "reject"
description = "An 'if' joining keys of two arenas is refused"
tags = ["typecheck"]

[scenario.lifetime_inv_key_holds_borrow]
category = "reject"
description = "A key to a value holding a borrow is refused, in a type and at an allocation"
tags = ["typecheck"]

[scenario.lifetime_inv_brand_lost]
category = "reject"
description = "A key stored or passed as a borrow, or cast to one, is refused; cast to a raw pointer it is not"
tags = ["typecheck"]

[scenario.lifetime_inv_keys_in_list]
category = "run"
description = "Keys kept in a List built in a function naming the brand, read back through the arena"
tags = ["typecheck", "runtime"]

[scenario.lifetime_inv_keys_in_list_cross]
category = "reject"
description = "Another arena's key pushed onto a list of one arena's keys is refused"
tags = ["typecheck"]

[scenario.lifetime_inv_result_two_brands]
category = "reject"
description = "A result naming one minted brand built of two arenas' values is refused"
tags = ["typecheck"]

# -------- lifetime bounds: '+ 'a' on a type parameter and a virtual reference --------

[scenario.lifetime_bound_generic_relied_on]
category = "run"
description = "A generic function's type parameter bounded by ''a', in each spelling, stored and returned as ''a', instantiated with long enough borrows and a borrow-free type"
tags = ["flow", "runtime"]

[scenario.lifetime_bound_generic_unbounded_refused]
category = "reject"
description = "The same generic bodies without the bound may not store or return a T as ''a'"
tags = ["flow"]

[scenario.lifetime_bound_generic_too_short]
category = "reject"
description = "A bounded generic handed a borrow too short for where it is stored or returned is refused where it is used"
tags = ["flow"]

[scenario.lifetime_bound_generic_caller_unordered]
category = "reject"
description = "A caller's borrow of a lifetime its order does not say lasts the bound's is refused at the call and the return"
tags = ["flow"]

[scenario.lifetime_bound_static_accepted]
category = "run"
description = "A type parameter bounded by ''static' stored in a global and returned as ''static', handed global borrows and a borrow-free type"
tags = ["flow", "runtime"]

[scenario.lifetime_bound_static_fat_forwarded]
category = "run"
description = "A global's thin borrow, slice and '&str' handed to a ''static'-bounded generic that forwards it to a second one"
tags = ["flow", "runtime"]

[scenario.lifetime_bound_static_fat_refused]
category = "reject"
description = "A ''static'-bounded generic forwarding to a second one still refuses a slice of a local, and a slice the caller lent"
tags = ["typecheck"]

[scenario.lifetime_bound_static_fat_str_refused]
category = "reject"
description = "A ''static'-bounded generic forwarding to a second one still refuses a '&str' made from a local's bytes, written as the argument or held in a variable"
tags = ["flow"]

[scenario.lifetime_bound_static_local_borrow]
category = "reject"
description = "A type parameter bounded by ''static' refuses a local's borrow written as its argument"
tags = ["typecheck"]

[scenario.lifetime_bound_static_local_in_value]
category = "reject"
description = "A type parameter bounded by ''static' refuses a local's borrow carried inside a value or by a variable"
tags = ["flow"]

[scenario.lifetime_bound_virt_accepted]
category = "run"
description = "A virtual reference bounded by ''a' holding a struct with a borrow, stored, returned and read back out where its lifetime lasts ''a'"
tags = ["flow", "runtime"]

[scenario.lifetime_bound_virt_refused]
category = "reject"
description = "A value coerced to, or stored as, a virtual reference bounded by a lifetime its borrows are not known to last is refused"
tags = ["flow"]

[scenario.lifetime_bound_owning_virt_refused]
category = "reject"
description = "A value holding a borrow that is not global made an owning virtual reference ('So[Trait]', 'Rc[Trait]'), which is bounded by ''static', is refused"
tags = ["flow"]

[scenario.lifetime_bound_owning_virt_accepted]
category = "run"
description = "Values holding no borrow, or only global ones, made owning virtual references, directly, through a ''static' parameter and through a ''static'-bounded type parameter"
tags = ["flow", "runtime"]

[scenario.lifetime_bound_generic_inferred_no_band]
category = "run"
description = "An unbounded type parameter inferred from a borrow carries no band of its call into the instance: a T kept in a local and an 'Option' is stored through the caller's '&mut &R'"
tags = ["flow", "runtime"]

[scenario.lifetime_bound_generic_inferred_still_refused]
category = "reject"
description = "An unbounded type parameter inferred from a borrow: a local's borrow stored through it or returned as it, a caller's stored in a global, and a call carrying a local's borrow into an outer variable, still refused"
tags = ["flow"]

[scenario.lifetime_bound_parse_refused]
category = "reject"
description = "A bound under 'or', 'T is 'a', an invariant bound, a bound on a plain reference or a generic type's parameter is refused at parse"
tags = ["parse"]

[scenario.lifetime_bound_nameres_refused]
category = "reject"
description = "A bound on a name that is no type parameter of the function, or on its generic type's parameter, is refused"
tags = ["nameres"]

[scenario.lifetime_bound_undeclared]
category = "reject"
description = "A bound of a lifetime the signature does not name is refused"
tags = ["typecheck"]
