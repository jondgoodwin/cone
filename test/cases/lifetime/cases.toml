tags = ["flow"]

[scenario.lifetime_band_static_field_given_local]
category = "reject"
description = "A ''static' field takes only a global's borrow wherever it is built: a local's borrow given to one is refused at the construction, though the value goes only to a by-value parameter that stores it in a global, or to a thread"
tags = ["flow"]

[scenario.lifetime_band_static_field_stored_local]
