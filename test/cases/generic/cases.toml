# generic - generics and macros. Tier 2.
#
# Key reference: design/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# Both subjects are the compiler cloning source at type-check time, which is why
# they share a group and a source directory in the compiler (ir/meta/). They are
# still split into two success programs, because what each establishes is
# different in kind: a generic reaches code generation as one function or type
# per set of type arguments and can be asserted against the LLVM IR, while a
# macro is expanded into its surroundings and leaves nothing behind to assert
# against but what the program prints.
#
# The reject scenarios are split by pipeline stage, because analysis halts
# between stages and a later stage's expectation would never be reached. The
# type-check stage is split again by mechanism: generic-typecheck-infer covers
# type arguments that are absent and cannot be derived, generic-typecheck-args
# covers type arguments that are written out and do not match the declaration,
# and generic-typecheck-macro covers what expansion itself cannot serve -- an
# argument list that does not match, and a body that would expand forever.
#
# One gap is recorded as an xfail scenario rather than left out, because it fails
# cleanly with a real diagnostic and blocks a whole shape of generic code: a
# reference to a generic instantiation.

support = []

# -------- success --------

[scenario.generic-success]
category = "run"
description = "Generic functions and generic types, instantiated by inference and by explicit type argument, including operators inside an instance's methods"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# One 'define' per distinct set of type arguments, under a name carrying them,
# and never one for the generic itself. This is the only place instantiation is
# visible: which instance ran is not something the program can print.
# An instance is the one symbol several object files may each define, so it is
# the one that asks the linker to keep a single copy -- 'comdat any', matching
# the linkonce linkage. An ordinary function in the same file asks the opposite,
# so that a genuine duplicate definition stays a link error.
[[scenario.generic-success.check]]
name = "only-instances-ask-the-linker-to-merge"
target = "llvmir"
contains = [
  '$"max:i64:i64" = comdat any',
  'define linkonce i64 @"max:i64:i64"(i64 %0, i64 %1) comdat {',
  "$inferredTypeArgument = comdat nodeduplicate",
]

[[scenario.generic-success.check]]
name = "one-instance-per-type-argument"
target = "llvmir"
contains = [
  '@"max:i64:i64"',
  '@"max:f64:f64"',
  '@"pickSecond:i64:f64"',
  '@"pickSecond:f64:i64"',
  '@"firstOf:Point:Point"',
  '@"boxUp:i64"',
]

# A type argument that is not a named type still names its instance. Each of
# these four used to mangle to nothing, so 'passThrough:' was the name of all
# five instances and LLVM appended '.1' onto four of them.
[[scenario.generic-success.check]]
name = "unnamed-type-arguments-mangle"
target = "llvmir"
contains = [
  '@"passThrough:(i64,i64)"',
  '@"passThrough:(i64,i64,i64)"',
  '@"passThrough:[2;i64]"',
  '@"passThrough:&f(i64)i64"',
  '@"passThrough:v"',
]
excludes = ['@"passThrough:"']

[[scenario.generic-success.check]]
name = "no-symbol-for-the-generic-itself"
target = "llvmir"
excludes = ["@max(", "@pickSecond(", "@firstOf(", "@boxUp("]

# A generic with no instances contributes nothing at all, rather than crashing
# code generation on the instance list it never grew
[[scenario.generic-success.check]]
name = "no-symbol-for-an-uninstantiated-generic"
target = "llvmir"
excludes = ["neverCalled"]

# Two instances of one generic *type* each get a copy of every method, and the
# copies share the generic's 'genname'. A generic function's instances are told
# apart by the parameter types the mangler walks, but a generic type's method may
# name no type parameter anywhere in its signature -- 'fn tally(self) i64', and
# 'fn litSum(self &) i64' most of all, whose body is two literals -- so the
# instance's type arguments are the only thing that distinguishes them.
#
# The '&ro' in litSum's name is also load-bearing, for a second reason. The
# mangler chose that character with a ternary whose middle test was a bare
# 'ArrayRefTag' -- a nonzero constant, so always true -- and '&' was
# unreachable: a plain reference was named exactly as a slice would be. These
# strings are what pins the two apart now.
#
# Both methods below are named for both instances, and the un-suffixed symbol they
# used to share is excluded. The '.' excludes are the load-bearing half: within one
# translation unit LLVM hides a symbol collision by appending '.1', so a check that
# only looked for two definitions would have passed all along. Neither symbol may
# depend on that.
[[scenario.generic-success.check]]
name = "instance-methods-carry-their-type-arguments"
target = "llvmir"
contains = [
  '@"Holder_tally:Holder:i64"',
  '@"Holder_tally:Holder:f64"',
  '@"Holder_litSum:&ro Holder:i64"',
  '@"Holder_litSum:&ro Holder:f64"',
]
excludes = [
  '@"Holder_tally:Holder"',
  '@"Holder_litSum:&ro Holder"',
  '@"Holder_tally:Holder:i64.',
  '@"Holder_tally:Holder:f64.',
  '@"Holder_litSum:&ro Holder:i64.',
  '@"Holder_litSum:&ro Holder:f64.',
]

[scenario.generic-macro]
category = "run"
description = "Macro expansion: substitution rather than evaluation, what a macro parameter may be, and every value position a parameterless name expands in"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# -------- parse stage --------

[scenario.generic-parse]
category = "reject"
description = "Type parameter lists that do not close or declare nothing, and a macro with no name"
tags = ["parse"]
diagnostics = 6

# -------- type check stage --------

[scenario.generic-typecheck-infer]
category = "reject"
description = "Generic uses whose type arguments cannot be inferred"
tags = ["typecheck"]
diagnostics = 4

[scenario.generic-typecheck-args]
category = "reject"
description = "Type argument lists written out that do not match the generic's parameters"
tags = ["typecheck"]
diagnostics = 5

[scenario.generic-typecheck-macro]
category = "reject"
description = "Macro argument counts that do not match the declaration, and expansion that would never terminate"
tags = ["typecheck"]
diagnostics = 7
