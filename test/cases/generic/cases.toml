# generic - generics and macros. Tier 2.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# Both subjects are the compiler cloning source at type-check time, which is why
# they share a group and a source directory in the compiler (ir/meta/). They are
# still split into two success programs, because what each establishes is
# different in kind: a generic reaches code generation as one function or type
# per set of type arguments and can be asserted against the LLVM IR, while a
# macro is expanded into its surroundings and leaves nothing behind to assert
# against but what the program prints.
#
# The reject scenarios are split by pipeline stage, because analysis halts
# between stages and a later stage's expectation would never be reached. The
# name-resolution stage has one scenario, the bare member name a macro method's
# body may not use. The type-check stage is split again by mechanism:
# generic_typecheck_infer covers type arguments that are absent and cannot be
# derived, generic_typecheck_args covers type arguments that are written out
# and do not match the declaration or are given to a method that is not
# generic (and a generic type that writes none where
# one is required: a member path through it, or a type position, outside its
# own braces or inside another generic's), and generic_typecheck_macro covers what
# expansion itself cannot serve -- an argument list that does not match, a body
# that would expand forever, and a macro method with nothing to stand in for
# its self.

support = []

# -------- success --------

[scenario.generic_success]
category = "run"
description = "Generic functions and generic types, instantiated by inference and by explicit type argument, including operators inside an instance's methods"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# One 'define' per distinct set of type arguments, read as the generic's name
# with those arguments, and never one for the generic itself. This is the only
# place instantiation is visible: which instance ran is not something the
# program can print.
# In a program compile an instance is a definition like any other -- internal,
# with a 'nodeduplicate' COMDAT -- because this object is the only one that
# references it. Asking the linker to merge is a package compile's case, where
# every object that uses the generic produces the instance; that compile does
# not exist yet, so nothing here asks.
[[scenario.generic_success.check]]
name = "instances-are-definitions-like-any-other"
target = "symbols"
contains = [
  "define internal max[i64] comdat nodeduplicate",
  "define internal inferredTypeArgument comdat nodeduplicate",
]
excludes = ["linkonce", "comdat any"]

[[scenario.generic_success.check]]
name = "one-instance-per-type-argument"
target = "symbols"
contains = [
  "define internal max[i64] comdat nodeduplicate",
  "define internal max[f64] comdat nodeduplicate",
  "define internal pickSecond[i64,f64] comdat nodeduplicate",
  "define internal pickSecond[f64,i64] comdat nodeduplicate",
  "define internal firstOf[Point] comdat nodeduplicate",
  "define internal boxUp[i64] comdat nodeduplicate",
]

# A type argument that is not a named type still names its instance: a tuple,
# an array, a reference to a function signature and void each spell their own
# instance. Were any of them spelled as nothing, the instances would share a
# name and LLVM would tell them apart with its '.1' uniquifier, which the last
# exclude forbids.
[[scenario.generic_success.check]]
name = "unnamed-type-arguments-mangle"
target = "symbols"
contains = [
  "define internal passThrough[(i64,i64)] comdat nodeduplicate",
  "define internal passThrough[(i64,i64,i64)] comdat nodeduplicate",
  "define internal passThrough[Array[i64, 2]] comdat nodeduplicate",
  "define internal passThrough[&opaq fn(i64) i64] comdat nodeduplicate",
  "define internal passThrough[void] comdat nodeduplicate",
]
excludes = ["passThrough[]", "].1 "]

# The generic's own name is never a symbol: an instance reads as the name with
# its arguments, so the bare name followed by a space is what would show one.
[[scenario.generic_success.check]]
name = "no-symbol-for-the-generic-itself"
target = "symbols"
excludes = ["max ", "pickSecond ", "firstOf ", "boxUp "]

# A generic with no instances contributes nothing at all, rather than crashing
# code generation on the instance list it never grew
[[scenario.generic_success.check]]
name = "no-symbol-for-an-uninstantiated-generic"
target = "symbols"
excludes = ["neverCalled"]

# Two instances of one generic *type* each get a copy of every method, and each
# copy is owned by its instance, so its symbol reads as the instance -- the
# generic with its type arguments -- then the method. A generic type's method
# may name no type parameter anywhere in its signature -- 'fn tally(self) i64',
# and 'fn litSum(self &) i64' most of all, whose body is two literals -- so the
# owner's type arguments are the only thing that distinguishes the copies.
#
# Both methods below are named for both instances, and the un-suffixed symbol
# an uninstantiated owner would give is excluded. The '.1' excludes are the
# load-bearing half: within one translation unit LLVM hides a symbol collision
# by appending '.1', so a check that only looked for two definitions would have
# passed all along. Neither symbol may depend on that.
[[scenario.generic_success.check]]
name = "instance-methods-carry-their-type-arguments"
target = "symbols"
contains = [
  "define internal Holder[i64].tally comdat nodeduplicate",
  "define internal Holder[f64].tally comdat nodeduplicate",
  "define internal Holder[i64].litSum comdat nodeduplicate",
  "define internal Holder[f64].litSum comdat nodeduplicate",
]
excludes = [
  " Holder.tally ",
  " Holder.litSum ",
  ".tally.1 ",
  ".litSum.1 ",
]

# Inside a generic type's braces its bare name is the instance being defined,
# reached as the clone is made rather than by instantiating anything: Nest's
# methods name it bare, and each instance still has exactly one copy of each
# method. A bare name that started a second Nest[i64] would give its methods a
# second definition, which LLVM hides with its '.1' uniquifier.
[[scenario.generic_success.check]]
name = "own-name-bare-is-this-instance"
target = "symbols"
contains = [
  "define internal Nest[i64].deeper comdat nodeduplicate",
  "define internal Nest[f64].deeper comdat nodeduplicate",
  "define internal Nest[i32].deeper comdat nodeduplicate",
]
excludes = [" Nest.deeper ", ".deeper.1 ", ".seed.1 "]

# A generic type's method instance is linked like a generic function's
# instance: internal, a definition of this object. Both instances of Holder
# clone every method, so 'clear' is cloned for f64 too although nothing calls
# it; a symbols check reads the pre-optimization dump, where that unreferenced
# clone is still defined, which is what lets it assert the linkage of a
# definition the optimizer removes as dead before it reaches the object file.
[[scenario.generic_success.check]]
name = "generic-type-method-instances-are-defined-even-uncalled"
target = "symbols"
contains = [
  "define internal Holder[i64].tally comdat nodeduplicate",
  "define internal Holder[i64].clear comdat nodeduplicate",
  "define internal Holder[f64].clear comdat nodeduplicate",
]

[scenario.generic_infer_through]
category = "run"
description = "Type arguments inferred through a pointer, reference, owning reference or slice parameter, a generic type's instance, a function reference's signature, and a variant passed for its enum, including the intrinsics a collection calls"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.generic_infer_value_type]
category = "run"
description = "A type argument inferred from a variable whose value is a block's or an 'if''s, which types as the struct's declaration itself: a plain struct's and a generic type's instance, each with a method whose body holds a blockret, named by the instance and not cloned into it"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.generic_infer_string_literal]
category = "run"
description = "A type argument inferred from a string literal, an array of u8 where no type is wanted: Some given one directly, nested and through a local, a program's own generic enum and a generic function given one, and an array literal beside them"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.generic_method]
category = "run"
description = "Generic methods of a plain type and of a generic type's instance, called on a receiver with type arguments inferred and written, through the type with the receiver passed, and bare inside the type's braces"
tags = ["typecheck", "genllvm", "runtime"]

# One instance per set of type arguments, however the method was named: a call
# on the receiver, through the type, and bare inside its braces all reach
# Holder.pick[i64]. A generic type's instance has its own copy of the generic
# method, so its instances read as that instance's. None is the generic's own,
# and none is told apart from another by LLVM's '.1' uniquifier.
[[scenario.generic_method.check]]
name = "one-instance-per-type-argument"
target = "symbols"
contains = [
  "define internal Holder.pick[i64] comdat nodeduplicate",
  "define internal Holder.pick[i32] comdat nodeduplicate",
  "define internal Holder.zero[i64] comdat nodeduplicate",
  "define internal Box[i64].pair[i64] comdat nodeduplicate",
  "define internal Box[f32].pair[i64] comdat nodeduplicate",
]
excludes = [" Holder.pick ", " Box[i64].pair ", "].1 "]

[scenario.generic_macro]
category = "run"
description = "Macro expansion: substitution rather than evaluation, what a macro parameter may be, every value position a parameterless name expands in, and macros declared in a type as its methods"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

[scenario.generic_instance_path]
category = "run"
description = "A path through an instance of a generic type to its functions: a static function, a method handed its self, an overload, a private function inside its module, a generic enum's static function, and a function reference"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.generic_fn_reference]
category = "run"
description = "A reference to a generic function's or generic method's instance, taken with type arguments and called for two of them, beside borrows of an array element that stay indexes"
tags = ["typecheck", "genllvm", "runtime"]

# One instance per type argument the references name, each a definition, and
# none the generic's own
[[scenario.generic_fn_reference.check]]
name = "each-reference-reaches-its-instance"
target = "symbols"
contains = [
  "define internal half[i64] comdat nodeduplicate",
  "define internal half[f64] comdat nodeduplicate",
  "define internal nOf[Fin] comdat nodeduplicate",
  "define internal nOf[Gin] comdat nodeduplicate",
  "define internal Holder.scale[i64] comdat nodeduplicate",
  "define internal Holder.scale[f64] comdat nodeduplicate",
]
excludes = [" half ", " nOf ", " Holder.scale ", "].1 "]

[scenario.generic_signature_first]
category = "run"
description = "An Option first instantiated by a generic instance's method signature, matched through a call to it from another type's method and from a free function, with the variant bare and written out"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.generic_tuple_return]
category = "run"
description = "A generic function, an inline one and a generic type's method each returning a tuple of values, whose templates hold value tuples no phase types"
tags = ["typecheck", "genllvm", "runtime"]

[scenario.generic_constraint]
category = "run"
description = "Constraints: the inline and 'where' forms alike, '+' and 'and', a requirement met by grant, declaration or structure, a method existing only where its clause holds, and an instance's structural conformance to what it has"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# A method whose clause an instance does not meet is absent from it: nothing of
# it is generated there, while the instance's other methods, and the method in
# an instance meeting the clause, are
[[scenario.generic_constraint.check]]
name = "an-absent-method-is-not-generated"
target = "symbols"
contains = [
  "define internal Cell[i32].add comdat nodeduplicate",
  "define internal Cell[bool].load comdat nodeduplicate",
  "define internal Box[i32].sum comdat nodeduplicate",
]
excludes = ["Cell[bool].add", "Box[Box[i32]].sum", "Maybe.Yes[f32].dbl"]

[scenario.generic_size_markers]
category = "run"
description = "The built-in markers Sized (the size is known at compile time) and DynSized (known at compile time or carried by a reference to the type) asked as constraints, both spellings: met by every type with a size, DynSized also by an open trait and the body of bytes; and the sizes of a thin reference and a fat one"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

[scenario.generic_trait_bound]
category = "run"
description = "A generic trait's instance as a constraint, 'S Stack[T]' inline and 'S is Stack[T]' in a 'where' clause: fitted structurally by two different structs, a concrete argument, two bounds on one parameter, a method returning Option[T], bounded generics calling each other, a type parameter inferred from the bound, and a bound on a generic type's own parameter"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# One instance per set of arguments, the bound's type parameter among them
[[scenario.generic_trait_bound.check]]
name = "the-bounded-generic-is-instantiated-at-its-arguments"
target = "symbols"
contains = [
  "define internal drain[i64,IntSlot] comdat nodeduplicate",
  "define internal drain[f64,Slot[f64]] comdat nodeduplicate",
  "define internal fillTwo[IntSlot] comdat nodeduplicate",
  "define internal Holder[i64,IntSlot].take comdat nodeduplicate",
]

[scenario.generic_fn_bound]
category = "run"
description = "A function signature as a generic bound, 'F fn(a &T, b &T) i32' inline, 'F fn(i32) i32' with an unnamed parameter, and 'where F is fn(x i32) i32' on a function and on a member of a generic type: one sort given a plain function and a struct with a pub '()', a '&mut F' whose '()' changes the struct and keeps a count, F by value (a '()' taking 'self', and a 'mut' one taking 'self &mut'), the signature before and after another bound, on a generic type's own parameter, a type parameter only the signature names read off the function or the '()', no parameters and nothing returned joined with '+ Sendable'"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# One instance per set of arguments: the plain function's type is the argument
# for F beside the struct's
[[scenario.generic_fn_bound.check]]
name = "the-function-and-the-struct-are-two-instances"
target = "symbols"
contains = [
  "define internal sortBy[i32,fn(&ro i32,&ro i32) i32] comdat nodeduplicate",
  "define internal sortBy[i32,Descending] comdat nodeduplicate",
  "define internal twice[fn(i32) i32] comdat nodeduplicate",
  "define internal twice[Adder] comdat nodeduplicate",
  "define internal once[&opaq fn(i32) i32] comdat nodeduplicate",
  "define internal tick3[Ticker] comdat nodeduplicate",
]

[scenario.generic_infer_literal]
category = "run"
description = "An unsuffixed integer literal passed for a bare type parameter takes the type another argument or a bound gives, and only a literal left alone defaults to i32: a stack of i64, u8 and f64 filled with 8, 200 and 3, in a function, with a 'where' clause and in a method, and a literal beside an i64 in either order"
tags = ["typecheck", "genllvm", "runtime"]

# T is read off the stack's methods, not defaulted from the literal
[[scenario.generic_infer_literal.check]]
name = "the-bound-decides-the-type-before-the-literal"
target = "symbols"
contains = [
  "define internal fill[i64,Slot] comdat nodeduplicate",
  "define internal fill[u8,Byte] comdat nodeduplicate",
  "define internal fill[f64,Real] comdat nodeduplicate",
  "define internal first[i64] comdat nodeduplicate",
  "define internal first[i32] comdat nodeduplicate",
]
excludes = ["fill[i32,"]

[scenario.generic_typecheck_infer_literal]
category = "reject"
description = "A literal left to the type another argument or a bound gives, held to it: out of its range, and for a type that is no number"
tags = ["typecheck"]
diagnostics = 3

[scenario.generic_trait_bound_order]
category = "run"
description = "A bound naming a type parameter declared after it, '[S Stack[T], T]': on a function, between other parameters, with two bounds, on a generic method and on a generic type, the type argument written or inferred from the bound"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

[[scenario.generic_trait_bound_order.check]]
name = "the-instance-is-the-one-the-other-order-makes"
target = "symbols"
contains = [
  "define internal drain[Slot,i64] comdat nodeduplicate",
  "define internal Holder[Slot,i64].take comdat nodeduplicate",
  "define internal middle[Slot,i64,Slot] comdat nodeduplicate",
]

[scenario.generic_nameres_trait_bound_order]
category = "reject"
description = "A bound naming a name that is no parameter of the declaration, on a function and on a generic type, still unknown even with parameters declared after it"
tags = ["nameres"]
diagnostics = 2

[scenario.generic_constraint_or]
category = "run"
description = "Constraints joined by 'or': 'and' binding tighter, parentheses grouping, '+' inside an alternative, a clause naming a type, requirements met, methods existing only where an 'or' holds, and the built-in marker Pointer granted to a raw pointer"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# A method whose 'or' an instance does not meet is absent from it, and one
# whose 'or' it meets is generated there
[[scenario.generic_constraint_or.check]]
name = "a-method-absent-under-or-is-not-generated"
target = "symbols"
contains = [
  "define internal Cell[i32].twice comdat nodeduplicate",
  "define internal Cell[i32].flip comdat nodeduplicate",
  "define internal Cell[bool].flip comdat nodeduplicate",
  "define internal Cell[*i32].get comdat nodeduplicate",
]
excludes = ["Cell[bool].twice", "Cell[*i32].flip", "Cell[*i32].twice"]

[scenario.generic_conditional_is]
category = "run"
description = "A condition on one entry of a generic type's 'is' list, decided per instance, for traits other than Move: a marker passed on by a wrapper, nested; a trait with methods paired with methods under the same condition, its default taken in only where the entry holds; Sendable on the type's word where its argument is; and generic functions taking the conditional type, requiring Move and Copy of the instance they are given"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# The trait's default method is taken in by the instance having the entry, and
# generated there; the instance lacking it has neither the default nor the
# conditional method
[[scenario.generic_conditional_is.check]]
name = "an-entry-not-met-takes-nothing-in"
target = "symbols"
contains = [
  "define internal Labelled[Shown].twice comdat nodeduplicate",
  "define internal Labelled[Shown].show comdat nodeduplicate",
]
excludes = ["Labelled[Plain].twice", "Labelled[Plain].show"]
# -------- parse stage --------

[scenario.generic_parse]
category = "reject"
description = "Type parameter lists that do not close or declare nothing, a macro parameter given an annotation, a macro with no name, and a macro whose name a field or method of its type already has"
tags = ["parse"]
diagnostics = 12
[scenario.generic_parse_where]
category = "reject"
description = "'where' clauses joined by 'or' and grouped, which parse; clauses of a form not built -- 'not' before a clause or its trait, a relation between parameters, a constraint on a type expression, no trait, an 'or' with nothing after it, an unclosed parenthesis -- 'or' in the inline form, and a clause on a type with no type parameters"
tags = ["parse"]
diagnostics = 9
[scenario.generic_parse_conditional_is]
category = "reject"
description = "Conditions on an 'is' entry grouped, joined and followed by another entry and a trailing 'where', which parse; conditions of a form not built -- 'not', a relation between parameters, no trait, an 'or' with nothing after it, an unclosed parenthesis -- and a lifetime comparison, which decides nothing for an instance"
tags = ["parse"]
diagnostics = 6
[scenario.generic_parse_fn_bound]
category = "reject"
description = "A function signature as the bound of a macro's parameter, whose own commas do not end the parameter: refused with the other macro and module parameters' annotations"
tags = ["parse"]
diagnostics = 1

# -------- name resolution stage --------

[scenario.generic_nameres_macro]
category = "reject"
description = "A macro method's body naming a member of its type without self"
tags = ["nameres"]
diagnostics = 4
[scenario.generic_nameres_where]
category = "reject"
description = "Constraints whose subject is not a type parameter or whose name is neither a trait nor a type (a function, a generic type without arguments), a parameter annotated with a type, and a 'where' on a function with no type parameters in scope"
tags = ["nameres"]
diagnostics = 7
[scenario.generic_nameres_trait_bound]
category = "reject"
description = "A generic trait as a constraint without type arguments, inline and in a 'where' clause, with too few and too many, and as an instance in a condition on an 'is' entry"
tags = ["nameres"]
diagnostics = 5
[scenario.generic_nameres_fn_bound]
category = "reject"
description = "A function signature as a bound naming a type that does not exist, inline and in a 'where' clause, and as the condition on a type's 'is' entry, which is not built"
tags = ["nameres"]
diagnostics = 3
[scenario.generic_typecheck_fn_bound]
category = "reject"
description = "A type not meeting a function signature bound: functions of another parameter type, return type and arity, a struct with no '()', with one that is not pub, with one taking fewer parameters and with one returning another type, each message naming the signature as written and as it comes to at the arguments; and the signature joined to Sendable, each asked"
tags = ["typecheck"]
diagnostics = 9
[scenario.generic_typecheck_fn_bound_receiver]
category = "reject"
description = "A signature bound leaves a '()' that takes 'self &mut' to the generic's permission: reached through '&F' it is refused in the instance's body, reached through '&mut F' it is not, and a '()' taking 'self &' is reached by both"
tags = ["typecheck"]
diagnostics = 1
[scenario.generic_typecheck_trait_bound]
category = "reject"
description = "A type not fitting a generic trait's instance: a missing method, a parameter and a return of another type once the trait's argument is substituted, the trait at other arguments, a concrete argument in the bound, and a type argument inferred from the first method that says"
tags = ["typecheck"]
diagnostics = 6
[scenario.generic_nameres_conditional_is]
category = "reject"
description = "Conditions on an 'is' entry refused at the declaration: on a type with no type parameters, on Copy, asking about a type or an undeclared name rather than one of the type's parameters, on an entry naming no trait, naming neither a trait nor a type, and on a trait's or an enum variant's entry, which is not built"
tags = ["nameres"]
diagnostics = 8

# -------- type check stage --------

[scenario.generic_typecheck_infer]
category = "reject"
description = "Generic uses whose type arguments cannot be inferred, directly, through a pointer parameter, through a function reference's signature, or from a generic method's arguments"
tags = ["typecheck"]
diagnostics = 10

[scenario.generic_typecheck_args]
category = "reject"
description = "Type argument lists written out that do not match the generic's parameters, given to a method that is not generic, and a generic type that writes none outside its own braces: on a path to its member, or where a type is wanted"
tags = ["typecheck"]
diagnostics = 24

[scenario.generic_typecheck_instance_path]
category = "reject"
description = "A path through an instance of a generic type to a private function from outside its module, to a generic enum's method, and to a member that is not a function"
tags = ["typecheck"]
diagnostics = 3

[scenario.generic_typecheck_macro]
category = "reject"
description = "Macro argument counts that do not match the declaration, expansion that would never terminate, one branching at each level included, and a macro method with no self to stand in for"
tags = ["typecheck"]
diagnostics = 17
[scenario.generic_typecheck_size_markers]
category = "reject"
description = "Sized refused to the body of bytes, the body of a run-time length, an open trait, an @opaque type and an @unsized enum; DynSized refused to the last two; and a type declaring either marker, which the compiler grants from the type's size"
tags = ["typecheck"]
diagnostics = 11
[scenario.generic_typecheck_where]
category = "reject"
description = "Requirements unmet at an instance, each refused once at the use; a method absent where its clause is unmet, called, required by a trait and behind a virtual reference; a marker met only by declaring it"
tags = ["typecheck"]
diagnostics = 10
[scenario.generic_typecheck_where_or]
category = "reject"
description = "Conditions joined by 'or' unmet: a requirement named whole with the arguments it turned on, the first false of an 'and', a method absent under 'or', one naming it bare, a generic method's 'or' over its type's parameter and its own; Pointer refused to a reference and an integer"
tags = ["typecheck"]
diagnostics = 11
[scenario.generic_typecheck_conditional_is]
category = "reject"
description = "An instance lacking an 'is' entry its condition decides: a requirement of Move, a marker and a trait with methods refused naming the false condition, of Copy naming the true 'is Move if' condition, of Copy where a field moves naming none, a default method absent, a generic function taking the conditional type refused at its instance, and a trailing 'where' still a requirement on the whole type"
tags = ["typecheck"]
diagnostics = 8

[scenario.generic_lifetime_fn_instances]
category = "run"
description = "A generic instantiated with two function-reference types differing only in their named lifetimes' promises is two instances, spelled apart"
tags = ["typecheck", "genllvm", "runtime"]

[[scenario.generic_lifetime_fn_instances.check]]
name = "one-instance-per-lifetime-promise"
target = "symbols"
contains = [
  "define internal passThrough[&opaq fn(&ro i64,&ro i64) &ro i64] comdat nodeduplicate",
  "define internal passThrough[&opaq fn'10(&ro i64,&ro i64) &ro i64] comdat nodeduplicate",
]

[scenario.generic_constraint_type_instance]
category = "run"
description = "A clause naming an instance, 'where K is So[str]': a region's reference, a generic type's instance and one whose arguments name another parameter, met by that type alone, joined with 'and' and 'or' beside a trait, in a function and on a generic type's methods"
tags = ["nameres", "typecheck", "genllvm", "runtime"]

[scenario.generic_typecheck_type_instance]
category = "reject"
description = "An instance named in a clause, unmet: another region's reference and an integer for 'So[str]', methods absent from instances that do not meet it, and an Option of another type, the refusal naming the clause as written"
tags = ["typecheck"]
diagnostics = 5

[scenario.generic_typecheck_generic_method_bound]
category = "reject"
description = "A generic method meeting a trait's method that is not generic, under a static bound: refused, naming the type, the method and that it is generic, for a generic trait's instance and for a trait with no type arguments, with the method's own parameter in the signature or not; the same methods not generic are accepted"
tags = ["typecheck"]
diagnostics = 2
