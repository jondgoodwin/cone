# generic - generics and macros. Tier 2.
#
# Key reference: design/Test Suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# Both subjects are the compiler cloning source at type-check time, which is why
# they share a group and a source directory in the compiler (ir/meta/). They are
# still split into two success programs, because what each establishes is
# different in kind: a generic reaches code generation as one function or type
# per set of type arguments and can be asserted against the LLVM IR, while a
# macro is expanded into its surroundings and leaves nothing behind to assert
# against but what the program prints.
#
# The reject scenarios are split by pipeline stage, because analysis halts
# between stages and a later stage's expectation would never be reached. The
# type-check stage is split again by mechanism: inference failures belong to the
# generic instantiation path, arity failures to the macro expansion path, and
# what each file covers of the two has no diagnostic in common.
#
# Left out, because the compiler crashes rather than diagnosing:
#
# - Anything wrong with a written-out type argument list. genericMemoize
#   rejects two things -- the wrong number of type arguments,
#   'max[i64, f64](1i64, 2i64)', and an argument that is not a type,
#   'pickSecond[i64, 3](...)' -- and returns null for both. genericSubstitute
#   then type-checks that null and the process dies with an access violation,
#   so each of the two reaches its ErrorManyArgs and then kills the compiler.
#   Both reach a generic type the same way, through 'Pair[i64, f64][...]' and
#   'Pair[i64, 3][...]'. A crash fails no assertion and cannot usefully be
#   marked xfail, so the whole explicit-type-argument error family is missing.
# - An empty type parameter list, 'fn f[]()'. Same kind of death, in the parser
#   instead. Noted again in generic-parse.
#
# Left out, because the failure describes something other than the construct:
#
# - A parameterless macro name used as a function's final statement, or as the
#   left operand of an operator. Both are noted in generic-typecheck-macro.
#
# Two gaps are recorded as xfail scenarios rather than left out, because each
# fails cleanly with a real diagnostic and each blocks a whole shape of generic
# code: a method on a generic type, and a reference to a generic instantiation.

support = []

# -------- success --------

[scenario.generic-success]
category = "run"
description = "Generic functions and generic types, instantiated by inference and by explicit type argument"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# One 'define' per distinct set of type arguments, under a name carrying them,
# and never one for the generic itself. This is the only place instantiation is
# visible: which instance ran is not something the program can print.
[[scenario.generic-success.check]]
name = "one-instance-per-type-argument"
target = "llvmir"
contains = [
  '@"max:i64:i64"',
  '@"max:f64:f64"',
  '@"pickSecond:i64:f64"',
  '@"pickSecond:f64:i64"',
  '@"firstOf:Point:Point"',
  '@"boxUp:i64"',
]

[[scenario.generic-success.check]]
name = "no-symbol-for-the-generic-itself"
target = "llvmir"
excludes = ["@max(", "@pickSecond(", "@firstOf(", "@boxUp("]

[scenario.generic-macro]
category = "run"
description = "Macro expansion: substitution rather than evaluation, and what a macro parameter may be"
tags = ["parse", "nameres", "typecheck", "genllvm", "runtime"]

# -------- known defects --------

[scenario.generic-struct-method]
category = "compile"
description = "A method on a generic type, whose 'self' never matches the instantiated type"
tags = ["typecheck"]
xfail = true

[scenario.generic-ref-instance]
category = "compile"
description = "A borrowed reference to a generic instantiation, which does not parse as a type"
tags = ["parse", "typecheck"]
xfail = true

# -------- parse stage --------

[scenario.generic-parse]
category = "reject"
description = "Type parameter lists that do not close, and a macro with no name"
tags = ["parse"]
diagnostics = 4

# -------- type check stage --------

[scenario.generic-typecheck-infer]
category = "reject"
description = "Generic uses whose type arguments cannot be inferred"
tags = ["typecheck"]
diagnostics = 4

[scenario.generic-typecheck-macro]
category = "reject"
description = "Macro uses whose argument count does not match the declaration"
tags = ["typecheck"]
diagnostics = 3
