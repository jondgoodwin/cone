# move - move types and move semantics. Tier 1.
#
# Key reference: compiler/c/doc/diagnostics/test-suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# A move type is declared with the built-in trait, 'struct Handle is Move', or
# inferred from a finalizer, a move-typed field, or a move-typed array or tuple
# element. 'is Copy' asserts the opposite, and is refused where the type moves
# (move_typecheck_copy). None of those needs a region,
# so this group stands on its own; 'region' owns the other way a value becomes
# non-copyable, which is an owning or non-aliasable reference.
#
# All of the group's rejects are the data flow stage, and they are split by what
# they are about rather than by stage: which operations move a value, which types
# move rather than copy, what a move out of an element or a global costs, that
# nothing moves out of a field, and that nothing may be moved out through a borrowed reference
# (move_flow_borrow). They have to be split anyway, because flow analysis runs on a function
# only when that function's own type check raised nothing, so a scenario's
# diagnostics all have to come from one function and there is a limit to how
# many belong in one.
#
# Not covered, with reasons:
#
# - WarnCopy (3003) is declared in shared/error.h and raised nowhere, so no
#   source can provoke it. There is no unsafe-copy warning to test.
# - The ErrorMove site in ir/exp/assign.c is commented out; the two live ones are
#   both in ir/exp/nameuse.c and both are covered here.
# - The anonymous variable '_', which the reference manual documents as the way
#   to destroy a move value early, does not resolve: '_ = a' reports
#   ErrorNameNotFound. Left out rather than xfailed, because the failure is a
#   name lookup and asserts nothing about move semantics.
# - A move out of an array element is documented as prohibited. The compiler
#   permits it and deactivates the whole array; move_flow_aggregate asserts what
#   it actually does.
#
# move_flow_aggregate and move_flow_field cover moving a value *out of* an
# aggregate: a field never, in every shape in move_flow_field. Moving one
# *into* one is move_flow_literal for a type literal, move_flow_arraylit for an
# array literal and move_flow_tuple for a tuple literal, which also asserts that
# the tuple then moves rather than copies. An array's contents that repeat a
# value evaluate it for each element, so a construction repeated is a new value
# each time and a variable repeated is moved into the first element and gone
# for the second; move_flow_arraylit asserts both. What the same contents do
# to a *counted* reference is a copy per element, and region owns it.

support = []

# -------- success --------

[scenario.move_success]
category = "run"
description = "Moving a value between variables and calls, borrowing before a move, after reassignment and before any value is given, swap and left-assignment, a copy type, one declaring 'is Copy' (a generic's instance included), a clone method that leaves a finalizing type a move type, finalized once, and a value handed back or bound through a block, an if or a loop, finalized once"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

# Drop flags: a variable whose state at a release differs by path carries a
# hidden flag the release tests. The run asserts each shape finalizes once, on
# the path that still holds the value; the checks, that the flag is there, and
# that where every path agrees there is none.
[scenario.move_drop_flags]
category = "run"
description = "A value moved, handed on (by a block, an 'if', a loop's 'break', a 'match' or a returned 'if'), or given a value on some paths only -- branches, 'elif', early return, loops with 'break', 'continue' and a move in an earlier pass, the right operand of 'and', a match's binding, a destructuring -- is finalized once, on the path that still holds it; so is a local declared last in a block or an 'if' arm of such a function"
tags = ["flow", "genllvm", "runtime"]

[[scenario.move_drop_flags.check]]
name = "a-moved-on-one-branch-has-a-flag"
target = "preir"
contains = ["%a.held = alloca i8", "%f.held = alloca i8"]

[scenario.move_match_payload]
category = "run"
description = "The one field of a variant, taken out by a match on a call's answer or on a value the match consumes: an Option's Some, a Result's Ok, handed back, passed on or kept in a variable; the matched value is not finalized again, and a payload left in it is finalized with it"
tags = ["flow", "genllvm", "runtime"]

[scenario.move_flow_matchfield]
category = "reject"
description = "A match taking a field out of a variant that has more than that field or a finalizer of its own is refused as any move out of a field is, and the one field of a variant moves once: taken twice, or the matched value used after the match"
tags = ["flow"]
diagnostics = 4

[scenario.move_drop_flags_agree]
category = "compile"
description = "Where every path agrees what a variable holds at each release -- moved or given a value on every branch, moved on a path that returns, declared in the loop body, reassigned in a loop and never moved -- it has no drop flag"
tags = ["flow", "genllvm"]

[[scenario.move_drop_flags_agree.check]]
name = "no-flag-where-paths-agree"
target = "preir"
excludes = [".held"]

# A condition on a generic type's Move entry, 'is Move if T is Move', decided
# per instance: the motivating case is a future, whose fields hold no T
[scenario.move_conditional]
category = "run"
description = "'is Move if <condition>' decided per instance: Fut[T] holding only a shared reference copies for i32 and moves for Handle and for Box[Handle] (Move by its field); a condition on one of two parameters; one joined by 'or' and 'and'; a field that moves winning over a false condition; a flat 'is Move' on a generic unchanged; an enum's entry; a struct holding an instance; and an instance named as a reference's target inside the type it is about"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

[scenario.move_conditional_manual]
category = "run"
description = "The reference manual's examples of a condition on an 'is' entry, run: refmove.html's Future copied for i32 and moved for Handle, and refgeneric.html's moves, Wrapper and Labelled"
tags = ["parse", "nameres", "typecheck", "flow", "genllvm", "runtime"]

# -------- type-check stage --------

[scenario.move_typecheck_copy]
category = "reject"
description = "'is Copy' refused on a type that moves: one declaring Move too (either order), with a final, with a field that moves (a move struct, an owning 'So' reference), enriching a base that moves, an enum with a variant that moves, by inference or declaring Move, and a generic's instance at a move type argument"
tags = ["typecheck"]
diagnostics = 9

# -------- flow stage --------

[scenario.move_flow_deactivate]
category = "reject"
description = "The operations that deactivate a move value's source, and use of a variable never initialized"
tags = ["flow"]

[scenario.move_flow_paths]
category = "reject"
description = "A value moved, or never given, on some path reaching a use is refused there: moved in each pass of a loop, read or borrowed in a pass after one that moved it, moved out through a sole owner in each pass, and a finalizing variable given a value on one branch only, then read"
tags = ["flow"]

[scenario.move_flow_maybe_uninit]
category = "reject"
description = "A local of any type declared without a value may not be read where some path reaching the read did not give it one: a number, a dereferenced borrowed reference, a struct's field and a raw pointer given a value in one arm of an 'if'; an 'if' with an 'else' assigning in one arm; a 'match' with one arm assigning; a loop that may not run; a 'while true', whose condition still has an exit; and a read before the assignment in source order"
tags = ["flow"]

[scenario.move_flow_maybe_uninit_ok]
category = "run"
description = "The neighbours that are accepted: a local given a value in both arms of an 'if', before the branch, in every arm of a 'match', in one arm while the other returns, before the 'break' of a loop with no condition, and in each pass of a loop it is declared in -- for a number, a borrowed reference, a struct and a raw pointer"
tags = ["flow", "genllvm", "runtime"]

[scenario.move_flow_infection]
category = "reject"
description = "Which types get move semantics: the built-in trait 'Move' declared, a finalizer, either one kept despite a clone method, a move-typed field (a tuple holding a move value included: directly, nested, as a generic's type argument and in an enum's variant), a move-typed array element (a tuple holding one included, the array's type written out or inferred from its literal), an enrichment of a type declaring 'Move', a generic declaring it and its enrichment, and an enum with a move-typed variant, seen by its own static function and by a struct and a function written above it"
tags = ["flow"]

[scenario.move_flow_conditional]
category = "reject"
description = "An instance only its 'is Move if' condition makes move is used after a move and refused: the reference manual's Future[Handle], a condition on one of two parameters, and an enum's"
tags = ["flow"]

[scenario.move_flow_aggregate]
category = "reject"
description = "Moving out of a field is refused and leaves the struct usable; moving out of an array element deactivates the array; moving out of a global is refused"
tags = ["flow"]

[scenario.move_flow_field]
category = "reject"
description = "Nothing moves out of a field: a struct's field or a tuple's element, of a local, a parameter, a by-value self, a temporary or a generic's instance, behind a sole, counted, shared or borrowed reference, nested, into a variable, a call, a literal or a by-value self, handed back directly or through a block, an if or a loop, and a value reached through a field -- what an owning field points at, an element of an array field"
tags = ["flow"]

[scenario.move_flow_borrow]
category = "reject"
description = "Moving a value out through a borrowed reference, in each position a value can leave by, is refused"
tags = ["flow"]

[scenario.move_flow_borrowmoved]
category = "reject"
description = "Borrowing a variable whose value was moved out is refused as a read is: written out, of a field, an element or a slice, for a slice parameter, and as a method's receiver"
tags = ["flow"]

[scenario.move_flow_literal]
category = "reject"
description = "Naming a move value in a type literal's field deactivates the source"
tags = ["flow"]

[scenario.move_flow_arraylit]
category = "reject"
description = "Naming a move value in an array literal's element deactivates the source, and an array's contents, or a collection's 'n of x', move a repeated variable once per element"
tags = ["flow"]

[scenario.move_flow_tuple]
category = "reject"
description = "A tuple holding a move value moves rather than copies, and a tuple literal deactivates its move sources"
tags = ["flow"]
