# move - move types and move semantics. Tier 1.
#
# Key reference: design/Test Suite.md, "cases.toml keys".
# The group directory supplies the feature tag, so tags carry pipeline phases.
#
# A move type is declared with 'struct @move', or inferred from a finalizer, a
# move-typed field, or a move-typed array element. None of those needs a region,
# so this group stands on its own; 'region' owns the other way a value becomes
# non-copyable, which is an owning or non-aliasable reference.
#
# All of the group's rejects are the data flow stage, and they are split by what
# they are about rather than by stage: which operations move a value, which types
# move rather than copy, and what a move out of a field or element or global
# costs. They have to be split anyway, because flow analysis is skipped for every
# remaining function once any error exists, so a scenario's diagnostics all have
# to come from one function and there is a limit to how many belong in one.
#
# Not covered, with reasons:
#
# - WarnCopy (3003) is declared in shared/error.h and raised nowhere, so no
#   source can provoke it. There is no unsafe-copy warning to test.
# - The ErrorMove site in ir/exp/assign.c is commented out; the two live ones are
#   both in ir/exp/nameuse.c and both are covered here.
# - The anonymous variable '_', which the reference manual documents as the way
#   to destroy a move value early, does not resolve: '_ = a' reports
#   ErrorNameNotFound. Left out rather than xfailed, because the failure is a
#   name lookup and asserts nothing about move semantics.
# - A field or element move is documented as prohibited for arrays and permitted
#   for struct fields. The compiler treats both the same way, permitting the move
#   and deactivating the whole container; move-flow-aggregate asserts what it
#   actually does.
#
# move-flow-aggregate covers moving a value *out of* an aggregate. Moving one
# *into* one is move-flow-literal, and it is an xfail: a type literal's field
# initializers never reach flowHandleMoveOrCopy, so the source stays active. That
# gap is also why region-owning-field-so double-frees.

support = []

# -------- success --------

[scenario.move-success]
category = "run"
description = "Moving a value between variables and calls, swap and left-assignment, and the types that stay copyable"
tags = ["parse", "typecheck", "flow", "genllvm", "runtime"]

# -------- flow stage --------

[scenario.move-flow-deactivate]
category = "reject"
description = "The operations that deactivate a move value's source, and use of a variable never initialized"
tags = ["flow"]

[scenario.move-flow-infection]
category = "reject"
description = "Which types get move semantics: the @move attribute, a finalizer, a move-typed field, a move-typed element"
tags = ["flow"]

[scenario.move-flow-aggregate]
category = "reject"
description = "Moving out of a field, an array element, or a global"
tags = ["flow"]

# -------- known defects --------

[scenario.move-flow-literal]
category = "reject"
description = "Naming a move value in a type literal's field does not deactivate the source"
tags = ["flow"]
xfail = true
