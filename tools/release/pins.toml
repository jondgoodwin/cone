# What release.py downloads, pinned. Nothing else is fetched: SDL3 comes from
# the SDL3 development kit on the builder's machine, OpenSSL from
# tools/deps/fetch.py's pinned files.

[python]
# Python's embeddable distribution for 64-bit Windows, which runs Congo
# (Congo needs 3.11 or later and only the standard library). The licence is the
# PSF's, and python.org's zip carries its own copy (LICENSE.txt).
# 3.13.3 is the version the Cone suite and Congo's tests run under on the
# development machine.
version = "3.13.3"
url = "https://www.python.org/ftp/python/3.13.3/python-3.13.3-embed-amd64.zip"
# SHA-256 of the zip itself. python.org publishes no SHA-256 on the release page
# (only MD5, 9ca0271e8fe78de957dd57e980d74822, and the size, 10885425); this value is
# the one in python.org's own SBOM for the file (package "CPython", downloadLocation =
# the url above): https://www.python.org/ftp/python/3.13.3/python-3.13.3-embed-amd64.zip.spdx.json
# It equals the SHA-256 measured on the downloaded file (13 Oct 2026).
sha256 = "59ff76e16e6597de47474fb22be69e7191a89116910d728ab735079b078e52db"
